name: Sunbreak isolated preview E2E
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'preview/mhsunbreak-bz-20261020/**'
      - 'test/mhsunbreak-bz-preview.e2e.cjs'
      - '.github/workflows/sunbreak-bz-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --test test/mhsunbreak-bz-preview.e2e.cjs
