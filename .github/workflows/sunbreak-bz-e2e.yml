name: Sunbreak draft BZ transfer E2E
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'mhsunbreak-*'
      - 'checker-data/mhsunbreak.js'
      - 'tests/mhsunbreak-bz-transfer.e2e.cjs'
      - 'tests/mhsunbreak-submarine-cycle.e2e.cjs'
      - '.github/workflows/sunbreak-bz-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 57 || startsWith(github.head_ref, 'feature/mhsunbreak-submarine-cycle-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Real-browser transfer regression
        run: node --test tests/mhsunbreak-bz-transfer.e2e.cjs tests/mhsunbreak-submarine-cycle.e2e.cjs
