ndar small{display:block;font-size:12px}.calendar .weekday{text-align:center;color:var(--dim);font-size:13px}.calendar .today{outline:1px solid var(--accent)}.log{border-bottom:1px solid var(--line);padding:12px 0}.log p{margin:4px 0;white-space:pre-wrap}.tag{display:inline-block;font-size:13px;color:var(--accent);margin-right:8px}.chips{display:flex;flex-wrap:wrap;gap:6px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters label{margin:0}.filters .full{grid-column:1/-1}.table-wrap{max-width:100%;overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}td button{width:100%;text-align:left;font-size:14px}svg{display:block;width:100%;height:auto}.empty{color:var(--dim);padding:16px 0}.file{display:block;width:100%;margin:8px 0}dialog{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;width:calc(100% - 20px);max-width:540px;max-height:85dvh;overflow:auto}dialog::backdrop{background:#000b}.preview-row{padding:10px 0;border-bottom:1px solid var(--line)}.preview-row strong{display:block}#preview-actions{position:sticky;bottom:-16px;padding:12px 0;background:var(--bg)}[hidden]{display:none!important}

<dialog id="preview" aria-labelledby="preview-title"><h2 id="preview-title">取り込み前の確認</h2><div id="rec-source-choice" hidden></div><div id="preview-body"></div><div class="row" id="preview-actions"><button id="import-confirm">取り込む</button><button id="import-cancel">やめる</button></div></dialog>
<input id="file-import" type="file" accept=".json,application/json" hidden><input id="file-restore" type="file" accept=".json,application/json" hidden>
<script>
'use strict';
// 第1段: source adapters → reconciliation → one IndexedDB transaction → read-only views.
const DB_NAME='slot-tools-nisshi', DB_VERSION=1;
const STORE_KEYS={plays:'id',days:'date',stores:'id',tagDefs:'id',imports:'id',meta:'key'};
const SOURCE_LABELS={rec:'rec（実戦記録）',ledger:'rec（簡易収支）','rec-kanokari':'かのかり',mylog:'マイログ',yutime:'遊タイム',kadonote:'kado-note'};
const PROTECTED=['aim','tags','diary','marks','mergedFrom'];
const $=id=>document.getElementById(id), clone=v=>structuredClone(v);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v===null||v===undefined||v===''?null:(Number.isFinite(Number(v))?Number(v):null);
const zero=v=>num(v)??0, unique=a=>[...new Set(a)], now=()=>new Date().toISOString();
const localDate=value=>{const d=new Date(value);if(!Number.isFinite(+d))throw Error('日付が読み取れない記録があります');return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateKey=v=>{const s=String(v??'').replaceAll('/','-');if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||localDate(s+'T12:00:00')!==s)throw Error('日付が読み取れない記録があります');return s};
const signed=n=>(n>0?'+':'')+Number(n).toLocaleString('ja-JP');
const yen=n=>n==null?'—':signed(n)+'円';
const tone=n=>n>0?'positive':n<0?'negative':'';
const hm=v=>{if(!v)return '—';const d=new Date(v);return Number.isFinite(+d)?d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'—'};
function stable(v){if(Array.isArray(v))return '['+v.map(stable).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';return JSON.stringify(v)}
function cleanEvents(events){return Array.isArray(events)?events.map(ev=>{const e=clone(ev);delete e.snap;return e}):null}
function cleanRaw(raw){const r=clone(raw);if(r.events)r.events=cleanEvents(r.events);return r}
function calculatedYen(p){if(p.cond)return Math.round(p.units*p.cond.exch)+p.money.cashOut-p.money.cashIn;if(p.source==='rec'||p.source==='rec-kanokari')return num(p.raw.recProfit);return null}
function play(source,id,fields){
  if(id==null||String(id)==='')throw Error('IDのない記録は取り込めません');
  const p={id:source+':'+id,source,sourceId:String(id),date:null,startAt:null,endAt:null,kind:'slot',machine:'機種不明',shop:'',dai:null,money:{cashIn:0,cashOut:0,withdraw:0,deposit:0,unit:'枚'},cond:null,yen:null,units:0,expected:null,events:null,raw:{},aim:null,tags:[],diary:'',marks:[],mergedFrom:[],importedAt:null,updatedAt:null,...fields};
  p.date=dateKey(p.date);p.units=p.money.deposit-p.money.withdraw;p.yen=calculatedYen(p);return p;
}
// tools/rec/index.html: sum / expectedTotal / invested / replayed / profit と同じ式。
const sum=a=>(a||[]).reduce((x,y)=>x+y.amount,0);
function expectedTotal(s){return (s.expected||0)+(s.follow||[]).reduce((a,f)=>a+(f.amount||0),0)}
function invested(m){return Array.isArray(m.spends)?sum(m.spends):sum(m.cash||[])}
function replayed(m){return sum(m.replays||[])}
function profit(s){const m=s.money;if(m.endMedal==null)return null;const st=m.startMedal||0,en=m.endMedal||0,rp=replayed(m),cash=invested(m),bought=Math.round(cash/1000*s.lend);return{cash,bought,replay:rp,lend:s.lend,medalDiff:en-st-bought-rp,yen:Math.round((en-st-rp)*(1000/s.lend)-cash)}}
function recPlay(session,source){
  const s=cleanRaw(session),m=s.money;if(!m)throw Error('recの収支データがありません');
  // rec の fixMoney と同じ旧形式移行。時刻は元データから取り、再取り込みを安定させる。
  if(!Array.isArray(m.replays)){m.replays=[];if(m.startReplay>0)m.replays.push({at:s.startAt,amount:m.startReplay,migrated:true});if(m.endReplay>0&&m.endMedal!=null)m.endMedal+=m.endReplay;m.startReplay=0;m.endReplay=0}
  return play(source,s.id,{date:localDate(s.startAt),startAt:s.startAt,endAt:s.endAt,machine:s.machine||'機種不明',shop:s.shop||'',dai:s.dai??null,money:{cashIn:invested(m),cashOut:0,withdraw:zero(m.startMedal)+replayed(m),deposit:zero(m.endMedal),unit:'枚'},expected:s.expected!=null||s.follow?.length?expectedTotal(s):null,events:cleanEvents(s.events),raw:{...s,recProfit:profit(s)?.yen??null}});
}
function ledgerPlay(e){const m=e.money||e;return play('ledger',e.id,{date:e.date,kind:e.kind||'slot',machine:e.machine||'機種不明',shop:e.storeName||e.shop||'',dai:e.dai??null,cond:validCond(e.cond),money:{cashIn:zero(m.cashIn),cashOut:zero(m.cashOut),withdraw:zero(m.withdraw),deposit:zero(m.deposit),unit:e.kind==='pachinko'?'玉':'枚'},expected:num(e.expected),raw:cleanRaw(e)})}
function validCond(c){if(!c)return null;if(!(num(c.exch)>0))throw Error('換算条件の交換単価が不正です');return clone(c)}
function mylogPlay(r){const m=r.money||{};return play('mylog',r.id,{date:r.date,machine:r.machineName||'機種不明',shop:r.shop||'',dai:r.seat??null,money:{cashIn:zero(m.yen),cashOut:0,withdraw:zero(m.startHold),deposit:zero(m.hold),unit:'枚'},cond:zero(m.rate)>0&&zero(m.exchangeMai)>0?{kind:'slot',label:'',lend:Number(m.rate),exchPer1000:Number(m.exchangeMai),exch:Math.round(1000/Number(m.exchangeMai)*100)/100}:null,raw:clone(r)})}
// yutime-v3.html 正本の依存関数を含む移植。店舗取得だけを引数で受ける。
const DEFAULT_LEND_RATE=4,DEFAULT_EXCHANGE_BALLS=25;
function normalizeNumber(value){if(value===''||value===null||value===undefined)return null;const n=Number(value);return Number.isFinite(n)?n:null}
function positiveNumberOrDefault(value,fallback){const n=normalizeNumber(value);return n!==null&&n>0?n:fallback}
function normalizeExchangeBalls(value){const n=normalizeNumber(value);return n!==null&&n>=20&&n<=50?Number(n.toFixed(2)):DEFAULT_EXCHANGE_BALLS}
function exchangeBallsFromStore(store){if(store?.exchangeBalls!==undefined)return normalizeExchangeBalls(store.exchangeBalls);const oldRate=normalizeNumber(store?.exchangeRate);if(oldRate!==null&&oldRate>=2&&oldRate<=5)return normalizeExchangeBalls(100/oldRate);if(oldRate!==null&&oldRate>=20&&oldRate<=50)return normalizeExchangeBalls(oldRate);return DEFAULT_EXCHANGE_BALLS}
function normalizeInvestmentSource(value){return value==='mochidama'||value==='saipurei'?value:'cash'}
function investmentSource(item){return normalizeInvestmentSource(item?.source||item?.type)}
function investmentTotals(session){return(session.investments||[]).reduce((totals,item)=>{const source=investmentSource(item);if(source==='cash')totals.cashYen+=Number(item.amount||0);if(source==='saipurei')totals.saipureiBalls+=Number(item.amount||0);if(source==='mochidama')totals.mochidamaBalls+=Number(item.amount||0);return totals},{cashYen:0,saipureiBalls:0,mochidamaBalls:0})}
function storeTermsForSession(session,stores){const store=stores.find(s=>s.id===session?.storeId);const terms=session?.storeTerms;if(!terms||typeof terms!=='object')return store;return {...(store||{}),isPersonal:Boolean(terms.isPersonal),lendRate:positiveNumberOrDefault(terms.lendRate,DEFAULT_LEND_RATE),exchangeBalls:normalizeExchangeBalls(terms.exchangeBalls)}}
function usesPersonalBalanceFormula(store){return Boolean(store?.isPersonal)}
function playerInvestedBalls(session,totals,store){return usesPersonalBalanceFormula(store)?Number(session.startMochidama||0)+Number(totals.saipureiBalls||0):Number(totals.mochidamaBalls||0)+Number(totals.saipureiBalls||0)}
function exchangeRateForStore(store){return 100/exchangeBallsFromStore(store)}
function profitYenForSession(session,totals,store){const endTotalBalls=normalizeNumber(session.endTotalBalls);if(endTotalBalls===null)return null;const exchangeRate=exchangeRateForStore(store);const recoverBalls=endTotalBalls+Number(session.zanhoryuBalls||0);const investedPlayerBalls=playerInvestedBalls(session,totals,store);const cashYen=Number(totals.cashYen||0);return Math.round((recoverBalls-investedPlayerBalls)*exchangeRate-cashYen)}
function yutimePlay(s,data){
  const store=storeTermsForSession(s,data.stores||[]),machine=(data.machines||[]).find(m=>m.id===s.machineId)||{},t=investmentTotals(s);
  const presets={'umi-sp5':'PA大海物語5 スペシャル','agnes-pe':'PA大海物語Withアグネス・ラム Premium Ed'};
  const time=v=>v?`${s.date}T${v}`:null;
  return play('yutime',s.id,{date:s.date,startAt:time(s.startTime),endAt:time(s.endTime),kind:'pachinko',machine:machine.modelName||presets[machine.presetId]||'パチンコ（機種不明）',shop:store?.name||'',dai:machine.daiNo??null,money:{cashIn:t.cashYen,cashOut:zero(s.settlementRecoverYen),withdraw:playerInvestedBalls(s,t,store),deposit:Number(s.endTotalBalls)+zero(s.zanhoryuBalls),unit:'玉'},cond:store?{kind:'pachinko',label:'',lend:1000/positiveNumberOrDefault(store.lendRate,DEFAULT_LEND_RATE),exchPer1000:exchangeBallsFromStore(store)*10,exch:Math.round(exchangeRateForStore(store)*100)/100}:null,expected:num(s.startEv?.evYen),raw:{...clone(s),machine:clone(machine),resolvedStore:store?clone(store):null,yutimeProfit:profitYenForSession(s,t,store)}});
}
function envelopePlay(e){
  const p=e.payload||{};
  if(String(e.payloadVer||'').startsWith('rec-')){
    const s={id:e.sessionId,startAt:e.startedAt,endAt:e.endedAt,machine:p.machine||e.machineId,shop:e.storeName,dai:e.unitNo,lend:e.lendRate,expected:p.expected,follow:p.follow||[],money:{spends:[{amount:zero(e.invest)}],startMedal:zero(p.startMedal),endMedal:p.endMedal??(zero(e.payout)+zero(p.startMedal)+zero(p.replays??p.startReplay)),replays:[{amount:zero(p.replays??p.startReplay)}]},events:(p.logs||[]).map(l=>({...l,at:l.at??new Date(l.t).toISOString()}))};
    const result=recPlay(s,'rec');result.raw.envelope=clone(e);return result;
  }
  // slot-session envelope: invest は円、payout は枚。元ログの type を保持する。
  const exch=positiveNumberOrDefault(e.exchangeRate,0);
  return play('kadonote',e.sessionId,{date:localDate(e.startedAt),startAt:e.startedAt,endAt:e.endedAt,machine:e.machineLabel||p.machine||e.machineId,shop:e.storeName||'',dai:e.unitNo??null,money:{cashIn:zero(e.invest),cashOut:0,withdraw:0,deposit:zero(e.payout),unit:'枚'},cond:exch?{kind:'slot',label:'',lend:num(e.lendRate),exchPer1000:exch,exch:1000/exch}:null,expected:num(p.expectedTotal??p.expected),events:cleanEvents(p.logs),raw:clone(e)});
}
function emptyBatch(){return {plays:[],stores:[],labels:[],sources:[],restore:null}}
function appendRec(batch,data,source,includeSessions=true,includeEntries=true){if(includeSessions)batch.plays.push(...(data.sessions||[]).filter(s=>s.endAt).map(s=>recPlay(s,source)));if(includeEntries)batch.plays.push(...(data.entries||[]).map(ledgerPlay));batch.stores.push(...(data.stores||[]));}
function fileBatch(data,name,recSource=null){
  const b=emptyBatch();b.labels=[name];
  if(data?.format==='slot-tools-nisshi')throw Error('日誌の書き出しは「復元」から選んでください');
  if(data?.format==='juggler-mylog'||Array.isArray(data?.records))b.plays=data.records.map(mylogPlay);
  else if(Array.isArray(data?.machines)&&Array.isArray(data?.sessions))b.plays=data.sessions.filter(s=>s.status==='completed'&&num(s.endTotalBalls)!==null).map(s=>yutimePlay(s,data));
  else if(data?.schema==='slot-session')b.plays=[envelopePlay(data)];
  else if(Array.isArray(data)&&data.every(e=>e.schema==='slot-session'))b.plays=data.map(envelopePlay);
  else if(Array.isArray(data?.sessions)||Array.isArray(data?.entries)){
    const source=recSource||(data.storageKey==='slot-tools-rec-kanokari'?'rec-kanokari':data.storageKey==='slot-tools-rec'||Array.isArray(data.entries)?'rec':null);
    if(!source){const error=Error('このファイルにはrec本線・かのかり箱の識別子がありません。出どころの指定が必要です。');error.needsRecSource=true;throw error}
    if(!['rec','rec-kanokari'].includes(source))throw Error('出どころが不正です');
    appendRec(b,data,source);
  }
  else throw Error('対応していないJSON形式です');
  b.sources=unique(b.plays.map(p=>p.source));b.plays.forEach(validatePlay);return b;
}
function browserBatch(selected){
  const b=emptyBatch(),read=key=>{const text=localStorage.getItem(key);return text?JSON.parse(text):null};
  if(selected.includes('rec')||selected.includes('ledger')){const d=read('slot-tools-rec');if(d)appendRec(b,d,'rec',selected.includes('rec'),selected.includes('ledger'))}
  if(selected.includes('rec-kanokari')){const d=read('slot-tools-rec-kanokari');if(d)appendRec(b,d,'rec-kanokari')}
  if(selected.includes('mylog')){const d=read('juggler-mylog:v1');if(d)b.plays.push(...(Array.isArray(d)?d:d.records||[]).map(mylogPlay))}
  if(selected.includes('yutime')){const d=read('ytv3:data');if(d)b.plays.push(...(d.sessions||[]).filter(s=>s.status==='completed'&&num(s.endTotalBalls)!==null).map(s=>yutimePlay(s,d)))}
  b.sources=selected;b.labels=selected.map(s=>SOURCE_LABELS[s]);b.plays.forEach(validatePlay);return b;
}
function validatePlay(p){
  if(!p||typeof p.id!=='string'||!p.id||p.id!==p.source+':'+p.sourceId)throw Error('台のIDが不正です');
  dateKey(p.date);if(!['slot','pachinko'].includes(p.kind))throw Error('種別が不正です');
  if(!p.money||!['枚','玉'].includes(p.money.unit)||!['cashIn','cashOut','withdraw','deposit'].every(k=>typeof p.money[k]==='number'&&Number.isFinite(p.money[k])))throw Error('収支の値が不正です');
  if(!Number.isFinite(p.units)||(p.yen!==null&&!Number.isFinite(p.yen))||(p.expected!==null&&!Number.isFinite(p.expected)))throw Error('集計値が不正です');
  if(!p.raw||typeof p.raw!=='object'||!Array.isArray(p.mergedFrom)||!Array.isArray(p.tags)||!Array.isArray(p.marks)||!(p.events===null||Array.isArray(p.events)))throw Error('台の保存形式が不正です');
  validCond(p.cond);
}
function restoreBatch(data,name){
  if(data?.format!=='slot-tools-nisshi'||data.version!==1)throw Error('稼働日誌 version 1 の書き出しを選んでください');
  for(const [store,key] of Object.entries(STORE_KEYS)){if(store==='meta'&&!data.meta)continue;if(!Array.isArray(data[store]))throw Error(store+' がありません');const ids=new Set();for(const row of data[store]){if(!row||typeof row[key]!=='string'||!row[key]||ids.has(row[key]))throw Error(store+' のキーが不正または重複しています');ids.add(row[key])}}
  data.plays.forEach(validatePlay);return {plays:clone(data.plays),stores:clone(data.stores),labels:['復元: '+name],sources:unique(data.plays.map(p=>p.source)),restore:clone(data)};
}
// 合流元も raw に保持し、取り込み順序に依存せず再照合する。利用者の追記は常に残す。
function preserve(incoming,old){if(!old)return clone(incoming);const p={...clone(old),...clone(incoming)};for(const k of PROTECTED)p[k]=clone(old[k]);p.mergedFrom=unique([...old.mergedFrom,...incoming.mergedFrom]).sort();p.importedAt=old.importedAt;p.updatedAt=old.updatedAt;return p}
function comparable(p){const c=clone(p);delete c.importedAt;delete c.updatedAt;return stable(c)}
function sourceTime(p){return Date.parse(p.raw.updatedAt||p.raw.editedAt||p.raw.savedAt||p.raw.endAt||p.raw.createdAt||'')||0}
function ledgerOrigin(p){const r=p.raw;if(r.source==='yutime-v3'||String(r.memo||'').includes('遊タイムツールから取り込み'))return 'yutime';if(r.source==='juggler-mylog'||/(?:マイジャグログ|マイログ)から取り込み/.test(String(r.memo||'')))return 'mylog';return null}
function matchesConverted(e,p){if(ledgerOrigin(e)!==p.source||e.date!==p.date||e.money.deposit!==p.money.deposit)return false;if(p.source==='yutime')return e.money.withdraw===p.money.withdraw;const seat=String(e.raw.memo||'').match(/台番\s*[:：]?\s*(\d+)/)?.[1];return String(p.dai??'')===String(seat??'')}
function reconcile(oldPlays,batch){
  const old=new Map(oldPlays.map(p=>[p.id,p])),pool=new Map(),touched=new Set(batch.plays.map(p=>p.id));
  for(const p of oldPlays){pool.set(p.id,clone(p));for(const e of p.raw.nisshiMergedEntries||[])if(!pool.has(e.id))pool.set(e.id,clone(e));const peer=p.raw.nisshiRecPeer;if(peer&&!pool.has(peer.id))pool.set(peer.id,clone(peer))}
  for(const p of batch.plays)pool.set(p.id,preserve(p,pool.get(p.id)));
  for(const p of batch.plays){for(const e of [...(p.raw.nisshiMergedEntries||[]),...(p.raw.nisshiRecPeer?[p.raw.nisshiRecPeer]:[])])if(!touched.has(e.id))pool.set(e.id,preserve(e,pool.get(e.id)))}

function analysisTable(list,key,title){const groups=grouped(list,p=>p[key]);return `<h2>${title}</h2><div class="table-wrap"><table><thead><tr><th>${title.replace('別','')}</th><th>台数</th><th>合計円</th><th>1台平均</th><th>想定期待値</th></tr></thead><tbody>${groups.map(([name,rows])=>{const t=totals(rows);return `<tr><td><button data-group="${key}" data-value="${esc(name)}">${esc(name||'未記録')}</button></td><td>${t.count}</td><td>${t.knownCount?signed(t.yen):'—'}${t.unknownCount?'<br>未換算 '+t.unknownCount+'件':''}</td><td>${t.knownCount?signed(Math.round(t.yen/t.knownCount)):'—'}</td><td>${t.expectedCount?signed(t.expected):'—'}</td></tr>`}).join('')}</tbody></table></div>`}
function analysisView(){const f=page.filters||{},list=analysisList(),machines=unique(plays.map(p=>p.machine)).sort(),shops=unique(plays.map(p=>p.shop)).sort();return back()+`<h2>分析</h2><div class="filters"><label>期間（月）<select data-filter="month">${option('','全期間',f.month)}${unique(plays.map(p=>p.date.slice(0,7))).sort().reverse().map(m=>option(m,m,f.month)).join('')}</select></label><label>種別<select data-filter="kind">${option('','全部',f.kind)}${option('slot','スロット',f.kind)}${option('pachinko','パチンコ',f.kind)}</select></label><label class="full">機種を検索<input id="machine-search" type="search" value="${esc(page.query||'')}" placeholder="機種名"></label><label class="full">機種<select id="machine-filter" data-filter="machine">${option('','全部',f.machine)}${machines.filter(m=>m.includes(page.query||'')||m===f.machine).map(m=>option(m,m,f.machine)).join('')}</select></label><label class="full">店<select data-filter="shop">${option('','全部',f.shop)}${shops.filter(Boolean).map(s=>option(s,s,f.shop)).join('')}</select></label></div>${summary(list)}<div class="row"><button data-chart="bar" aria-pressed="${page.chart!=='line'}">月別の棒</button><button data-chart="line" aria-pressed="${page.chart==='line'}">累積の折れ線</button></div>${chart(list,page.chart==='line')}<p class="muted">合計・1台平均は換算済みの台が対象。1台平均＝合計円 ÷ 換算済み台数。想定期待値は記録のある台のみ合計。</p>${analysisTable(list,'machine','機種別')}${analysisTable(list,'shop','店別')}`}
function settingsView(){const bytes=n=>Number(n).toLocaleString('ja-JP')+' bytes';return back()+`<h2>設定</h2><section class="panel"><h3>このブラウザの記録を取り込む</h3>${['rec','ledger','rec-kanokari','mylog','yutime'].map(s=>`<label class="check"><input type="checkbox" name="source" value="${s}" checked>${SOURCE_LABELS[s]}</label>`).join('')}<button id="browser-import">件数を確認</button></section><button class="file" id="choose-import">ファイルから取り込む</button><button class="file" id="export">書き出し</button><button class="file" id="choose-restore">復元</button><section class="panel"><h3>保存容量</h3><p>${storageInfo?bytes(storageInfo.usage||0)+' / '+bytes(storageInfo.quota||0):'取得できません'}</p><p class="muted">容量はこのサイト全体の使用量です。</p><p>永続化：${esc(persistence)}</p></section><h2>取り込みの履歴</h2>${[...imports].sort((a,b)=>b.at.localeCompare(a.at)).map(i=>`<div class="panel"><small>${esc(new Date(i.at).toLocaleString('ja-JP'))}</small><div>${esc((Array.isArray(i.from)?i.from:[i.from||'']).join('・'))}</div>${Object.entries(i.counts||{}).map(([s,c])=>`<div class="muted">${esc(SOURCE_LABELS[s]||s)}：新規 ${zero(c.new)} ／ 更新 ${zero(c.updated)} ／ 変化なし ${zero(c.unchanged)} ／ まとめた元記録 ${zero(c.merged)}</div>`).join('')}</div>`).join('')||'<p class="empty">まだ取り込んでいません。</p>'}`}
function render(){
  let html='';switch(page.name){case 'home':html=homeView();break;case 'history':html=historyView();break;case 'day':{const list=plays.filter(p=>p.date===page.date);html=back()+`<h2>${esc(page.date)}</h2>`+summary(list)+cards(list);break}case 'detail':html=detailView();break;case 'analysis':html=analysisView();break;case 'group':{const list=plays.filter(p=>page.ids.includes(p.id));html=back()+`<h2>${esc(page.title||'未記録')}</h2>`+summary(list)+cards(list);break}case 'settings':html=settingsView();break}
  $('app').innerHTML=html;
}
$('app').addEventListener('click',async event=>{const b=event.target.closest('button');if(!b)return;try{
  if(b.hasAttribute('data-back')){page=historyStack.pop()||{name:'home'};render();window.scrollTo(0,0)}
  else if(b.dataset.page){go({name:b.dataset.page});if(page.name==='settings')updateStorage()}
  else if(b.dataset.play)go({name:'detail',id:b.dataset.play});else if(b.dataset.day)go({name:'day',date:b.dataset.day});
  else if(b.dataset.month){const date=new Date((page.month||localDate(new Date()).slice(0,7))+'-01T12:00:00');date.setMonth(date.getMonth()+Number(b.dataset.month));page.month=localDate(date).slice(0,7);render()}
  else if(b.hasAttribute('data-tag')){page.tag=b.dataset.tag;render()}
  else if(b.hasAttribute('data-logs')){page.all=!page.all;render()}
  else if(b.dataset.chart){page.chart=b.dataset.chart;render()}
  else if(b.dataset.group)go({name:'group',title:b.dataset.value,ids:analysisList().filter(p=>p[b.dataset.group]===b.dataset.value).map(p=>p.id)});
  else if(b.id==='browser-import'){const selected=[...document.querySelectorAll('input[name=source]:checked')].map(e=>e.value);if(!selected.length){notice('取り込む出どころを選んでください');return}await previewBatch(browserBatch(selected))}
  else if(b.id==='choose-import')$('file-import').click();else if(b.id==='choose-restore')$('file-restore').click();else if(b.id==='export')await exportAll();
}catch(error){notice('取り込めませんでした。'+error.message)}});
$('app').addEventListener('change',event=>{const key=event.target.dataset.filter;if(key){page.filters={...page.filters,[key]:event.target.value};render()}});
$('app').addEventListener('input',event=>{if(event.target.id==='machine-search'){page.query=event.target.value;const selected=page.filters?.machine;$('machine-filter').innerHTML=option('','全部',selected)+unique(plays.map(p=>p.machine)).sort().filter(m=>m.includes(page.query)||m===selected).map(m=>option(m,m,selected)).join('')}});
for(const mode of ['import','restore'])$('file-'+mode).addEventListener('change',async event=>{const file=event.target.files[0];event.target.value='';if(!file)return;try{const data=JSON.parse((await file.text()).replace(/^\uFEFF/,''));if(mode==='restore')await previewBatch(restoreBatch(data,file.name));else{try{await previewBatch(fileBatch(data,file.name))}catch(error){if(!error.needsRecSource)throw error;await previewBatch(fileBatch(data,file.name,'rec'),{data,name:file.name,source:'rec'})}}}catch(error){notice('取り込めませんでした。'+error.message)}});
$('rec-source-choice').addEventListener('change',async event=>{
  if(event.target.name!=='rec-source'||!pending?.recFile||busy)return;
  const recFile={...pending.recFile,source:event.target.value};
  try{await previewBatch(fileBatch(recFile.data,recFile.name,recFile.source),recFile,true)}catch(error){notice('取り込めませんでした。'+error.message)}
});
$('import-confirm').addEventListener('click',commitPending);
$('import-cancel').addEventListener('click',()=>{if(!busy){previewVersion++;pending=null;$('preview').close()}});
$('preview').addEventListener('cancel',event=>{if(busy)event.preventDefault();else{previewVersion++;pending=null}});
async function init(){try{db=await openDatabase();if('BroadcastChannel' in window){channel=new BroadcastChannel(DB_NAME);channel.onmessage=event=>{if(event.data?.type==='updated')refresh().catch(e=>notice('記録を読み直せませんでした。'+e.message))}}await refresh();try{persistence=navigator.storage?.persist?(await navigator.storage.persist()?'許可されています':'許可されていません'):'このブラウザでは確認できません'}catch{persistence='確認できません'}await updateStorage()}catch(error){saveFailure(error);$('app').innerHTML='<p>記録を開けませんでした。再読み込みしてください。</p>'}}
init();
</script></body></html>
