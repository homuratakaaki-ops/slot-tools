<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>保存容量チェック</title>
<style>
:root{
  --bg:#0F0E0C; --panel:#191713; --panel2:#221F19; --line:#332E25;
  --ink:#F2ECE1; --dim:#948A7C; --accent:#D9A441; --hot:#E0574A; --ok:#69C08A;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px}
.shell{max-width:520px;margin:0 auto;padding:12px 16px 32px}
h1{font-size:18px;color:var(--accent);margin:4px 0 6px}
.note{color:var(--dim);font-size:13px;line-height:1.6;margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px}
.big{font-size:22px;font-family:var(--mono)}
.bar{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.hot>i{background:var(--hot)}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.k{word-break:break-all}
td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
button{font-family:var(--sans);font-size:15px;min-height:44px;width:100%;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);margin:0 0 8px;cursor:pointer}
button:active{filter:brightness(1.35)}
.ok{color:var(--ok)}.hot{color:var(--hot)}
</style>
</head>
<body>
<div class="shell">
  <h1>保存容量チェック</h1>
  <p class="note">このページは slot-tools.jp がスマホの中に保存しているデータの量を表示するだけです。記録の書き換えや削除はしません。</p>

  <div class="card">
    <div>slot-tools.jp 全体の保存量（目安）</div>
    <div class="big" id="total">-</div>
    <div class="bar" id="totalBar"><i id="totalFill" style="width:0"></i></div>
    <div class="note" id="totalNote" style="margin:0"></div>
  </div>

  <div class="card">
    <div style="margin-bottom:6px">保存データの内訳（大きい順）</div>
    <table><tbody id="rows"></tbody></table>
  </div>

  <div class="card">
    <div style="margin-bottom:6px">空き容量の実測</div>
    <p class="note">ボタンを押すと、仮のデータを入れて空きを測り、すぐ消します。記録には触れません。</p>
    <button id="probe">空き容量を測る</button>
    <div id="probeOut" class="big" style="font-size:16px"></div>
  </div>

  <button id="copy">この結果をコピーする</button>
  <div id="copyOut" class="note"></div>
</div>
<script>
"use strict";
// 目安の上限：Chrome系は1サイトあたり約500万文字（約10MB）。端末・ブラウザで異なるため「目安」と表示する
const LIMIT_CHARS=5*1024*1024;
const PROBE_KEY="__slot_tools_storage_probe__";
const el=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString("ja-JP");
const mb=chars=>(chars*2/1024/1024).toFixed(2)+"MB";
let report="";

function listKeys(){
  const out=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k===PROBE_KEY)continue;
      const v=localStorage.getItem(k)||"";
      out.push({k,chars:k.length+v.length});
    }
  }catch(e){return null}
  return out.sort((a,b)=>b.chars-a.chars);
}

function render(){
  const list=listKeys();
  const rows=el("rows");rows.textContent="";
  if(!list){el("total").textContent="読み取れませんでした";return}
  const total=list.reduce((a,x)=>a+x.chars,0);
  const pct=Math.min(100,total/LIMIT_CHARS*100);
  el("total").textContent=fmt(total)+"文字（約"+mb(total)+"）";
  el("totalFill").style.width=pct.toFixed(1)+"%";
  el("totalBar").classList.toggle("hot",pct>=80);
  el("totalNote").textContent="上限の目安に対して約"+pct.toFixed(0)+"%";
  const lines=["保存量 "+fmt(total)+"文字 / 約"+pct.toFixed(0)+"%"];
  list.forEach(x=>{
    const tr=document.createElement("tr");
    const a=document.createElement("td");a.className="k";a.textContent=x.k;
    const b=document.createElement("td");b.className="n";b.textContent=fmt(x.chars);
    const c=document.createElement("td");c.className="n";c.textContent=(total?x.chars/total*100:0).toFixed(0)+"%";
    tr.append(a,b,c);rows.append(tr);
    lines.push(x.k+"\t"+x.chars);
  });
  if(!list.length){const tr=document.createElement("tr");const a=document.createElement("td");a.textContent="保存データはありません";tr.append(a);rows.append(tr)}
  report=lines.join("\n");
  if(navigator.storage&&navigator.storage.estimate){
    navigator.storage.estimate().then(e=>{
      if(e&&e.usage!=null)report+="\n(参考)storage.estimate usage="+e.usage+" quota="+e.quota;
    }).catch(()=>{});
  }
}

// 空きの実測：書けた最大の長さを二分探索で求め、最後に必ず消す
function probe(){
  const out=el("probeOut");out.textContent="測定中…";
  setTimeout(()=>{
    let lo=0,hi=8*1024*1024;
    try{
      while(hi-lo>1024){
        const mid=Math.floor((lo+hi)/2);
        try{localStorage.setItem(PROBE_KEY,"x".repeat(mid));lo=mid}
        catch(e){hi=mid}
      }
    }finally{
      try{localStorage.removeItem(PROBE_KEY)}catch(e){}
    }
    const free=Math.max(0,lo-PROBE_KEY.length);
    out.textContent="あと約 "+fmt(free)+" 文字 保存できます";
    out.className="big "+(free<200000?"hot":"ok");
    out.style.fontSize="16px";
    report+="\n空き実測 "+free;
  },30);
}

el("probe").addEventListener("click",probe);
el("copy").addEventListener("click",()=>{
  const done=()=>{el("copyOut").textContent="コピーしました。チャットに貼り付けてください。"};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(report).then(done,()=>{el("copyOut").textContent="コピーできませんでした。画面のスクリーンショットで大丈夫です。"});
  }else{el("copyOut").textContent="コピーできませんでした。画面のスクリーンショットで大丈夫です。"}
});
try{localStorage.removeItem(PROBE_KEY)}catch(e){}   // 前回の測定が途中で止まっていた場合の後片付け
render();
</script>
</body>
</html>
