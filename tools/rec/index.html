<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>実戦記録</title>
<style>
:root{
  --bg:#0F0E0C; --panel:#191713; --panel2:#221F19; --line:#332E25;
  --ink:#F2ECE1; --dim:#948A7C; --accent:#D9A441; --accent2:#8B6C22;
  --hot:#E0574A; --cool:#4FA3D9; --ok:#69C08A; --lcd:#C9A96E; --pur:#B48CE0;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;overflow-x:hidden}
button{font-family:var(--sans);cursor:pointer;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:14px}
button:active{filter:brightness(1.35)}
input,textarea{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;font-family:var(--sans)}
textarea{min-height:80px;resize:vertical}
.hide{display:none!important}
.shell{max-width:520px;margin:0 auto;padding:8px 10px 20px}
.hd{display:flex;align-items:center;gap:8px;padding:4px 2px 8px;border-bottom:1px solid var(--line)}
.hd .t{flex:1;font-size:15px;font-weight:700;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .x{width:44px;height:38px;font-size:18px;color:var(--dim)}
.badges{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;padding:8px 2px 4px;min-height:20px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.grid .r5{margin-top:8px}
.badges::-webkit-scrollbar{display:none}
.badges .badge{flex:none;white-space:nowrap}
.badges .stg{flex:none;font-size:12px;color:var(--dim);font-family:var(--mono);padding:0 4px}
.badge{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--dim)}
.badge.on{background:rgba(217,164,65,.16);border-color:var(--accent);color:var(--accent)}
.badge.hit{background:rgba(224,87,74,.16);border-color:var(--hot);color:var(--hot)}
.badge.zen{background:rgba(79,163,217,.16);border-color:var(--cool);color:var(--cool)}
.badge.par{background:rgba(180,140,224,.16);border-color:var(--pur);color:var(--pur)}
.cnts{display:flex;gap:6px;margin-top:8px}
.cnt{flex:1;padding:8px 4px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.cnt span{display:block;font-size:11px;color:var(--dim)}
.cnt b{display:block;font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.15}
.cnt.lcd b{color:var(--lcd)}
.mrow{display:flex;gap:6px;margin-top:6px}
.mpill{flex:1;padding:7px 4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;text-align:center;font-size:11px;color:var(--dim)}
.mpill b{font-family:var(--mono);font-size:14px;color:var(--ink);margin-left:3px}
.r3{display:flex;gap:6px;margin-top:6px}
.r3 button{flex:1;padding:11px 0;font-weight:600}
.r3 .danger{background:rgba(224,87,74,.14);border-color:#5C2B26;color:#F0968C}
.r5{display:flex;gap:5px;margin-top:6px}
.r5 button{flex:1;padding:12px 0;font-weight:700;font-family:var(--mono);font-size:15px}
.r5 .undo{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--dim)}
.grid{margin-top:6px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.gtitle{display:flex;align-items:center;gap:8px;padding:0 2px 8px}
.gtitle .m{font-size:12px;font-weight:700;color:var(--accent);flex:1}
.gtitle .st{font-size:12px;color:var(--dim);font-family:var(--mono)}
.grow{display:flex;gap:6px;margin-bottom:6px}
.grow:last-child{margin-bottom:0}
.grow button{flex:1;padding:14px 2px;font-weight:700;font-size:14px;line-height:1.25}
.grow .pri{background:rgba(217,164,65,.14);border-color:var(--accent2);color:var(--accent)}
.grow .hot{background:rgba(224,87,74,.14);border-color:#5C2B26;color:#F0968C}
.grow .par{background:rgba(180,140,224,.14);border-color:#5A4470;color:var(--pur)}
.grow .on{outline:2px solid var(--accent)}
.rc{display:flex;gap:5px;margin-top:6px}
.rcv{flex:1;text-align:center;padding:5px 2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--dim)}
.rcv b{display:block;font-family:var(--mono);font-size:16px;color:var(--ink)}
.rcv small{display:block;font-family:var(--mono);font-size:10px;color:var(--ok)}
.rcv.sw{flex:0 0 46px;border-color:var(--accent2);color:var(--accent)}
.rcv.sw b{color:var(--accent);font-family:var(--sans);font-size:14px}
.log{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.log .lg{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:baseline;font-size:13px}
.log .lg:last-child{border-bottom:none}
.log .tm{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none;width:34px}
.log .gs{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none;width:58px;text-align:right}
.log .gs .lc{color:var(--lcd)} .log .gs .sl{opacity:.5}
.log .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .more{width:100%;border:none;border-radius:0;padding:13px;min-height:44px;font-size:12px;color:var(--dim);background:var(--panel2)}
.log .fbar{position:sticky;top:0;z-index:2;display:flex;gap:4px;padding:6px;background:var(--panel2);border-bottom:1px solid var(--line)}
.log .fbar button{flex:1;min-height:44px;padding:6px 2px;font-size:11px;border-radius:8px}
.log .fbar button.on{background:var(--accent);border-color:var(--accent);color:#1a1200;font-weight:700}
.log .fbar button.close{flex:0 0 auto;padding:6px 10px;color:var(--hot)}
.log .empty{padding:16px;text-align:center;color:var(--dim);font-size:13px}
.r2{display:flex;gap:6px;margin-top:6px}
.r2 button{flex:1;min-height:46px;padding:12px 4px;font-weight:700;font-size:14px}
.wide{width:100%;padding:12px;margin-top:6px;font-weight:600}
.wide.dim{color:var(--dim)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:none;align-items:flex-end;padding-bottom:25vh;padding-bottom:25dvh}
.sheet.open{display:flex}
.sheet .pane{width:100%;max-width:520px;margin:0 auto;background:var(--panel);border-top-left-radius:16px;border-top-right-radius:16px;max-height:72vh;max-height:72dvh;border-bottom-left-radius:16px;border-bottom-right-radius:16px;display:flex;flex-direction:column}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet .sh .st{flex:1;font-weight:700}
.sheet .sb{padding:12px 14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .sf{flex:none;padding:8px 14px 14px;border-top:1px solid var(--line);background:var(--panel);display:none}
.sheet .sf:not(:empty){display:block}
.sheet .sf button{margin-top:6px}
.opts button.tone-p{background:rgba(180,140,224,.18);border-color:rgba(180,140,224,.55)}
.opts button.tone-c{background:rgba(110,170,240,.18);border-color:rgba(110,170,240,.55)}
.opts button.tone-d{background:rgba(240,110,110,.18);border-color:rgba(240,110,110,.55)}
.opts button.on.tone-p,.opts button.on.tone-c,.opts button.on.tone-d{background:var(--accent);border-color:var(--accent)}
.sheet .sh{position:sticky;top:0;background:var(--panel);z-index:1}
.sheet .sb .lbl{font-size:12px;color:var(--dim);margin:12px 0 6px}
.sheet .sb .lbl:first-child{margin-top:0}
.sheet .sb .lbl .hint{font-weight:400;opacity:.8;margin-left:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{flex:1 0 calc(33.33% - 4px);padding:13px 2px;font-weight:700;font-size:13px;line-height:1.25}
.opts button.q4{flex:1 0 calc(25% - 5px)}
.opts button.q2{flex:1 0 calc(50% - 3px)}
.opts button.on{background:var(--accent);border-color:var(--accent);color:#1A1509}
.opts button.hot.on{background:var(--hot);border-color:var(--hot);color:#fff}
.opts button small{display:block;font-weight:400;font-size:10px;opacity:.75}
.sheet .go{width:100%;padding:14px;margin-top:14px;background:var(--accent);border-color:var(--accent);color:#1A1509;font-weight:700;font-size:15px}
.sheet .sub{width:100%;padding:11px;margin-top:8px;color:var(--dim)}
.hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}
.kp{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:none;align-items:flex-end}
.kp.open{display:flex}
.kp .pane{width:100%;max-width:520px;margin:0 auto;background:var(--panel);border-top-left-radius:16px;border-top-right-radius:16px;padding-bottom:18px}
.kp .disp{font-family:var(--mono);font-size:32px;font-weight:700;text-align:right;padding:14px 18px;border-bottom:1px solid var(--line)}
.kp .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 12px 0}
.kp .keys button{padding:16px 0;font-family:var(--mono);font-size:20px;font-weight:700}
.kp .acts{display:flex;gap:6px;padding:10px 12px 0}
.kp .acts button{flex:1;padding:14px 0;font-weight:700}
.kp .acts .ok{background:var(--accent);border-color:var(--accent);color:#1A1509}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2C2720;border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:13px;z-index:70;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
.setup{padding:14px 0}
.setup .lbl{font-size:12px;color:var(--dim);margin:12px 0 6px}
.setup .lbl:first-child{margin-top:0}
.setup .two{display:flex;gap:8px}
.setup .two>div{flex:1}
.num{font-family:var(--mono);text-align:right}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.recent button{padding:7px 11px;font-size:13px;color:var(--dim)}
.recent button.on{color:#1A1509;background:var(--accent);border-color:var(--accent)}
.err{color:var(--hot);font-size:12px;margin-top:8px}
.note.fold{max-height:220px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.note{white-space:pre-wrap;font-family:var(--mono);font-size:12px;line-height:1.6}
.sess{border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}
.sess>summary{padding:11px 12px;background:var(--panel);cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline}
.sess>summary::-webkit-details-marker{display:none}
.sess .sm{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
.sess .sn{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .pl{font-family:var(--mono);font-size:12px;font-weight:700}
.sess .body{padding:10px 12px;background:var(--bg);border-top:1px solid var(--line)}
.dayhd{display:flex;gap:8px;align-items:baseline;padding:14px 4px 7px;border-bottom:1px solid var(--line);margin-top:6px}
.dayhd .d{font-weight:700;font-size:14px}
.dayhd .c{font-family:var(--mono);font-size:11px;color:var(--dim)}
.dayhd .v{flex:1;text-align:right;font-family:var(--mono);font-size:14px;font-weight:700}
.sumrow{display:flex;gap:8px;align-items:baseline;padding:8px 10px;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:none}
.sumrow .k{font-size:12px;color:var(--accent);font-weight:700;flex:none;width:38px}
.sumrow .c{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none;width:34px}
.sumrow .v{font-family:var(--mono);font-size:15px;font-weight:700;flex:1;text-align:right}
.sumrow .e{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
.warn{background:#3A2A16;color:#F0D9A8;font-size:12px;padding:8px 12px;text-align:center;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<div class="shell">
  <div class="hd"><div class="t" id="hdTitle">実戦記録</div><button class="x" id="hdMenu">≡</button></div>
  <div id="storeWarn" class="warn hide">保存できません。閉じる前に必ず書き出してください。</div>

  <section id="scSetup" class="setup hide">
    <div class="lbl">機種</div>
    <div class="recent" id="stMachines"></div>
    <input id="stMachine" placeholder="一覧にない機種は名前を入力（汎用で記録）" autocomplete="off" style="margin-top:8px">
    <div class="lbl">レート（1000円で何枚）</div>
    <div class="opts"><button class="q4" data-lend="46">46</button><button class="q4" data-lend="47">47</button><button class="q4" data-lend="50">50</button><button class="q4" data-lend="52">52</button></div>
    <input id="stLend" class="num" inputmode="numeric" style="margin-top:6px" placeholder="52">
    <div class="two" style="margin-top:12px">
      <div><div class="lbl">開始 実G</div><input id="stRealG" class="num" inputmode="numeric" placeholder="0"></div>
      <div id="stLcdWrap"><div class="lbl">開始 液晶G</div><input id="stLcdG" class="num" inputmode="numeric" placeholder="0"></div>
    </div>
    <div id="stFields"></div>
    <div class="lbl" style="margin-top:12px">台の総回転数（開始時・データ画面の値）<span class="hint" id="stTotalHint" style="font-weight:400;opacity:.8;margin-left:6px">任意</span></div>
    <input id="stTotal" class="num" inputmode="numeric" placeholder="0">
    <div class="lbl" style="margin-top:12px">想定期待値（円）</div>
    <input id="stExp" class="num" inputmode="numeric" placeholder="2000">
    <div class="two" style="margin-top:12px">
      <div><div class="lbl">持ちメダル（元から手元に）</div><input id="stMedal" class="num" inputmode="numeric" placeholder="0"></div>
      <div><div class="lbl">再プレイでおろした分</div><input id="stReplay0" class="num" inputmode="numeric" placeholder="0"></div>
    </div>
    <div class="hint">打ち始めに貯メダルからおろした枚数は「再プレイ」に。途中でおろす分は打ち始めてから「再プレイ」ボタンで。</div>
    <div class="lbl">打ち始めのメモ</div>
    <textarea id="stNote" placeholder="リセット / 3スルー など" style="min-height:60px"></textarea>
    <div class="err hide" id="stErr"></div>
    <button class="go wide" id="stStart" style="background:var(--accent);border-color:var(--accent);color:#1A1509;font-weight:700;padding:15px;margin-top:16px">打ち始める</button>
  </section>

  <section id="scMain" class="hide">
    <div class="cnts">
      <button class="cnt" data-cnt="realG"><span>実G</span><b id="cRealG">0</b></button>
      <button class="cnt lcd" data-cnt="lcdG" id="cLcdWrap"><span>液晶G</span><b id="cLcdG">0</b></button>
      <button class="cnt" data-cnt="c3"><span id="c3Lbl">周期</span><b id="cC3">0</b></button>
    </div>
    <div class="mrow">
      <div class="mpill">投資<b id="mCash">0円</b></div>
      <div class="mpill">残高<b id="mBal">0円</b></div>
      <div class="mpill">再<b id="mRep">0枚</b></div>
      <div class="mpill">差枚<b id="mDiff">−</b></div>
    </div>
    <div class="r3"><button class="danger" id="bMinus">−1000</button><button id="bDeposit">入金</button><button id="bReplay">再プレイ</button></div>
    <div class="badges" id="badges"></div>
    <div class="grid">
      <div id="gridRows"></div>
      <div class="rc" id="rareCounts"></div>
    <div class="r5"><button data-step="1">+1</button><button data-step="3">+3</button><button data-step="5">+5</button><button data-step="10">+10</button><button class="undo" id="bStepUndo">元に戻す</button></div>
    </div>
    <div class="log" id="log"></div>
    <button class="wide dim" id="bUndo">直前を取り消す</button>
    <div class="r2"><button id="bHint">設定判別</button><button id="bUtil">投資・回収・出力</button></div>
  </section>

  <section id="scNote" class="hide">
    <div id="nSum"></div>
    <div style="display:flex;gap:6px;margin-top:12px"><button class="wide" id="nExpText" style="margin:0">テキスト</button><button class="wide" id="nExpJson" style="margin:0">JSON</button><button class="wide" id="nDl" style="margin:0">保存</button></div>
    <div style="display:flex;gap:6px;margin-top:6px"><button class="wide" id="nExpNote" style="margin:0">振り返りノート用</button><button class="wide" id="nDlNote" style="margin:0">同・保存</button></div>
    <button class="wide dim" id="nImpOpen">JSONを取り込む</button>
    <div id="nList"></div>
  </section>
</div>

<div class="sheet" id="sheet"><div class="pane"><div class="sh"><div class="st" id="shTitle">入力</div><button id="shClose" style="padding:8px 14px">閉じる</button></div><div class="sb" id="shBody"></div><div class="sf" id="shFoot"></div></div></div>
<div class="kp" id="kp"><div class="pane"><div class="sh"><div class="st" id="kpTitle">数値</div><button id="kpX" style="padding:8px 14px">キャンセル</button></div><div class="disp" id="kpDisp">0</div><div class="keys" id="kpKeys"></div><div class="acts"><button id="kpClear">C</button><button id="kpBack">⌫</button><button class="ok" id="kpOk">決定</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const KEY="slot-tools-rec";
const DEF_LEND=46;

/* =====================================================================
   機種定義
   generic … 機種未登録時の汎用。rec14 までの動きをそのまま定義に落としたもの
   karakuri2 … からくりサーカス2（第1段：通常時・CZ中）
   ===================================================================== */
const MACHINES={
  generic:{
    name:"汎用",
    lcdG:true,
    setup:[{key:"c3",label:"周期",type:"num"}],
    counter3:{label:"周期",reset:"ask"},
    rares:[
      {key:"melon",label:"🍉",strong:true},
      {key:"cherry",label:"🍒",strong:true},
      {key:"chance",label:"チャンス目",strong:true},
      {key:"other",label:"その他",strong:true}
    ],
    lcdAdd:{steps:[10,20,30,50,100],chars:null},
    hits:[{label:"BIG",kind:"at",inline:true},{label:"REG",kind:"at",inline:true},{label:"CZ",kind:"cz"},{label:"AT",kind:"at"}],
    hitTriggers:null,
    stages:null,
    zenchou:{stages:["前兆","前兆ステージ"],stageIndex:1,outGroups:[],stageLabel:"前兆ステージ"},
    parallel:[],
    czEndStd:{groups:[]},
    atStart:{groups:[]},
    atEnd:{groups:[]},
    grids:{
      normal:[["lcdAdd","rare","hit"],["zenchou","counter3","memo"]],
      cz:[["hitEnd","rare","memo"]],
      at:[["hitEnd","rare","memo"]]
    }
  },
  karakuri2:{
    name:"からくりサーカス2",
    lcdG:true,
    checker:{key:"karakuri2-checker-v1",url:"https://slot-tools.jp/karakuri2-checker.html",name:"からくりサーカス2 設定判別"},
    setup:[
      {key:"c3",label:"CZスルー回数",type:"num"},
      {key:"state",label:"状態",type:"select",options:["不明","リセット後","AT後","CZ後"]},
      {key:"melon",label:"スイカ回数（自分が続行する時だけ）",type:"num",optional:true},
      {key:"lastCz",label:"前回のCZ終了画面",type:"select",options:["不明","鳴海","勝","しろがね","祈るフランシーヌ","フランシーヌ人形","笑顔のフランシーヌ","アンジェリーナ","リーゼ","敵4人","手","ギイ＆オリンピア","ピエロ","真夜中のサーカス","フェイスレス"]}
    ],
    counter3:{label:"CZスルー",reset:"at",incOnCzFail:["機械仕掛けの女神"]},
    modeEra:{advanceOn:["機械仕掛けの女神","劇場ジャッジ","AT","上位AT"],skipTriggers:["劇場ジャッジ 失敗"]},
    // 有利区間切れ：引き継ぎ前提の情報を消す。終了シートに確認を出す当選と、消すもの
    yuuri:{askOnEnd:["運命の一劇","上位AT"],clear:["rewardHint","pendingReward","melonLeft","modeHints","tags","parCount"]},

let S={version:2,settings:{lend:DEF_LEND},sessions:[],cur:null};
let saveOK=true, logOpen=false, rareView="w", pickedMachine=null;

const el=i=>document.getElementById(i);
const pad=n=>String(n).padStart(2,"0");
const nowISO=()=>new Date().toISOString();
const hm=s=>{const d=new Date(s);return pad(d.getHours())+":"+pad(d.getMinutes())};
const ymd=s=>{const d=new Date(s);return d.getFullYear()+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate())};
const wd=s=>"日月火水木金土"[new Date(s).getDay()];
const int=v=>{const t=String(v==null?"":v).trim().replace(/[,，]/g,"").replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));if(t==="")return null;if(!/^-?\d+$/.test(t))return NaN;return parseInt(t,10)};
const badNum=v=>v!==null&&Number.isNaN(v);   // 入力はあるが数値として読めない
const yen=n=>n.toLocaleString("ja-JP");
const sgn=n=>(n>0?"+":"")+yen(n);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=a=>(a||[]).reduce((x,y)=>x+y.amount,0);
function expectedTotal(s){return (s.expected||0)+(s.follow||[]).reduce((a,f)=>a+(f.amount||0),0)}
function invested(m){return Array.isArray(m.spends)?sum(m.spends):sum(m.cash||[])}
function balance(m){return Array.isArray(m.deposits)?sum(m.deposits)-sum(m.spends||[]):0}
function replayed(m){return sum(m.replays||[])}
function fixMoney(m){
  if(!m)return;
  if(!Array.isArray(m.deposits)||!Array.isArray(m.spends)){
    const t=Math.abs(sum(m.cash||[]));
    const at=(m.cash&&m.cash.length)?m.cash[0].at:nowISO();
    m.deposits=t>0?[{at,amount:t}]:[]; m.spends=t>0?[{at,amount:t}]:[];
  }
  if(!Array.isArray(m.cash))m.cash=[];
  // 再プレイ：開始時・終了時の欄 → 途中の投入履歴へ
  if(!Array.isArray(m.replays)){
    m.replays=[];
    if(m.startReplay>0)m.replays.push({at:nowISO(),amount:m.startReplay,migrated:true});
    if(m.endReplay>0&&m.endMedal!=null)m.endMedal+=m.endReplay;
    m.startReplay=0;m.endReplay=0;
  }
}
function toast(m){const t=el("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1400)}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function DEF(){return MACHINES[S.cur&&S.cur.machineId]||MACHINES.generic}

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));if(!saveOK){saveOK=true;el("storeWarn").classList.add("hide")}}catch(e){saveOK=false;el("storeWarn").classList.remove("hide")}}
function fixSession(c){
  if(!c)return;
  fixMoney(c.money);
  if(!c.machineId)c.machineId="generic";
  if(c.c3===undefined)c.c3=c.cycle||0;
  if(c.hit&&!c.hit.label)c.hit.label=c.hit.type||"当選";
  if(c.hit&&!c.hit.kind)c.hit.kind=(c.hit.label==="CZ")?"cz":"at";
  if(c.hit&&c.hit.keepG===undefined)c.hit.keepG=false;
  if(c.hit&&c.hit.phase===undefined)c.hit.phase=null;
  if(!c.mode)c.mode=c.hit?c.hit.kind:"normal";
  if(!c.parallel)c.parallel={};
  if(!c.rare)c.rare={};
  const d=MACHINES[c.machineId]||MACHINES.generic;
  d.rares.forEach(r=>{
    const v=c.rare[r.key];
    if(r.strong){ if(v==null)c.rare[r.key]={w:0,s:0}; else if(typeof v==="number")c.rare[r.key]={w:v,s:0}; }
    else{ if(v==null||typeof v!=="object")c.rare[r.key]={n:typeof v==="number"?v:0,hit:0}; if(c.rare[r.key].hit==null)c.rare[r.key].hit=0; }
  });
  if(!c._steps)c._steps=[];
  if(c.revive==null)c.revive=0;
  if(c.melonLeft===undefined)c.melonLeft=null;
  if(c.melonApprox===undefined)c.melonApprox=false;
  if(c.rewardHint===undefined)c.rewardHint=null;
  if(c.modeHint===undefined)c.modeHint=null;
  if(c.ticket===undefined)c.ticket=false;
  if(c.judgeWins==null)c.judgeWins=0;
  if(c.returnHit===undefined)c.returnHit=null;
  if(c.pendingReward===undefined)c.pendingReward=null;
  if(c.modeEra==null)c.modeEra=0;
  if(!c.tags||typeof c.tags!=="object")c.tags={};
  if(!Array.isArray(c.modeHints)){c.modeHints=[];if(c.modeHint)c.modeHints.push({text:c.modeHint,era:c.modeEra,span:1,at:nowISO()})}
  if(!c.melonPhase)c.melonPhase="normal";
  if(c.rare&&c.rare.melon){if(c.rare.melon.nMission==null)c.rare.melon.nMission=0;if(c.rare.melon.nPending==null)c.rare.melon.nPending=0}
  if(c.zenchou===true||c.zenchou==="pre")c.zenchou=zenStages().indexOf("前兆");
  if(c.zenchou==="stage")c.zenchou=zenStages().length-1;
  if(typeof c.zenchou!=="number"&&c.zenchou!==false)c.zenchou=false;
  if(!Array.isArray(c.follow))c.follow=[];
}

function sheet(title,build){el("shTitle").textContent=title;const b=el("shBody");b.innerHTML="";el("shFoot").innerHTML="";build(b);el("sheet").classList.add("open");positionSheet()}
function closeSheet(){el("sheet").classList.remove("open");const p=el("sheet").querySelector(".pane");if(p)p.style.transform="";if(_op&&_op.snap&&!_op.used)_op=null}   // 使われなかったスナップショットは捨てる
// シートの位置：最初の選択肢群の中心を、グリッド最下段（レア役の行）の高さに合わせる
let _posRaf=null;
function positionSheet(){
  const sh=el("sheet"),pane=sh.querySelector(".pane");if(!pane)return;
  pane.style.transform="";
  const body=el("shBody");body.scrollTop=0;
  if(_posRaf)cancelAnimationFrame(_posRaf);   // 前のシートの分が後から走らないように
  _posRaf=requestAnimationFrame(()=>{
    _posRaf=null;pane.style.transform="";
    const rows=document.querySelectorAll("#gridRows .grow");
    const last=rows.length?rows[rows.length-1]:null;
    const targetY=last?(last.getBoundingClientRect().top+last.getBoundingClientRect().bottom)/2:window.innerHeight*0.5;
    const opts=body.querySelector(".opts");
    if(!opts)return;
    const r=opts.getBoundingClientRect(),pr=pane.getBoundingClientRect();
    let shift=targetY-(r.top+r.bottom)/2;
    const minTop=8,maxBottom=window.innerHeight-8;
    if(pr.top+shift<minTop)shift=minTop-pr.top;
    if(pr.bottom+shift>maxBottom)shift=maxBottom-pr.bottom;
    pane.style.transform="translateY("+Math.round(shift)+"px)";
  });
}
el("shClose").addEventListener("click",closeSheet);
el("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
function optRow(items,onPick,cls){

/* 複数グループから1つずつ選ぶシート。required でないグループは未選択でも可 */
function groupSheet(title,groups,onDone,opts){
  opts=opts||{};
  const sel={};
  if(opts.initial)Object.assign(sel,opts.initial);
  // 選択肢が1グループだけで必須なら、選んだ瞬間に記録する（「記録する」を押させない）
  const instant=opts.instant===true||(opts.instant!==false&&groups.length===1&&groups[0].required&&!opts.after&&!opts.before);
  const wraps=[];   // showWhen の再評価用
  const reeval=()=>{wraps.forEach(x=>{const sw=x.showWhen;if(!sw)return;const ok=sw.in.includes(sel[sw.key]);x.els.forEach(e=>e.classList.toggle("hide",!ok));
    if(!ok&&x.key){delete sel[x.key];delete sel["_set_"+x.key]}
    if(!ok&&x.optOf&&sel[x.optOf]===x.optLabel){delete sel[x.optOf];delete sel["_set_"+x.optOf];x.els.forEach(e=>e.classList.remove("on"))}   // 隠れた選択肢が選ばれていたら外す
  })};
  sheet(title,b=>{
    if(opts.before)opts.before(b,sel);
    const hideable=[];
    groups.forEach(g=>{
      const lbl=mk("div","lbl",g.label);
      if(!g.required&&!instant)lbl.append(mk("span","hint","任意"));
      b.append(lbl);
      const w=mk("div","opts");
      if(g.showWhen)wraps.push({showWhen:g.showWhen,els:[lbl,w],key:g.key});
      if(g.hideOn===undefined&&groups[0].hideOthersOn&&g!==groups[0])hideable.push(lbl,w);
      g.options.forEach(o=>{
        const label=Array.isArray(o)?o[0]:(o&&o.l!=null?o.l:o), hint=Array.isArray(o)?o[1]:(o&&o.h!=null?o.h:null), setv=(o&&o.set)||null;
        const btn=mk("button",g.options.length>6?"q4":(g.options.length<=2?"q2":""),label);
        if(o&&o.tone)btn.classList.add("tone-"+o.tone);
        if(hint)btn.append(mk("small","",hint));
        if(sel[g.key]===label){btn.classList.add("on");if(setv)sel["_set_"+g.key]=setv}
        if(o&&o.showWhen)wraps.push({showWhen:o.showWhen,els:[btn],key:null,optOf:g.key,optLabel:label});
        btn.addEventListener("click",()=>{
          if(sel[g.key]===label&&instant){onDone(sel);return}
          if(sel[g.key]===label){delete sel[g.key];delete sel["_set_"+g.key];btn.classList.remove("on");reeval();return}
          sel[g.key]=label;if(setv)sel["_set_"+g.key]=setv;else delete sel["_set_"+g.key];
          w.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
          btn.classList.add("on");
          reeval();
          if(instant){onDone(sel);return}
          if(g===groups[0]&&g.hideOthersOn){
            const hide=g.hideOthersOn===label;
            hideable.forEach(e=>e.classList.toggle("hide",hide));
            if(b._extraHide)b._extraHide.forEach(e=>e.classList.toggle("hide",hide));
            if(hide){groups.slice(1).forEach(og=>delete sel[og.key]);hideable.forEach(e=>e.querySelectorAll&&e.querySelectorAll("button").forEach(x=>x.classList.remove("on")))}
          }
        });
        w.append(btn);
      });
      b.append(w);
    });
    if(opts.after)opts.after(b,sel);
    reeval();
    if(!instant){
      const go=mk("button","go",opts.goLabel||"記録する");
      go.addEventListener("click",()=>{
        const miss=groups.find(g=>g.required&&!sel[g.key]&&!(g.showWhen&&!g.showWhen.in.includes(sel[g.showWhen.key])));
        if(miss){toast(miss.label+"を選んでください");return}
        onDone(sel);
      });
      el("shFoot").append(go);   // 下に固定して常に見える
    }
  });
}

const SNAP_KEYS=["hit","mode","stage","prevStage","zenchou","realG","lcdG","c3","parallel","parCount","melonLeft","melonApprox","rewardHint","modeHint","revive","rare","ticket","judgeWins","returnHit","pendingReward","melonPhase","modeEra","modeHints","tags"];
function snapshot(c){const o={};SNAP_KEYS.forEach(k=>{o[k]=JSON.parse(JSON.stringify(c[k]===undefined?null:c[k]))});return o}
// 1操作＝1つの op。mark() で開き、その操作中の push は同じ op に属する。
// 取り消しは op 単位で戻す（1操作が複数行を作っても、まとめて戻る）
let _op=null;        // {id, snap, used}
function push(type,text,extra){
  const c=S.cur;
  const ev={id:uid(),at:nowISO(),type,text,realG:c.realG,lcdG:DEF().lcdG?c.lcdG:null,c3:c.c3,mode:c.mode};
  if(extra)Object.assign(ev,extra);
  if(!_op||(_op.closed&&_op.used)||(_op.closed&&!_op.snap)){_op={id:uid(),snap:null,used:false,closed:false}}
  else if(_op.closed&&_op.snap&&!_op.used){_op.closed=false}   // mark→シート→push：snap をまだ使っていなければ同じ操作
  if(!_op.closed)queueMicrotask(()=>{if(_op)_op.closed=true});
  ev.op=_op.id;
  if(_op.snap&&!_op.used){ev.snap=_op.snap;_op.used=true}
  c.events.push(ev); save(); render();
}
// 状態を変える操作の直前に呼ぶ。この後の push（同期処理内、または次の push まで）が同じ操作になる
function mark(){_op={id:uid(),snap:snapshot(S.cur),used:false,closed:false};queueMicrotask(()=>{if(_op)_op.closed=true})}
// mark したが push しない経路で呼ぶ（次の push に古いスナップショットを付けない）
function unmark(){_op=null}
// ログ行の表示文：曖昧なら「？」、補足があれば括弧で

function gsHtml(ev,def){const d=def||DEF();const r=ev.realG,l=d.lcdG?ev.lcdG:null;if(r==null&&l==null)return"";if(r==null)return'<span class="lc">'+l+'</span>';if(l==null||l===r)return String(r);return r+'<span class="sl">/</span><span class="lc">'+l+'</span>'}

function makeGridButton(spec){

  if(spec==="hit")return mkb("当選","hot",openHit);

  if(spec==="zenchou")return mkb(zenchouLabel(),zenIdx()>=0?"on":"",openZenchou);
  if(spec==="stage")return d.stages?mkb("ステージ","",openStage):null;
  if(spec==="counter3")return mkb(d.counter3.label+" +1","",()=>{c.c3++;push("c3",d.counter3.label+" "+c.c3+"に加算")});
  if(spec==="memo")return mkb("メモ","",openMemo);
  if(spec.startsWith("par:")){const p=d.parallel.find(x=>x.key===spec.slice(4));if(!p)return null;const on=!!c.parallel[p.key];
    if(c.pendingReward&&p.pending)return mkb("報酬待ち","par on",firePending);
    return mkb(on?p.label+" 結果":p.label,"par"+(on?" on":""),()=>on?parallelEnd(p):parallelStart(p))}

    return mkb(x.label,"",()=>openExtra(x))}
  if(spec.startsWith("phase:")){const hd=curHitDef();const k=spec.slice(6);const p=hd&&hd.phases&&hd.phases[k];if(!p)return null;const on=c.hit.phase===k;return mkb(on?p.label+"中":p.label,"par"+(on?" on":""),()=>{if(on)return;mark();c.hit.phase=k;push("phase",p.label+" 突入",{phase:k});toast(p.label)})}

function startHit(h,trig,opts){
  const d=DEF(),c=S.cur;opts=opts||{};mark();
  if(opts.returnFrom&&c.hit)c.returnHit=JSON.parse(JSON.stringify(c.hit));   // AT中からのCZ：戻り先を保存（mark の後）
  if(opts.consumePending){c.pendingReward=null;c.melonPhase="normal"}          // 報酬待ちからの当選：待ちを消費（mark の後）
  const target=h.enter?hitDef(h.enter):h;   // AT直撃 → AT の定義で開始
  // 契機とレア役の当選を紐づける（trackHit があれば、その当選のときだけ）
  if(trig){const t=d.rares.find(x=>x.track&&x.trigger===trig);if(t&&c.rare[t.key]){const ok=!t.trackHit||t.trackHit.includes(h.label);if(ok)c.rare[t.key].hit=(c.rare[t.key].hit||0)+1}}
  const wasZen=(!opts.sub&&zenIdx()>=0)?zenStages()[zenIdx()]:null;
  let stageTxt="";
  if(wasZen&&d.onHitInStage&&!opts.sub){
    const o=d.onHitInStage;const ex=o.exceptTriggers&&trig&&o.exceptTriggers.includes(trig);const nt=o.noTagTriggers&&trig&&o.noTagTriggers.includes(trig);
    if(ex){if(o.exceptC3==="+1"){c.c3++;stageTxt="　"+d.counter3.label+" "+c.c3}}
    else if(nt){if(typeof o.c3==="number"){c.c3=o.c3;stageTxt="　"+d.counter3.label+" "+c.c3}}
    else{if(o.tag){c.tags=c.tags||{};c.tags[o.tag]=o.until||"stageEnd";stageTxt="　"+o.tag}if(typeof o.c3==="number"){c.c3=o.c3;stageTxt+="　"+d.counter3.label+" "+c.c3}}
  }
  if(!opts.sub){if(zenIsStage()&&c.prevStage!==undefined)c.stage=c.prevStage;c.zenchou=false}
  if(target.kind==="at"&&!opts.resume){c.judgeWins=0;c.ticket=false}   // 新しいAT：権利と激情成功数を0に
  Object.keys(c.tags||{}).forEach(k=>{if(c.tags[k]==="nextHit")delete c.tags[k]});
  // モード示唆の区間：定義の advanceOn に該当する当選で1つ進む（劇場→女神のような連鎖は進めない）
  const me=d.modeEra;if(me&&me.advanceOn&&me.advanceOn.includes(target.label)&&!(me.skipTriggers&&trig&&me.skipTriggers.includes(trig))&&!opts.sub){c.modeEra=(c.modeEra||0)+1}
  c.hit={label:target.label,via:h.label,kind:target.kind,keepG:!!target.keepG,phase:null,at:nowISO(),realG:c.realG,lcdG:c.lcdG,c3:c.c3,trig};
  c.mode=target.kind;
  push("hitStart",h.label+" 当選　"+gsText(c)+"G"+(trig?"（"+trig+"）":"")+(wasZen?"　"+wasZen+"から":"")+(opts.where?"　告知："+opts.where:"")+(opts.consumePending?"　報酬待ちから":"")+(opts.extraTxt||"")+stageTxt,{hit:target.label,via:h.label,trig,where:opts.where||null,zenFrom:wasZen,fromPending:!!opts.consumePending,hitSel:opts.hitSel||null});
  if(opts.hitSel)applyHints(opts.hitSel);
  // G数は当選時に触らない。終了時に「今のG数」を入れて合わせる（SF6と同じ）
  c._steps=[];
  const st=hitProp(target,"atStart");
  const skipStart=st&&st.skipTriggers&&trig&&st.skipTriggers.includes(trig);
  if(target.kind==="at"&&st&&st.groups&&st.groups.length&&!skipStart){
    groupSheet(target.label+" 開始",st.groups,sel=>{if(sel.stage)c.stage=sel.stage;push("atStart",target.label+"開始　"+selText(st.groups,sel),{sel});closeSheet();if(target.inline)hitEnd()});
  }else{save();render();closeSheet();if(target.inline)hitEnd();else toast(target.label+" 開始")}
}

// セリフ・ボイスの示唆を運命盤の手がかり／モード示唆として持つ
function applyHints(sel){
  const c=S.cur;let msg=[];
  if(!sel)return "";
  Object.keys(sel).filter(k=>k.startsWith("_set_")).forEach(k=>{
    const v=sel[k];if(!v)return;
    if(v.ifTag&&!(c.tags&&c.tags[v.ifTag])){msg.push("（"+v.ifTag+"中ではないので示唆なし）");return}   // 条件付きの示唆
    if(v.melonLeft!=null){c.melonLeft=v.melonLeft;c.melonApprox=!!v.approx;msg.push("🍉残り"+v.melonLeft+(v.approx?"以下":""))}
    if(v.reward){c.rewardHint=v.reward;msg.push("次回 "+v.reward)}
    if(v.mode){c.modeHints=c.modeHints||[];c.modeHints.push({text:v.mode,era:c.modeEra||0,span:v.span||1,at:nowISO()});msg.push(v.mode+(v.span>1?"（"+v.span+"回）":""))}
    if(v.tag){c.tags=c.tags||{};c.tags[v.tag]=v.until||"hitEnd";msg.push(v.tag)}
  });
  return msg.join("、");
}

// 有利区間切れ：引き継ぎ前提の情報を消す（ユーザーが押す）

// 当選を抜けた時の共通処理：運命盤の回数を数え直す、🍉残りを消す（モード示唆は区間で期限切れ）
function afterHitEnd(endedLabel,keep){
  const d=DEF(),c=S.cur;
  if(keep)return;   // 通常時が続く失敗（通常時の幕間チャンス等）：何も消さない
  d.parallel.forEach(p=>{if(p.resetCountOnHitEnd&&c.parCount)c.parCount[p.key]=0});
  // 規定回数がCZ/ATでリセットされるレア役：打ち切りとしてログに残してから0に
  d.rares.forEach(r=>{
    if(!r.resetOnHitEnd)return;const cell=c.rare[r.key];if(!cell)return;
    const n=cell.n||0;
    if(n>0&&r.cutLog)push("rareCut",r.label+" "+n+"回で打ち切り"+(endedLabel?"（"+endedLabel+"）":""),{rareKey:r.key,n});
    cell.n=0;
  });
  c.melonLeft=null;c.melonApprox=false;
  Object.keys(c.tags||{}).forEach(k=>{if(c.tags[k]==="hitEnd")delete c.tags[k]});
  if(c.melonPhase==="mission")c.melonPhase="normal";   // ミッション中の当選（U04）：バッジは残すが🍉は通常中として数え直す
  // rewardHint・pendingReward は残す（CZ/ATをまたいでも報酬は引き継ぐ）
}
// AT を抜けて次へ（afterAt）または通常時へ
function leaveAt(after,extraTxt,sel,GF,MF){
  const d=DEF(),c=S.cur,h=c.hit;mark();
  if(!GF&&h){const lr=(d.lcdRestart!=null&&!after)?d.lcdRestart:0;GF={realG:{value:"0"},lcdG:{value:String(lr)}}}   // G数を聞かない機種：既定で進める
  const reset=d.counter3.reset==="at";
  let t=h.label+" 終了";if(extraTxt)t+="　"+extraTxt;
  if(reset){c.c3=0;t+="　"+d.counter3.label+"リセット"}
  if(c.ticket&&after&&after.hit==="運命の一劇"){c.ticket=false;t+="　一劇権利を使用"}
  c.returnHit=null;
  c.hit=null;c.mode="normal";
  push("hitEnd",t,{hit:h.label,sel:sel||null});
  if(GF)applyG(GF);else{c.realG=0;c.lcdG=0;c._steps=[]}
  {const md=applyMedal(MF);if(md)push("medal","持ちメダル "+yen(md.medal)+"枚（差枚 "+sgn(md.diff)+"）",{medal:md.medal,diff:md.diff,prevCredit:md.prev})}
  afterHitEnd(h.label);
  if(sel)applyHints(sel);
  closeSheet();
  if(after&&after.viaNormal){
    // いったん通常時に戻ってから即当選（1G連など）。段階に入り、G数を進めてから当選
    if(d.zenchou&&d.zenchou.enterOnHitEnd){c.zenchou=0;push("zenchou",zenStages()[0]+" 開始")}
    if(after.realG!=null){c.realG=after.realG;if(d.lcdG)c.lcdG=after.realG}
    const nxt=hitDef(after.hit);if(nxt){startHit(nxt,after.trig);return}
  }
  if(after){const nxt=hitDef(after.hit);if(nxt){startHit(nxt,after.trig);return}}
  if(d.zenchou&&d.zenchou.enterOnHitEnd){c.zenchou=0;push("zenchou",zenStages()[0]+" 開始")}
  save();render();
}

/* ---------- 前兆：段階は任意。シートで「次の段階／失敗」を選ぶ ---------- */

function zenIdx(){const c=S.cur;return typeof c.zenchou==="number"?c.zenchou:-1}   // -1=通常時
function zenStageIdxs(){const d=DEF();const i=(d.zenchou&&d.zenchou.stageIndex!=null)?d.zenchou.stageIndex:zenStages().length-1;return Array.isArray(i)?i:[i]}

function applyStageEnd(){
  const d=DEF(),c=S.cur,oe=d.zenchou&&d.zenchou.onEnd;let txt="";

function openExtra(x){
  if(x.type==="melonLeft"){openMelonLeft();return}
  if(x.once&&S.cur.hit){
    const cur=findExtraInHit(x.label);
    if(cur){
      const init={};x.groups.forEach(g=>{if(cur.sel&&cur.sel[g.key])init[g.key]=cur.sel[g.key]});
      groupSheet(x.title||x.label,x.groups,sel=>{
        const t=selText(x.groups,sel);if(!t){toast("何も選ばれていません");return}
        const same=x.groups.every(g=>(sel[g.key]||null)===(cur.sel&&cur.sel[g.key]||null));
        if(same){closeSheet();toast("同じ内容です");return}
        mark();
        Object.keys(cur.sel||{}).filter(k=>k.startsWith("_set_")).forEach(k=>{const v=cur.sel[k];if(v&&v.tag&&S.cur.tags)delete S.cur.tags[v.tag]});
        const hint=applyHints(sel);
        const before=cur.text,beforeSel=JSON.parse(JSON.stringify(cur.sel||{}));
        cur.sel=Object.assign({},sel);cur.text=x.label+"："+t+(hint?"　→ "+hint:"")+"（修正）";cur.edited=true;
        push("extraFix",x.label+" を修正："+t,{fixOf:cur.id,before,beforeSel});   // 取り消せるように操作として残す
        closeSheet();toast(x.label+"を直しました");
      },{initial:init,instant:x.groups.length===1&&!!x.groups[0].required,goLabel:"この内容に直す",before:(b)=>{b.append(mk("div","hint","この当選中は1回だけ記録します。今の記録：「"+cur.text+"」"))}});
      return;
    }
  }
  if(x.type==="fixAtStart"){
    const c=S.cur;
    // 今のAT開始以降で最初の atStart を探す
    let idx=-1;for(let i=c.events.length-1;i>=0;i--){const ev=c.events[i];if(ev.type==="atStart")idx=i;if(ev.type==="hitStart"&&(ev.hit==="AT"||ev.hit==="上位AT"))break}
    const cur=idx>=0?c.events[idx]:null;
    groupSheet(x.title,x.groups,sel=>{
      mark();
      if(cur){const before=cur.text,beforeSel=JSON.parse(JSON.stringify(cur.sel||{}));cur.sel=Object.assign({},cur.sel||{},sel);cur.text=(c.hit?c.hit.label:"AT")+"開始　"+selText(x.groups,sel)+"（修正）";cur.edited=true;c.stage=sel.stage||c.stage;push("extraFix","開始ステージを修正："+selText(x.groups,sel),{fixOf:cur.id,before,beforeSel});closeSheet();toast("開始ステージを直しました")}
      else{c.stage=sel.stage||c.stage;push("atStart",(c.hit?c.hit.label:"AT")+"開始　"+selText(x.groups,sel),{sel});closeSheet()}
    },{goLabel:cur?"この内容に直す":"記録する",instant:x.groups.length===1&&!!x.groups[0].required,before:(b)=>{if(cur)b.append(mk("div","hint","今の記録：「"+cur.text+"」"))}});
    return;
  }
  if(x.type==="num"){
    askNum(x.title||x.label,0,v=>{push("extra",(x.logAs||x.label)+" "+v+(x.unit||""),{extra:x.label,n:v});toast((x.logAs||x.label)+" "+v+(x.unit||""))});
    return;
  }
  groupSheet(x.title||x.label,x.groups,sel=>{
    const t=selText(x.groups,sel);if(!t){toast("何も選ばれていません");return}
    mark();const hint=applyHints(sel);
    let extraTxt="";
    const tk=hitProp(curHitDef(),"ticket");
    if(tk&&tk.autoBy&&tk.autoBy.extra===x.label&&sel.result===tk.autoBy.result){
      S.cur.judgeWins=(S.cur.judgeWins||0)+1;extraTxt="　成功"+S.cur.judgeWins+"回目";
      if(S.cur.judgeWins===tk.autoBy.count&&!S.cur.ticket){S.cur.ticket=true;extraTxt+="　→ "+tk.label+"獲得";}
    }
    push("extra",x.label+"："+t+extraTxt+(hint?"　→ "+hint:""),{sel,extra:x.label});closeSheet();
    if(extraTxt.includes("獲得"))toast(tk.label+"を獲得");
  });
}

// 直前の1操作（同じ op の行すべて）を戻す
function undoLastOp(silent){
  const c=S.cur,e=c.events;if(!e.length){if(!silent)toast("記録がありません");return false}
  const last=e[e.length-1];
  const grp=last.op?e.filter(x=>x.op===last.op):[last];
  const names=grp.map(x=>x.text.split("　")[0]);
  if(!silent&&!confirm((grp.length>1?"次の"+grp.length+"件をまとめて取り消します：\n":"取り消します：")+names.join("／")+"\nよろしいですか？"))return false;
  // 末尾から順に、行ごとの逆操作（お金・フォロー・持ち玉）
  grp.slice().reverse().forEach(ev=>{
    if(ev.type==="money"&&ev.tk)["deposits","spends","replays"].forEach(k=>{c.money[k]=(c.money[k]||[]).filter(x=>x.tk!==ev.tk)});
    if((ev.type==="money"||ev.type==="medal")&&ev.prevCredit!==undefined)c.money.credit=ev.prevCredit;
    if(ev.type==="follow"&&ev.tk)c.follow=(c.follow||[]).filter(x=>x.tk!==ev.tk);
    if(ev.type==="extraFix"&&ev.fixOf){const t=c.events.find(x=>x.id===ev.fixOf);if(t){t.text=ev.before;t.edited=undefined;if(ev.beforeSel)t.sel=ev.beforeSel}}
  });
  const first=grp[0];
  if(first.snap){
    SNAP_KEYS.forEach(k=>{c[k]=first.snap[k]});
    if(c.zenchou===true||c.zenchou==="pre")c.zenchou=zenStages().indexOf("前兆");
    if(c.zenchou==="stage")c.zenchou=zenStages().length-1;
    if(typeof c.zenchou!=="number"&&c.zenchou!==false)c.zenchou=false;
  }else{
    grp.slice().reverse().forEach(last=>{
      if(last.type==="rare"&&last.rareKey&&!last.nocount){const cell=c.rare[last.rareKey];if(cell){if(last.slot)cell[last.slot]=Math.max(0,(cell[last.slot]||0)-1);else if(last.phase==="mission")cell.nMission=Math.max(0,(cell.nMission||0)-1);else if(last.phase==="pending")cell.nPending=Math.max(0,(cell.nPending||0)-1);else cell.n=Math.max(0,(cell.n||0)-1)}if(last.rareKey==="melon"&&c.melonLeft!=null&&(!last.phase||last.phase==="normal"))c.melonLeft++}
      if(last.type==="c3")c.c3=Math.max(0,c.c3-1);
      if(last.type==="revive")c.revive=Math.max(0,(c.revive||0)-1);
      if(last.type==="parStart"&&last.par&&c.parCount)c.parCount[last.par]=Math.max(0,(c.parCount[last.par]||0)-1);
      if(last.type==="lcdAdd"&&last.add)c.lcdG=Math.max(0,c.lcdG-last.add);
    });
  }
  c.events=e.filter(x=>!grp.includes(x));
  _op=null;save();render();if(!silent)toast("取り消しました");return true;
}
el("bUndo").addEventListener("click",()=>{undoLastOp(false)});

/* ---------- 設定示唆のまとめ（記録中いつでも見られる） ---------- */
function summarizeHints(sess){
  const md=MACHINES[sess.machineId]||MACHINES.generic;
  const out={};const add=(cat,label)=>{if(!label)return;out[cat]=out[cat]||{};out[cat][label]=(out[cat][label]||0)+1};
  const atLabels=(md.hits||[]).filter(h=>h.kind==="at").map(h=>h.label);
  sess.events.forEach(ev=>{
    const sel=ev.sel||{};
    if(ev.type==="hitStart"){
      const auto=ev.trig&&/後$|失敗$|^引き戻し$|^1G連$|中$/.test(ev.trig);   // 自動遷移（AT後・○○失敗・引き戻し・1G連・AT中）
      add(auto?"自動で入った当選":"当選",ev.via||ev.hit);if(ev.trig)add(auto?"自動遷移の契機":"当選の契機",ev.trig);if(ev.where)add("告知された場所",ev.where)}
    if(ev.type==="hitEnd"){
      const isAt=atLabels.includes(ev.hit);
      if(sel.screen)add(isAt?"AT終了画面":"CZ終了画面",sel.screen);
      if(sel.voice)add("終了ボイス",sel.voice);
      if(sel.feather)add("フェザーランプ（終了時）",sel.feather);
      if(sel.hidden&&sel.hidden!=="なし")add("隠しハイビスカス",sel.hidden);
      if(sel.wipe)add("ワイプ演出",sel.wipe);
      if(ev.result)add(ev.hit+" 結果",ev.result);
    }
    if(ev.type==="revive"){if(sel.screen)add("AT終了画面",sel.screen);if(sel.voice)add("終了ボイス",sel.voice)}
    if(ev.type==="atStart"&&sel.stage)add("AT開始ステージ",sel.stage);
    if(ev.type==="extra"&&ev.extra){Object.keys(sel).filter(k=>!k.startsWith("_")).forEach(k=>add(ev.extra,sel[k]))}
    if(ev.type==="parStart"&&ev.reward)add("運命盤の報酬",ev.reward+(ev.melonAt!=null?"（🍉"+ev.melonAt+"回目）":""));
    if(ev.type==="rareCut")add("🍉 打ち切り",ev.n+"回で");
    if(ev.type==="toggle"&&/ON|点灯/.test(ev.text))add("トグル",ev.text);
  });
  if(sess.modeHints&&sess.modeHints.length)sess.modeHints.forEach(h=>add("モード示唆",h.text+"（区間"+h.era+(h.span>1?"〜"+(h.era+h.span-1):"")+"）"));
  (md.rares||[]).forEach(r=>{const v=sess.rare&&sess.rare[r.key];if(!v||r.count===false)return;
    const tot=r.strong?((v.w||0)+(v.s||0)):((v.n||0)+(v.hit||0));if(!tot)return;   // 0だけの項目は出さない
    if(r.strong){out["レア役"]=out["レア役"]||{};out["レア役"]["弱"+r.label]=v.w||0;out["レア役"]["強"+r.label]=v.s||0}else{out["レア役"]=out["レア役"]||{};out["レア役"][r.label]=(v.n||0)+(r.track?"（当"+(v.hit||0)+"）":"")}});
  return out;
}
function showHintSummary(sess){
  const o=summarizeHints(sess);
  sheet("設定示唆のまとめ",b=>{
    const cats=Object.keys(o);
    if(!cats.length){b.append(mk("div","hint","まだ示唆の記録がありません"));return}
    cats.forEach(cat=>{
      b.append(mk("div","lbl",cat));
      const t=mk("div","note");
      t.textContent=Object.keys(o[cat]).map(k=>k+"：" + o[cat][k]).join("　／　");
      b.append(t);
    });
    b.append(mk("div","hint","チェッカーに送る内容はこの一部です。全部の内訳を残したい場合は「振り返りノート用」で書き出してください。"));
  });
}

const K2_MAP={
  zones:{"懸糸傀儡演舞":"dance","幕間チャンス":"makuma","AT":"direct","機械仕掛けの神":"god"},

  atcz:{"私の名前はしろがね":"def","人生はそういうものだよ":"neg2","何を恐れることがある":"neg3","俺をしろがねと呼びな":"neg4","僕は僕さ":"neg5","近づいてきているようです":"water3","すぐそばまで来ているようです":"water1","何かを感じます":"nextmakuma","あるるかんがある限り〜":"stock","女神が留守のようです":"nextdirect","あなたの運命が変わるかも〜":"fate"},
  ed:{"ミンシア":"min","リーゼロッテ":"lise","ヴィルマ":"vil","ジョージ":"geo"},

function toChecker(s){
  const o={games:0,zones:{},cz:{rg:0,theater:0,strong:0,strongHit:0},atcz:{},choku:0,atCount:0,screens:{},ed:{},icons:{},coins:{},over:{},stages:{}};
  const inc=(bag,map,label)=>{const k=map[label];if(k)bag[k]=(bag[k]||0)+1};
  if(s.totalStart!=null&&s.totalEnd!=null&&s.totalEnd>=s.totalStart)o.games=s.totalEnd-s.totalStart;
  const r=s.rare&&s.rare.cherryS;if(r){o.cz.strong=r.n||0;o.cz.strongHit=r.hit||0}
  let inAt=false,judged=false;
  s.events.forEach(ev=>{
    const sel=ev.sel||{};
    if(ev.type==="hitStart"){
      const lab=ev.hit||"",via=ev.via||lab,trig=ev.trig||"";
      if((lab==="機械仕掛けの女神"||lab==="劇場ジャッジ")&&trig!=="AT後"&&trig!=="劇場ジャッジ 失敗")o.cz.rg++;   // 劇場→女神はセットで1回
      if(lab==="劇場ジャッジ")o.cz.theater++;
      if(via==="AT直撃")o.choku++;
      if(lab==="AT"&&trig!=="引き戻し")o.atCount++;
      if(lab==="AT"||lab==="上位AT"){inAt=true;judged=false}
    }
    if(ev.type==="hitEnd"){
      if(sel.screen&&K2_MAP.icons[sel.screen]&&ev.hit!=="AT"&&ev.hit!=="上位AT")inc(o.icons,K2_MAP.icons,sel.screen);

      if(sel.voice)inc(o.atcz,K2_MAP.atcz,sel.voice);

    }

    if(ev.type==="atStart"&&sel.stage&&sel.stage!=="引き継ぎ")inc(o.stages,K2_MAP.stages,sel.stage);

      if(ev.extra==="EDランプ"&&sel.lamp)inc(o.coins,K2_MAP.coins,sel.lamp);
    }
  });

}

function writeChecker(ck,o,existing,merge,sess){

    out.choku=(Number(out.choku)||0)+o.choku;out.atCount=(Number(out.atCount)||0)+o.atCount;

    ["zones","atcz","screens","ed","icons","coins","over","stages"].forEach(k=>{out[k]=out[k]||{};Object.keys(o[k]).forEach(x=>out[k][x]=(Number(out[k][x])||0)+o[k][x])});
  }else{

    if(existing)localStorage.setItem(ck.key+"-rec-bak",JSON.stringify(existing));

    const open=mk("button","go","チェッカーを開く");open.addEventListener("click",()=>{window.open(ck.url,"_blank");closeSheet()});b.append(open);
  });
}

function profit(s){const m=s.money;if(m.endMedal==null)return null;const st=m.startMedal||0,en=m.endMedal||0,rp=replayed(m),cash=invested(m),bought=Math.round(cash/1000*s.lend);return{cash,bought,replay:rp,lend:s.lend,medalDiff:en-st-bought-rp,yen:Math.round((en-st-rp)*(1000/s.lend)-cash)}}
function agg(list){let n=0,exp=0,act=0,nExp=0,medal=0;list.forEach(s=>{const p=profit(s);if(p){n++;act+=p.yen;medal+=p.medalDiff}if(s.expected!=null||(s.follow&&s.follow.length)){nExp++;exp+=expectedTotal(s)}});return{n,nExp,exp,act,medal,gap:act-exp,total:list.length}}
function dayKey(s){return ymd(s.startAt)}
function today(){return ymd(nowISO())}
function sessionText(s){
  const d=MACHINES[s.machineId]||MACHINES.generic,L=[];
  L.push("■ "+s.machine);L.push(ymd(s.startAt)+"("+wd(s.startAt)+") "+hm(s.startAt)+(s.endAt?"〜"+hm(s.endAt):"〜"));

  if(s.expected!=null)L.push("想定期待値 "+sgn(s.expected)+"円"+((s.follow&&s.follow.length)?"　＋フォロー "+s.follow.map(f=>sgn(f.amount)+(f.note?"（"+f.note+"）":"")).join(" ")+"　合計 "+sgn(expectedTotal(s))+"円":""));if(s.startNote)L.push(s.startNote);
  L.push("────────");
  s.events.forEach(ev=>L.push(hm(ev.at)+"  "+gsText(ev,d)+"  "+evTxt(ev)));
  if(s.endAt)L.push(hm(s.endAt)+"  "+gsText({realG:s.realG,lcdG:s.lcdG},d)+"  "+(s.endNote||"ヤメ"));
  if(s.revive)L.push("SHOW TIME復活 "+s.revive+"回");
  if(s.modeHints&&s.modeHints.length)L.push("モード示唆："+s.modeHints.map(h=>h.text+"（区間"+h.era+(h.span>1?"〜"+(h.era+h.span-1):"")+"）").join("、"));
  if(s.rare&&s.rare.melon&&(s.rare.melon.nMission||s.rare.melon.nPending))L.push("🍉 ミッション中 "+(s.rare.melon.nMission||0)+"回／報酬待ち中 "+(s.rare.melon.nPending||0)+"回（終了時点）");
  if(s.totalStart!=null&&s.totalEnd!=null)L.push("台の総回転数 "+s.totalStart+"→"+s.totalEnd+"（"+(s.totalEnd-s.totalStart)+"G）");
  const p=profit(s);
  if(p){L.push("────────");L.push("投資 "+yen(p.cash)+"円（"+p.lend+"枚貸し＝"+p.bought+"枚）"+(balance(s.money)?"／残高 "+yen(balance(s.money))+"円":""));L.push("再プレイ "+p.replay+"枚 ／ 終了 持 "+(s.money.endMedal||0)+"枚");L.push("差枚 "+sgn(p.medalDiff)+"枚 ／ 収支 "+sgn(p.yen)+"円"+(s.expected!=null?"（想定 "+sgn(expectedTotal(s))+"円 ／ 差 "+sgn(p.yen-expectedTotal(s))+"円）":""))}
  return L.join("\n");
}
function sumRow(label,t){const r=mk("div","sumrow");r.append(mk("div","k",label),mk("div","c",t.total+"台"));const v=mk("div","v",sgn(t.act)+"円");v.style.color=t.act>=0?"var(--ok)":"var(--hot)";r.append(v,mk("div","e",t.nExp?"想定 "+sgn(t.exp):"想定 −"));return r}
function renderSummary(){const w=el("nSum");w.innerHTML="";if(!S.sessions.length)return;const box=mk("div","log");box.style.marginTop="12px";const td=S.sessions.filter(s=>dayKey(s)===today());if(td.length)box.append(sumRow("今日",agg(td)));box.append(sumRow("全体",agg(S.sessions)));const t=agg(S.sessions);if(t.nExp){const h=mk("div","sumrow");h.append(mk("div","k",""));const g=mk("div","v",(t.gap>=0?"想定より +":"想定より ")+yen(t.gap)+"円");g.style.fontSize="12px";g.style.color="var(--dim)";h.append(g);box.append(h)}w.append(box)}
function renderNote(){
  renderSummary();const w=el("nList");w.innerHTML="";const arr=S.sessions.slice().reverse();
  if(!arr.length){w.innerHTML='<div class="log"><div class="empty">まだ記録がありません</div></div>';return}
  let cur=null;
  arr.forEach(s=>{
    const k=dayKey(s);
    if(k!==cur){cur=k;const t=agg(S.sessions.filter(x=>dayKey(x)===k));const h=mk("div","dayhd");h.append(mk("div","d",k.slice(5)+"("+wd(s.startAt)+")"),mk("div","c",t.total+"台"));const v=mk("div","v",sgn(t.act)+"円");v.style.color=t.act>=0?"var(--ok)":"var(--hot)";h.append(v);w.append(h)}
    const p=profit(s),d=mk("details","sess"),sm=mk("summary");sm.append(mk("span","sm",hm(s.startAt)),mk("span","sn",s.machine));
    if(p){const pl=mk("span","pl",sgn(p.yen));pl.style.color=p.yen>=0?"var(--ok)":"var(--hot)";sm.append(pl)}
    const bd=mk("div","body");
    const ops=mk("div","ops");bd.append(ops);
    const txt=mk("div","note",sessionText(s));txt.classList.add("fold");bd.append(txt);
    const tg=mk("button","wide dim","記録を全部見る");tg.addEventListener("click",()=>{const on=txt.classList.toggle("fold");tg.textContent=on?"記録を全部見る":"記録をたたむ"});bd.append(tg);
    if(s.endAt){const one=mk("button","wide","この台をノート用に保存");one.addEventListener("click",()=>dlJson(toEnvelope(s),"kadonote-"+hm(s.startAt).replace(":","")+".json"));ops.append(one)}
    const hs=mk("button","wide","設定示唆のまとめ");hs.addEventListener("click",()=>showHintSummary(s));ops.append(hs);
    const ed1=mk("button","wide dim","打ち始め・終了の情報を直す");ed1.addEventListener("click",()=>editInfo(s,renderNote));ops.append(ed1);
    const ed2=mk("button","wide dim","お金の履歴を直す");ed2.addEventListener("click",()=>editMoney(s,renderNote));ops.append(ed2);
    const ed3=mk("button","wide dim","記録の修正・削除");ed3.addEventListener("click",()=>editLogs(s));ops.append(ed3);
    if(s.endAt&&(MACHINES[s.machineId]||{}).checker){const ck=mk("button","wide","設定判別チェッカーへ送る");ck.style.color="var(--accent)";ck.addEventListener("click",()=>sendToChecker(s));ops.append(ck)}
    const del=mk("button","wide dim","この記録を削除");del.addEventListener("click",()=>{if(!confirm("削除しますか？"))return;S.sessions=S.sessions.filter(x=>x.id!==s.id);save();renderNote()});bd.append(del);
    d.append(sm,bd);w.append(d);
  });
}
function outSheet(title,text,hint){sheet(title,b=>{const ta=mk("textarea");ta.value=text;ta.readOnly=true;ta.style.minHeight="220px";ta.style.fontFamily="var(--mono)";ta.style.fontSize="12px";b.append(ta);const cp=mk("button","go","コピー");cp.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(text);toast("コピーしました")}catch(e){ta.readOnly=false;ta.select();ta.setSelectionRange(0,999999);ta.readOnly=true;toast("全選択しました")}});b.append(cp);if(hint)b.append(mk("div","hint",hint))})}
function dlJson(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast("保存しました")}
el("nExpText").addEventListener("click",()=>{const t=agg(S.sessions),L=[];if(t.total){L.push("【集計】"+t.total+"台 ／ 実収支 "+sgn(t.act)+"円"+(t.nExp?" ／ 想定 "+sgn(t.exp)+"円（"+t.nExp+"台）／ 差 "+sgn(t.gap)+"円":""));L.push("")}let cur=null;S.sessions.forEach(s=>{const k=dayKey(s);if(k!==cur){cur=k;const d=agg(S.sessions.filter(x=>dayKey(x)===k));L.push("──── "+k+"("+wd(s.startAt)+") "+d.total+"台 ／ "+sgn(d.act)+"円"+(d.nExp?" ／ 想定 "+sgn(d.exp)+"円":"")+" ────");L.push("")}L.push(sessionText(s));L.push("")});outSheet("テキスト",L.join("\n").trim()||"（記録なし）")});
el("nExpJson").addEventListener("click",()=>outSheet("JSON",JSON.stringify(S.sessions,null,2)));
el("nDl").addEventListener("click",()=>dlJson(S.sessions,"jissen-"+ymd(nowISO()).replace(/\//g,"")+".json"));
function uuidV4(){if(crypto&&crypto.randomUUID)return crypto.randomUUID();return"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==="x"?r:(r&0x3|0x8);return v.toString(16)})}
function isoOffset(d){const p=n=>String(n).padStart(2,"0");const o=-d.getTimezoneOffset(),sg=o>=0?"+":"-",a=Math.abs(o);return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())+sg+p(Math.trunc(a/60))+":"+p(a%60)}
function toEnvelope(s){
  const m=s.money,p=profit(s),logs=[];
  const md=MACHINES[s.machineId]||MACHINES.generic;
  if(s.startNote)logs.push({t:new Date(s.startAt).getTime(),type:"memo",text:"打ち始め "+gsText({realG:s.startRealG,lcdG:s.startLcdG},md)+"G　"+s.startNote});
  s.events.forEach(ev=>{const g=gsText(ev,md);logs.push({t:new Date(ev.at).getTime(),type:"memo",text:(g?g+"G　":"")+evTxt(ev)})});
  if(s.endAt)logs.push({t:new Date(s.endAt).getTime(),type:"memo",text:gsText({realG:s.realG,lcdG:s.lcdG},md)+"G　"+(s.endNote||"ヤメ")});
  const memo=[s.machine];if(s.expected!=null)memo.push("想定期待値 "+sgn(expectedTotal(s))+"円");if(p)memo.push("差枚 "+sgn(p.medalDiff)+"枚");memo.push("開始持 "+(m.startMedal||0)+"枚／再プレイ "+replayed(m)+"枚／終了持 "+(m.endMedal||0)+"枚（回収は純増枚数）");
  return{schema:"slot-session",schemaVer:2,sessionId:s.id||uuidV4(),machineId:s.machine,payloadVer:"rec-3",startedAt:isoOffset(new Date(s.startAt)),endedAt:isoOffset(new Date(s.endAt||s.startAt)),invest:invested(m),payout:(m.endMedal||0)-(m.startMedal||0)-replayed(m),storeId:null,storeName:null,unitNo:null,lendRate:s.lend,exchangeRate:s.lend,memo:memo.join(" ／ "),estimated:false,payload:{machine:s.machine,machineDef:s.machineId,startRealG:s.startRealG,startLcdG:s.startLcdG,endRealG:s.realG,endLcdG:s.lcdG,startMedal:m.startMedal,replays:replayed(m),endMedal:m.endMedal,expected:s.expected??null,follow:s.follow||[],expectedTotal:expectedTotal(s),rare:s.rare||null,c3:s.c3,revive:s.revive||0,pendingReward:s.pendingReward||null,modeHints:s.modeHints||[],modeEra:s.modeEra||0,logs}};
}
el("nExpNote").addEventListener("click",()=>{const done=S.sessions.filter(s=>s.endAt);if(!done.length){toast("終わった台がありません");return}outSheet("振り返りノート用",JSON.stringify(done.map(toEnvelope),null,2),"kado-note の「JSON取り込み」でファイルを選んでください。")});
el("nDlNote").addEventListener("click",()=>{const done=S.sessions.filter(s=>s.endAt);if(!done.length){toast("終わった台がありません");return}dlJson(done.map(toEnvelope),"kadonote-"+ymd(nowISO()).replace(/\//g,"")+".json")});
el("nImpOpen").addEventListener("click",()=>{sheet("JSONを取り込む",b=>{const ta=mk("textarea");ta.placeholder="書き出したJSONを貼る";ta.style.minHeight="160px";b.append(ta);const fi=mk("input");fi.type="file";fi.accept=".json,application/json";fi.className="hide";const fb=mk("button","sub","ファイルを選ぶ");fb.addEventListener("click",()=>fi.click());fi.addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ta.value=r.result;doImport(ta.value)};r.readAsText(f)});const go=mk("button","go","取り込む");go.addEventListener("click",()=>doImport(ta.value));b.append(go,fb,fi);b.append(mk("div","hint","同じ記録は二重に入りません。今ある記録も消えません。"))})});
function doImport(txt){let d;try{d=JSON.parse(txt)}catch(e){toast("JSONとして読めません");return}const arr=Array.isArray(d)?d:(d&&Array.isArray(d.sessions)?d.sessions:null);if(!arr){toast("記録が見つかりません");return}const have=new Set(S.sessions.map(s=>s.id));let n=0;arr.forEach(s=>{if(s&&s.id&&s.startAt&&s.machine&&!have.has(s.id)){fixSession(s);S.sessions.push(s);have.add(s.id);n++}});S.sessions.sort((a,b)=>new Date(a.startAt)-new Date(b.startAt));save();renderNote();closeSheet();toast(n+"件を取り込みました")}

/* ---------- 画面切替 ---------- */
let setupVals={};
function renderSetupFields(){
  const d=MACHINES[pickedMachine||"generic"],w=el("stFields");w.innerHTML="";setupVals={};
  el("stLcdWrap").classList.toggle("hide",d.lcdG===false);
  el("stTotalHint").textContent=d.checker?"チェッカーに送るなら開始時も必要（AT込みの累計）":"任意";
  d.setup.forEach(f=>{
    const lbl=mk("div","lbl",f.label);lbl.style.marginTop="12px";
    if(f.optional)lbl.append(mk("span","hint","任意"));
    w.append(lbl);
    if(f.type==="num"){const i=mk("input");i.className="num";i.setAttribute("inputmode","numeric");i.placeholder="0";i.addEventListener("input",()=>setupVals[f.key]=int(i.value));w.append(i)}
    else if(f.type==="select"){
      const row=optRow(f.options,(it,btn,wrap)=>{setupVals[f.key]=it;wrap.querySelectorAll("button").forEach(x=>x.classList.remove("on"));btn.classList.add("on")},f.options.length>6?"q4":"");
      w.append(row);
    }
  });
}
function showSetup(){
  el("scSetup").classList.remove("hide");el("scMain").classList.add("hide");el("scNote").classList.add("hide");
  el("hdTitle").textContent="実戦記録";el("stLend").value=S.settings.lend;
  const w=el("stMachines");w.innerHTML="";pickedMachine=null;
  Object.keys(MACHINES).filter(k=>k!=="generic").forEach(k=>{const b=mk("button","",MACHINES[k].name);b.addEventListener("click",()=>{pickedMachine=k;el("stMachine").value=MACHINES[k].name;w.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");renderSetupFields()});w.append(b)});
  const names=Object.keys(MACHINES).filter(k=>k!=="generic").map(k=>MACHINES[k].name);
  const seen=[];S.sessions.slice().reverse().forEach(s=>{if(s.machineId==="generic"&&!seen.includes(s.machine)&&!names.includes(s.machine))seen.push(s.machine)});
  seen.slice(0,4).forEach(m=>{const b=mk("button","",m);b.addEventListener("click",()=>{pickedMachine=null;el("stMachine").value=m;w.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");renderSetupFields()});w.append(b)});
  renderSetupFields();
}
el("stMachine").addEventListener("input",()=>{if(pickedMachine){pickedMachine=null;el("stMachines").querySelectorAll("button").forEach(x=>x.classList.remove("on"));renderSetupFields()}});
function showMain(){el("scSetup").classList.add("hide");el("scMain").classList.remove("hide");el("scNote").classList.add("hide");el("hdTitle").textContent=S.cur.machine+" ／ "+hm(S.cur.startAt)+"〜";render()}
function showNote(){el("scSetup").classList.add("hide");el("scMain").classList.add("hide");el("scNote").classList.remove("hide");el("hdTitle").textContent="ノート（"+S.sessions.length+"件）";renderNote()}
el("hdMenu").addEventListener("click",()=>{sheet("メニュー",b=>{if(S.cur){const a=mk("button","sub","記録に戻る");a.addEventListener("click",()=>{closeSheet();showMain()});b.append(a)}const n=mk("button","sub","ノートを開く");n.addEventListener("click",()=>{closeSheet();showNote()});b.append(n);if(!S.cur){const s=mk("button","sub","新しく打ち始める");s.addEventListener("click",()=>{closeSheet();showSetup()});b.append(s)}})});

/* ---------- 開始 ---------- */
document.querySelectorAll("[data-lend]").forEach(b=>b.addEventListener("click",()=>{el("stLend").value=b.dataset.lend}));
el("stStart").addEventListener("click",()=>{
  const m=el("stMachine").value.trim(),lend=int(el("stLend").value),e=el("stErr");
  if(!m){e.textContent="機種名を入れてください";e.classList.remove("hide");return}
  if(badNum(lend)||!lend||lend<=0){e.textContent="レートは整数で入れてください（例：46、52）";e.classList.remove("hide");return}
  {const bad=["stRealG","stLcdG","stMedal","stReplay0","stTotal","stExp"].map(id=>{const v=int(el(id).value);return {id,v}}).find(x=>badNum(x.v)||(x.v!=null&&x.v<0&&x.id!=="stExp"));
   if(bad){const lb=el(bad.id).previousElementSibling;e.textContent="数字は整数で、0以上にしてください（"+((lb&&lb.textContent)||bad.id).replace(/任意|チェッカーに.*$/,"").trim()+"）";e.classList.remove("hide");return}}
  {const bad=Object.keys(setupVals).find(k=>badNum(setupVals[k])||(typeof setupVals[k]==="number"&&setupVals[k]<0));if(bad){e.textContent="打ち始めの項目は整数で、0以上にしてください";e.classList.remove("hide");return}}
  if(!pickedMachine){
    const hit=Object.keys(MACHINES).find(k=>k!=="generic"&&MACHINES[k].name===m);
    if(hit&&confirm("「"+m+"」には専用の記録画面があります。そちらで始めますか？")){pickedMachine=hit;renderSetupFields();e.textContent="専用の項目が出ました。内容を確認して、もう一度「打ち始める」を押してください。";e.classList.remove("hide");return}
  }
  e.classList.add("hide");S.settings.lend=lend;
  const machineId=pickedMachine||"generic",d=MACHINES[machineId];
  const rare={};d.rares.forEach(r=>{rare[r.key]=r.strong?{w:0,s:0}:{n:0,hit:0,nMission:0,nPending:0}});
  // 機種ごとの打ち始め項目：c3 と melon は器の状態へ、それ以外はメモ扱い
  const setup={};d.setup.forEach(f=>{const v=setupVals[f.key];if(v!=null&&v!=="")setup[f.key]=v});
  const c3=setup.c3!=null?setup.c3:0;
  if(setup.melon!=null&&rare.melon)rare.melon.n=setup.melon;
  let zen0=false;d.setup.forEach(f=>{if(f.applyStage&&setup[f.key]!=null&&f.applyStage[setup[f.key]]!=null)zen0=f.applyStage[setup[f.key]]});
  if(d.zenchou&&d.zenchou.autoEnterIfG!=null&&setup.stage0!=="リセット後"&&(int(el("stRealG").value)||0)<=d.zenchou.autoEnterIfG)zen0=0;
  const setupNote=d.setup.filter(f=>f.key!=="c3"&&f.key!=="melon"&&setup[f.key]!=null&&setup[f.key]!=="不明").map(f=>f.label.replace(/（.*?）/,"")+"："+setup[f.key]);
  const noteParts=setupNote.concat(el("stNote").value.trim()?[el("stNote").value.trim()]:[]);
  S.cur={id:uid(),machineId,machine:m,startAt:nowISO(),lend,setup,
    startRealG:int(el("stRealG").value)||0,startLcdG:int(el("stLcdG").value)||0,
    realG:int(el("stRealG").value)||0,lcdG:int(el("stLcdG").value)||0,c3,
    startNote:noteParts.join("　"),expected:int(el("stExp").value),totalStart:int(el("stTotal").value),totalEnd:null,
    rare,zenchou:zen0,hit:null,mode:"normal",parallel:{},stage:null,revive:0,melonLeft:null,melonApprox:false,rewardHint:null,modeHint:null,ticket:false,judgeWins:0,returnHit:null,pendingReward:null,melonPhase:"normal",modeEra:0,modeHints:[],tags:{},follow:[],events:[],_steps:[],
    money:{cash:[],deposits:[],spends:[],replays:(int(el("stReplay0").value)>0?[{at:nowISO(),amount:int(el("stReplay0").value),atStart:true}]:[]),startMedal:int(el("stMedal").value)||0,startReplay:0,credit:null,endMedal:null,endReplay:0},
    endAt:null,endNote:""};
  ["stMachine","stRealG","stLcdG","stMedal","stReplay0","stNote","stExp","stTotal"].forEach(i=>el(i).value="");
  save();showMain();
});

/* ---------- 起動 ---------- */
load();
S.sessions.forEach(fixSession);
if(S.cur){fixSession(S.cur);save();showMain()}else{save();showSetup()}
})();
</script>
