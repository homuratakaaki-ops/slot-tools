<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>実戦ログ</title>
<style>
  :root{
    --bg:#141210; --panel:#1D1A16; --panel2:#262119; --line:#332C24;
    --ink:#F0E9DF; --dim:#8E8377; --accent:#D9A441;
    --big:#E9B949; --reg:#E0574A; --at:#4FA3D9; --cz:#7FBF6A; --lcd:#C9A96E;
    --win:#69C08A; --lose:#B4645C;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; padding-bottom:40px}
  .wrap{max-width:520px; margin:0 auto; padding:0 12px}

  header{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line)}
  .hbar{display:flex; align-items:baseline; gap:8px; padding:10px 12px 8px; max-width:520px; margin:0 auto}
  .htitle{font-size:17px; font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hmeta{font-family:var(--mono); font-size:12px; color:var(--dim); white-space:nowrap}
  .tabs{display:flex; max-width:520px; margin:0 auto}
  .tab{flex:1; text-align:center; padding:9px 0 8px; font-size:13px; color:var(--dim); border-bottom:2px solid transparent; cursor:pointer; user-select:none}
  .tab.on{color:var(--ink); border-bottom-color:var(--accent)}
  .ver{font-family:var(--mono); font-size:10px; color:var(--dim); text-align:right; padding:2px 12px 0; max-width:520px; margin:0 auto}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin:12px 0}
  .lbl{font-size:12px; color:var(--dim); margin:0 0 5px; letter-spacing:.04em}
  .row{display:flex; gap:8px}
  .row > *{min-width:0}
  .grow{flex:1}
  input, textarea{width:100%; background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:11px 10px; font-size:16px; font-family:var(--sans)}
  input.num{font-family:var(--mono); text-align:right}
  textarea{resize:vertical; min-height:44px; font-size:15px}
  input:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
  button{font-family:var(--sans); cursor:pointer; border-radius:8px; font-size:14px}
  .btn{background:var(--panel2); color:var(--ink); border:1px solid var(--line); padding:11px 12px; font-weight:600}
  .btn:active{background:#332C24}
  .btn.primary{background:var(--accent); color:#1A1509; border-color:var(--accent)}
  .btn.ghost{background:transparent; color:var(--dim); border-color:var(--line); font-weight:500}
  .btn.wide{width:100%}
  .btn.sm{padding:8px 10px; font-size:13px}
  .btn.now{flex:none; width:64px}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chip{background:var(--panel2); border:1px solid var(--line); color:var(--dim); padding:9px 0; font-weight:600; font-size:14px; flex:1 0 calc(25% - 5px); text-align:center}
  .chip.on{color:#1A1509; background:var(--accent); border-color:var(--accent)}
  .chip.on[data-c="BIG"]{background:var(--big); border-color:var(--big)}
  .chip.on[data-c="REG"]{background:var(--reg); border-color:var(--reg); color:#fff}
  .chip.on[data-c="AT"], .chip.on[data-c="ART"]{background:var(--at); border-color:var(--at); color:#fff}
  .chip.on[data-c="CZ"]{background:var(--cz); border-color:var(--cz)}
  .chip.res{flex:1 0 calc(33.33% - 4px); padding:7px 0; font-size:13px}
  .chip.win.on{background:var(--win); border-color:var(--win); color:#10240f}
  .chip.lose.on{background:var(--lose); border-color:var(--lose); color:#fff}
  .chip.rate{flex:1 0 calc(25% - 5px); font-size:13px; padding:7px 0}

  .money{display:flex; gap:6px; margin:10px 0 0}
  .mcell{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:7px 8px; text-align:left; color:var(--ink)}
  .mcell .k{font-size:11px; color:var(--dim)}
  .mcell .v{font-family:var(--mono); font-size:15px; font-weight:700}

  .log{margin:14px 0 0; border-top:1px solid var(--line)}
  .li{display:flex; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line); align-items:flex-start}
  .li .t{font-family:var(--mono); font-size:12px; color:var(--dim); width:38px; flex:none; padding-top:2px}
  .li .b{flex:1}
  .li .g{font-family:var(--mono); font-size:16px; font-weight:700}
  .li .g .lc{color:var(--lcd)}
  .li .g .sl{color:var(--dim); font-weight:400}
  .li .tg{font-size:12px; font-weight:700; padding:1px 6px; border-radius:4px; margin-left:6px; vertical-align:2px}
  .li .nt{font-size:13px; color:var(--dim); margin-top:2px; white-space:pre-wrap; word-break:break-word}
  .li .x{color:var(--dim); background:none; border:none; font-size:16px; padding:2px 4px; flex:none}
  .tg-BIG{background:rgba(233,185,73,.18); color:var(--big)}
  .tg-REG{background:rgba(224,87,74,.18); color:var(--reg)}
  .tg-AT,.tg-ART{background:rgba(79,163,217,.18); color:var(--at)}
  .tg-CZ{background:rgba(127,191,106,.18); color:var(--cz)}
  .tg-o{background:var(--panel2); color:var(--dim)}
  .res-m{font-family:var(--mono); font-size:14px; margin-left:6px}
  .res-m.w{color:var(--win)} .res-m.l{color:var(--lose)}

  .note{white-space:pre-wrap; font-family:var(--mono); font-size:13px; line-height:1.65}
  .sess{border:1px solid var(--line); border-radius:10px; margin:10px 0; overflow:hidden}
  .sess > summary{padding:11px 12px; background:var(--panel); cursor:pointer; list-style:none; display:flex; gap:8px; align-items:baseline}
  .sess > summary::-webkit-details-marker{display:none}
  .sess .sm{font-family:var(--mono); font-size:11px; color:var(--dim); flex:none}
  .sess .sn{font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sess .pl{font-family:var(--mono); font-size:12px; font-weight:700; flex:none}
  .pl.p{color:var(--win)} .pl.m{color:var(--lose)}
  .sess .body{padding:10px 12px; background:var(--bg); border-top:1px solid var(--line)}
  .empty{color:var(--dim); text-align:center; padding:36px 12px; font-size:14px}
  .warn{background:#3A2A16; color:#F0D9A8; font-size:12px; padding:8px 12px; text-align:center}
  .hide{display:none !important}
  .hint{font-size:12px; color:var(--dim); margin-top:6px}
  .err{color:var(--reg); font-size:12px; margin-top:6px}
  hr.sep{border:none; border-top:1px dashed var(--line); margin:12px 0}
  .recent{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
  .recent button{background:var(--panel2); border:1px solid var(--line); color:var(--dim); padding:6px 10px; font-size:13px}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="htitle" id="hTitle">実戦ログ</div>
    <div class="hmeta" id="hMeta"></div>
  </div>
  <div class="tabs">
    <div class="tab on" data-tab="rec">記録</div>
    <div class="tab" data-tab="note">ノート</div>
  </div>
</header>
<div id="storeWarn" class="warn hide">保存できません（プライベートモードの可能性）。画面を閉じる前に必ず書き出してください。</div>
<div class="ver">v4 &middot; 2026-08-30</div>

<div class="wrap">

  <!-- ========== 新規 ========== -->
  <section id="scNew" class="hide">
    <div class="card">
      <p class="lbl">機種</p>
      <input id="nMachine" placeholder="からくりサーカス2" autocomplete="off">
      <div class="recent" id="nRecent"></div>

      <hr class="sep">
      <div class="row">
        <div class="grow">
          <p class="lbl">開始ゲーム数</p>
          <input id="nGame" class="num" inputmode="numeric" placeholder="291">
        </div>
        <div class="grow">
          <p class="lbl">打ち始め時刻</p>
          <div class="row">
            <input id="nTime" type="time" class="grow">
            <button class="btn sm now" id="nNow">今</button>
          </div>
        </div>
      </div>

      <p class="lbl" style="margin-top:12px">打ち始めの状態メモ</p>
      <textarea id="nNote" placeholder="3スルー（74.69.214）"></textarea>

      <hr class="sep">
      <p class="lbl">この店のレート（1000円で何枚）</p>
      <div class="chips" style="margin-bottom:8px">
        <button class="chip rate" data-lend="45">45枚</button>
        <button class="chip rate" data-lend="46">46枚</button>
        <button class="chip rate" data-lend="47">47枚</button>
        <button class="chip rate" data-lend="50">50枚</button>
      </div>
      <input id="nLend" class="num" inputmode="numeric" placeholder="52">

      <hr class="sep">
      <p class="lbl">打ち始めの手持ち</p>
      <div class="row">
        <div class="grow">
          <p class="lbl">持ちメダル</p>
          <input id="nMedal" class="num" inputmode="numeric" placeholder="0">
        </div>
        <div class="grow">
          <p class="lbl">再プレイ</p>
          <input id="nReplay" class="num" inputmode="numeric" placeholder="0">
        </div>
      </div>
      <p class="hint">やめる時にもう一度入力して、差で収支を出します。</p>

      <div class="err hide" id="nErr"></div>
      <button class="btn primary wide" id="nStart" style="margin-top:14px">打ち始める</button>
    </div>
  </section>

  <!-- ========== 進行中 ========== -->
  <section id="scLive" class="hide">

    <div class="money">
      <button class="mcell" data-add="cash"><span class="k">現金</span><br><span class="v" id="mCash">0</span></button>
      <button class="mcell" data-add="startMedal"><span class="k">開始 持ち</span><br><span class="v" id="mMedal">0</span></button>
      <button class="mcell" data-add="startReplay"><span class="k">開始 再プレイ</span><br><span class="v" id="mReplay">0</span></button>
    </div>

    <div class="card hide" id="addPanel">
      <p class="lbl" id="addLbl">現金を追加</p>
      <div class="chips" id="addBtns"></div>
      <div class="row" style="margin-top:8px">
        <input id="addFree" class="num grow" inputmode="numeric" placeholder="手入力">
        <button class="btn sm" id="addFreeGo">追加</button>
        <button class="btn sm ghost" id="addUndo">直前を取消</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="grow">
          <p class="lbl">液晶G</p>
          <input id="eLcd" class="num" inputmode="numeric" placeholder="86">
        </div>
        <div class="grow">
          <p class="lbl">カウンターG</p>
          <input id="eCnt" class="num" inputmode="numeric" placeholder="57">
        </div>
      </div>

      <p class="lbl" style="margin-top:12px">種別</p>
      <div class="chips" id="eTags"></div>

      <p class="lbl" style="margin-top:12px">メモ</p>
      <textarea id="eNote" placeholder="デフォルト、鳴海、フウ屋敷"></textarea>

      <div class="chips" style="margin-top:10px">
        <button class="chip res" data-res="">結果なし</button>
        <button class="chip res win" data-res="勝">勝</button>
        <button class="chip res lose" data-res="×">×</button>
      </div>

      <div class="err hide" id="eErr"></div>
      <button class="btn primary wide" id="eAdd" style="margin-top:12px">記録する</button>
    </div>

    <div class="log" id="eLog"></div>

    <div class="card">
      <p class="lbl">やめる</p>
      <div class="row">
        <input id="fGame" class="num grow" inputmode="numeric" placeholder="やめたG数">
        <input id="fNote" class="grow" placeholder="ヤメ">
      </div>
      <div class="row" style="margin-top:8px">
        <div class="grow">
          <p class="lbl">終了時 持ちメダル</p>
          <input id="fMedal" class="num" inputmode="numeric" placeholder="0">
        </div>
        <div class="grow">
          <p class="lbl">終了時 再プレイ</p>
          <input id="fReplay" class="num" inputmode="numeric" placeholder="0">
        </div>
      </div>
      <button class="btn wide" id="fEnd" style="margin-top:10px">この台を終了する</button>
      <button class="btn ghost wide sm" id="fCancel" style="margin-top:8px">この記録を破棄する</button>
    </div>
  </section>

  <!-- ========== ノート ========== -->
  <section id="scNote" class="hide">
    <div class="row" style="margin:12px 0 0">
      <button class="btn grow" id="expText">テキスト書き出し</button>
      <button class="btn grow" id="expJson">JSON書き出し</button>
    </div>
    <div class="row" style="margin:8px 0 0">
      <button class="btn grow ghost sm" id="impOpen">JSONを取り込む</button>
    </div>
    <div class="card hide" id="impCard">
      <p class="lbl">書き出したJSONを貼るか、ファイルを選んでください</p>
      <textarea id="impArea" rows="6" placeholder="[ { ... } ]" style="font-family:var(--mono); font-size:13px"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn sm grow" id="impGo">取り込む</button>
        <button class="btn sm grow ghost" id="impFileBtn">ファイルを選ぶ</button>
        <button class="btn sm ghost" id="impClose">閉じる</button>
      </div>
      <input type="file" id="impFile" accept=".json,application/json" class="hide">
      <p class="hint" id="impHint">同じ記録は二重に入りません。今ある記録は消えません。</p>
    </div>
    <div class="card hide" id="expCard">
      <textarea id="expArea" rows="12" readonly style="font-family:var(--mono); font-size:13px"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn sm grow" id="expCopy">コピー</button>
        <button class="btn sm grow ghost" id="expClose">閉じる</button>
      </div>
      <p class="hint" id="expHint"></p>
    </div>
    <div id="noteList"></div>
  </section>

</div>

<script>
(function(){
  "use strict";
  const KEY = "slot-tools-jissen-log";
  const TAGS = ["メモ","BIG","REG","AT","CZ","ART","天井","有利切れ"];
  const COLORED = ["BIG","REG","AT","CZ","ART"];
  const CASH_STEPS = [1000,3000,5000,10000];
  const DEFAULT_LEND = 46;

  let state = { version:4, settings:{lend:DEFAULT_LEND}, sessions:[], current:null };
  let draft = { tag:"メモ", res:"" };
  let addKind = null, saveOK = true, timeTouched = false;

  const el = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,"0");
  const nowISO = () => new Date().toISOString();
  const hm = iso => { const d=new Date(iso); return pad(d.getHours())+":"+pad(d.getMinutes()); };
  const ymd = iso => { const d=new Date(iso); return d.getFullYear()+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate()); };
  const wd  = iso => "日月火水木金土"[new Date(iso).getDay()];
  const num = v => { const n = parseInt(String(v).replace(/[^0-9-]/g,""),10); return isNaN(n)?null:n; };
  const yen = n => n.toLocaleString("ja-JP");
  const sign = n => (n>0?"+":"")+yen(n);
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const sum = a => (a||[]).reduce((s,x)=>s+x.amount,0);

  /* ---------- 保存 ---------- */
  function migrate(){
    if(!state.settings) state.settings = {};
    if(!state.settings.lend) state.settings.lend = DEFAULT_LEND;
    delete state.settings.ex;
    const fix = s => {
      const iv = s.invest || {};
      if(Array.isArray(iv.medal))  { iv.startMedal  = sum(iv.medal);  delete iv.medal; }
      if(Array.isArray(iv.replay)) { iv.startReplay = sum(iv.replay); delete iv.replay; }
      if(iv.startMedal===undefined)  iv.startMedal = 0;
      if(iv.startReplay===undefined) iv.startReplay = 0;
      if(iv.endMedal===undefined)  iv.endMedal = null;
      if(iv.endReplay===undefined) iv.endReplay = null;
      if(!Array.isArray(iv.cash)) iv.cash = [];
      s.invest = iv;
      if(!s.lend) s.lend = state.settings.lend;
      (s.events||[]).forEach(ev=>{
        if(ev.counterGame===undefined){
          const f = ev.fromGame, g = ev.game;
          ev.counterGame = (f!==undefined && f!==null) ? f : (g??null);
          ev.lcdGame = (f!==undefined && f!==null) ? (g??null) : null;
          delete ev.fromGame; delete ev.game;
        }
      });
      return s;
    };
    (state.sessions||[]).forEach(fix);
    if(state.current) fix(state.current);
    state.version = 4;
  }
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){ const d = JSON.parse(raw); if(d && d.sessions){ state = d; migrate(); } }
    }catch(e){}
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(state));
      if(!saveOK){ saveOK = true; el("storeWarn").classList.add("hide"); }
    }catch(e){ saveOK = false; el("storeWarn").classList.remove("hide"); }
  }

  /* ---------- 収支（等価前提：貸出レートで交換） ---------- */
  function profit(s){
    const iv = s.invest;
    if(iv.endMedal===null && iv.endReplay===null) return null;
    const lend = s.lend || state.settings.lend || DEFAULT_LEND;
    const st = (iv.startMedal||0) + (iv.startReplay||0);
    const en = (iv.endMedal||0) + (iv.endReplay||0);
    const cash = sum(iv.cash);
    const bought = Math.round(cash / 1000 * lend);
    return {
      cash, bought, lend,
      medalDiff: en - st - bought,
      yen: Math.round((en - st) * (1000 / lend) - cash)
    };
  }

  /* ---------- 時刻 ---------- */
  function setNow(force){
    if(timeTouched && !force) return;
    const d = new Date();
    el("nTime").value = pad(d.getHours())+":"+pad(d.getMinutes());
    if(force) timeTouched = false;
  }
  el("nTime").addEventListener("input", ()=>{ timeTouched = true; });
  el("nNow").addEventListener("click", ()=> setNow(true));
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) setNow(false); });

  /* ---------- レート選択 ---------- */
  function syncRate(){
    const v = num(el("nLend").value);
    document.querySelectorAll("[data-lend]").forEach(b=>b.classList.toggle("on", +b.dataset.lend===v));
  }
  document.querySelectorAll("[data-lend]").forEach(b=>b.addEventListener("click", ()=>{
    el("nLend").value = b.dataset.lend; syncRate();
  }));
  el("nLend").addEventListener("input", syncRate);

  /* ---------- 画面 ---------- */
  function show(tab){
    document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.tab===tab));
    const live = !!state.current;
    el("scNew").classList.toggle("hide",  tab!=="rec" || live);
    el("scLive").classList.toggle("hide", tab!=="rec" || !live);
    el("scNote").classList.toggle("hide", tab!=="note");
    if(tab==="rec" && !live) setNow(false);
    if(tab==="note") renderNotes();
    renderHeader();
  }
  function renderHeader(){
    const c = state.current;
    if(c){
      el("hTitle").textContent = c.machine;
      el("hMeta").textContent = hm(c.startAt)+"〜  開始"+(c.startGame??"-")+"G";
    }else{
      el("hTitle").textContent = "実戦ログ";
      el("hMeta").textContent = state.sessions.length ? state.sessions.length+"件" : "";
    }
  }

  function gameText(ev){
    const c = ev.counterGame, l = ev.lcdGame;
    if(c!=null && l!=null) return c+"/"+l;
    if(c!=null) return String(c);
    if(l!=null) return String(l);
    return "";
  }
  function gameHtml(ev){
    const c = ev.counterGame, l = ev.lcdGame;
    if(c!=null && l!=null) return c+'<span class="sl">/</span><span class="lc">'+l+'</span>';
    if(c!=null) return String(c);
    if(l!=null) return '<span class="lc">'+l+'</span>';
    return "";
  }

  function renderLive(){
    const c = state.current; if(!c) return;
    el("mCash").textContent   = yen(sum(c.invest.cash))+"円";
    el("mMedal").textContent  = yen(c.invest.startMedal||0)+"枚";
    el("mReplay").textContent = yen(c.invest.startReplay||0)+"枚";

    const log = el("eLog");
    if(!c.events.length){ log.innerHTML = '<div class="empty">まだ記録がありません</div>'; return; }
    log.innerHTML = c.events.slice().reverse().map(ev=>{
      const tg = ev.tag ? '<span class="tg '+(COLORED.includes(ev.tag)?"tg-"+ev.tag:"tg-o")+'">'+esc(ev.tag)+'</span>' : "";
      const rs = ev.result ? '<span class="res-m '+(ev.result==="勝"?"w":"l")+'">'+esc(ev.result)+'</span>' : "";
      const nt = ev.note ? '<div class="nt">'+esc(ev.note)+'</div>' : "";
      return '<div class="li"><div class="t">'+hm(ev.at)+'</div><div class="b">'
           + '<span class="g">'+gameHtml(ev)+'</span>'+tg+rs+nt+'</div>'
           + '<button class="x" data-del="'+ev.id+'">×</button></div>';
    }).join("");
  }

  function sessionText(s){
    const L = [];
    L.push("■ "+s.machine);
    L.push(ymd(s.startAt)+"("+wd(s.startAt)+") "+hm(s.startAt)+(s.endAt? "〜"+hm(s.endAt):"〜"));
    const head = [];
    if(s.startGame!=null) head.push("開始 "+s.startGame+"G");
    const iv = s.invest;
    if(iv.startMedal)  head.push("持 "+iv.startMedal+"枚");
    if(iv.startReplay) head.push("再 "+iv.startReplay+"枚");
    if(head.length) L.push(head.join(" ／ "));
    if(s.startNote) L.push(s.startNote);
    L.push("────────");
    s.events.forEach(ev=>{
      L.push([hm(ev.at), gameText(ev), ev.tag||"", ev.result||"", ev.note||""].filter(Boolean).join("  "));
    });
    if(s.endAt) L.push([hm(s.endAt), (s.endGame!=null?s.endGame:""), s.endNote||"ヤメ"].filter(x=>x!=="").join("  "));
    const p = profit(s);
    if(p){
      L.push("────────");
      L.push("現金 "+yen(p.cash)+"円（"+p.lend+"枚貸し＝"+p.bought+"枚）");
      L.push("終了 持 "+(iv.endMedal||0)+"枚 ／ 再 "+(iv.endReplay||0)+"枚");
      L.push("差枚 "+sign(p.medalDiff)+"枚 ／ 収支 "+sign(p.yen)+"円");
    }else if(sum(iv.cash)){
      L.push("現金 "+yen(sum(iv.cash))+"円");
    }
    return L.join("\n");
  }

  function renderNotes(){
    const list = el("noteList");
    const arr = state.sessions.slice().reverse();
    if(!arr.length){ list.innerHTML = '<div class="empty">まだ記録がありません</div>'; return; }
    list.innerHTML = arr.map(s=>{
      const p = profit(s);
      const pl = p ? '<span class="pl '+(p.yen>=0?"p":"m")+'">'+sign(p.yen)+'</span>' : '';
      return '<details class="sess"><summary>'
      + '<span class="sm">'+ymd(s.startAt).slice(5)+'</span>'
      + '<span class="sn">'+esc(s.machine)+'</span>'+pl
      + '</summary><div class="body"><div class="note">'+esc(sessionText(s))+'</div>'
      + '<button class="btn ghost sm wide" style="margin-top:10px" data-delses="'+s.id+'">この記録を削除</button>'
      + '</div></details>';
    }).join("");
  }

  /* ---------- 新規 ---------- */
  function renderRecent(){
    const seen = [];
    state.sessions.slice().reverse().forEach(s=>{ if(!seen.includes(s.machine)) seen.push(s.machine); });
    el("nRecent").innerHTML = seen.slice(0,6).map(m=>'<button data-m="'+esc(m)+'">'+esc(m)+'</button>').join("");
  }
  el("nRecent").addEventListener("click", e=>{
    const b = e.target.closest("[data-m]"); if(!b) return;
    el("nMachine").value = b.dataset.m;
  });

  el("nStart").addEventListener("click", ()=>{
    const machine = el("nMachine").value.trim();
    const game = num(el("nGame").value);
    const lend = num(el("nLend").value);
    const err = el("nErr");
    if(!machine){ err.textContent="機種名を入れてください"; err.classList.remove("hide"); return; }
    if(game===null){ err.textContent="開始ゲーム数を入れてください"; err.classList.remove("hide"); return; }
    if(lend===null || lend<=0){ err.textContent="レート（1000円で何枚）を入れてください"; err.classList.remove("hide"); return; }
    err.classList.add("hide");

    let startAt = nowISO();
    const t = el("nTime").value;
    if(t){ const d=new Date(); d.setHours(+t.slice(0,2), +t.slice(3,5), 0, 0); startAt = d.toISOString(); }

    state.settings.lend = lend;
    state.current = {
      id: uid(), machine, startAt, startGame: game, lend,
      startNote: el("nNote").value.trim(),
      invest: {
        cash: [],
        startMedal: num(el("nMedal").value) || 0,
        startReplay: num(el("nReplay").value) || 0,
        endMedal: null, endReplay: null
      },
      events: [], endAt:null, endGame:null, endNote:""
    };
    ["nMachine","nGame","nNote","nMedal","nReplay"].forEach(i=>el(i).value="");
    timeTouched=false; setNow(true);
    save(); renderLive(); show("rec");
  });

  /* ---------- 現金・開始手持ちの修正 ---------- */
  document.querySelectorAll("[data-add]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const k = b.dataset.add;
      if(addKind===k){ addKind=null; el("addPanel").classList.add("hide"); return; }
      addKind = k;
      if(k==="cash"){
        el("addLbl").textContent = "現金を追加";
        el("addBtns").innerHTML = CASH_STEPS.map(v=>'<button class="chip" data-amt="'+v+'">+'+yen(v)+'</button>').join("");
        el("addFree").placeholder = "手入力（円）";
        el("addUndo").classList.remove("hide");
        el("addFreeGo").textContent = "追加";
      }else{
        el("addLbl").textContent = (k==="startMedal"?"開始の持ちメダル":"開始の再プレイ")+"を直す";
        el("addBtns").innerHTML = "";
        el("addFree").placeholder = "枚数を入れ直す";
        el("addUndo").classList.add("hide");
        el("addFreeGo").textContent = "直す";
      }
      el("addFree").value = "";
      el("addPanel").classList.remove("hide");
    });
  });
  el("addBtns").addEventListener("click", e=>{
    const b = e.target.closest("[data-amt]"); if(!b||addKind!=="cash") return;
    state.current.invest.cash.push({at:nowISO(), amount:+b.dataset.amt});
    save(); renderLive();
  });
  el("addFreeGo").addEventListener("click", ()=>{
    const v = num(el("addFree").value); if(v===null||!addKind) return;
    if(addKind==="cash") state.current.invest.cash.push({at:nowISO(), amount:v});
    else state.current.invest[addKind] = v;
    el("addFree").value=""; save(); renderLive();
  });
  el("addUndo").addEventListener("click", ()=>{
    if(addKind!=="cash") return;
    state.current.invest.cash.pop(); save(); renderLive();
  });

  /* ---------- 記録 ---------- */
  el("eTags").innerHTML = TAGS.map(t=>'<button class="chip" data-c="'+t+'" data-tag="'+t+'">'+t+'</button>').join("");
  function syncChips(){
    document.querySelectorAll("[data-tag]").forEach(b=>b.classList.toggle("on", b.dataset.tag===draft.tag));
    document.querySelectorAll("[data-res]").forEach(b=>b.classList.toggle("on", b.dataset.res===draft.res));
  }
  el("eTags").addEventListener("click", e=>{
    const b = e.target.closest("[data-tag]"); if(!b) return;
    draft.tag = b.dataset.tag; syncChips();
  });
  document.querySelectorAll("[data-res]").forEach(b=>b.addEventListener("click",()=>{
    draft.res = b.dataset.res; syncChips();
  }));
  syncChips();

  el("eAdd").addEventListener("click", ()=>{
    const c = num(el("eCnt").value), l = num(el("eLcd").value);
    const err = el("eErr");
    if(c===null && l===null){ err.textContent="ゲーム数を入れてください（どちらか一方で可）"; err.classList.remove("hide"); return; }
    err.classList.add("hide");
    state.current.events.push({
      id: uid(), at: nowISO(), counterGame: c, lcdGame: l,
      tag: draft.tag, result: draft.res, note: el("eNote").value.trim()
    });
    el("eCnt").value=""; el("eLcd").value=""; el("eNote").value="";
    draft.tag="メモ"; draft.res="";
    syncChips(); save(); renderLive();
    window.scrollTo({top: el("eLog").offsetTop-60, behavior:"smooth"});
  });

  el("eLog").addEventListener("click", e=>{
    const b = e.target.closest("[data-del]"); if(!b) return;
    if(!confirm("この行を削除しますか？")) return;
    state.current.events = state.current.events.filter(x=>x.id!==b.dataset.del);
    save(); renderLive();
  });

  /* ---------- 終了 ---------- */
  el("fEnd").addEventListener("click", ()=>{
    const c = state.current; if(!c) return;
    c.endGame = num(el("fGame").value);
    c.endNote = el("fNote").value.trim() || "ヤメ";
    c.invest.endMedal  = num(el("fMedal").value);
    c.invest.endReplay = num(el("fReplay").value);
    if(c.invest.endMedal===null && c.invest.endReplay!==null) c.invest.endMedal = 0;
    if(c.invest.endReplay===null && c.invest.endMedal!==null) c.invest.endReplay = 0;
    c.endAt = nowISO();
    state.sessions.push(c); state.current = null;
    ["fGame","fNote","fMedal","fReplay"].forEach(i=>el(i).value="");
    timeTouched=false; setNow(true);
    save(); renderRecent(); show("note");
  });
  el("fCancel").addEventListener("click", ()=>{
    if(!confirm("この台の記録を破棄しますか？")) return;
    state.current = null; timeTouched=false; setNow(true); save(); show("rec");
  });

  /* ---------- 書き出し ---------- */
  function openExport(txt, hint){
    el("expArea").value = txt;
    el("expHint").textContent = hint||"";
    el("expCard").classList.remove("hide");
  }
  el("expText").addEventListener("click", ()=>{
    const all = state.sessions.map(sessionText).join("\n\n");
    openExport(all || "（記録なし）", "そのままノートに貼れる形式です。");
  });
  el("expJson").addEventListener("click", ()=>{
    openExport(JSON.stringify(state.sessions, null, 2), "シオンに渡すのはこちら。");
  });
  el("expCopy").addEventListener("click", async ()=>{
    const a = el("expArea");
    try{ await navigator.clipboard.writeText(a.value); el("expHint").textContent="コピーしました。"; }
    catch(e){ a.removeAttribute("readonly"); a.select(); a.setSelectionRange(0,999999); a.setAttribute("readonly","");
      el("expHint").textContent="全選択しました。長押しでコピーしてください。"; }
  });
  el("expClose").addEventListener("click", ()=> el("expCard").classList.add("hide"));

  /* ---------- 取り込み ---------- */
  el("impOpen").addEventListener("click", ()=>{
    el("impCard").classList.toggle("hide");
  });
  el("impClose").addEventListener("click", ()=> el("impCard").classList.add("hide"));
  el("impFileBtn").addEventListener("click", ()=> el("impFile").click());
  el("impFile").addEventListener("change", e=>{
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { el("impArea").value = r.result; importJson(); };
    r.onerror = () => { el("impHint").textContent = "ファイルを読めませんでした。"; };
    r.readAsText(f);
    e.target.value = "";
  });
  el("impGo").addEventListener("click", importJson);

  function importJson(){
    const hint = el("impHint");
    let data;
    try{ data = JSON.parse(el("impArea").value); }
    catch(err){ hint.textContent = "JSONとして読めません。書き出した文字列をそのまま貼ってください。"; return; }
    const arr = Array.isArray(data) ? data : (data && Array.isArray(data.sessions) ? data.sessions : null);
    if(!arr){ hint.textContent = "記録の配列が見つかりません。"; return; }

    const have = new Set(state.sessions.map(s=>s.id));
    let added = 0, skipped = 0, bad = 0;
    arr.forEach(s=>{
      if(!s || !s.id || !s.startAt || !s.machine){ bad++; return; }
      if(have.has(s.id)){ skipped++; return; }
      state.sessions.push(s); have.add(s.id); added++;
    });
    migrate();
    state.sessions.sort((a,b)=> new Date(a.startAt) - new Date(b.startAt));
    save(); renderRecent(); renderNotes(); renderHeader();
    el("impArea").value = "";
    hint.textContent = added+"件を取り込みました。"
      + (skipped? "（同じ記録 "+skipped+"件は飛ばしました）":"")
      + (bad? "（読めない記録 "+bad+"件）":"");
  }

  /* ---------- タブ ---------- */
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click", ()=>show(t.dataset.tab)));
  el("noteList").addEventListener("click", e=>{
    const b = e.target.closest("[data-delses]"); if(!b) return;
    if(!confirm("この記録を削除しますか？")) return;
    state.sessions = state.sessions.filter(s=>s.id!==b.dataset.delses);
    save(); renderNotes(); renderHeader();
  });

  setNow(true);
  load();
  el("nLend").value = state.settings.lend; syncRate();
  renderRecent(); renderLive(); show("rec");
})();
</script>
</body>
</html>
