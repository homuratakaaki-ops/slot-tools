<style>
:root{
  --bg:#0c1110;
  --surface:#151b1a;
  --surface2:#1d2523;
  --ink:#eef5ee;
  --muted:#92a099;
  --line:#2a3632;
  --drive:#69d84f;
  --drive-soft:#20391e;
  --accent:#7ce6b0;
  --danger:#ff5d6c;
  --amber:#f0ba51;
  --blue:#62a8ff;
  --purple:#ba8cff;
  --pink:#ff7aa2;
  --memo:#c4e86b;
  --focus:#9af285;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;
  min-height:100dvh;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  font-size:14px;
  line-height:1.45;
}
a{color:var(--accent);text-decoration:none}
button,input,textarea{font:inherit}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bm-overlay{
  position:fixed;
  inset:0;
  z-index:9000;
  background:var(--bg);
  color:var(--ink);
  padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
  overflow:auto;
}
.bm-shell{
  width:100%;
  max-width:480px;
  min-height:100%;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.bm-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  border-bottom:1px solid rgba(105,216,79,.28);
  padding:2px 0 7px;
}
.bm-title{min-width:0;font-size:13px;font-weight:900;color:var(--drive);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm-close{
  flex:none;
  width:48px;
  height:48px;
  border:1px solid rgba(105,216,79,.42);
  border-radius:8px;
  background:rgba(105,216,79,.08);
  color:var(--drive);
  font-size:22px;
  font-weight:900;
}
.state-badges{display:flex;gap:6px;flex-wrap:wrap;min-height:32px}
.state-badge{
  border:1px solid rgba(148,163,184,.35);
  border-radius:999px;
  background:rgba(148,163,184,.11);
  color:var(--muted);
  min-height:32px;
  padding:5px 10px;
  font-size:12px;
  font-weight:900;
}
.state-badge.active-normal{border-color:rgba(105,216,79,.52);background:rgba(105,216,79,.12);color:var(--drive)}
.state-badge.active-battle{border-color:rgba(255,93,108,.72);background:rgba(255,93,108,.14);color:#ffc2ca}
.counter-row,.money-row,.step-row,.button-row,.sheet-row,.choice-row{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}
.counter-btn{
  flex:1 1 0;
  min-width:0;
  min-height:64px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface);
  color:var(--ink);
  text-align:center;
  padding:7px 8px;
}
.counter-btn span{display:block;color:var(--muted);font-size:11px;font-weight:900}
.counter-btn b{display:block;color:var(--drive);font-size:24px;line-height:1.25;font-variant-numeric:tabular-nums}
.counter-btn.lcd-attention{animation:lcdPulse 1.1s ease-in-out infinite}
@keyframes lcdPulse{
  0%,100%{border-color:var(--line);box-shadow:none}
  50%{border-color:rgba(240,186,81,.95);box-shadow:0 0 0 2px rgba(240,186,81,.22) inset}
}
.money-pill{
  flex:1 1 110px;
  min-height:38px;
  border:1px solid rgba(105,216,79,.25);
  border-radius:8px;
  background:rgba(0,0,0,.14);
  color:var(--muted);
  padding:7px 9px;
  font-size:12px;
  font-weight:900;
  text-align:center;
}
.money-pill strong{color:var(--ink);font-variant-numeric:tabular-nums}
.bm-btn,.chip{
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface2);
  color:var(--ink);
  min-height:52px;
  padding:8px 9px;
  font-weight:900;
  cursor:pointer;
  white-space:normal;
  overflow-wrap:anywhere;
}
.bm-btn{flex:1 1 92px;font-size:15px}
.bm-btn.small{flex:1 1 58px;min-height:48px}
.bm-btn.primary{border-color:#315b2d;background:var(--drive-soft);color:var(--drive)}
.bm-btn.secondary{border-color:var(--line);background:var(--surface2);color:var(--ink)}
.bm-btn.danger{border-color:#70313b;background:#32171b;color:var(--danger)}
.bm-btn.win{border-color:#3a6b35;background:#1d3521;color:var(--drive)}
.bm-btn.lose{border-color:#74344c;background:#33202a;color:var(--pink)}
.bm-btn.hot-text{color:var(--danger)}
.bm-btn.blue-text{color:var(--blue)}
.bm-btn.red-text{color:var(--danger)}
.bm-btn.gold-text{color:var(--amber)}
.bm-btn:disabled,.chip:disabled,.counter-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  filter:grayscale(.35);
}
.chip{
  flex:1 1 auto;
  min-height:42px;
  border-radius:999px;
  font-size:12px;
  padding:8px 11px;
}
.chip[aria-pressed="true"]{border-color:var(--drive);background:var(--drive-soft);color:var(--drive)}
.chip.hot{border-color:#633039;color:var(--danger)}
.chip.hot[aria-pressed="true"]{border-color:var(--danger);background:#35171c;color:#fff}
.chip.blue-text{color:var(--blue)}
.chip.green-text{color:var(--drive)}
.chip.red-text{color:var(--danger)}
.panel{
  border:1px solid rgba(105,216,79,.22);
  border-radius:8px;
  background:rgba(0,0,0,.12);
  padding:8px;
}
.panel-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;color:var(--drive);font-size:12px;font-weight:900}
.field-row{display:flex;align-items:center;gap:8px;margin:8px 0}
.field-row label{flex:1;color:var(--muted);font-size:12px;font-weight:900}
.field-row input,.field-row select{
  width:138px;
  max-width:54%;
  border:1px solid var(--line);
  border-radius:8px;
  background:#0a0f0d;
  color:var(--ink);
  padding:10px 9px;
  font-size:17px;
  font-variant-numeric:tabular-nums;
}
.field-row input{text-align:right}
.field-row input[type="text"]{text-align:left;font-size:15px}
.field-row select{font-size:15px}
textarea{
  width:100%;
  min-height:96px;
  resize:vertical;
  border:1px solid var(--line);
  border-radius:8px;
  background:#0a0f0d;
  color:var(--ink);
  padding:10px;
}
.recent,.undo-bar{
  border:1px solid rgba(105,216,79,.25);
  border-radius:8px;
  background:rgba(0,0,0,.16);
}
.recent{padding:7px 9px;min-height:40px;color:var(--muted);font-size:12px;overflow:hidden}
.recent-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.undo-bar{
  min-height:48px;
  color:var(--drive);
  background:rgba(105,216,79,.10);
  font-size:14px;
  font-weight:900;
  padding:9px 10px;
}
.undo-bar.disabled{opacity:.52;color:var(--muted);border-color:rgba(122,122,138,.35);background:rgba(122,122,138,.08)}
.bm-sheet{
  position:fixed;
  inset:0;
  z-index:9050;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.58);
}
.bm-sheet.open{display:flex}
.bm-sheet-panel{
  width:100%;
  max-width:480px;
  max-height:76dvh;
  overflow:auto;
  margin:0 auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-bottom:0;
  border-radius:14px 14px 0 0;
  padding:12px;
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sheet-title{font-size:14px;font-weight:900;color:var(--drive)}
.sheet-body{display:flex;flex-direction:column;gap:8px}
.export-box{min-height:130px;font-size:12px;user-select:text;-webkit-user-select:text}
.toast{
  position:fixed;
  left:50%;
  top:72px;
  transform:translateX(-50%);
  z-index:12000;
  display:none;
  max-width:calc(100vw - 22px);
  border:1px solid rgba(105,216,79,.45);
  border-radius:999px;
  background:rgba(20,20,24,.95);
  color:var(--drive);
  font-size:16px;
  font-weight:900;
  padding:12px 18px;
  box-shadow:0 8px 22px rgba(0,0,0,.35);
  text-align:center;
}
.toast.show{display:block}
.tag{
  display:inline-block;
  min-width:60px;
  text-align:center;
  border-radius:999px;
  padding:3px 7px;
  margin-right:5px;
  font-size:11px;
  font-weight:900;
  color:#07100b;
}
.tag.gain{background:var(--drive)}
.tag.dcin{background:#94d982}
.tag.judge{background:var(--amber)}
.tag.in{background:var(--blue)}
.tag.stage{background:#3f75c8;color:#eef5ff}
.tag.out{background:var(--purple)}
.tag.gcolor{background:#d7e8ef}
.tag.stage_sel{background:#8ecf9e;color:#07100b}
.tag.rare{background:#f0d27b;color:#161006}
.tag.fb{background:var(--pink)}
.tag.fbhit{background:#ffb4c8}
.tag.continue{background:#f7a7b7;color:#16070b}
.tag.cash{background:#9fd37b}
.tag.collect{background:#87d8d0;color:#061110}
.tag.memo{background:var(--memo)}
.voice-mark,.red-mark{color:var(--danger);font-weight:900}
.muted{color:var(--muted)}
@media (max-width:380px){
  .bm-shell{gap:6px}
  .bm-btn{flex-basis:76px;padding-left:6px;padding-right:6px;font-size:14px}
  .bm-btn.small{flex-basis:52px}
  .field-row input,.field-row select{width:118px}
  .chip{padding-left:9px;padding-right:9px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<main class="bm-overlay" id="battleModeOverlay">
  <div class="bm-shell">
    <header class="bm-header">
      <div class="bm-title">Lストリートファイター6 / 実戦記録</div>
      <a class="bm-close" href="/" aria-label="トップへ">×</a>
    </header>

    <div class="state-badges" id="stateBadges"></div>

    <section class="counter-row" aria-label="現在G数">
      <button class="counter-btn" type="button" id="realCounterBtn" data-adjust="realG"><span>実G</span><b id="realCounter">-</b></button>
      <button class="counter-btn" type="button" id="lcdCounterBtn" data-adjust="lcdG"><span>液晶G</span><b id="lcdCounter">-</b></button>
    </section>

    <section class="money-row" aria-label="投資回収">

    <section class="step-row" aria-label="通常消化">

    <section class="panel" id="adjustPanel" hidden>
      <div class="panel-title"><span id="adjustTitle">G数調整</span><button class="bm-btn small secondary" type="button" id="adjustCloseBtn">閉じる</button></div>
      <div class="field-row">
        <label for="adjustValue" id="adjustLabel">現在値</label>

      </div>
      <div class="button-row">
        <button class="bm-btn small secondary" type="button" data-adjust-step="-10">-10</button>
        <button class="bm-btn small secondary" type="button" data-adjust-step="-1">-1</button>

        <button class="bm-btn small secondary" type="button" data-adjust-step="10">+10</button>

    <section id="modeGrid" class="panel"></section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script src="sf6-schema.js"></script>
<script>
(function(){
  'use strict';
  const STORAGE_KEY='sf6_record_v1';
  const MACHINE='L-SF6';
  const VERSION='4';
  const GAIN_KINDS=['DC-アタック','DC-ルーク','DC-春麗','DC-キャミィ','ジャッジ'];
  const VOICES=['ルーク','春麗','キャミィ','リュウ','ケン','キンバリー','ジェイミー','未確認'];
  const HOT_VOICES=new Set(['キンバリー','ジェイミー']);
  const G_COLORS=['青','赤','デフォ復帰'];
  const DEFAULT_RETURN_COLOR=G_COLORS[2];
  const STAGE_CHOICES=['ジェイミー','キャミィ','春麗','ルーク'];
  const RARE_KINDS=['スイカ','弱チェリー','チャンス目','強チェリー'];
  const BONUSES=['赤7','青7'];
  const RANKS=['ルーキー','ブロンズ','シルバー','ゴールド','レジェンド'];
  const RANK_RATE_LABELS=[['ルーキー','50%'],['ブロンズ','60%'],['シルバー','70%'],['ゴールド','80%'],['レジェンド','88%']];
  const ROUND_STARTS=['青','緑','味方全員集合','敵全員集合'];
  const ROUND_START_LABELS=[['青','青（デフォ）','blue-default'],['緑','緑（上位キャラ）','green-upper'],['味方全員集合','味方全員集合','ally-all'],['敵全員集合','敵全員集合','enemy-all']];
  const OPPONENTS=['マリーザ','ガイル','マノン','ジュリ','JP','リュウ'];
  const END_SCREENS=['基本画面','男性ファイター集合','女性ファイター集合','ケン&JP','リュウ','ルーク&ジェイミー','全員集合','エンタライオン'];
  const CONTINUES=[{key:'none',label:'なし'},{key:'success',label:'成功'},{key:'fail',label:'失敗'}];
  const CASH_AMOUNTS=[1000,5000,10000];
  const ICATCHES=['ルーク','春麗','キンバリー','キャミィ','JP','ジェイミー','豪鬼','リュウ'];
  const BATTLE_STEP_LOCK_TOAST='FB中は通常消化を操作できません';
  const BATTLE_ADJUST_LOCK_TOAST='FB中はG数調整を操作できません';
  const $=id=>document.getElementById(id);
  const txt=(text)=>document.createTextNode(String(text??''));
  let state={machine:MACHINE,ver:VERSION,battleState:'normal',currentState:{realG:null,lcdG:null},logs:[]};
  let selectedGainKind='';
  let selectedVoice=null;
  let gainAddDraft='';
  let selectedBonus=null;
  let selectedRank=null;
  let selectedRoundStart=null;
  let selectedCashAmount=10000;
  let selectedIcatch=null;
  let selectedContinue='none';
  let adjustTarget=null;
  let stepHistory=[];
  let undoStack=[];
  let redoAction=null;
  let resetTimer=null;
  let lastLcdTouchedAt=Date.now();
  let lcdLogCountAtTouch=0;

  function positiveInt(value){
    const text=String(value??'').trim();
    if(!/^\d+$/.test(text))return null;
    const n=Number(text);
    return Number.isSafeInteger(n)&&n>0?n:null;
  }
  function nonnegativeInt(value){
    const text=String(value??'').trim();
    if(!/^\d+$/.test(text))return null;
    const n=Number(text);
    return Number.isSafeInteger(n)?n:null;
  }
  function optionalGame(value){
    const text=String(value??'').trim();
    if(text==='')return null;
    if(!/^\d+$/.test(text))return null;
    const n=Number(text);
    return Number.isSafeInteger(n)?n:null;
  }
  function normalizeBattleState(value){
    return value==='battle'?'battle':'normal';
  }
  function normalizeCurrentState(value){
    return {realG:value?.realG==null?null:optionalGame(value.realG),lcdG:value?.lcdG==null?null:optionalGame(value.lcdG)};
  }
  function snapshot(){
    const current=state.currentState||{};
    return {realG:current.realG==null?null:optionalGame(current.realG),lcdG:current.lcdG==null?null:optionalGame(current.lcdG)};
  }
  function deepClone(value){
    return JSON.parse(JSON.stringify(value));
  }
  function appSnapshot(){
    return deepClone({battleState:state.battleState,currentState:normalizeCurrentState(state.currentState),logs:state.logs});
  }
  function restoreSnapshot(snap){
    state.battleState=normalizeBattleState(snap?.battleState);
    state.currentState=normalizeCurrentState(snap?.currentState);
    state.logs=Array.isArray(snap?.logs)?snap.logs.map(sanitizeLog).filter(Boolean):[];
    save();
    render();
  }
  function commit(label,mutator,options={}){
    const before=appSnapshot();
    const ok=mutator();
    if(ok===false)return false;
    state.battleState=normalizeBattleState(state.battleState);
    state.currentState=normalizeCurrentState(state.currentState);
    const after=appSnapshot();
    if(JSON.stringify(before)===JSON.stringify(after)){
      render();
      return false;
    }
    undoStack.push({label,before,after});
    if(undoStack.length>80)undoStack.shift();
    redoAction=null;
    if(options.lcdTouched)markLcdTouched();
    save();
    render();
    toast(options.toast||`${label}を記録しました`);
    return true;
  }
  function nextId(){
    return state.logs.reduce((max,log)=>Math.max(max,Number(log.id)||0),0)+1;
  }
  function addLogDirect(log){
    state.logs.push({...log,id:nextId(),t:Date.now()});
  }
  function sanitizeLog(log){
    if(!log||typeof log!=='object')return null;
    const base={id:Number(log.id)||0,type:String(log.type||''),realG:log.realG==null?null:optionalGame(log.realG),lcdG:log.lcdG==null?null:optionalGame(log.lcdG),t:Number(log.t)||Date.now()};
    if(!base.id||!base.type)return null;
    if(base.type==='gain'){
      if(!GAIN_KINDS.includes(log.kind))return null;
      const addG=positiveInt(log.addG);
      if(!addG||base.lcdG===null)return null;
      return {...log,...base,kind:log.kind,addG,voice:log.kind==='ジャッジ'?null:(VOICES.includes(log.voice)?log.voice:null)};
    }
    if(base.type==='zenchou'){
      if(!['in','stage','out'].includes(log.dir)||base.lcdG===null)return null;
      return {...log,...base,dir:log.dir};
    }
    if(base.type==='gcolor'){
      if(!G_COLORS.includes(log.color)||base.lcdG===null)return null;
      return {...log,...base,color:log.color};
    }
    if(base.type==='stage_sel'){
      if(!STAGE_CHOICES.includes(log.stage)||base.lcdG===null)return null;
      return {...log,...base,stage:log.stage};
    }
    if(base.type==='rare'){
      if(!RARE_KINDS.includes(log.kind)||base.lcdG===null)return null;
      return {...log,...base,kind:log.kind};
    }
    if(base.type==='dcin'||base.type==='fbhit'){
      if(base.lcdG===null)return null;
      return {...log,...base};
    }
    if(base.type==='continue'){
      return {...log,...base,result:log.result==='success'?'success':'success'};
    }
    if(base.type==='fb'){
      const win=log.win===true;
      const rank=log.rank==null?null:(String(log.rank).trim().slice(0,20)||null);
      const roundStart=log.roundStart==null?null:(String(log.roundStart).trim().slice(0,20)||null);
      const opponent=String(log.opponent||'').trim().slice(0,20)||null;
      const kiteiG=log.kiteiG==null?null:nonnegativeInt(log.kiteiG);
      const knownLegacyIcatch=['ルーク（デフォ）','その他'];
      const icatchValue=String(log.icatch||'').trim();
      const icatch=!win&&(ICATCHES.includes(icatchValue)||knownLegacyIcatch.includes(icatchValue))?icatchValue:null;
      const icatchNote=!win&&Object.prototype.hasOwnProperty.call(log,'icatchNote')?(String(log.icatchNote||'').trim().slice(0,20)||null):null;
      const bonusMedals=log.bonusMedals==null?null:positiveInt(log.bonusMedals);
      const endScreen=log.endScreen==null?null:(String(log.endScreen).trim().slice(0,30)||null);
      const cont=['none','success','fail'].includes(log.continue)?log.continue:null;
      return {...log,...base,win,bonus:win&&BONUSES.includes(log.bonus)?log.bonus:null,rank,roundStart,opponent,kiteiG,icatch,icatchNote,bonusMedals:win?bonusMedals:null,endScreen:win?endScreen:null,continue:win?null:cont};
    }
    if(base.type==='cash'){
      const amount=positiveInt(log.amount);
      return amount?{...log,...base,amount}:null;
    }
    if(base.type==='collect'){
      const medals=positiveInt(log.medals);
      return medals?{...log,...base,medals}:null;
    }
    if(base.type==='memo'){
      const text=String(log.text||'').slice(0,100);
      return text?{...log,...base,text}:null;
    }
    return {...log,...base};
  }
  function normalize(data){

    const logs=Array.isArray(normalized?.logs)?normalized.logs.map(sanitizeLog).filter(Boolean):[];
    const sourceVer=normalized&&Object.prototype.hasOwnProperty.call(normalized,'sourceVer')?normalized.sourceVer:VERSION;
    return {machine:MACHINE,ver:VERSION,sourceVer,battleState:normalizeBattleState(normalized?.battleState),currentState:normalizeCurrentState(normalized?.currentState),logs};
  }

  function stepBoth(delta){

    const before=snapshot();
    state.currentState={realG:(before.realG??0)+delta,lcdG:(before.lcdG??0)+delta};

  function undoStep(){

    state.currentState={realG:prev.realG,lcdG:prev.lcdG};

  function tagClass(log){
    if(log.type==='gain')return log.kind==='ジャッジ'?'judge':'gain';
    if(log.type==='zenchou')return log.dir;
    if(['gain','dcin','gcolor','stage_sel','rare','zenchou','fbhit','fb','continue','cash','collect','memo'].includes(log.type))return log.type;
    return 'memo';
  }
  function logLabel(log){
    if(log.type==='gain')return log.kind==='ジャッジ'?'ジャッジ':'加算DC';
    if(log.type==='dcin')return 'DC-IN';
    if(log.type==='gcolor')return '色';
    if(log.type==='stage_sel')return 'ステージ';
    if(log.type==='rare')return 'レア役';
    if(log.type==='zenchou')return log.dir==='stage'?'WT':(log.dir==='in'?'前兆IN':'前兆OUT');
    if(log.type==='fbhit')return 'FB当選';
    if(log.type==='fb')return 'FB';
    if(log.type==='continue')return '継続';
    if(log.type==='cash')return '投資';
    if(log.type==='collect')return '回収';
    if(log.type==='memo')return 'メモ';
    return '不明';
  }
  function logTextPlain(log){
    if(log.type==='gain')return `${log.kind} +${log.addG}G${log.voice?` / ボイス ${log.voice}`:''}`;
    if(log.type==='zenchou')return log.dir==='stage'?'前兆ステージ突入':(log.dir==='in'?'前兆突入':'前兆抜け');
    if(log.type==='gcolor')return `色：${log.color}`;
    if(log.type==='stage_sel')return `ステージ：${log.stage}`;
    if(log.type==='rare')return `レア役：${log.kind}`;
    if(log.type==='dcin')return 'DC突入';
    if(log.type==='fbhit')return 'FB当選';
    if(log.type==='continue')return 'コンティニュー成功';
    if(log.type==='fb'){
      const parts=[`FB ${log.win?'勝利':'敗北'}`];
      if(log.rank||log.roundStart||log.opponent)parts.push([log.rank,log.roundStart,log.opponent].filter(Boolean).join('／'));
      if(!log.win&&log.continue)parts.push(`コンティニュー ${CONTINUES.find(item=>item.key===log.continue)?.label||log.continue}`);
      if(log.kiteiG!==null&&log.kiteiG!==undefined)parts.push(`規定${log.kiteiG}G`);
      if(log.icatch)parts.push(`アイキャッチ ${log.icatchNote?`${log.icatch}：${log.icatchNote}`:log.icatch}`);
      if(log.bonus)parts.push(log.bonus);
      if(log.bonusMedals)parts.push(`${log.bonusMedals}枚`);
      if(log.endScreen)parts.push(`終了画面 ${log.endScreen}`);
      return parts.join(' / ');
    }
    if(log.type==='cash')return `投資 ${log.amount.toLocaleString()}円`;
    if(log.type==='collect')return `回収 ${log.medals.toLocaleString()}枚`;
    if(log.type==='memo')return log.text;
    return `未対応 ${log.type}`;
  }
  function gameSub(log){
    const lcd=log.lcdG==null?'液晶-':`液晶${log.lcdG}G`;
    const real=log.realG==null?'実-':`実${log.realG}G`;
    return `${lcd} / ${real}`;
  }
  function setText(el,text,className){
    const node=document.createElement('span');
    if(className)node.className=className;
    node.textContent=text;
    el.appendChild(node);
  }
  function fillLogText(el,log){
    if(log.type==='gcolor'){
      setText(el,'色：');
      setText(el,log.color,log.color==='赤'?'red-mark':'');
      return;
    }
    if(log.type==='stage_sel'){
      setText(el,'ステージ：');
      setText(el,log.stage,log.stage==='ジェイミー'?'voice-mark':'');
      return;
    }
    if(log.type==='rare'){
      setText(el,`レア役：${log.kind}`,log.kind==='強チェリー'?'voice-mark':'');
      return;
    }
    if(log.type==='gain'){
      setText(el,`${log.kind} +${log.addG}G`);
      if(log.voice){
        setText(el,' / ボイス ');
        setText(el,log.voice,HOT_VOICES.has(log.voice)?'voice-mark':'');
      }
      return;
    }
    if(log.type==='fb'&&log.icatch){
      setText(el,logTextPlain({...log,icatch:null,icatchNote:null}));
      setText(el,' / アイキャッチ ');
      setText(el,log.icatchNote?`${log.icatch}：${log.icatchNote}`:log.icatch,log.icatch!=='ルーク'&&log.icatch!=='ルーク（デフォ）'?'voice-mark':'');
      return;
    }
    if(log.type==='memo'){
      setText(el,log.text);
      return;
    }
    setText(el,logTextPlain(log));
  }
  function openGColorSheet(){
    openSheet('液晶色',body=>{
      const choices=row('choice-row');
      choices.id='gColorKinds';
      G_COLORS.forEach(color=>{
        const cls=color==='青'?'blue-text':color==='赤'?'red-text':'';
        choices.append(chip(color,false,()=>recordGColor(color,{closeAfter:true}),cls));
      });
      body.append(choices);
    });
  }
  function openRareSheet(){
    openSheet('レア役',body=>{
      const choices=row('choice-row');
      choices.id='rareKinds';
      RARE_KINDS.forEach(label=>choices.append(chip(label,false,()=>recordRare(label,{closeAfter:true}),label==='強チェリー'?'hot':'')));
      body.append(choices);
    });
  }
  function openStageSheet(){
    openSheet('ステージ',body=>{
      const choices=row('choice-row');
      choices.id='stageKinds';
      STAGE_CHOICES.forEach(label=>choices.append(chip(label,false,()=>recordStage(label,{closeAfter:true}),label==='ジェイミー'?'hot':'')));
      body.append(choices);
    });
  }
  function openZenchouSheet(){
    openSheet('前兆',body=>{
      const choices=row();
      choices.id='zenchouKinds';
      choices.append(button('前兆突入','secondary',()=>recordZenchou('in',{closeAfter:true})));
      choices.append(button('前兆ステージ突入','secondary',()=>recordZenchou('stage',{closeAfter:true})));
      choices.append(button('前兆抜け','secondary',()=>recordZenchou('out',{closeAfter:true})));
      body.append(choices);
    });
  }
  function openGainSheet(){
    const liveAdd=$('addG');
    if(liveAdd)gainAddDraft=String(liveAdd.value||'');
    openSheet('DC結果',body=>{
      const kinds=row('choice-row');
      kinds.id='gainKinds';
      GAIN_KINDS.forEach(label=>{
        kinds.append(chip(label,selectedGainKind===label,()=>{selectedGainKind=label;openGainSheet();}));
      });
      body.append(kinds);
      const addInput=input('addG','number','例 120');
      addInput.value=gainAddDraft;
      addInput.addEventListener('input',()=>{gainAddDraft=addInput.value;});
      body.append(field('加算G数',addInput));
      const voices=row('choice-row');
      voices.id='voiceKinds';
      VOICES.forEach(label=>{
        voices.append(chip(label,selectedVoice===label,()=>{selectedVoice=selectedVoice===label?null:label;openGainSheet();},HOT_VOICES.has(label)?'hot':''));
      });
      body.append(el('div','muted','ジャッジ選択時はボイスを保存しません'));
      body.append(voices);
      const actions=row();
      const gainBtn=button('加算を記録','primary',recordGainFromSheet);
      gainBtn.id='gainBtn';
      actions.append(gainBtn);
      body.append(actions);
    });
  }
  function openWinSheet(){
    openSheet('勝利記録',body=>{
      const bonusKinds=row('choice-row');
      bonusKinds.id='bonusKinds';
      BONUSES.forEach(label=>{
        bonusKinds.append(chip(label,selectedBonus===label,()=>{selectedBonus=selectedBonus===label?null:label;openWinSheet();}));
      });
      body.append(el('div','muted','ボーナス種別（任意）'));
      body.append(bonusKinds);
      body.append(field('ボーナス枚数',input('bonusMedals','number','任意')));
      const endScreen=selectInput('endScreenSelect',END_SCREENS,'終了画面');
      body.append(field('ボーナス終了画面',endScreen));
      const actions=row();
      actions.append(button('勝利を記録','win',recordWinFromSheet));
      body.append(actions);
    });
  }
  function openLossSheet(){
    openSheet('敗北記録',body=>{
      const continueKinds=row('choice-row');
      continueKinds.id='continueKinds';
      CONTINUES.forEach(item=>{
        continueKinds.append(chip(item.label,selectedContinue===item.key,()=>{selectedContinue=item.key;openLossSheet();},item.key==='success'?'hot':''));
      });
      body.append(el('div','muted','コンティニュー'));
      body.append(continueKinds);
      if(selectedContinue==='success'){
        body.append(el('div','muted','成功時は敗北レコードを作らず、FB中を維持します'));
      }else{
        body.append(field('抜け時液晶G',input('fbExitLcdG','number','必須')));
        const choices=row('choice-row');
        choices.id='icatchKinds';
        ICATCHES.forEach(label=>{
          const cls=label==='ルーク'?'':(label==='リュウ'||label==='豪鬼'||label==='キンバリー'?'hot':'');
          choices.append(chip(label,selectedIcatch===label,()=>{selectedIcatch=selectedIcatch===label?null:label;openLossSheet();},cls));
        });
        body.append(el('div','muted','アイキャッチ（任意）'));
        body.append(choices);
      }
      const actions=row();
      actions.append(button(selectedContinue==='success'?'成功を記録':'敗北を確定',selectedContinue==='success'?'win':'lose',recordLossFromSheet));
      body.append(actions);
    });
  }
  function openMemoSheet(){
    openSheet('メモ',body=>{
      const memo=document.createElement('textarea');
      memo.id='memoText';
      memo.maxLength=100;
      memo.placeholder='メモ（100文字まで）';
      body.append(memo);
      const memoBtn=button('メモを記録','secondary',recordMemo);
      memoBtn.id='memoBtn';
      body.append(memoBtn);
    });
  }
  function openUtilitySheet(){
    openSheet('投資・回収・メモ・出力',body=>{
      const cashRow=row('choice-row');
      cashRow.id='cashKinds';
      CASH_AMOUNTS.forEach(amount=>{
        cashRow.append(chip(`${amount.toLocaleString()}円`,selectedCashAmount===amount,()=>{selectedCashAmount=amount;openUtilitySheet();}));
      });
      body.append(el('div','muted','投資'));
      body.append(cashRow);
      const cashBtn=button('投資を記録','primary',recordCash);
      cashBtn.id='cashBtn';
      body.append(cashBtn);
      body.append(field('回収枚数',input('collectMedals','number','例 1417')));
      const collectBtn=button('回収を記録','secondary',recordCollect);
      collectBtn.id='collectBtn';
      body.append(collectBtn);
      const memo=document.createElement('textarea');
      memo.id='memoText';
      memo.maxLength=100;
      memo.placeholder='メモ（100文字まで）';
      body.append(memo);
      const memoBtn=button('メモを記録','secondary',recordMemo);
      memoBtn.id='memoBtn';
      body.append(memoBtn);
      const out=row();
      const exportBtn=button('JSONを表示','secondary',exportJson);
      exportBtn.id='exportBtn';
      const copyBtn=button('コピー','secondary',copyJson);
      copyBtn.id='copyJsonBtn';
      const downloadBtn=button('ファイル保存','secondary',downloadJson);
      downloadBtn.id='downloadJsonBtn';
      const resetBtn=button('リセット','danger',resetAll);
      resetBtn.id='resetBtn';
      out.append(exportBtn);
      out.append(copyBtn);
      out.append(downloadBtn);
      out.append(resetBtn);
      body.append(out);
      const exportBox=document.createElement('textarea');
      exportBox.id='exportBox';
      exportBox.className='export-box';
      exportBox.readOnly=true;
      exportBox.hidden=true;
      body.append(exportBox);
    });
  }
  function openSheet(title,build){
    $('sheetTitle').textContent=title;
    const body=$('sheetBody');
    clearNode(body);
    build(body);
    $('sheet').classList.add('open');
  }
  function closeSheet(){
    $('sheet').classList.remove('open');
    clearNode($('sheetBody'));
  }
  function openAdjustPanel(key){
    if(isBattleLocked()){toast(BATTLE_ADJUST_LOCK_TOAST);return;}
    adjustTarget=key;
    $('adjustPanel').hidden=false;
    $('adjustTitle').textContent=key==='realG'?'実G調整':'液晶G調整';
    $('adjustLabel').textContent=key==='realG'?'実ゲーム数':'液晶ゲーム数';
    syncAdjustPanel();
    $('adjustValue').focus();
    $('adjustValue').select();
  }
  function syncAdjustPanel(){
    if(!adjustTarget||!$('adjustPanel')||$('adjustPanel').hidden)return;
    const value=snapshot()[adjustTarget];
    const target=$('adjustValue');
    if(document.activeElement!==target)target.value=value==null?'':String(value);
  }
  function exportData(){
    return normalize(state);
  }
  function exportJsonText(){
    return JSON.stringify(exportData(),null,1);
  }
  function exportJson(){
    const box=$('exportBox')||document.createElement('textarea');
    box.hidden=false;
    box.value=exportJsonText();
    box.focus();
    box.select();
    toast('JSONを表示しました');
  }
  async function copyJson(){
    const text=exportJsonText();
    const box=$('exportBox');
    if(box){
      box.hidden=false;
      box.value=text;
    }
    try{
      await navigator.clipboard.writeText(text);
      toast('JSONをコピーしました');
    }catch(e){
      if(box){box.focus();box.select();}
      toast('コピーできませんでした。手動で選択してください');
    }
  }
  function exportFilename(date=new Date()){
    const pad=n=>String(n).padStart(2,'0');
    return `sf6-record_${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}.json`;
  }
  function downloadJson(){
    const blob=new Blob([exportJsonText()],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const filename=exportFilename();
    a.href=url;
    a.download=filename;
    a.dataset.lastFilename=filename;
    if($('downloadJsonBtn'))$('downloadJsonBtn').dataset.lastFilename=filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),0);
    toast('JSONファイルを保存しました');
  }
  function resetAll(){
    if(resetTimer){
      clearTimeout(resetTimer);
      resetTimer=null;
      state={machine:MACHINE,ver:VERSION,battleState:'normal',currentState:{realG:null,lcdG:null},logs:[]};
      stepHistory=[];
      undoStack=[];
      redoAction=null;
      localStorage.removeItem(STORAGE_KEY);
      closeSheet();
      render();
      toast('全記録をリセットしました');
      return;
    }
    toast('3秒以内にもう一度リセットで全削除');
    resetTimer=setTimeout(()=>{resetTimer=null;toast('リセットを解除しました');},3000);
  }
  function bind(){
    document.querySelectorAll('[data-adjust]').forEach(btn=>btn.addEventListener('click',()=>openAdjustPanel(btn.dataset.adjust)));
    $('adjustCloseBtn').addEventListener('click',()=>{$('adjustPanel').hidden=true;adjustTarget=null;});
    $('adjustValue').addEventListener('input',()=>setCurrentValue(adjustTarget,optionalGame($('adjustValue').value)));
    document.querySelectorAll('[data-adjust-step]').forEach(btn=>btn.addEventListener('click',()=>adjustCurrentValue(adjustTarget,Number(btn.dataset.adjustStep)||0)));
    document.querySelectorAll('[data-step]').forEach(btn=>btn.addEventListener('click',()=>stepBoth(Number(btn.dataset.step)||0)));
    $('stepUndoBtn').addEventListener('click',undoStep);
    $('undoBtn').addEventListener('click',undoLast);
    $('openUtilityBtn').addEventListener('click',openUtilitySheet);
    $('sheetCloseBtn').addEventListener('click',closeSheet);
    $('sheet').addEventListener('click',event=>{if(event.target===$('sheet'))closeSheet();});
    setInterval(()=>renderStatus(),30000);
  }
  load();
  bind();
  render();
  window.SF6RecordApp={normalize,fbThroughCount,positiveInt,optionalGame,nonnegativeInt,exportFilename,exportData,exportJsonText,STORAGE_KEY,MACHINE,VERSION};
})();
</script>
</body>
