<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lストリートファイター6 液晶G履歴入力｜スロット稼働ノート</title>
<meta name="description" content="Lストリートファイター6の液晶ゲーム数、実ゲーム数、DC加算、前兆、ファイターズバトル、メモを端末内に記録する実戦ログです。">
<link rel="canonical" href="https://slot-tools.jp/sf6-record.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="スロット稼働ノート">
<meta property="og:title" content="Lストリートファイター6 液晶G履歴入力｜スロット稼働ノート">
<meta property="og:description" content="実G、液晶G、DC終了時の合計加算、FB結果を端末内に記録します。判断ロジックは入れず、実記録に徹したPhase 1ツールです。">
<meta property="og:url" content="https://slot-tools.jp/sf6-record.html">
<style>
:root{
  --bg:#0c1110;
  --panel:#151b1a;
  --panel2:#1d2523;
  --ink:#eef5ee;
  --muted:#92a099;
  --line:#2a3632;
  --drive:#69d84f;
  --drive-dark:#20391e;
  --accent:#7ce6b0;
  --danger:#ff5d6c;
  --amber:#f0ba51;
  --blue:#62a8ff;
  --purple:#ba8cff;
  --pink:#ff7aa2;
  --memo:#c4e86b;
  --focus:#9af285;
  --red:#ff5d6c;
  --soft-green:#94d982;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  font-size:14px;
  line-height:1.45;
}
a{color:var(--accent);text-decoration:none}
button,input,textarea{font:inherit}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.shell{
  width:100%;
  max-width:640px;
  min-height:100dvh;
  margin:0 auto;
  padding:0 10px calc(18px + env(safe-area-inset-bottom));
}
.top{
  position:sticky;
  top:0;
  z-index:10;
  margin:0 -10px;
  padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
  background:linear-gradient(180deg,#122016,#0c1110);
  border-bottom:1px solid var(--line);
}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.head h1{font-size:15px;line-height:1.3;margin:0;font-weight:800}
.head small{display:block;color:var(--drive);font-size:10px;letter-spacing:.08em;margin-top:2px}
.head-link{flex:none;color:var(--muted);font-size:12px;padding:4px 0}
.status{display:flex;gap:6px}
.stat{
  flex:1 1 0;
  min-width:0;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:8px;
  padding:5px 2px;
  text-align:center;
  cursor:pointer;
}
.stat[aria-disabled="true"]{cursor:default;opacity:.78}
.stat span{display:block;color:var(--muted);font-size:10px;white-space:nowrap}
.stat b{display:block;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.section h2{font-size:13px;color:var(--drive);margin:0 0 10px}
.field-row{display:flex;gap:8px;align-items:center;margin:8px 0}
.field-row label{flex:1;color:var(--muted);font-size:12px}
.field-row input{
  width:128px;
  max-width:48%;
  border:1px solid var(--line);
  border-radius:8px;
  background:#0a0f0d;
  color:var(--ink);
  padding:10px 9px;
  font-size:18px;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.actions,.chips{display:flex;gap:8px;flex-wrap:wrap}
.actions{margin-top:10px}
.chips{margin:8px 0}
.step-actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 12px}
.step-actions .action{flex:1 1 58px;padding-left:6px;padding-right:6px}
.adjust-panel[hidden]{display:none!important}
.adjust-panel{margin:10px 0 12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.adjust-title{font-size:12px;color:var(--drive);font-weight:800;margin-bottom:8px}
.adjust-steps{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.adjust-steps .action{flex:1 1 58px;padding-left:6px;padding-right:6px}
.chip,.action{
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--panel2);
  color:var(--ink);
  padding:9px 12px;
  min-height:40px;
  cursor:pointer;
}
.chip{font-size:12px;font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--drive);background:var(--drive-dark);color:var(--drive)}
.chip.color-blue{color:var(--blue)}
.chip.color-red{color:var(--red)}
.chip.voice-hot{border-color:#633039;color:var(--danger)}
.chip.voice-hot[aria-pressed="true"]{background:#35171c;border-color:var(--danger);color:#fff}
.action{
  flex:1 1 130px;
  border-radius:8px;
  font-weight:800;
  background:var(--drive-dark);
  border-color:#315b2d;
  color:var(--drive);
}
.action.secondary{background:var(--panel2);color:var(--ink);border-color:var(--line)}
.action.danger{background:#32171b;color:var(--danger);border-color:#70313b}
.action.win{background:#1d3521;color:var(--drive);border-color:#3a6b35}
.action.lose{background:#33202a;color:var(--pink);border-color:#74344c}
.input-note{color:var(--muted);font-size:11px;margin:6px 0 0}
textarea{
  width:100%;
  min-height:72px;
  resize:vertical;
  border:1px solid var(--line);
  border-radius:8px;
  background:#0a0f0d;
  color:var(--ink);
  padding:10px;
}
.log-list{display:flex;flex-direction:column;gap:8px}
.log-item{
  display:flex;
  gap:8px;
  align-items:flex-start;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--panel2);
  padding:10px;
}
.tag{
  flex:none;
  min-width:62px;
  text-align:center;
  border-radius:999px;
  padding:4px 7px;
  font-size:11px;
  font-weight:800;
  color:#07100b;
}
.tag.gain{background:var(--drive)}
.tag.dcin{background:var(--soft-green)}
.tag.judge{background:var(--amber)}
.tag.in{background:var(--blue)}
.tag.stage{background:#3f75c8;color:#eef5ff}
.tag.out{background:var(--purple)}
.tag.gcolor{background:#d7e8ef}
.tag.fb{background:var(--pink)}
.tag.fbhit{background:#ffb4c8}
.tag.cash{background:#9fd37b}
.tag.collect{background:#87d8d0;color:#061110}
.tag.memo{background:var(--memo)}
.log-main{flex:1;min-width:0}
.log-text{font-size:13px;word-break:break-word}
.log-sub{font-size:11px;color:var(--muted);margin-top:3px}
.voice-mark{color:var(--danger);font-weight:800}
.red-mark{color:var(--red);font-weight:800}
.delete{
  flex:none;
  width:34px;
  height:34px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#121716;
  color:var(--muted);
  font-size:18px;
}
.empty{color:var(--muted);font-size:12px;padding:4px 0}
.export-box{
  width:100%;
  min-height:118px;
  margin-top:8px;
  font-size:12px;
  user-select:text;
  -webkit-user-select:text;
}
.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:30;
  max-width:calc(100vw - 28px);
  padding:10px 14px;
  border-radius:999px;
  background:var(--danger);
  color:#fff;
  font-weight:800;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s;
  box-shadow:0 10px 24px rgba(0,0,0,.4);
}
.toast.show{opacity:1}
@media (max-width:380px){
  .shell{padding-left:8px;padding-right:8px}
  .top{margin-left:-8px;margin-right:-8px;padding-left:8px;padding-right:8px}
  .section{padding:10px}
  .field-row input{width:112px}
  .chip{padding-left:10px;padding-right:10px}
  .tag{min-width:54px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="shell">
  <div class="top">
    <div class="head">
      <h1>Lストリートファイター6<small>LCD GAME LOG - Phase 1</small></h1>
      <a class="head-link" href="/">トップ</a>
    </div>
    <div class="status" aria-label="現在値">
      <button class="stat" type="button" id="statRealBtn" data-adjust="realG"><span>実G</span><b id="statReal">-</b></button>
      <button class="stat" type="button" id="statLcdBtn" data-adjust="lcdG"><span>液晶G</span><b id="statLcd">-</b></button>
      <div class="stat" aria-disabled="true"><span>FBスルー</span><b id="statThrough">0</b></div>
    </div>
  </div>

  <div class="step-actions" aria-label="通常消化">
    <button class="action secondary" type="button" data-step="1">+1</button>
    <button class="action secondary" type="button" data-step="3">+3</button>
    <button class="action secondary" type="button" data-step="5">+5</button>
    <button class="action secondary" type="button" data-step="10">+10</button>
    <button class="action secondary" type="button" id="stepUndoBtn">元に戻す</button>
  </div>

  <section class="adjust-panel" id="adjustPanel" aria-labelledby="adjustTitle" hidden>
    <div class="adjust-title" id="adjustTitle">G数調整</div>
    <div class="field-row">
      <label for="adjustValue" id="adjustLabel">現在値</label>
      <input id="adjustValue" type="number" inputmode="numeric" min="0" step="1" placeholder="未入力可">
    </div>
    <div class="adjust-steps">
      <button class="action secondary" type="button" data-adjust-step="-10">-10</button>
      <button class="action secondary" type="button" data-adjust-step="-1">-1</button>
      <button class="action secondary" type="button" data-adjust-step="1">+1</button>
      <button class="action secondary" type="button" data-adjust-step="10">+10</button>
    </div>
  </section>

  <section class="section" aria-labelledby="zenTitle">
    <h2 id="zenTitle">前兆</h2>
    <div class="actions">
      <button class="action secondary" type="button" data-zen="in">前兆 突入</button>
      <button class="action secondary" type="button" data-zen="stage">前兆ステージ突入</button>
      <button class="action secondary" type="button" data-zen="out">前兆 抜け</button>
    </div>
  </section>

  <section class="section" aria-labelledby="colorTitle">
    <h2 id="colorTitle">G数色変化</h2>
    <div class="chips" id="gColorKinds" aria-label="G数色"></div>
    <div class="actions">
      <button class="action secondary" type="button" id="gColorBtn">色変化を記録</button>
    </div>
  </section>

  <section class="section" aria-labelledby="gainTitle">
    <h2 id="gainTitle">ゲーム数加算</h2>
    <div class="actions">
      <button class="action secondary" type="button" id="dcInBtn">DC突入</button>
    </div>
    <div class="chips" id="gainKinds" aria-label="加算種別"></div>
    <div class="field-row">
      <label for="addG">加算G数</label>
      <input id="addG" type="number" inputmode="numeric" min="1" step="1" placeholder="例 120">
    </div>
    <div class="chips" id="voiceKinds" aria-label="DC終了時ボイス"></div>
    <p class="input-note">ジャッジ選択時はボイスを保存しません。</p>
    <div class="actions">
      <button class="action" type="button" id="gainBtn">加算を記録</button>
    </div>
  </section>

  <section class="section" aria-labelledby="fbTitle">
    <h2 id="fbTitle">ファイターズバトル</h2>
    <div class="actions">
      <button class="action secondary" type="button" id="fbHitBtn">FB当選</button>
    </div>
    <div class="field-row">
      <label for="opponentText">対戦相手</label>
      <input id="opponentText" type="text" maxlength="20" placeholder="任意">
    </div>
    <div id="fbLossFields" hidden>
      <div class="field-row">
        <label for="fbExitLcdG">抜け時液晶G</label>
        <input id="fbExitLcdG" type="number" inputmode="numeric" min="0" step="1" placeholder="敗北時必須">
      </div>
      <div class="chips" id="icatchKinds" aria-label="敗北時アイキャッチ"></div>
      <div class="field-row" id="icatchNoteRow" hidden>
        <label for="icatchNoteText">アイキャッチ</label>
        <input id="icatchNoteText" type="text" maxlength="20" placeholder="例 豪鬼">
      </div>
    </div>
    <div class="chips" id="bonusKinds" aria-label="ボーナス"></div>
    <div class="actions">
      <button class="action win" type="button" id="fbWinBtn">勝利</button>
      <button class="action lose" type="button" id="fbLoseBtn">敗北</button>
    </div>
  </section>

  <section class="section" aria-labelledby="cashTitle">
    <h2 id="cashTitle">投資 / 回収</h2>
    <div class="chips" id="cashKinds" aria-label="投資額"></div>
    <div class="actions">
      <button class="action secondary" type="button" id="cashBtn">投資を記録</button>
    </div>
    <div class="field-row">
      <label for="collectMedals">回収枚数</label>
      <input id="collectMedals" type="number" inputmode="numeric" min="1" step="1" placeholder="例 1417">
    </div>
    <div class="actions">
      <button class="action secondary" type="button" id="collectBtn">回収を記録</button>
    </div>
  </section>

  <section class="section" aria-labelledby="memoTitle">
    <h2 id="memoTitle">メモ</h2>
    <textarea id="memoText" maxlength="100" placeholder="100文字まで"></textarea>
    <div class="actions">
      <button class="action secondary" type="button" id="memoBtn">メモを記録</button>
    </div>
  </section>

  <section class="section" aria-labelledby="logTitle">
    <h2 id="logTitle">ログ一覧</h2>
    <div id="logList" class="log-list"></div>
  </section>

  <section class="section" aria-labelledby="dataTitle">
    <h2 id="dataTitle">データ出力 / リセット</h2>
    <div class="actions">
      <button class="action secondary" type="button" id="exportBtn">JSONを表示</button>
      <button class="action secondary" type="button" id="copyJsonBtn">コピー</button>
      <button class="action secondary" type="button" id="downloadJsonBtn">ファイル保存</button>
      <button class="action danger" type="button" id="resetBtn">リセット</button>
    </div>
    <textarea id="exportBox" class="export-box" readonly hidden></textarea>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="sf6-schema.js"></script>
<script>
(function(){
  'use strict';
  const STORAGE_KEY='sf6_record_v1';
  const MACHINE='L-SF6';
  const VERSION='3';
  const GAIN_KINDS=['DC-アタック','DC-ルーク','DC-春麗','DC-キャミィ','ジャッジ'];
  const VOICES=['ルーク','春麗','キャミィ','リュウ','ケン','キンバリー','ジェイミー','未確認'];
  const HOT_VOICES=new Set(['キンバリー','ジェイミー']);
  const G_COLORS=['青','赤','デフォ復帰'];
  const BONUSES=['赤7','青7'];
  const CASH_AMOUNTS=[1000,5000,10000];
  const ICATCHES=['ルーク（デフォ）','その他'];
  const $=id=>document.getElementById(id);
  let state={machine:MACHINE,ver:VERSION,currentState:{realG:null,lcdG:null},logs:[]};
  let selectedGainKind='';
  let selectedVoice=null;
  let selectedGColor=null;
  let selectedBonus=null;
  let selectedCashAmount=10000;
  let selectedIcatch=null;
  let adjustTarget=null;
  let stepHistory=[];
  let resetTimer=null;

  function positiveInt(value){
    const text=String(value??'').trim();
    if(!/^\d+$/.test(text))return null;
    const n=Number(text);
    return Number.isSafeInteger(n)&&n>0?n:null;
  }
  function nonnegativeInt(value){
    const text=String(value??'').trim();
    if(!/^\d+$/.test(text))return null;
    const n=Number(text);
    return Number.isSafeInteger(n)?n:null;
  }
  function optionalGame(value){
    const text=String(value??'').trim();
    if(text==='')return null;
    if(!/^\d+$/.test(text))return null;
    const n=Number(text);
    return Number.isSafeInteger(n)?n:null;
  }
  function snapshot(){
    const current=state.currentState||{};
    return {realG:current.realG==null?null:optionalGame(current.realG),lcdG:current.lcdG==null?null:optionalGame(current.lcdG)};
  }
  function normalizeCurrentState(value){
    return {realG:value?.realG==null?null:optionalGame(value.realG),lcdG:value?.lcdG==null?null:optionalGame(value.lcdG)};
  }
  function setCurrentValue(key,value){
    state.currentState=normalizeCurrentState(state.currentState);
    state.currentState[key]=value==null?null:optionalGame(value);
    save();
    renderStatus();
    syncAdjustPanel();
  }
  function adjustCurrentValue(key,delta){
    const current=snapshot()[key]??0;
    setCurrentValue(key,Math.max(0,current+delta));
  }
  function stepBoth(delta){
    const before=snapshot();
    const nextReal=(before.realG??0)+delta;
    const nextLcd=(before.lcdG??0)+delta;
    state.currentState={realG:nextReal,lcdG:nextLcd};
    stepHistory.push(before);
    if(stepHistory.length>10)stepHistory.shift();
    save();
    renderStatus();
    syncAdjustPanel();
  }
  function undoStep(){
    const prev=stepHistory.pop();
    if(!prev){toast('戻す通常消化がありません');return;}
    state.currentState={realG:prev.realG,lcdG:prev.lcdG};
    save();
    renderStatus();
    syncAdjustPanel();
    toast('通常消化を戻しました');
  }
  function nextId(){
    return state.logs.reduce((max,log)=>Math.max(max,Number(log.id)||0),0)+1;
  }
  function sanitizeLog(log){
    if(!log||typeof log!=='object')return null;
    const base={id:Number(log.id)||0,type:String(log.type||''),realG:log.realG==null?null:optionalGame(log.realG),lcdG:log.lcdG==null?null:optionalGame(log.lcdG),t:Number(log.t)||Date.now()};
    if(!base.id||!base.type)return null;
    if(base.type==='gain'){
      if(!GAIN_KINDS.includes(log.kind))return null;
      const addG=positiveInt(log.addG);
      if(!addG||base.lcdG===null)return null;
      return {...log,...base,kind:log.kind,addG,voice:log.kind==='ジャッジ'?null:(VOICES.includes(log.voice)?log.voice:null)};
    }
    if(base.type==='zenchou'){
      if(!['in','stage','out'].includes(log.dir)||base.lcdG===null)return null;
      return {...log,...base,dir:log.dir};
    }
    if(base.type==='gcolor'){
      if(!G_COLORS.includes(log.color)||base.lcdG===null)return null;
      return {...log,...base,color:log.color};
    }
    if(base.type==='dcin'||base.type==='fbhit'){
      if(base.lcdG===null)return null;
      return {...log,...base};
    }
    if(base.type==='fb'){
      const win=log.win===true;
      const hasRank=Object.prototype.hasOwnProperty.call(log,'rank');
      const rank=log.rank==null?null:(String(log.rank).trim().slice(0,20)||null);
      const opponent=String(log.opponent||'').trim().slice(0,20)||null;
      const kiteiG=log.kiteiG==null?null:nonnegativeInt(log.kiteiG);
      const icatch=!win&&ICATCHES.includes(log.icatch)?log.icatch:null;
      const icatchNote=!win&&icatch==='その他'?(String(log.icatchNote||'').trim().slice(0,20)||null):null;
      const fbLog={...log,...base,win,bonus:win&&BONUSES.includes(log.bonus)?log.bonus:null,opponent,kiteiG,icatch,icatchNote};
      if(hasRank)fbLog.rank=rank;
      return fbLog;
    }
    if(base.type==='cash'){
      const amount=positiveInt(log.amount);
      return amount?{...log,...base,amount}:null;
    }
    if(base.type==='collect'){
      const medals=positiveInt(log.medals);
      return medals?{...log,...base,medals}:null;
    }
    if(base.type==='memo'){
      const text=String(log.text||'').slice(0,100);
      return text?{...log,...base,text}:null;
    }
    return {...log,...base};
  }
  function normalize(data){
    const schemaNormalize=globalThis.normalizeSf6Export||window.normalizeSf6Export||((value)=>value);
    const normalized=schemaNormalize(data||{machine:MACHINE,ver:VERSION,currentState:{realG:null,lcdG:null},logs:[]});
    const logs=Array.isArray(normalized?.logs)?normalized.logs.map(sanitizeLog).filter(Boolean):[];
    const sourceVer=normalized&&Object.prototype.hasOwnProperty.call(normalized,'sourceVer')?normalized.sourceVer:VERSION;
    return {machine:MACHINE,ver:VERSION,sourceVer,currentState:normalizeCurrentState(normalized?.currentState),logs};
  }
  function save(){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){toast('保存に失敗しました');}
  }
  function load(){
    try{state=normalize(JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'));}catch(e){state={machine:MACHINE,ver:VERSION,currentState:{realG:null,lcdG:null},logs:[]};}
  }
  function toast(message){
    const el=$('toast');
    el.textContent=message;
    el.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer=setTimeout(()=>el.classList.remove('show'),1800);
  }
  function makeChip(label,pressed,hot){
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='chip'+(hot?' voice-hot':'');
    btn.textContent=label;
    btn.setAttribute('aria-pressed',pressed?'true':'false');
    return btn;
  }
  function colorChipClass(label){
    if(label==='青')return ' color-blue';
    if(label==='赤')return ' color-red';
    return '';
  }
  function renderChips(){
    const colors=$('gColorKinds');
    colors.textContent='';
    G_COLORS.forEach(label=>{
      const btn=makeChip(label,selectedGColor===label,false);
      btn.className+=colorChipClass(label);
      btn.addEventListener('click',()=>{selectedGColor=label;renderChips();});
      colors.appendChild(btn);
    });
    const gain=$('gainKinds');
    gain.textContent='';
    GAIN_KINDS.forEach(label=>{
      const btn=makeChip(label,selectedGainKind===label,false);
      btn.addEventListener('click',()=>{selectedGainKind=label;renderChips();});
      gain.appendChild(btn);
    });
    const voices=$('voiceKinds');
    voices.textContent='';
    VOICES.forEach(label=>{
      const btn=makeChip(label,selectedVoice===label,HOT_VOICES.has(label));
      btn.addEventListener('click',()=>{selectedVoice=selectedVoice===label?null:label;renderChips();});
      voices.appendChild(btn);
    });
    const bonuses=$('bonusKinds');
    bonuses.textContent='';
    BONUSES.forEach(label=>{
      const btn=makeChip(label,selectedBonus===label,false);
      btn.addEventListener('click',()=>{selectedBonus=selectedBonus===label?null:label;renderChips();});
      bonuses.appendChild(btn);
    });
    const cashes=$('cashKinds');
    cashes.textContent='';
    CASH_AMOUNTS.forEach(amount=>{
      const btn=makeChip(amount.toLocaleString(),selectedCashAmount===amount,false);
      btn.addEventListener('click',()=>{selectedCashAmount=amount;renderChips();});
      cashes.appendChild(btn);
    });
    const icatches=$('icatchKinds');
    icatches.textContent='';
    ICATCHES.forEach(label=>{
      const btn=makeChip(label,selectedIcatch===label,label==='その他');
      btn.addEventListener('click',()=>{selectedIcatch=selectedIcatch===label?null:label;renderChips();syncIcatchNote();});
      icatches.appendChild(btn);
    });
    syncIcatchNote();
  }
  function fbThroughCount(logs=state.logs){
    let count=0;
    for(let i=logs.length-1;i>=0;i--){
      const log=logs[i];
      if(log.type!=='fb')continue;
      if(log.win)return 0;
      count++;
    }
    return count;
  }
  function setText(parent,text,className){
    const el=document.createElement('span');
    if(className)el.className=className;
    el.textContent=text;
    parent.appendChild(el);
  }
  function logLabel(log){
    if(log.type==='gain')return log.kind==='ジャッジ'?'ジャッジ':'加算DC';
    if(log.type==='dcin')return 'DC-IN';
    if(log.type==='gcolor')return '色';
    if(log.type==='zenchou')return log.dir==='stage'?'WT':(log.dir==='in'?'前兆IN':'前兆OUT');
    if(log.type==='fbhit')return 'FB当選';
    if(log.type==='fb')return 'FB';
    if(log.type==='cash')return '投資';
    if(log.type==='collect')return '回収';
    if(log.type==='memo')return 'メモ';
    return '不明';
  }
  function tagClass(log){
    if(log.type==='gain')return log.kind==='ジャッジ'?'judge':'gain';
    if(log.type==='zenchou')return log.dir;
    if(['gain','dcin','gcolor','zenchou','fbhit','fb','cash','collect','memo'].includes(log.type))return log.type;
    return 'memo';
  }
  function fillLogText(el,log){
    if(log.type==='gain'){
      setText(el,`${log.kind} +${log.addG}G`);
      if(log.voice){
        setText(el,' / ボイス ');
        setText(el,log.voice,HOT_VOICES.has(log.voice)?'voice-mark':'');
      }
    }else if(log.type==='zenchou'){
      setText(el,log.dir==='stage'?'前兆ステージ突入':(log.dir==='in'?'前兆 突入':'前兆 抜け'));
    }else if(log.type==='gcolor'){
      setText(el,'色：');
      setText(el,log.color,log.color==='赤'?'red-mark':'');
    }else if(log.type==='dcin'){
      setText(el,'DC突入');
    }else if(log.type==='fbhit'){
      setText(el,'FB当選');
    }else if(log.type==='fb'){
      setText(el,`FB ${log.win?'勝利':'敗北'}`);
      if(log.rank||log.opponent)setText(el,` / ${[log.rank,log.opponent].filter(Boolean).join('／')}`);
      if(log.kiteiG!==null&&log.kiteiG!==undefined)setText(el,` / 規定${log.kiteiG}G`);
      if(log.icatch){
        setText(el,' / アイキャッチ ');
        setText(el,log.icatchNote?`${log.icatch}：${log.icatchNote}`:log.icatch,log.icatch==='その他'?'voice-mark':'');
      }
      if(log.bonus)setText(el,` / ${log.bonus}`);
    }else if(log.type==='cash'){
      setText(el,`投資 ${log.amount.toLocaleString()}円`);
    }else if(log.type==='collect'){
      setText(el,`回収 ${log.medals.toLocaleString()}枚`);
    }else if(log.type==='memo'){
      setText(el,log.text);
    }else{
      setText(el,`未対応: ${log.type}`);
    }
  }
  function gameSub(log){
    const lcd=log.lcdG==null?'液晶-':`液晶${log.lcdG}G`;
    const real=log.realG==null?'実-':`実${log.realG}G`;
    return `${lcd} / ${real}`;
  }
  function renderLogs(){
    const list=$('logList');
    list.textContent='';
    const logs=[...state.logs].sort((a,b)=>b.t-a.t||b.id-a.id);
    if(!logs.length){
      const empty=document.createElement('div');
      empty.className='empty';
      empty.textContent='まだ記録がありません';
      list.appendChild(empty);
      return;
    }
    logs.forEach(log=>{
      const row=document.createElement('div');
      row.className='log-item';
      const tag=document.createElement('div');
      tag.className=`tag ${tagClass(log)}`;
      tag.textContent=logLabel(log);
      const main=document.createElement('div');
      main.className='log-main';
      const text=document.createElement('div');
      text.className='log-text';
      fillLogText(text,log);
      const sub=document.createElement('div');
      sub.className='log-sub';
      sub.textContent=gameSub(log);
      main.append(text,sub);
      const del=document.createElement('button');
      del.type='button';
      del.className='delete';
      del.setAttribute('aria-label','この記録を削除');
      del.textContent='×';
      del.addEventListener('click',()=>deleteLog(log.id));
      row.append(tag,main,del);
      list.appendChild(row);
    });
  }
  function renderStatus(){
    const snap=snapshot();
    $('statReal').textContent=snap.realG==null?'-':String(snap.realG);
    $('statLcd').textContent=snap.lcdG==null?'-':String(snap.lcdG);
    $('statThrough').textContent=String(fbThroughCount());
  }
  function render(){
    renderChips();
    renderStatus();
    renderLogs();
  }
  function openAdjustPanel(key){
    adjustTarget=key;
    $('adjustPanel').hidden=false;
    $('adjustTitle').textContent=key==='realG'?'実G調整':'液晶G調整';
    $('adjustLabel').textContent=key==='realG'?'実ゲーム数':'液晶ゲーム数';
    syncAdjustPanel();
    $('adjustValue').focus();
    $('adjustValue').select();
  }
  function syncAdjustPanel(){
    if(!adjustTarget||!$('adjustPanel')||$('adjustPanel').hidden)return;
    const value=snapshot()[adjustTarget];
    const input=$('adjustValue');
    if(document.activeElement!==input)input.value=value==null?'':String(value);
  }
  function showFbLossFields(){
    $('fbLossFields').hidden=false;
    syncIcatchNote();
  }
  function hideFbLossFields(){
    $('fbLossFields').hidden=true;
    $('fbExitLcdG').value='';
    $('icatchNoteText').value='';
    selectedIcatch=null;
    syncIcatchNote();
    renderChips();
  }
  function syncIcatchNote(){
    const row=$('icatchNoteRow');
    if(row)row.hidden=selectedIcatch!=='その他';
  }
  function addLog(log){
    state.logs.push({...log,id:nextId(),t:Date.now()});
    save();
    render();
  }
  function recordZenchou(dir){
    const snap=snapshot();
    if(snap.lcdG===null){toast('液晶Gを入力してください');return;}
    addLog({type:'zenchou',dir,realG:snap.realG,lcdG:snap.lcdG});
    toast(dir==='stage'?'前兆ステージ突入を記録しました':(dir==='in'?'前兆突入を記録しました':'前兆抜けを記録しました'));
  }
  function recordGColor(){
    const snap=snapshot();
    if(snap.lcdG===null){toast('液晶Gを入力してください');return;}
    if(!selectedGColor){toast('色を選択してください');return;}
    addLog({type:'gcolor',color:selectedGColor,realG:snap.realG,lcdG:snap.lcdG});
    toast('色変化を記録しました');
  }
  function recordDcIn(){
    const snap=snapshot();
    if(snap.lcdG===null){toast('液晶Gを入力してください');return;}
    addLog({type:'dcin',realG:snap.realG,lcdG:snap.lcdG});
    toast('DC突入を記録しました');
  }
  function recordGain(){
    const snap=snapshot();
    const addG=positiveInt($('addG').value);
    if(!selectedGainKind){toast('加算種別を選択してください');return;}
    if(!addG){toast('加算G数を入力してください');return;}
    if(snap.lcdG===null){toast('液晶Gを入力してください');return;}
    const nextLcd=snap.lcdG+addG;
    state.currentState={realG:snap.realG,lcdG:nextLcd};
    addLog({type:'gain',kind:selectedGainKind,addG,voice:selectedGainKind==='ジャッジ'?null:selectedVoice,realG:snap.realG,lcdG:nextLcd});
    $('addG').value='';
    selectedVoice=null;
    render();
    toast('加算を記録しました');
  }
  function recordFb(win){
    const snap=snapshot();
    let exitLcdG=snap.lcdG;
    let recentHit=null;
    let kiteiG=null;
    let kiteiWarning=false;
    let icatch=null;
    let icatchNote=null;
    if(!win){
      showFbLossFields();
      exitLcdG=optionalGame($('fbExitLcdG').value);
      if(exitLcdG===null){toast('抜け時液晶Gを入力してください');return;}
      recentHit=latestFbHit();
      if(recentHit){
        const diff=recentHit.lcdG-exitLcdG;
        if(diff>=0)kiteiG=diff;
        else kiteiWarning=true;
      }
      icatch=ICATCHES.includes(selectedIcatch)?selectedIcatch:null;
      icatchNote=icatch==='その他'?($('icatchNoteText').value.trim().slice(0,20)||null):null;
      state.currentState=normalizeCurrentState({realG:snap.realG,lcdG:exitLcdG});
    }
    addLog({type:'fb',win,bonus:win?selectedBonus:null,opponent:$('opponentText').value.trim().slice(0,20)||null,kiteiG,icatch:win?null:icatch,icatchNote:win?null:icatchNote,realG:snap.realG,lcdG:exitLcdG});
    $('fbExitLcdG').value='';
    $('opponentText').value='';
    $('icatchNoteText').value='';
    selectedIcatch=null;
    selectedBonus=null;
    if(win)hideFbLossFields();
    render();
    toast(kiteiWarning?`${win?'FB勝利':'FB敗北'}を記録しました（規定Gは未保存）`:(win?'FB勝利を記録しました':'FB敗北を記録しました'));
  }
  function latestFbHit(){
    for(let i=state.logs.length-1;i>=0;i--){
      if(state.logs[i].type==='fbhit')return state.logs[i];
    }
    return null;
  }
  function recordFbHit(){
    const snap=snapshot();
    if(snap.lcdG===null){toast('液晶Gを入力してください');return;}
    addLog({type:'fbhit',realG:snap.realG,lcdG:snap.lcdG});
    toast('FB当選を記録しました');
  }
  function recordCash(){
    const amount=positiveInt(selectedCashAmount);
    if(!amount){toast('投資額を選択してください');return;}
    const snap=snapshot();
    addLog({type:'cash',amount,realG:snap.realG,lcdG:snap.lcdG});
    toast(`投資 ${amount.toLocaleString()}円を記録しました`);
  }
  function recordCollect(){
    const medals=positiveInt($('collectMedals').value);
    if(!medals){toast('回収枚数を入力してください');return;}
    const snap=snapshot();
    addLog({type:'collect',medals,realG:snap.realG,lcdG:snap.lcdG});
    $('collectMedals').value='';
    toast(`回収 ${medals.toLocaleString()}枚を記録しました`);
  }
  function recordMemo(){
    const input=$('memoText');
    const text=input.value.trim();
    if(!text){toast('メモを入力してください');return;}
    const snap=snapshot();
    addLog({type:'memo',text:text.slice(0,100),realG:snap.realG,lcdG:snap.lcdG});
    input.value='';
    toast('メモを記録しました');
  }
  function deleteLog(id){
    state.logs=state.logs.filter(log=>log.id!==id);
    save();
    render();
    toast('記録を削除しました');
  }
  function exportData(){
    return normalize(state);
  }
  function exportJsonText(){
    return JSON.stringify(exportData(),null,1);
  }
  function exportJson(){
    const box=$('exportBox');
    box.hidden=false;
    box.value=exportJsonText();
    box.focus();
    box.select();
    toast('JSONを出力しました');
  }
  async function copyJson(){
    const text=exportJsonText();
    $('exportBox').hidden=false;
    $('exportBox').value=text;
    try{
      await navigator.clipboard.writeText(text);
      toast('JSONをコピーしました');
    }catch(e){
      $('exportBox').focus();
      $('exportBox').select();
      toast('コピーできませんでした。手動で選択してください');
    }
  }
  function exportFilename(date=new Date()){
    const pad=n=>String(n).padStart(2,'0');
    return `sf6-record_${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}.json`;
  }
  function downloadJson(){
    const blob=new Blob([exportJsonText()],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const filename=exportFilename();
    a.href=url;
    a.download=filename;
    $('downloadJsonBtn').dataset.lastFilename=filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),0);
    toast('JSONファイルを保存しました');
  }
  function resetAll(){
    const btn=$('resetBtn');
    if(resetTimer){
      clearTimeout(resetTimer);
      resetTimer=null;
      state={machine:MACHINE,ver:VERSION,currentState:{realG:null,lcdG:null},logs:[]};
      stepHistory=[];
      localStorage.removeItem(STORAGE_KEY);
      $('exportBox').hidden=true;
      $('exportBox').value='';
      btn.textContent='リセット';
      render();
      toast('全記録をリセットしました');
      return;
    }
    btn.textContent='もう一度タップで全削除';
    toast('3秒以内にもう一度タップで全削除');
    resetTimer=setTimeout(()=>{
      resetTimer=null;
      btn.textContent='リセット';
      toast('リセットを解除しました');
    },3000);
  }
  function bind(){
    document.querySelectorAll('[data-adjust]').forEach(btn=>btn.addEventListener('click',()=>openAdjustPanel(btn.dataset.adjust)));
    $('adjustValue').addEventListener('input',()=>setCurrentValue(adjustTarget,optionalGame($('adjustValue').value)));
    document.querySelectorAll('[data-adjust-step]').forEach(btn=>btn.addEventListener('click',()=>adjustCurrentValue(adjustTarget,Number(btn.dataset.adjustStep)||0)));
    document.querySelectorAll('[data-step]').forEach(btn=>btn.addEventListener('click',()=>stepBoth(Number(btn.dataset.step)||0)));
    $('stepUndoBtn').addEventListener('click',undoStep);
    document.querySelectorAll('[data-zen]').forEach(btn=>btn.addEventListener('click',()=>recordZenchou(btn.dataset.zen)));
    $('gColorBtn').addEventListener('click',recordGColor);
    $('dcInBtn').addEventListener('click',recordDcIn);
    $('gainBtn').addEventListener('click',recordGain);
    $('fbHitBtn').addEventListener('click',recordFbHit);
    $('fbWinBtn').addEventListener('click',()=>recordFb(true));
    $('fbLoseBtn').addEventListener('click',()=>recordFb(false));
    $('cashBtn').addEventListener('click',recordCash);
    $('collectBtn').addEventListener('click',recordCollect);
    $('memoBtn').addEventListener('click',recordMemo);
    $('exportBtn').addEventListener('click',exportJson);
    $('copyJsonBtn').addEventListener('click',copyJson);
    $('downloadJsonBtn').addEventListener('click',downloadJson);
    $('resetBtn').addEventListener('click',resetAll);
  }
  load();
  bind();
  render();
  window.SF6RecordApp={normalize,fbThroughCount,positiveInt,optionalGame,nonnegativeInt,exportFilename,exportData,exportJsonText,STORAGE_KEY,MACHINE,VERSION};
})();
</script>
</body>
</html>
