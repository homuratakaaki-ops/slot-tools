<style>
:root{
  --bg:#0c1110;
  --surface:#151b1a;
  --surface2:#1d2523;
  --ink:#eef5ee;
  --muted:#92a099;
  --line:#2a3632;
  --drive:#69d84f;
  --drive-soft:#20391e;
  --accent:#7ce6b0;
  --danger:#ff5d6c;
  --amber:#f0ba51;
  --blue:#62a8ff;
  --purple:#ba8cff;
  --pink:#ff7aa2;
  --memo:#c4e86b;
  --focus:#9af285;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;
  min-height:100dvh;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  font-size:14px;
  line-height:1.45;
}
a{color:var(--accent);text-decoration:none}
button,input,textarea{font:inherit}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bm-overlay{
  position:fixed;
  inset:0;
  z-index:9000;
  background:var(--bg);
  color:var(--ink);
  padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
  overflow:auto;
}
.bm-shell{
  width:100%;
  max-width:480px;
  min-height:100%;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.bm-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  border-bottom:1px solid rgba(105,216,79,.28);
  padding:2px 0 7px;
}
.bm-title{min-width:0;font-size:13px;font-weight:900;color:var(--drive);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm-close{
  flex:none;
  width:48px;
  height:48px;
  border:1px solid rgba(105,216,79,.42);
  border-radius:8px;
  background:rgba(105,216,79,.08);
  color:var(--drive);
  font-size:22px;
  font-weight:900;
}
.state-badges{display:flex;gap:6px;flex-wrap:wrap;min-height:32px}
.state-badge{
  border:1px solid rgba(148,163,184,.35);
  border-radius:999px;
  background:rgba(148,163,184,.11);
  color:var(--muted);
  min-height:32px;
  padding:5px 10px;
  font-size:12px;
  font-weight:900;
}
.state-badge.active-normal{border-color:rgba(105,216,79,.52);background:rgba(105,216,79,.12);color:var(--drive)}
.state-badge.active-battle{border-color:rgba(255,93,108,.72);background:rgba(255,93,108,.14);color:#ffc2ca}
.counter-row,.money-row,.step-row,.button-row,.sheet-row,.choice-row{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}
.counter-btn{
  flex:1 1 0;
  min-width:0;
  min-height:64px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface);
  color:var(--ink);
  text-align:center;
  padding:7px 8px;
}
.counter-btn span{display:block;color:var(--muted);font-size:11px;font-weight:900}
.counter-btn b{display:block;color:var(--drive);font-size:24px;line-height:1.25;font-variant-numeric:tabular-nums}
.counter-btn.lcd-attention{animation:lcdPulse 1.1s ease-in-out infinite}
@keyframes lcdPulse{
  0%,100%{border-color:var(--line);box-shadow:none}
  50%{border-color:rgba(240,186,81,.95);box-shadow:0 0 0 2px rgba(240,186,81,.22) inset}
}
.money-pill{
  flex:1 1 110px;
  min-height:38px;
  border:1px solid rgba(105,216,79,.25);
  border-radius:8px;
  background:rgba(0,0,0,.14);
  color:var(--muted);
  padding:7px 9px;
  font-size:12px;
  font-weight:900;
  text-align:center;
}
.money-pill strong{color:var(--ink);font-variant-numeric:tabular-nums}
.money-pill.unset{border-color:rgba(255,93,108,.58);background:rgba(255,93,108,.13);cursor:pointer}
.money-pill.unset strong{color:var(--danger)}
.bm-btn,.chip{
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface2);
  color:var(--ink);
  min-height:52px;
  padding:8px 9px;
  font-weight:900;
  cursor:pointer;
  white-space:normal;
  overflow-wrap:anywhere;
}
.bm-btn{flex:1 1 92px;font-size:15px}
.bm-btn.small{flex:1 1 58px;min-height:48px}
.bm-btn.primary{border-color:#315b2d;background:var(--drive-soft);color:var(--drive)}
.bm-btn.secondary{border-color:var(--line);background:var(--surface2);color:var(--ink)}
.bm-btn.danger{border-color:#70313b;background:#32171b;color:var(--danger)}
.bm-btn.win{border-color:#3a6b35;background:#1d3521;color:var(--drive)}
.bm-btn.lose{border-color:#74344c;background:#33202a;color:var(--pink)}
.bm-btn.hot-text{color:var(--danger)}
.bm-btn.blue-text{color:var(--blue)}
.bm-btn.red-text{color:var(--danger)}
.bm-btn.gold-text{color:var(--amber)}
.bm-btn:disabled,.chip:disabled,.counter-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  filter:grayscale(.35);
}
.chip{
  flex:1 1 auto;
  min-height:42px;
  border-radius:999px;
  font-size:12px;
  padding:8px 11px;
}
.chip[aria-pressed="true"]{border-color:var(--drive);background:var(--drive-soft);color:var(--drive)}
.chip.hot{border-color:#633039;color:var(--danger)}
.chip.hot[aria-pressed="true"]{border-color:var(--danger);background:#35171c;color:#fff}
.chip.blue-text{color:var(--blue)}
.chip.green-text{color:var(--drive)}
.chip.red-text{color:var(--danger)}
.panel{
  border:1px solid rgba(105,216,79,.22);
  border-radius:8px;
  background:rgba(0,0,0,.12);
  padding:8px;
}
.panel-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;color:var(--drive);font-size:12px;font-weight:900}
.field-row{display:flex;align-items:center;gap:8px;margin:8px 0}
.field-row label{flex:1;color:var(--muted);font-size:12px;font-weight:900}
.field-row input,.field-row select{
  width:138px;
  max-width:54%;
  border:1px solid var(--line);
  border-radius:8px;
  background:#0a0f0d;
  color:var(--ink);
  padding:10px 9px;
  font-size:17px;
  font-variant-numeric:tabular-nums;
}
.field-row input{text-align:right}
.field-row input[type="text"]{text-align:left;font-size:15px}
.field-row select{font-size:15px}
textarea{
  width:100%;
  min-height:96px;
  resize:vertical;
  border:1px solid var(--line);
  border-radius:8px;
  background:#0a0f0d;
  color:var(--ink);
  padding:10px;
}
.recent,.undo-bar{
  border:1px solid rgba(105,216,79,.25);
  border-radius:8px;
  background:rgba(0,0,0,.16);
}
.recent{padding:7px 9px;min-height:40px;color:var(--muted);font-size:12px;overflow:hidden}
.recent-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.undo-bar{
  min-height:48px;
  color:var(--drive);
  background:rgba(105,216,79,.10);
  font-size:14px;
  font-weight:900;
  padding:9px 10px;
}
.undo-bar.disabled{opacity:.52;color:var(--muted);border-color:rgba(122,122,138,.35);background:rgba(122,122,138,.08)}
.bm-sheet{
  position:fixed;
  inset:0;
  z-index:9050;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.58);
}
.bm-sheet.open{display:flex}
.bm-sheet-panel{
  width:100%;
  max-width:480px;
  max-height:76dvh;
  overflow:auto;
  margin:0 auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-bottom:0;
  border-radius:14px 14px 0 0;
  padding:12px;
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sheet-title{font-size:14px;font-weight:900;color:var(--drive)}
.sheet-body{display:flex;flex-direction:column;gap:8px}
.export-box{min-height:130px;font-size:12px;user-select:text;-webkit-user-select:text}
.toast{
  position:fixed;
  left:50%;
  top:72px;
  transform:translateX(-50%);
  z-index:12000;
  display:none;
  max-width:calc(100vw - 22px);
  border:1px solid rgba(105,216,79,.45);
  border-radius:999px;
  background:rgba(20,20,24,.95);
  color:var(--drive);
  font-size:16px;
  font-weight:900;
  padding:12px 18px;
  box-shadow:0 8px 22px rgba(0,0,0,.35);
  text-align:center;
}
.toast.show{display:block}
.tag{
  display:inline-block;
  min-width:60px;
  text-align:center;
  border-radius:999px;
  padding:3px 7px;
  margin-right:5px;
  font-size:11px;
  font-weight:900;
  color:#07100b;
}
.tag.gain{background:var(--drive)}
.tag.dcin{background:#94d982}
.tag.judge{background:var(--amber)}
.tag.in{background:var(--blue)}
.tag.stage{background:#3f75c8;color:#eef5ff}
.tag.out{background:var(--purple)}
.tag.gcolor{background:#d7e8ef}
.tag.stage_sel{background:#8ecf9e;color:#07100b}
.tag.rare{background:#f0d27b;color:#161006}
.tag.fb{background:var(--pink)}
.tag.fbhit{background:#ffb4c8}
.tag.continue{background:#f7a7b7;color:#16070b}
.tag.money{background:#c7d7ff;color:#071024}
.tag.cash{background:#9fd37b}
.tag.collect{background:#87d8d0;color:#061110}
.tag.memo{background:var(--memo)}
.voice-mark,.red-mark{color:var(--danger);font-weight:900}
.muted{color:var(--muted)}
@media (max-width:380px){
  .bm-shell{gap:6px}
  .bm-btn{flex-basis:76px;padding-left:6px;padding-right:6px;font-size:14px}
  .bm-btn.small{flex-basis:52px}
  .field-row input,.field-row select{width:118px}
  .chip{padding-left:9px;padding-right:9px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<main class="bm-overlay" id="battleModeOverlay">
  <div class="bm-shell">
    <header class="bm-header">
      <div class="bm-title">Lストリートファイター6 / 実戦記録</div>
      <a class="bm-close" href="/" aria-label="トップへ">×</a>
    </header>

    <div class="state-badges" id="stateBadges"></div>

    <section class="counter-row" aria-label="現在G数">
      <button class="counter-btn" type="button" id="realCounterBtn" data-adjust="realG"><span>実G</span><b id="realCounter">-</b></button>
      <button class="counter-btn" type="button" id="lcdCounterBtn" data-adjust="lcdG"><span>液晶G</span><b id="lcdCounter">-</b></button>
    </section>

    <section class="money-row" aria-label="投資回収">
      <div class="money-pill" id="moneyInvestPill">投資 <strong id="cashTotal">0円</strong></div>
      <div class="money-pill" id="moneyDiffPill">差枚 <strong id="diffTotal">-</strong></div>
      <div class="money-pill">FBスルー <strong id="throughCount">0</strong></div>
    </section>

    <section class="button-row" aria-label="収支操作">
      <button class="bm-btn small danger" type="button" id="moneyLoanBtn">−1000</button>
      <button class="bm-btn small secondary" type="button" id="moneyDepositBtn">入金</button>
      <button class="bm-btn small secondary" type="button" id="moneyCreditBtn">クレジット入力</button>
    </section>

    <section class="step-row" aria-label="通常消化">
      <button class="bm-btn small secondary" type="button" data-step="1">+1</button>
      <button class="bm-btn small secondary" type="button" data-step="3">+3</button>
      <button class="bm-btn small secondary" type="button" data-step="5">+5</button>
      <button class="bm-btn small secondary" type="button" data-step="10">+10</button>
      <button class="bm-btn small secondary" type="button" id="stepUndoBtn">元に戻す</button>
    </section>

    <section class="panel" id="adjustPanel" hidden>
      <div class="panel-title"><span id="adjustTitle">G数調整</span><button class="bm-btn small secondary" type="button" id="adjustCloseBtn">閉じる</button></div>
      <div class="field-row">
        <label for="adjustValue" id="adjustLabel">現在値</label>
        <input id="adjustValue" type="number" inputmode="numeric" min="0" step="1" placeholder="未入力可">
      </div>
      <div class="button-row">
        <button class="bm-btn small secondary" type="button" data-adjust-step="-10">-10</button>
        <button class="bm-btn small secondary" type="button" data-adjust-step="-1">-1</button>
        <button class="bm-btn small secondary" type="button" data-adjust-step="1">+1</button>
        <button class="bm-btn small secondary" type="button" data-adjust-step="10">+10</button>
      </div>
    </section>

    <section id="modeGrid" class="panel"></section>
    <section id="recentLog" class="recent" aria-label="直近ログ"></section>
    <button class="undo-bar disabled" id="undoBtn" type="button">直前の記録はありません</button>
    <button class="bm-btn secondary" type="button" id="openUtilityBtn">投資・回収・メモ・出力</button>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="bm-sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="bm-sheet-panel">
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle">入力</div>
      <button class="bm-btn small secondary" type="button" id="sheetCloseBtn">閉じる</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  const STORAGE_KEY='sf6_record_v1';
  const MACHINE='L-SF6';
  const MACHINE_ID='l-sf6';
  const VERSION='7';
  const PAYLOAD_VERSION='2.2';
  const GAIN_KINDS=['DC-アタック','DC-ルーク','DC-春麗','DC-キャミィ','ジャッジ'];
  const VOICES=['ルーク','春麗','キャミィ','リュウ','ケン','キンバリー','ジェイミー','未確認'];
  const HOT_VOICES=new Set(['キンバリー','ジェイミー']);
  const G_COLORS=['青','赤','デフォ復帰'];
  const DEFAULT_RETURN_COLOR=G_COLORS[2];
  const STAGE_CHOICES=['ジェイミー','キャミィ','春麗','ルーク'];
  const RARE_KINDS=['スイカ','弱チェリー','チャンス目','強チェリー'];
  const BONUSES=['赤7','青7'];
  const RANKS=['ルーキー','ブロンズ','シルバー','ゴールド','レジェンド'];
  const RANK_RATE_LABELS=[['ルーキー','50%'],['ブロンズ','60%'],['シルバー','70%'],['ゴールド','80%'],['レジェンド','88%']];
  const ROUND_STARTS=['青','緑','味方全員集合','敵全員集合'];
  const ROUND_START_LABELS=[['青','青（デフォ）','blue-default'],['緑','緑（上位キャラ）','green-upper'],['味方全員集合','味方全員集合','ally-all'],['敵全員集合','敵全員集合','enemy-all']];
  const OPPONENTS=['マリーザ','ガイル','マノン','ジュリ','JP','リュウ'];
  const END_SCREENS=['基本画面','男性ファイター集合','女性ファイター集合','ケン&JP','リュウ','ルーク&ジェイミー','全員集合','エンタライオン'];
  const CONTINUES=[{key:'none',label:'なし'},{key:'success',label:'成功'},{key:'fail',label:'失敗'}];
  const CASH_AMOUNTS=[1000,5000,10000];
  const MONEY_OPS=['init','deposit','loan','creditUpdate','mochidama','saipurei','diffSync','collectEnd'];
  const DEFAULT_LOAN_RATE=50;
  const ICATCHES=['ルーク','春麗','キンバリー','キャミィ','JP','ジェイミー','豪鬼','リュウ'];
  const BATTLE_STEP_LOCK_TOAST='FB中は通常消化を操作できません';
  const BATTLE_ADJUST_LOCK_TOAST='FB中はG数調整を操作できません';
  const $=id=>document.getElementById(id);
  const txt=(text)=>document.createTextNode(String(text??''));
  let state={machine:MACHINE,ver:VERSION,sessionId:null,startedAt:null,sessionInfo:{storeName:null,unitNo:null,lendRate:null,exchangeRate:null,memo:''},battleState:'normal',currentState:{realG:null,lcdG:null},initialThrough:0,sessionMoney:null,logs:[]};
  let selectedGainKind='';
  let selectedVoice=null;
  let gainAddDraft='';
  let selectedBonus=null;
  let selectedRank=null;
  let selectedRoundStart=null;
  let selectedCashAmount=10000;
  let selectedIcatch=null;
  let selectedContinue='none';
  let winSheetDraft={bonusMedals:'',endScreen:''};
  let lossSheetDraft={exitLcdG:'',exitRealG:'',exitCredit:''};
  let adjustTarget=null;
  let stepHistory=[];
  let undoStack=[];
  let redoAction=null;
  let resetTimer=null;
  let initialMoneyPromptShown=false;
  let lastLcdTouchedAt=Date.now();
  let lcdLogCountAtTouch=0;

  function positiveInt(value){
    const text=String(value??'').trim();
    if(!/^\d+$/.test(text))return null;
    const n=Number(text);
    return Number.isSafeInteger(n)&&n>0?n:null;
  }
  function positiveNumber(value){
    const text=String(value??'').trim();
    if(!/^\d+(?:\.\d+)?$/.test(text))return null;
    const n=Number(text);
    return Number.isFinite(n)&&n>0?n:null;
  }
  function optionalNumber(value){
    const text=String(value??'').trim();
    if(text==='')return null;
    if(!/^\d+(?:\.\d+)?$/.test(text))return null;
    const n=Number(text);
    return Number.isFinite(n)&&n>0?n:null;
  }
  function nonnegativeInt(value){
    const text=String(value??'').trim();
    if(!/^\d+$/.test(text))return null;
    const n=Number(text);
    return Number.isSafeInteger(n)?n:null;
  }
  function optionalGame(value){
    const text=String(value??'').trim();
    if(text==='')return null;
    if(!/^\d+$/.test(text))return null;
    const n=Number(text);
    return Number.isSafeInteger(n)?n:null;
  }
  function normalizeBattleState(value){
    return value==='battle'?'battle':'normal';
  }
  function normalizeCurrentState(value){
    return {realG:value?.realG==null?null:optionalGame(value.realG),lcdG:value?.lcdG==null?null:optionalGame(value.lcdG)};
  }
  function signedInt(value){
    const text=String(value??'').trim();
    if(text==='')return null;
    if(!/^-?\d+$/.test(text))return null;
    const n=Number(text);
    return Number.isSafeInteger(n)?n:null;
  }
  function moneyNumber(value,defaultValue=0){
    const n=signedInt(value);
    return n===null?defaultValue:n;
  }
  function uuidV4(){
    if(globalThis.crypto&&typeof globalThis.crypto.randomUUID==='function')return globalThis.crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
      const r=Math.random()*16|0;
      const v=c==='x'?r:(r&0x3|0x8);
      return v.toString(16);
    });
  }
  function isoWithOffset(date=new Date()){
    const d=date instanceof Date?date:new Date(date);
    const pad=(value,size=2)=>String(Math.trunc(Math.abs(value))).padStart(size,'0');
    const offset=-d.getTimezoneOffset();
    const sign=offset>=0?'+':'-';
    const hours=Math.trunc(Math.abs(offset)/60);
    const minutes=Math.abs(offset)%60;
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${sign}${pad(hours)}:${pad(minutes)}`;
  }
  function isoFromLogTime(value){
    const n=Number(value);
    return Number.isFinite(n)&&n>0?isoWithOffset(new Date(n)):isoWithOffset();
  }
  function normalizeSessionInfo(value){
    const src=value&&typeof value==='object'?value:{};
    const textOrNull=v=>{
      const text=String(v??'').trim();
      return text?text:null;
    };
    return {
      storeName:textOrNull(src.storeName),
      unitNo:textOrNull(src.unitNo),
      lendRate:optionalNumber(src.lendRate),
      exchangeRate:optionalNumber(src.exchangeRate),
      memo:String(src.memo??'')
    };
  }
  function defaultState(){
    return {machine:MACHINE,ver:VERSION,sessionId:uuidV4(),startedAt:isoWithOffset(),sessionInfo:normalizeSessionInfo({}),battleState:'normal',currentState:{realG:null,lcdG:null},initialThrough:0,sessionMoney:null,logs:[]};
  }

  function sanitizeLog(log){
    if(!log||typeof log!=='object')return null;
    const base={id:Number(log.id)||0,type:String(log.type||''),realG:log.realG==null?null:optionalGame(log.realG),lcdG:log.lcdG==null?null:optionalGame(log.lcdG),t:Number(log.t)||Date.now()};

      if(!GAIN_KINDS.includes(log.kind))return null;
      const addG=positiveInt(log.addG);
      if(!addG||base.lcdG===null)return null;
      return {...log,...base,kind:log.kind,addG,voice:log.kind==='ジャッジ'?null:(VOICES.includes(log.voice)?log.voice:null)};
    }
    if(base.type==='zenchou'){
      if(!['in','stage','out'].includes(log.dir)||base.lcdG===null)return null;
      return {...log,...base,dir:log.dir};
    }
    if(base.type==='gcolor'){
      if(!G_COLORS.includes(log.color)||base.lcdG===null)return null;
      return {...log,...base,color:log.color};
    }
    if(base.type==='stage_sel'){
      if(!STAGE_CHOICES.includes(log.stage)||base.lcdG===null)return null;
      return {...log,...base,stage:log.stage};
    }
    if(base.type==='rare'){
      if(!RARE_KINDS.includes(log.kind)||base.lcdG===null)return null;
      return {...log,...base,kind:log.kind};
    }
    if(base.type==='dcin'||base.type==='fbhit'){
      if(base.lcdG===null)return null;
      return {...log,...base};
    }
    if(base.type==='continue'){
      return {...log,...base,result:log.result==='success'?'success':'success'};
    }
    if(base.type==='money'){
      if(!MONEY_OPS.includes(log.op))return null;

      return {...log,...base,op:log.op,amount,after};
    }
    if(base.type==='fb'){
      const win=log.win===true;
      const rank=log.rank==null?null:(String(log.rank).trim().slice(0,20)||null);
      const roundStart=log.roundStart==null?null:(String(log.roundStart).trim().slice(0,20)||null);
      const opponent=String(log.opponent||'').trim().slice(0,20)||null;
      const kiteiG=log.kiteiG==null?null:nonnegativeInt(log.kiteiG);
      const knownLegacyIcatch=['ルーク（デフォ）','その他'];
      const icatchValue=String(log.icatch||'').trim();
      const icatch=!win&&(ICATCHES.includes(icatchValue)||knownLegacyIcatch.includes(icatchValue))?icatchValue:null;
      const icatchNote=!win&&Object.prototype.hasOwnProperty.call(log,'icatchNote')?(String(log.icatchNote||'').trim().slice(0,20)||null):null;
      const bonusMedals=log.bonusMedals==null?null:positiveInt(log.bonusMedals);
      const endScreen=log.endScreen==null?null:(String(log.endScreen).trim().slice(0,30)||null);
      const cont=['none','success','fail'].includes(log.continue)?log.continue:null;
      const exitRealG=log.exitRealG==null?null:optionalGame(log.exitRealG);
      return {...log,...base,win,bonus:win&&BONUSES.includes(log.bonus)?log.bonus:null,rank,roundStart,opponent,kiteiG,icatch,icatchNote,bonusMedals:win?bonusMedals:null,endScreen:win?endScreen:null,continue:win?null:cont,exitRealG:win?null:exitRealG};
    }
    if(base.type==='cash'){
      const amount=positiveInt(log.amount);
      return amount?{...log,...base,amount}:null;
    }
    if(base.type==='collect'){
      const medals=positiveInt(log.medals);
      return medals?{...log,...base,medals}:null;
    }
    if(base.type==='memo'){

  function recordLossFromSheet(){
    syncLossSheetDraft();
    const snap=snapshot();
    if(selectedContinue==='success'){recordContinueSuccess();return;}
    const exitLcdG=optionalGame(lossSheetDraft.exitLcdG);
    if(exitLcdG===null){toast('抜け時液晶Gを入力してください');return;}
    const exitRealG=optionalGame(lossSheetDraft.exitRealG);
    if(exitRealG===null){toast('抜け時実Gを入力してください');return;}
    const creditRaw=String(lossSheetDraft.exitCredit||'').trim();
    const exitCredit=creditRaw===''?null:optionalGame(creditRaw);
    if(creditRaw!==''&&exitCredit===null){toast('クレジットを数値で入力してください');return;}
    if(exitCredit!==null&&!moneyInitialized()){toast('クレジット入力には初期登録が必要です');openMoneyInitSheet();return;}
    let kiteiG=null;
    let warning=false;
    const recentHit=latestFbHit();
    if(recentHit){
      const diff=recentHit.lcdG-exitLcdG;
      if(diff>=0)kiteiG=diff;
      else warning=true;
    }
    const icatch=ICATCHES.includes(selectedIcatch)?selectedIcatch:null;
    const start=fbStartDraft();
    const cont=selectedContinue==='fail'?'fail':'none';
    commit('FB敗北',()=>{
      state.currentState={realG:exitRealG,lcdG:exitLcdG};
      if(exitCredit!==null){
        const next=normalizeSessionMoney({...currentMoney(),credit:exitCredit});
        state.sessionMoney=next;
        addLogDirect({type:'money',op:'creditUpdate',amount:exitCredit,after:moneyAfterSummary(next),realG:exitRealG,lcdG:exitLcdG});
      }
      addLogDirect({type:'fb',win:false,bonus:null,bonusMedals:null,endScreen:null,rank:start.rank,roundStart:start.roundStart,opponent:start.opponent,kiteiG,icatch,icatchNote:null,continue:cont,exitRealG,realG:exitRealG,lcdG:exitLcdG});
      state.battleState='normal';
    },{toast:warning?'FB敗北を記録しました（規定Gは未保存）':'FB敗北を記録しました',lcdTouched:true});
    clearBattleDrafts();
    closeSheet();

  function tagClass(log){
    if(log.type==='gain')return log.kind==='ジャッジ'?'judge':'gain';
    if(log.type==='zenchou')return log.dir;

  function logLabel(log){
    if(log.type==='gain')return log.kind==='ジャッジ'?'ジャッジ':'加算DC';
    if(log.type==='dcin')return 'DC-IN';
    if(log.type==='gcolor')return '色';
    if(log.type==='stage_sel')return 'ステージ';
    if(log.type==='rare')return 'レア役';
    if(log.type==='zenchou')return log.dir==='stage'?'WT':(log.dir==='in'?'前兆IN':'前兆OUT');
    if(log.type==='fbhit')return 'FB当選';
    if(log.type==='fb')return 'FB';
    if(log.type==='continue')return '継続';
    if(log.type==='money')return '収支';
    if(log.type==='cash')return '投資';
    if(log.type==='collect')return '回収';
    if(log.type==='memo')return 'メモ';
    return '不明';
  }
  function logTextPlain(log){
    if(log.type==='gain')return `${log.kind} +${log.addG}G${log.voice?` / ボイス ${log.voice}`:''}`;
    if(log.type==='zenchou')return log.dir==='stage'?'前兆ステージ突入':(log.dir==='in'?'前兆突入':'前兆抜け');
    if(log.type==='gcolor')return `色：${log.color}`;
    if(log.type==='stage_sel')return `ステージ：${log.stage}`;
    if(log.type==='rare')return `レア役：${log.kind}`;
    if(log.type==='dcin')return 'DC突入';
    if(log.type==='fbhit')return 'FB当選';
    if(log.type==='continue')return 'コンティニュー成功';
    if(log.type==='fb'){
      const parts=[`FB ${log.win?'勝利':'敗北'}`];
      if(log.rank||log.roundStart||log.opponent)parts.push([log.rank,log.roundStart,log.opponent].filter(Boolean).join('／'));
      if(!log.win&&log.continue)parts.push(`コンティニュー ${CONTINUES.find(item=>item.key===log.continue)?.label||log.continue}`);
      if(log.kiteiG!==null&&log.kiteiG!==undefined)parts.push(`規定${log.kiteiG}G`);
      if(log.icatch)parts.push(`アイキャッチ ${log.icatchNote?`${log.icatch}：${log.icatchNote}`:log.icatch}`);
      if(log.bonus)parts.push(log.bonus);
      if(log.bonusMedals)parts.push(`${log.bonusMedals}枚`);
      if(log.endScreen)parts.push(`終了画面 ${log.endScreen}`);
      return parts.join(' / ');
    }
    if(log.type==='money'){
      const labels={init:'初期登録',deposit:'入金',loan:'−1000',creditUpdate:'クレジット入力',mochidama:'持ちメダル',saipurei:'再プレ',diffSync:'差枚一致',collectEnd:'終了回収'};
      const amount=log.amount==null?'':` ${Number(log.amount).toLocaleString()}${['deposit','loan'].includes(log.op)?'円':'枚'}`;
      const after=log.after?` / 投資${Number(log.after.investedYen||0).toLocaleString()}円 / 残高${Number(log.after.sandBalance||0).toLocaleString()}円 / 差枚${diffText(intervalDiffValue(log.after))}`:'';
      return `${labels[log.op]||log.op}${amount}${after}`;
    }
    if(log.type==='cash')return `投資 ${log.amount.toLocaleString()}円`;
    if(log.type==='collect')return `回収 ${log.medals.toLocaleString()}枚`;
    if(log.type==='memo')return log.text;
    return `未対応 ${log.type}`;
  }
  function gameSub(log){
    const lcd=log.lcdG==null?'液晶-':`液晶${log.lcdG}G`;
    const real=log.realG==null?'実-':`実${log.realG}G`;
    return `${lcd} / ${real}`;
  }
  function setText(el,text,className){

  function fillLogText(el,log){
    if(log.type==='gcolor'){
      setText(el,'色：');
      setText(el,log.color,log.color==='赤'?'red-mark':'');
      return;
    }
    if(log.type==='stage_sel'){
      setText(el,'ステージ：');
      setText(el,log.stage,log.stage==='ジェイミー'?'voice-mark':'');
      return;
    }
    if(log.type==='rare'){
      setText(el,`レア役：${log.kind}`,log.kind==='強チェリー'?'voice-mark':'');
      return;
    }
    if(log.type==='gain'){
      setText(el,`${log.kind} +${log.addG}G`);
      if(log.voice){
        setText(el,' / ボイス ');
        setText(el,log.voice,HOT_VOICES.has(log.voice)?'voice-mark':'');
      }
      return;
    }
    if(log.type==='fb'&&log.icatch){
      setText(el,logTextPlain({...log,icatch:null,icatchNote:null}));
      setText(el,' / アイキャッチ ');
      setText(el,log.icatchNote?`${log.icatch}：${log.icatchNote}`:log.icatch,log.icatch!=='ルーク'&&log.icatch!=='ルーク（デフォ）'?'voice-mark':'');
      return;
    }
    if(log.type==='memo'){
      setText(el,log.text);
      return;
    }
    setText(el,logTextPlain(log));
  }

        choices.id='icatchKinds';
        ICATCHES.forEach(label=>{
          const cls=label==='ルーク'?'':(label==='リュウ'||label==='豪鬼'||label==='キンバリー'?'hot':'');
          choices.append(chip(label,selectedIcatch===label,()=>{syncLossSheetDraft();selectedIcatch=selectedIcatch===label?null:label;openLossSheet();},cls));
        });
        body.append(el('div','muted','アイキャッチ（任意）'));
        body.append(choices);
      }
      const actions=row();
      actions.append(button(selectedContinue==='success'?'成功を記録':'敗北を確定',selectedContinue==='success'?'win':'lose',recordLossFromSheet));
      body.append(actions);
    });
  }
  function openMemoSheet(){
    openSheet('メモ',body=>{
      const memo=document.createElement('textarea');
      memo.id='memoText';
      memo.maxLength=100;
      memo.placeholder='メモ（100文字まで）';
      body.append(memo);
      const memoBtn=button('メモを記録','secondary',recordMemo);
      memoBtn.id='memoBtn';
      body.append(memoBtn);
    });
  }
  function openMoneyInitSheet(edit=false){
    openSheet('初期登録',body=>{
      const m=currentMoney();
      const locked=moneyInitialized()&&!edit;
      const startCredit=input('moneyStartCredit','number','例 10000');
      startCredit.value=m.startCredit??'';
      const startMochidama=input('moneyStartMochidama','number','例 500');
      startMochidama.value=m.startMochidama??'';
      const startSaipurei=input('moneyStartSaipurei','number','例 0');
      startSaipurei.value=m.startSaipurei??'';
      const loanRate=input('moneyLoanRate','number','50');
      loanRate.step='0.1';
      loanRate.value=m.loanRate||DEFAULT_LOAN_RATE;
      const initialDiff=input('moneyInitialDiff','text','例 -800');
      initialDiff.inputMode='numeric';
      initialDiff.value=m.initialDiff??'';
      const initialThrough=input('initialThroughInput','number','0');
      initialThrough.value=state.initialThrough??0;
      [startCredit,startMochidama,startSaipurei,loanRate,initialDiff,initialThrough].forEach(node=>{node.disabled=locked;});
      if(locked)body.append(el('div','muted','初期設定はロック中です。修正する場合だけ編集を押してください。'));
      body.append(field('現金残高',startCredit));
      body.append(field('持ちメダル',startMochidama));
      body.append(field('再プレイ',startSaipurei));
      body.append(field('貸出レート',loanRate));
      body.append(field('初期差枚',initialDiff));
      body.append(field('FBスルー初期値',initialThrough));
      const actions=row();
      if(locked)actions.append(button('編集','secondary',()=>openMoneyInitSheet(true)));
      else actions.append(button(moneyInitialized()?'初期登録を修正':'初期登録を保存','primary',recordMoneyInit));
      body.append(actions);
    });
  }
  function openMoneyDepositSheet(){
    if(!ensureMoneyForOperation())return;
    openSheet('入金',body=>{
      const choices=row('choice-row');
      CASH_AMOUNTS.forEach(amount=>choices.append(chip(`+${amount.toLocaleString()}円`,false,()=>recordMoneyDeposit(amount))));
      body.append(choices);
      const direct=input('moneyDepositAmount','number','直接入力');
      body.append(field('入金額',direct));
      body.append(button('入金を記録','primary',()=>recordMoneyDeposit($('moneyDepositAmount')?.value)));
    });
  }
  function openMoneyCreditSheet(){
    if(!ensureMoneyForOperation())return;
    openSheet('クレジット入力',body=>{
      body.append(field('現在クレジット',input('moneyCreditValue','number','枚数')));
      body.append(button('クレジットを入力','primary',recordMoneyCreditUpdate));
    });
  }
  function openMoneyMedalUseSheet(){
    if(!ensureMoneyForOperation())return;
    openSheet('持ちメダル・再プレイ投入',body=>{
      const quick=row('choice-row');
      [50,100,500].forEach(amount=>quick.append(chip(`${amount}枚`,false,()=>{$('moneyMedalUse').value=String(amount);})));
      body.append(quick);
      body.append(field('使用枚数',input('moneyMedalUse','number','例 50')));
      const actions=row();
      actions.append(button('持ちメダル投入','secondary',()=>recordMoneyMedalUse('mochidama')));
      actions.append(button('再プレイ投入','secondary',()=>recordMoneyMedalUse('saipurei')));
      body.append(actions);
    });
  }
  function openMoneyDiffSyncSheet(){
    if(!ensureMoneyForOperation())return;
    openSheet('差枚一致',body=>{
      const now=intervalDiffValue();
      body.append(el('div','muted',`現在推定：${diffText(now)}`));
      const inputNode=input('moneyDiffSyncValue','text','実機の差枚');
      inputNode.inputMode='numeric';
      body.append(field('実機差枚',inputNode));
      body.append(button('差枚を一致','primary',recordMoneyDiffSync));
    });
  }
  function renderMoneySummaryInSheet(){
    const box=$('moneySummaryBox');
    if(!box)return;
    clearNode(box);
    const m=currentMoney();
    const s=moneySummary(m);
    const info=normalizeSessionInfo(state.sessionInfo);
    const balance=finalBalanceYen(m.investedYen,m.collectMedals,info.exchangeRate);
    box.append(el('div','muted',`現金投資 ${m.investedYen.toLocaleString()}円 / 持ちメダル ${m.usedMochidama.toLocaleString()}枚 / 再プレ ${m.usedSaipurei.toLocaleString()}枚`));
    box.append(el('div','muted',`回収 ${s.collect.toLocaleString()}枚 / クレ ${s.credit.toLocaleString()}枚 / メダル収支 ${diffText(s.medalDiff)}`));
    box.append(el('div','muted',`円換算 ${s.yenDiff.toLocaleString()}円（貸出レートによる等価換算）`));
    box.append(el('div','muted',info.exchangeRate?`交換率${info.exchangeRate}枚: 最終収支 ${formatYen(balance)}`:'交換率未入力: 円換算なし'));
  }
  function openMoneyCollectSheet(){
    if(!ensureMoneyForOperation())return;
    openSheet('終了・回収',body=>{
      const inputNode=input('moneyCollectMedals','number','流し枚数');
      inputNode.value=currentMoney().collectMedals??'';
      body.append(field('回収メダル',inputNode));
      body.append(button('回収を記録','primary',recordMoneyCollectEnd));
      const box=el('div','panel');
      box.id='moneySummaryBox';
      body.append(box);
      renderMoneySummaryInSheet();
    });
  }
  function openSessionInfoSheet(){
    openSheet('セッション情報',body=>{
      const info=normalizeSessionInfo(state.sessionInfo);
      const money=normalizeSessionMoney(state.sessionMoney);
      const storeName=input('sessionStoreName','text','店舗名',40);
      storeName.value=info.storeName||'';
      const unitNo=input('sessionUnitNo','text','台番号',20);
      unitNo.value=info.unitNo||'';
      const lendRate=input('sessionLendRate','number','46');
      lendRate.step='0.1';
      lendRate.value=info.lendRate??(money?money.loanRate:'');
      const exchangeRate=input('sessionExchangeRate','number','52');
      exchangeRate.step='0.1';
      exchangeRate.value=info.exchangeRate??'';
      const memo=document.createElement('textarea');
      memo.id='sessionMemo';
      memo.maxLength=500;
      memo.placeholder='セッション全体メモ';
      memo.value=info.memo||'';
      body.append(field('店舗名',storeName));
      body.append(field('台番号',unitNo));
      body.append(field('貸出レート',lendRate));
      body.append(field('交換レート',exchangeRate));
      body.append(memo);
      body.append(button('セッション情報を保存','primary',recordSessionInfo));
    });
  }
  function recordSessionInfo(){
    const next=normalizeSessionInfo({
      storeName:$('sessionStoreName')?.value,
      unitNo:$('sessionUnitNo')?.value,
      lendRate:$('sessionLendRate')?.value,
      exchangeRate:$('sessionExchangeRate')?.value,
      memo:$('sessionMemo')?.value
    });
    const lendRaw=String($('sessionLendRate')?.value||'').trim();
    const exchangeRaw=String($('sessionExchangeRate')?.value||'').trim();
    if(lendRaw!==''&&next.lendRate===null){toast('貸出レートを数値で入力してください');return;}
    if(exchangeRaw!==''&&next.exchangeRate===null){toast('交換レートを数値で入力してください');return;}
    state.sessionInfo=next;
    save();
    render();
    closeSheet();
    toast('セッション情報を保存しました');
  }
  function openUtilitySheet(){
    openSheet('収支・メモ・出力',body=>{
      const moneyActions=row();
      moneyActions.append(button('初期登録','secondary',openMoneyInitSheet));
      moneyActions.append(button('持ちメダル/再プレ','secondary',openMoneyMedalUseSheet));
      moneyActions.append(button('差枚一致','secondary',openMoneyDiffSyncSheet));
      moneyActions.append(button('終了・回収','secondary',openMoneyCollectSheet));
      moneyActions.append(button('セッション情報','secondary',openSessionInfoSheet));
      body.append(moneyActions);
      const memo=document.createElement('textarea');
      memo.id='memoText';
      memo.maxLength=100;
      memo.placeholder='メモ（100文字まで）';
      body.append(memo);
      const memoBtn=button('メモを記録','secondary',recordMemo);
      memoBtn.id='memoBtn';
      body.append(memoBtn);
      const out=row();
      const exportBtn=button('JSONを表示','secondary',exportJson);
      exportBtn.id='exportBtn';
      const copyBtn=button('コピー','secondary',copyJson);
      copyBtn.id='copyJsonBtn';
      const downloadBtn=button('ファイル保存','secondary',downloadJson);
      downloadBtn.id='downloadJsonBtn';
      const resetBtn=button('リセット','danger',resetAll);
      resetBtn.id='resetBtn';
      out.append(exportBtn);
      out.append(copyBtn);
      out.append(downloadBtn);
      out.append(resetBtn);
      body.append(out);
      const exportBox=document.createElement('textarea');
      exportBox.id='exportBox';
      exportBox.className='export-box';
      exportBox.readOnly=true;
      exportBox.hidden=true;
      body.append(exportBox);
    });
  }
  function openSheet(title,build){
    $('sheetTitle').textContent=title;
    const body=$('sheetBody');
    clearNode(body);
    build(body);
    $('sheet').classList.add('open');
  }
  function closeSheet(){
    $('sheet').classList.remove('open');
    clearNode($('sheetBody'));
  }
  function openAdjustPanel(key){
    if(isBattleLocked()){toast(BATTLE_ADJUST_LOCK_TOAST);return;}
    adjustTarget=key;
    $('adjustPanel').hidden=false;
    $('adjustTitle').textContent=key==='realG'?'実G調整':'液晶G調整';
    $('adjustLabel').textContent=key==='realG'?'実ゲーム数':'液晶ゲーム数';
    syncAdjustPanel();
    $('adjustValue').focus();
    $('adjustValue').select();
  }
  function syncAdjustPanel(){
    if(!adjustTarget||!$('adjustPanel')||$('adjustPanel').hidden)return;
    const value=snapshot()[adjustTarget];
    const target=$('adjustValue');
    if(document.activeElement!==target)target.value=value==null?'':String(value);
  }
  function exportData(){
    state=normalize(state);
    save();
    return exportEnvelope();
  }
  function exportJsonText(){
    return JSON.stringify(exportData(),null,1);
  }
  function exportJson(){
    const box=$('exportBox')||document.createElement('textarea');
    box.hidden=false;
    box.value=exportJsonText();
    box.focus();
    box.select();
    toast('JSONを表示しました');
  }
  async function copyJson(){
    const text=exportJsonText();
    const box=$('exportBox');
    if(box){
      box.hidden=false;
      box.value=text;
    }
    try{
      await navigator.clipboard.writeText(text);
      toast('JSONをコピーしました');
    }catch(e){
      if(box){box.focus();box.select();}
      toast('コピーできませんでした。手動で選択してください');
    }
  }
  function exportFilename(date=new Date()){
    const pad=n=>String(n).padStart(2,'0');
    return `sf6-record_${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}.json`;
  }
  function downloadJson(){
    const blob=new Blob([exportJsonText()],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const filename=exportFilename();
    a.href=url;
    a.download=filename;
    a.dataset.lastFilename=filename;
    if($('downloadJsonBtn'))$('downloadJsonBtn').dataset.lastFilename=filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),0);
    toast('JSONファイルを保存しました');
  }
  function resetAll(){
    if(resetTimer){
      clearTimeout(resetTimer);
      resetTimer=null;
      state=defaultState();
      initialMoneyPromptShown=false;
      stepHistory=[];
      undoStack=[];
      redoAction=null;
      localStorage.removeItem(STORAGE_KEY);
      closeSheet();
      render();
      toast('全記録をリセットしました');
      return;
    }
    toast('3秒以内にもう一度リセットで全削除');
    resetTimer=setTimeout(()=>{resetTimer=null;toast('リセットを解除しました');},3000);
  }
  function bind(){
    document.querySelectorAll('[data-adjust]').forEach(btn=>btn.addEventListener('click',()=>openAdjustPanel(btn.dataset.adjust)));
    $('adjustCloseBtn').addEventListener('click',()=>{$('adjustPanel').hidden=true;adjustTarget=null;});
    $('adjustValue').addEventListener('input',()=>setCurrentValue(adjustTarget,optionalGame($('adjustValue').value)));
    document.querySelectorAll('[data-adjust-step]').forEach(btn=>btn.addEventListener('click',()=>adjustCurrentValue(adjustTarget,Number(btn.dataset.adjustStep)||0)));
    document.querySelectorAll('[data-step]').forEach(btn=>btn.addEventListener('click',()=>stepBoth(Number(btn.dataset.step)||0)));
    $('stepUndoBtn').addEventListener('click',undoStep);
    $('moneyLoanBtn').addEventListener('click',recordMoneyLoan);
    $('moneyDepositBtn').addEventListener('click',openMoneyDepositSheet);
    $('moneyCreditBtn').addEventListener('click',openMoneyCreditSheet);
    $('moneyInvestPill').addEventListener('click',()=>{if(!moneyInitialized())openMoneyInitSheet();});
    $('moneyDiffPill').addEventListener('click',()=>{if(!moneyInitialized())openMoneyInitSheet();});
    $('undoBtn').addEventListener('click',undoLast);
    $('openUtilityBtn').addEventListener('click',openUtilitySheet);
    $('sheetCloseBtn').addEventListener('click',closeSheet);
    $('sheet').addEventListener('click',event=>{if(event.target===$('sheet'))closeSheet();});
    setInterval(()=>renderStatus(),30000);
  }
  load();
  bind();
  render();
  maybePromptInitialMoney();
  window.SF6RecordApp={normalize,fbThroughCount,positiveInt,positiveNumber,optionalGame,nonnegativeInt,normalizeSessionMoney,intervalDiffValue,moneySummary,recoveryYen,finalBalanceYen,exportEnvelope,exportFilename,exportData,exportJsonText,STORAGE_KEY,MACHINE,MACHINE_ID,VERSION,PAYLOAD_VERSION};
})();
</script>
</body>
</html>
