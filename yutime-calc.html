<script>
  (() => {
    "use strict";

    // S11: 1Rあたりの実質出玉（玉/R）の既定値。当選あたりの玉数ではない。
    const DEFAULT_NET_BALLS_PER_ROUND = 140;

const YUTIME_EXPECTATION_ENGINE = (() => {
      const preset = {
        id: "umi-sp5",
        name: "P大海物語5スペシャル",
        spec: {
          hitProb: 0.00312891,
          hitProbLabel: "1/319.6",
          tenjo: 950,
          // counterOffset は「データカウンター表示 − 内部低確回転数」。
          // 入力された回転数はカウンター基準なので、エンジンへ渡す前にこの値を引く。
          counterOffset: 0,
          yutimeJitan: 350,
          kakuhenRate: 0.54,
          jitanNormal: 100,
          jitanChain: 200,
          jitanRule: "確変中・通常時の通常当り→時短100 / 時短中(遊タイム含む)の通常当り→時短200",
          // S11: 当選1回あたりの平均R数。R構成は10R単発なので standardPayout 1400 ÷ standardRounds 10 = 140玉/R、
          // 当選あたり1,400玉 ÷ 140玉/R = 10R。新しい推定は足さず既存のR構成の重みをそのまま使う。
          averageRoundsPerWin: 10
        },
        defaults: {
          // S11: netBallsPerWin は「1Rあたりの実質出玉（玉/R）」。当選あたりの玉数ではない。
          netBallsPerWin: DEFAULT_NET_BALLS_PER_ROUND,
          jitanNormalBallsPerSpin: 0,
          jitanFastBallsPerSpin: 0,
          yutimeBallsPerSpin: -0.3,
          densapoDelta: 0,
          spinsPerHour: 250,
          secPerHit: 120,
          secPerDensapoSpin: 6,
          slotGamesPerHour: 800,
          yenPerBall: 4,
          holdSpins: 5
        }
      };
      const agnesPreset = {
        id: "agnes-pe",
        name: "PA大海物語Withアグネス・ラムPE",
        spec: {
          hitProbLow: 1 / 99.9,
          hitProbHigh: 1 / 19.5,
          tenjo: 239,
          // カウンター250回転で遊タイム突入。内部低確は239回転なので差は11。
          counterOffset: 11,
          stSpins: 10,
          yutimeJitan: 10000,
          modelType: "st-certain",
          jitanTable: [{ spins: 90, share: 0.04 }, { spins: 40, share: 0.66 }, { spins: 15, share: 0.30 }],
          // S11: 当選1回あたりの平均R数。R構成は 4R/6R/10R いずれも108玉/R（standardPayout 648 ÷ standardRounds 6）で、
          // 当選あたり587.5玉 ÷ 108玉/R ＝ 5.44R。R構成の重みは既存の値をそのまま使い、新しい推定は足さない。
          averageRoundsPerWin: 587.5 / 108
        },
        defaults: {
          // S11: netBallsPerWin は「1Rあたりの実質出玉（玉/R）」。当選あたりの玉数ではない。
          netBallsPerWin: 108,
          jitanNormalBallsPerSpin: -0.8,
          jitanFastBallsPerSpin: 0,
          yutimeBallsPerSpin: -0.8,
          densapoDelta: -0.8,
          spinsPerHour: 250,
          secPerHit: 120,
          secPerDensapoSpin: 6,
          slotGamesPerHour: 800,
          yenPerBall: 4,
          holdSpins: 5
        }
      };
      const presetOverrides = {
        [agnesPreset.id]: agnesPreset
      };
      function activePresetFor(input = {}, settings = {}) {
        const id = settings.presetId || input.presetId || preset.id;
        return presetOverrides[id] || preset;
      }
      function rebound(prob, spins) {
        return 1 - Math.pow(1 - prob, spins);
      }
      function finiteExpectedSpins(prob, limit) {
        return rebound(prob, limit) / prob;
      }
      function normalInvestmentSplit(prob, spinsToTenjo, ballsPerSpin, availableBalls) {
        const available = Math.max(0, Number(availableBalls) || 0);
        const totalBalls = finiteExpectedSpins(prob, spinsToTenjo) * ballsPerSpin;
        if (spinsToTenjo <= 0 || available <= 0) return { mochidamaBalls: 0, cashBalls: totalBalls };
        let mochidamaBalls = 0;
        let missProb = 1;
        for (let spin = 1; spin <= spinsToTenjo; spin += 1) {
          const endBalls = Math.min(spin * ballsPerSpin, available);
          mochidamaBalls += missProb * prob * endBalls;
          missProb *= 1 - prob;
        }
        mochidamaBalls += missProb * Math.min(spinsToTenjo * ballsPerSpin, available);
        return {
          mochidamaBalls,
          cashBalls: Math.max(0, totalBalls - mochidamaBalls)
        };
      }
      function stCertainValues(activePreset, holdSpins = 0) {
        const spec = activePreset.spec;
        const pLow = spec.hitProbLow;
        const pHigh = spec.hitProbHigh;
        const hold = Math.max(0, Number(holdSpins) || 0);
        const pST = rebound(pHigh, spec.stSpins);
        const missedSt = 1 - pST;
        // 引き戻しは「時短L＋残保留」で判定する（残保留も玉代ゼロで抽選を受ける）
        const weightedJitanHit = spec.jitanTable.reduce((sum, row) => sum + row.share * rebound(pLow, row.spins + hold), 0);
        const continuation = pST + missedSt * weightedJitanHit;
        const expectedWins = 1 / (1 - continuation);
        const stSupportSpins = finiteExpectedSpins(pHigh, spec.stSpins);
        // 電サポとして数える回転は時短枠のみ。残保留は電サポではないので別枠にする
        const jitanSupportSpins = spec.jitanTable.reduce((sum, row) => sum + row.share * finiteExpectedSpins(pLow, row.spins), 0);
        const supportSpinsPerWin = stSupportSpins + missedSt * jitanSupportSpins;
        const holdSpinsPerWin = hold > 0
          ? missedSt * spec.jitanTable.reduce((sum, row) => sum + row.share * Math.pow(1 - pLow, row.spins) * finiteExpectedSpins(pLow, hold), 0)
          : 0;
        return { pST, continuation, expectedWins, supportSpinsPerWin, holdSpinsPerWin };
      }
      function calculateStCertain(activePreset, input, settings = {}) {
        const merged = { ...activePreset.defaults, ...settings };
        const p = activePreset.spec.hitProbLow;
        const currentSpin = Math.max(0, Number(input.currentSpin) || 0);
        const spinsToTenjo = Math.max(0, activePreset.spec.tenjo - currentSpin);
        const rate = Number(input.rotationRate) || 0;
        if (rate <= 0) return null;
        const chains = stCertainValues(activePreset, merged.holdSpins);
        const pHit = rebound(p, spinsToTenjo);
        const pReach = Math.pow(1 - p, spinsToTenjo);
        const expectedNormalSpins = pHit / p;
        const expectedWins = chains.expectedWins;
        const expectedJitanNormalSpins = 0;
        const expectedJitanFastSpins = expectedWins * chains.supportSpinsPerWin;
        const expectedYutimeSpins = pReach * (1 / p);
        const expectedHoldSpins = expectedWins * (chains.holdSpinsPerWin || 0);
        const expectedDensapoSpins = expectedJitanNormalSpins + expectedJitanFastSpins + expectedYutimeSpins;
        const investBalls = expectedNormalSpins * 250 / rate;
        const split = normalInvestmentSplit(p, spinsToTenjo, 250 / rate, input.availableBalls);
        // S11: netBallsPerWin は玉/R。当選あたりの出玉は 玉/R × 当選1回あたりの平均R数。
        const netBallsPerWinTotal = merged.netBallsPerWin * activePreset.spec.averageRoundsPerWin;
        const winBalls = expectedWins * netBallsPerWinTotal + expectedJitanNormalSpins * merged.jitanNormalBallsPerSpin + expectedJitanFastSpins * merged.jitanFastBallsPerSpin + expectedYutimeSpins * merged.yutimeBallsPerSpin;
        const evBalls = winBalls - investBalls;
        const mochidamaCostYen = split.mochidamaBalls * merged.yenPerBall;
        const cashSpentYen = split.cashBalls / 250 * 1000;
        const normalCostYen = mochidamaCostYen + cashSpentYen;
        const winBallsYen = winBalls * merged.yenPerBall;
        const evYen = winBallsYen - normalCostYen;
        // 残保留は玉代ゼロ・電サポ外だが、時間は通常時速で計上する
        const normalHours = (expectedNormalSpins + expectedHoldSpins) / merged.spinsPerHour;
        const hitHours = expectedWins * merged.secPerHit / 3600;
        const densapoHours = expectedDensapoSpins * merged.secPerDensapoSpin / 3600;
        const totalHours = normalHours + hitHours + densapoHours;
        const hourlyYen = totalHours > 0 ? evYen / totalHours : 0;
        const slotRate = 100 + hourlyYen / (merged.slotGamesPerHour * 3 * 20 * 0.01);
        return { presetId: activePreset.id, currentSpin, spinsToTenjo, rotationRate: rate, pHit, pReach, expectedNormalSpins, expectedWins, expectedJitanNormalSpins, expectedJitanFastSpins, expectedYutimeSpins, expectedHoldSpins, expectedDensapoSpins, investBalls, mochidamaBalls: split.mochidamaBalls, cashBalls: split.cashBalls, mochidamaCostYen, cashSpentYen, normalCostYen, winBalls, evBalls, winBallsYen, evYen, normalHours, hitHours, densapoHours, totalHours, hourlyYen, slotRate, spinsPerHour: merged.spinsPerHour, secPerDensapoSpin: merged.secPerDensapoSpin, chains };
      }
      function chainValues(settings = {}) {
        const spec = preset.spec;
        const p = spec.hitProb;
        const kaku = spec.kakuhenRate;
        const normal = 1 - kaku;
        const hold = Math.max(0, Number(settings.holdSpins) || 0);
        // 引き戻し・駆け抜け判定は「時短枠＋残保留」で見る
        const r100 = rebound(p, spec.jitanNormal + hold);
        const r200 = rebound(p, spec.jitanChain + hold);
        const r350 = rebound(p, spec.yutimeJitan + hold);
        const a = 1 - kaku;
        const b = -normal * r100;
        const c = -kaku;
        const d = 1 - normal * r200;
        const det = a * d - b * c;
        const wInit = (d - b) / det;
        const jitanHit = (a - c) / det;
        const s100 = finiteExpectedSpins(p, spec.jitanNormal);
        const s200 = finiteExpectedSpins(p, spec.jitanChain);
        const dA = 1 - kaku;
        const dB = -normal * r100;
        const dC = -kaku;
        const dD = 1 - normal * r200;
        const dDet = dA * dD - dB * dC;
        const dRightE = normal * s100;
        const dRightJ = normal * s200;
        const densapoInit = (dRightE * dD - dB * dRightJ) / dDet;
        const densapoJitanHit = (dA * dRightJ - dRightE * dC) / dDet;
        const normalRightE = normal * s100;
        const normalRightJ = 0;
        const fastRightE = 0;
        const fastRightJ = normal * s200;
        const jitanNormalInit = (normalRightE * dD - dB * normalRightJ) / dDet;
        const jitanNormalJitanHit = (dA * normalRightJ - normalRightE * dC) / dDet;
        const jitanFastInit = (fastRightE * dD - dB * fastRightJ) / dDet;
        const jitanFastJitanHit = (dA * fastRightJ - fastRightE * dC) / dDet;
        // 残保留の消化回転（電サポ外・玉代ゼロ）。時短枠を抜けたときだけ回る
        const holdPerJitan = hold > 0 ? finiteExpectedSpins(p, hold) : 0;
        const holdRightE = normal * Math.pow(1 - p, spec.jitanNormal) * holdPerJitan;
        const holdRightJ = normal * Math.pow(1 - p, spec.jitanChain) * holdPerJitan;
        const holdInit = (holdRightE * dD - dB * holdRightJ) / dDet;
        const holdJitanHit = (dA * holdRightJ - holdRightE * dC) / dDet;
        return { r100, r200, r350, wInit, jitanHit, yutimeWins: r350 * jitanHit, densapoInit, densapoJitanHit, jitanNormalInit, jitanNormalJitanHit, jitanFastInit, jitanFastJitanHit, holdInit, holdJitanHit, holdPerJitan, settings };
      }
      function calculate(input, settings = {}) {
        const activePreset = activePresetFor(input, settings);
        if (activePreset.spec?.modelType === "st-certain") return calculateStCertain(activePreset, input, settings);
        const merged = { ...preset.defaults, ...settings };
        const p = preset.spec.hitProb;
        const currentSpin = Math.max(0, Number(input.currentSpin) || 0);
        const spinsToTenjo = Math.max(0, preset.spec.tenjo - currentSpin);
        const rate = Number(input.rotationRate) || 0;
        if (rate <= 0) return null;
        const chains = chainValues(merged);
        const pHit = rebound(p, spinsToTenjo);
        const pReach = Math.pow(1 - p, spinsToTenjo);
        const expectedNormalSpins = pHit / p;
        const expectedWins = pHit * chains.wInit + pReach * chains.yutimeWins;
        const yutimeDensapoBeforeHit = finiteExpectedSpins(p, preset.spec.yutimeJitan);
        const expectedJitanNormalSpins = pHit * chains.jitanNormalInit + pReach * chains.r350 * chains.jitanNormalJitanHit;
        const expectedJitanFastSpins = pHit * chains.jitanFastInit + pReach * chains.r350 * chains.jitanFastJitanHit;
        const expectedYutimeSpins = pReach * yutimeDensapoBeforeHit;
        const holdAfterYutime = pReach * Math.pow(1 - p, preset.spec.yutimeJitan) * chains.holdPerJitan;
        const expectedHoldSpins = pHit * chains.holdInit + pReach * chains.r350 * chains.holdJitanHit + holdAfterYutime;
        const expectedDensapoSpins = expectedJitanNormalSpins + expectedJitanFastSpins + expectedYutimeSpins;
        const investBalls = expectedNormalSpins * 250 / rate;
        const split = normalInvestmentSplit(p, spinsToTenjo, 250 / rate, input.availableBalls);
        // S11: netBallsPerWin は玉/R。当選あたりの出玉は 玉/R × 当選1回あたりの平均R数。
        const netBallsPerWinTotal = merged.netBallsPerWin * preset.spec.averageRoundsPerWin;
        const winBalls = expectedWins * netBallsPerWinTotal + expectedJitanNormalSpins * merged.jitanNormalBallsPerSpin + expectedJitanFastSpins * merged.jitanFastBallsPerSpin + expectedYutimeSpins * merged.yutimeBallsPerSpin;
        const evBalls = winBalls - investBalls;
        const mochidamaCostYen = split.mochidamaBalls * merged.yenPerBall;
        const cashSpentYen = split.cashBalls / 250 * 1000;
        const normalCostYen = mochidamaCostYen + cashSpentYen;
        const winBallsYen = winBalls * merged.yenPerBall;
        const evYen = winBallsYen - normalCostYen;
        // 残保留は玉代ゼロ・電サポ外だが、時間は通常時速で計上する
        const normalHours = (expectedNormalSpins + expectedHoldSpins) / merged.spinsPerHour;
        const hitHours = expectedWins * merged.secPerHit / 3600;
        const densapoHours = expectedDensapoSpins * merged.secPerDensapoSpin / 3600;
        const totalHours = normalHours + hitHours + densapoHours;
        const hourlyYen = totalHours > 0 ? evYen / totalHours : 0;
        const slotRate = 100 + hourlyYen / (merged.slotGamesPerHour * 3 * 20 * 0.01);
        return { currentSpin, spinsToTenjo, rotationRate: rate, pHit, pReach, expectedNormalSpins, expectedWins, expectedJitanNormalSpins, expectedJitanFastSpins, expectedYutimeSpins, expectedHoldSpins, expectedDensapoSpins, investBalls, mochidamaBalls: split.mochidamaBalls, cashBalls: split.cashBalls, mochidamaCostYen, cashSpentYen, normalCostYen, winBalls, evBalls, winBallsYen, evYen, normalHours, hitHours, densapoHours, totalHours, hourlyYen, slotRate, spinsPerHour: merged.spinsPerHour, secPerDensapoSpin: merged.secPerDensapoSpin, chains };
      }
      function logRate(log) {
        const balls = Number(log.usedBalls ?? log.balls) || 0;
        const spins = Number(log.normalSpin ?? log.spins) || 0;
        return balls > 0 ? spins / (balls / 250) : 0;
      }
      return { preset, presets: { ...presetOverrides, [preset.id]: preset }, rebound, finiteExpectedSpins, normalInvestmentSplit, stCertainValues, chainValues, calculate, logRate };
    })();
    window.YutimeExpectationEngine = YUTIME_EXPECTATION_ENGINE;

    const HOURLY_THRESHOLD_YEN = 2400;
    const MOCHIDAMA_AVAILABLE_BALLS = 999999;
    const EXCHANGE_OPTIONS = [
      { balls: 25, label: "等価(25玉)" },
      { balls: 28, label: "28玉" },
      { balls: 30, label: "30玉" },
      { balls: 33, label: "33玉" }
    ];
    const BALL_KIND_OPTIONS = [
      { id: "cash", label: "現金で打つ", availableBalls: 0 },
      { id: "mochidama", label: "持ち玉で打つ", availableBalls: MOCHIDAMA_AVAILABLE_BALLS }
    ];
    // 入力される回転数はデータカウンター基準。エンジンの spec.tenjo は内部の低確回転数なので、
    // エンジンのプリセットが持つ counterOffset だけ引いてから渡す（数値の出所はエンジン1箇所）。
    const PRESETS = [
      {
        id: "agnes-pe",
        name: "PA大海物語Withアグネス・ラムPE",
        payoutLabel: "1R実質出玉（電サポ中の減り込み）",
        payoutHint: "電サポ中の減りを含めた1Rあたりの実質出玉",
        payoutStep: "1",
        payoutDefault: 100,
        payoutChips: [105, 100, 90],
        // S11: エンジンが受け取る netBallsPerWin は玉/R。入力欄も1R実質出玉なので変換しない
        netBallsPerWin: (value) => value
      },
      {
        id: "umi-sp5",
        name: "P大海物語5スペシャル",
        payoutLabel: "1回の当りあたり純払い出し",
        payoutHint: "当り1回あたりの純払い出し玉数",
        payoutStep: "10",
        payoutDefault: 1400,
        payoutChips: [],
        // S11: この機種の入力欄は当選あたりの純払い出し。エンジンは玉/R なので平均R数で割る
        netBallsPerWin: (value) => value / YUTIME_EXPECTATION_ENGINE.presets["umi-sp5"].spec.averageRoundsPerWin
      }
    ];

    const byId = (id) => document.getElementById(id);

    const state = {
      presetId: PRESETS[0].id,
      currentSpin: null,
      rotationRate: null,
      payout: PRESETS[0].payoutDefault,
      exchangeBalls: EXCHANGE_OPTIONS[0].balls,
      ballKind: BALL_KIND_OPTIONS[0].id
    };

    function currentPreset() {
      return PRESETS.find((preset) => preset.id === state.presetId) || PRESETS[0];
    }

    function enginePresetFor(preset) {
      return YUTIME_EXPECTATION_ENGINE.presets[preset.id];
    }

    function counterOffset(preset) {
      return Math.max(0, Number(enginePresetFor(preset).spec.counterOffset) || 0);
    }

    function engineSpinFromCounter(preset, counterSpin) {
      return Math.max(0, counterSpin - counterOffset(preset));
    }

    function remainingSpins(preset, counterSpin) {
      if (counterSpin === null || counterSpin < 0) return null;
      return Math.max(0, enginePresetFor(preset).spec.tenjo - engineSpinFromCounter(preset, counterSpin));
    }

    function numberOrNull(value) {
      if (value === null || value === undefined) return null;
      const text = String(value).trim();
      if (text === "") return null;
      const num = Number(text);
      return Number.isFinite(num) ? num : null;
    }

    function yenText(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "—";
      const rounded = Math.round(Number(value));
      return `${rounded >= 0 ? "+" : ""}${rounded.toLocaleString("ja-JP")}円`;
    }

    function hourText(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "—";
      return `${Number(value).toFixed(2)}h`;
    }

    function evJudgment(result) {
      if (!result) return { className: "", label: "—" };
      const hourly = Number(result.hourlyYen);
      const hasHourly = Number(result.totalHours) > 0 && Number.isFinite(hourly);
      // 打てる＝時給がしきい値以上。時給が出せないときは期待値の符号だけで判定する
      if (hasHourly && hourly >= HOURLY_THRESHOLD_YEN) return { className: "good", label: "打てる" };
      if (Number(result.evYen) > 0) return { className: "warn", label: "微妙" };
      return { className: "bad", label: "打てない" };
    }

    function basisText(result) {
      if (!result) return "";
      // 投資額は機械割の分母と同じ「持ち玉ぶんの玉単価換算＋現金ぶん」の円換算合計
      const investYen = Math.round(Number(result.normalCostYen) || 0);
      const evYen = Number(result.evYen) || 0;
      const machineRate = investYen > 0 ? 100 + evYen / investYen * 100 : null;
      const spinsPerHour = Math.round(Number(result.spinsPerHour) || 0);
      return `投資 約${investYen.toLocaleString("ja-JP")}円に対し期待値 ${yenText(evYen)}`
        + `（機械割 ${machineRate === null ? "-" : `${machineRate.toFixed(1)}%`} ＝ 期待値÷投資額+100%）`
        + ` ／ 消化時間 ${hourText(result.totalHours)}（通常${hourText(result.normalHours)}＋当選${hourText(result.hitHours)}＋電サポ${hourText(result.densapoHours)}）`
        + ` ／ 通常時${spinsPerHour.toLocaleString("ja-JP")}回転/h想定`;
    }

    function missingMessage() {
      if (state.currentSpin === null || state.currentSpin < 0) return "現在回転数を入力してください";
      if (state.rotationRate === null || state.rotationRate <= 0) return "回転率を入力してください";
      if (state.payout === null || state.payout <= 0) return "出玉を入力してください";
      return "";
    }

    function calculateFromState() {
      const preset = currentPreset();
      const missing = missingMessage();
      if (missing) return { result: null, missing };
      const ballKind = BALL_KIND_OPTIONS.find((option) => option.id === state.ballKind) || BALL_KIND_OPTIONS[0];
      const settings = {
        ...enginePresetFor(preset).defaults,
        presetId: preset.id,
        netBallsPerWin: preset.netBallsPerWin(state.payout),
        yenPerBall: 100 / state.exchangeBalls
      };
      const result = YUTIME_EXPECTATION_ENGINE.calculate({
        presetId: preset.id,
        currentSpin: engineSpinFromCounter(preset, state.currentSpin),
        rotationRate: state.rotationRate,
        availableBalls: ballKind.availableBalls
      }, settings);
      return { result, missing: result ? "" : "入力値を確認してください" };
    }

    function chipHtml(options) {
      return options.map((option) => `<button type="button" class="chip" data-value="${option.value}" aria-pressed="${option.selected ? "true" : "false"}">${option.label}</button>`).join("");
    }

    function renderPayoutChips() {
      const preset = currentPreset();
      const row = byId("payoutChipRow");
      if (!preset.payoutChips.length) {
        row.style.display = "none";
        byId("payoutChips").innerHTML = "";
        return;
      }
      row.style.display = "";
      byId("payoutChips").innerHTML = chipHtml(preset.payoutChips.map((value) => ({
        value,
        label: `${value}玉`,
        selected: Number(state.payout) === value
      })));
    }

    function renderStaticChips() {
      byId("exchangeChips").innerHTML = chipHtml(EXCHANGE_OPTIONS.map((option) => ({
        value: option.balls,
        label: option.label,
        selected: state.exchangeBalls === option.balls
      })));
      byId("ballKindChips").innerHTML = chipHtml(BALL_KIND_OPTIONS.map((option) => ({
        value: option.id,
        label: option.label,
        selected: state.ballKind === option.id
      })));
    }

    function renderPresetFields() {
      const preset = currentPreset();
      byId("payoutLabel").textContent = preset.payoutLabel;
      byId("payoutHint").textContent = preset.payoutHint;
      const payoutInput = byId("payout");
      payoutInput.step = preset.payoutStep;
      payoutInput.placeholder = String(preset.payoutDefault);
      payoutInput.value = state.payout === null ? "" : String(state.payout);
      renderPayoutChips();
    }

    function renderResult() {
      const preset = currentPreset();
      const remaining = remainingSpins(preset, state.currentSpin);
      byId("currentSpinHint").textContent = remaining === null
        ? "実機：データカウンターの回転数"
        : `実機：データカウンターの回転数 ／ 遊タイムまで残り${remaining.toLocaleString("ja-JP")}回転`;

      const { result, missing } = calculateFromState();
      const judgment = evJudgment(result);
      const panel = byId("resultPanel");
      panel.className = `result ${judgment.className}`.trim();
      const judgmentNode = byId("judgment");
      judgmentNode.textContent = judgment.label;
      judgmentNode.className = `cell-value small ${judgment.className === "good" ? "good" : judgment.className === "bad" ? "bad" : ""}`.trim();
      const evNode = byId("evYen");
      evNode.textContent = result ? yenText(result.evYen) : "—";
      evNode.className = `cell-value ${result && Number(result.evYen) < 0 ? "bad" : ""}`.trim();
      byId("hourlyYen").textContent = result ? yenText(result.hourlyYen) : "—";
      byId("totalHours").textContent = result ? hourText(result.totalHours) : "—";
      byId("basis").innerHTML = basisText(result);
      byId("notice").textContent = missing;
      byId("embedCode").textContent = `<iframe src="https://slot-tools.jp/yutime-calc.html?m=${preset.id}"\n        width="100%" height="700" style="border:0" loading="lazy"></iframe>`;
    }

    function bindChipGroup(containerId, apply) {
      byId(containerId).addEventListener("click", (event) => {
        const chip = event.target.closest(".chip");
        if (!chip) return;
        apply(chip.dataset.value);
        renderStaticChips();
        renderPayoutChips();
        renderResult();
      });
    }

    function presetIdFromUrl() {
      try {
        const requested = new URLSearchParams(window.location.search).get("m");
        return PRESETS.some((preset) => preset.id === requested) ? requested : PRESETS[0].id;
      } catch (err) {
        return PRESETS[0].id;
      }
    }

    function inIframe() {
      try {
        return window.self !== window.top;
      } catch (err) {
        return true;
      }
    }

    function init() {
      state.presetId = presetIdFromUrl();
      state.payout = currentPreset().payoutDefault;

      const select = byId("preset");
      select.innerHTML = PRESETS.map((preset) => `<option value="${preset.id}">${preset.name}</option>`).join("");
      select.value = state.presetId;
      select.addEventListener("change", () => {
        state.presetId = PRESETS.some((preset) => preset.id === select.value) ? select.value : PRESETS[0].id;
        state.payout = currentPreset().payoutDefault;
        renderPresetFields();
        renderResult();
      });

      byId("currentSpin").addEventListener("input", (event) => {
        state.currentSpin = numberOrNull(event.target.value);
        renderResult();
      });
      byId("rotationRate").addEventListener("input", (event) => {
        state.rotationRate = numberOrNull(event.target.value);
        renderResult();
      });
      byId("payout").addEventListener("input", (event) => {
        state.payout = numberOrNull(event.target.value);
        renderPayoutChips();
        renderResult();
      });

      bindChipGroup("payoutChips", (value) => {
        state.payout = Number(value);
        byId("payout").value = value;
      });
      bindChipGroup("exchangeChips", (value) => {
        state.exchangeBalls = Number(value);
      });
      bindChipGroup("ballKindChips", (value) => {
        state.ballKind = value;
      });

      if (inIframe()) byId("embedSection").style.display = "none";

      renderPresetFields();
      renderStaticChips();
      renderResult();
    }

    init();
  })();
</script>
