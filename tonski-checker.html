<style>
:root{--bg:#0d0a10;--panel:#171220;--panel2:#1f1830;--line:#2c2340;--pink:#ff3d8f;--pink-dim:#a8265f;--gold:#ffc94d;--cyan:#6fd8ff;--txt:#f2eef5;--muted:#9a90a8;--danger:#ff5c5c;--seg:'DotGothic16',monospace;--body:'M PLUS 1p',sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:var(--body);background:var(--bg);color:var(--txt);position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);user-select:none;-webkit-user-select:none}

.hd-title{font-weight:800;font-size:15px;letter-spacing:.02em;min-width:0}
.hd-title small{display:block;font-size:10px;font-weight:500;color:var(--pink);letter-spacing:.15em}

.hd-link{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--cyan);font-size:11px;font-weight:800;text-decoration:none}
.hd-actions{display:flex;gap:6px;flex:none}
.hd-btn{font-family:var(--body);font-size:11px;font-weight:700;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:56px;white-space:nowrap}
.hd-btn.danger{color:var(--danger)}

body.minus .crow .plus{border-color:#7a3040;background:rgba(255,92,92,.14);color:var(--danger)}
.feed{margin-top:6px;font-size:10.5px;color:var(--muted);min-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.feed b{color:var(--cyan);font-weight:700}
nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#120d1a;padding-bottom:env(safe-area-inset-bottom)}
nav button{font-family:var(--body);appearance:none;background:none;border:none;color:var(--muted);font-size:11px;font-weight:700;padding:11px 0 13px;letter-spacing:.05em;border-top:2px solid transparent}
nav button.on{color:var(--pink);border-top-color:var(--pink)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px}.sec{margin-bottom:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.1em;margin-bottom:8px}.sec-h .sub{font-size:10px;font-weight:500;color:var(--muted);letter-spacing:0}
.cgrid{display:grid;gap:6px}.crow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.crow:active{border-color:var(--pink-dim)}
.crow .lbl{flex:1;min-width:0}.crow .lbl .nm{font-size:12px;font-weight:700;line-height:1.25}.crow .lbl .mn{font-size:9.5px;color:var(--muted);line-height:1.3}.crow .mn.hot,.hint.hot{color:var(--gold)}
.crow .num{font-family:var(--seg);font-size:22px;color:var(--pink);min-width:34px;text-align:right;text-shadow:0 0 8px rgba(255,61,143,.45)}.crow .pct{font-family:var(--seg);font-size:11px;color:var(--cyan);min-width:62px;text-align:right}
.crow .plus{flex:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--pink-dim);background:rgba(255,61,143,.12);color:var(--pink);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--body)}
.inrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}.inrow label{flex:1;font-size:12px;font-weight:700}.inrow input{width:124px;font-family:var(--seg);font-size:20px;text-align:right;color:var(--gold);background:#0d0a12;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.hint{font-size:10px;color:var(--muted);line-height:1.5;margin-top:6px}.cardwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;max-width:100%;overflow:hidden}
#cardCanvas,#detailCanvas{width:100%;max-width:100%;min-width:0;height:auto;border-radius:10px;display:block;background:#000}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btnrow.one{grid-template-columns:1fr}.act{font-family:var(--body);font-size:13px;font-weight:800;padding:12px;border-radius:10px;border:1px solid var(--pink-dim);background:rgba(255,61,143,.14);color:var(--pink)}.act.gold{border-color:#8a6c1e;background:rgba(255,201,77,.12);color:var(--gold)}.act.plain{border-color:var(--line);background:var(--panel2);color:var(--txt)}
.text-btn{appearance:none;background:none;border:none;color:var(--cyan);font-family:var(--body);font-size:11px;font-weight:700;text-decoration:underline;padding:8px 4px 0}.text-btn[hidden],.icon-choice[hidden]{display:none}
.icon-choices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.icon-choice{font-family:var(--body);font-size:11px;font-weight:800;padding:9px 6px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}.icon-choice.on{border-color:var(--pink-dim);background:rgba(255,61,143,.14);color:var(--pink)}
.imgnote{font-size:10px;color:var(--muted);line-height:1.6;margin-top:8px}textarea#tpl{width:100%;height:140px;margin-top:10px;background:#0d0a12;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;line-height:1.5;font-family:var(--body);user-select:text;-webkit-user-select:text}
.credit{margin-top:4px;padding:12px;border-top:1px dashed var(--line);font-size:10.5px;color:var(--muted);line-height:1.7;text-align:center}.credit a{color:var(--cyan);font-weight:700;text-decoration:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--pink);color:#fff;font-size:12px;font-weight:700;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;box-shadow:0 0 18px rgba(255,61,143,.6)}.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
