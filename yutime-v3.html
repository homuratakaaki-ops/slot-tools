    function saveCurrentMap() {
      const store = activeStore();
      if (!store) return;
      ensureMapDraft(store.id);
      const layout = storeLayout(store.id);
      const map = activeMap(store.id);
      const previousIslands = cloneIslands(map.islands || []);
      const islands = readIslandDraftFromDom();
      if (!islands.length && previousIslands.length && !mapDraft.allowEmptySave) {
        showToast(`フロアマップが空です。既存の${previousIslands.length}島を消す場合は、島ごとに[島を削除]してから保存してください。`, "error");
        renderMapEditor();
        return;
      }
      const parsed = parseIslandLayout({ islands });
      const previousParsed = parseIslandLayout({ islands: previousIslands });
      const previousDaiNos = new Set(previousParsed.daiNos.map(String));
      const nextDaiNos = new Set(parsed.daiNos.map(String));
      const removedDaiNos = [...previousDaiNos].filter((daiNo) => !nextDaiNos.has(daiNo));
      const addedDaiNos = parsed.daiNos.filter((daiNo) => !previousDaiNos.has(String(daiNo)));
      const removedRecordedMachines = machinesWithSessions(store.id, removedDaiNos);
      if (removedRecordedMachines.length) {
        const ok = confirm(`${removedRecordedMachines.length}台（記録あり）がこのマップから外れます。台の記録は消えませんが、マップに表示されなくなります。保存しますか？`);
        if (!ok) {
          renderMapEditor();
          return;
        }
      }
      saveMapBackup(store.id, map);
      map.islands = cloneIslands(islands);
      map.updatedAt = nowIso();
      map.errors = parsed.errors;
      layout.activeMapId = map.id;
      mapDraft = { storeId: store.id, mapId: map.id, islands: cloneIslands(islands), allowEmptySave: false };
      syncMachinesFromMap(store.id, parsed);
      applyColumnPresetsToMachines(store.id, islands, parsed, previousIslands);
      if (!persistWithToast(`フロアマップを保存しました（+${addedDaiNos.length}台 / -${removedDaiNos.length}台）`)) return;
      renderAll();
    }

    function ensureMapDraft(storeId) {
      const map = activeMap(storeId);
      if (mapDraft.storeId === storeId && mapDraft.mapId === map.id) return;
      mapDraft = { storeId, mapId: map.id, islands: cloneIslands(map.islands || []), allowEmptySave: false };
      expandedIslandIndexes = new Set();
    }

    function hydrateMapDraftFromSavedLayout(storeId) {
      const map = activeMap(storeId);
      const savedIslands = cloneIslands(map.islands || []);
      if (savedIslands.length && !mapDraft.islands.length && !mapDraft.allowEmptySave) {
        mapDraft = { storeId, mapId: map.id, islands: savedIslands, allowEmptySave: false };
        expandedIslandIndexes = new Set();
      }
    }

    function machinesWithSessions(storeId, daiNos) {
      const wanted = new Set((daiNos || []).map(String));
      const recordedMachineIds = new Set(data.sessions.map((session) => session.machineId));
      return data.machines.filter((machine) => (
        machine.storeId === storeId &&
        wanted.has(String(machine.daiNo)) &&
        recordedMachineIds.has(machine.id)
      ));
    }

    function loadMapBackup() {
      try {
        const backup = JSON.parse(localStorage.getItem(MAP_BACKUP_KEY) || "null");
        if (!backup || typeof backup !== "object") return null;
        if (backup.backups && typeof backup.backups === "object") return backup;
        if (!backup.storeId || !backup.mapId || !backup.map) return null;
        return { backups: { [backup.storeId]: { [backup.mapId]: backup } } };
      } catch (error) {
        console.warn("ytv3 map backup load failed", error);
        return null;
      }
    }

    function mapBackupFor(storeId, mapId) {
      const entry = loadMapBackup()?.backups?.[storeId]?.[mapId];
      if (!entry || !entry.map) return null;
      return {
        storeId,
        mapId,
        map: normalizeNamedMap(entry.map, 0),
        createdAt: entry.createdAt || nowIso()
      };
    }

    function saveMapBackup(storeId, map) {
      try {
        const root = loadMapBackup() || { backups: {} };
        if (!root.backups[storeId]) root.backups[storeId] = {};
        root.backups[storeId][map.id] = {
          storeId,
          mapId: map.id,
          map: {
            id: map.id,
            name: map.name,
            islands: cloneIslands(map.islands || []),
            updatedAt: map.updatedAt || nowIso(),
            errors: Array.isArray(map.errors) ? map.errors : []
          },
          createdAt: nowIso()
        };
        localStorage.setItem(MAP_BACKUP_KEY, JSON.stringify(root));
      } catch (error) {
        console.warn("ytv3 map backup save failed", error);
        showToast("直前のマップ退避に失敗しました。容量を確認してください。", "error");
      }
    }

    function restoreActiveMapBackup(storeId) {
      const layout = storeLayout(storeId);
      const map = activeMap(storeId);
      const backup = mapBackupFor(storeId, map.id);
      if (!backup) {
        showToast("戻せる直前のマップ定義がありません", "error");
        return;
      }
      if (!confirm("直前のマップ定義に戻します。台と記録には触りません。よろしいですか？")) return;
      map.islands = cloneIslands(backup.map.islands || []);
      map.updatedAt = nowIso();
      layout.activeMapId = map.id;
      const parsed = parseIslandLayout(map);
      map.errors = parsed.errors;
      syncMachinesFromMap(storeId, parsed);
      mapDraft = { storeId, mapId: map.id, islands: cloneIslands(map.islands), allowEmptySave: false };
      expandedIslandIndexes = new Set();
      if (!persistWithToast("直前のマップ定義に戻しました")) return;
      renderAll();
    }

    function openAddFloorMapForm(storeId) {
      openModal("マップを追加", "コーナー名など、歩きながら選びやすい名前にしてください。", `
        <div class="field-row"><label for="newFloorMapName">マップ名</label><input id="newFloorMapName" value="" placeholder="例: リコリス・リコイル"></div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          <button class="primary" id="saveNewFloorMapBtn">追加</button>
        </div>
      `);
      byId("saveNewFloorMapBtn").addEventListener("click", () => {
        const name = byId("newFloorMapName").value.trim() || "新しいマップ";
        const layout = storeLayout(storeId);
        const map = defaultMap(name);
        layout.maps.push(map);
        layout.activeMapId = map.id;
        mapDraft = { storeId, mapId: map.id, islands: [], allowEmptySave: false };
        expandedIslandIndexes = new Set();
        mapEditorOpenByStore[storeId] = true;
        if (!persistWithToast("保存しました")) return;
        closeModal();
        renderAll();
      });
    }

    function openRenameFloorMapForm(storeId) {
      const map = activeMap(storeId);
      openModal("マップ名を変更", "表示上の名前だけを変更します。台と記録には触りません。", `
        <div class="field-row"><label for="floorMapName">マップ名</label><input id="floorMapName" value="${escapeHtml(map.name)}"></div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          <button class="primary" id="saveFloorMapNameBtn">保存</button>
        </div>
      `);
      byId("saveFloorMapNameBtn").addEventListener("click", () => {
        map.name = byId("floorMapName").value.trim() || "無題のマップ";
        map.updatedAt = nowIso();
        if (!persistWithToast("保存しました")) return;
        closeModal();
        renderAll();
      });
    }

    function deleteActiveFloorMap(storeId) {
      const layout = storeLayout(storeId);
      const map = activeMap(storeId);
      if (!confirm(`「${map.name}」を削除しますか？台と記録は消えません。`)) return;
      if (!confirm("元に戻せません。マップ削除を確定しますか？台と記録は残ります。")) return;
      layout.maps = layout.maps.filter((item) => item.id !== map.id);
      if (!layout.maps.length) layout.maps.push(defaultMap());
      layout.activeMapId = layout.maps[0].id;
      mapDraft = { storeId: null, mapId: null, islands: [], allowEmptySave: false };
      expandedIslandIndexes = new Set();
      if (!persistWithToast("保存しました")) return;
      renderAll();
    }

    function addIslandDraft() {
      const store = activeStore();
      if (!store) return;
      ensureMapDraft(store.id);
      mapEditorOpenByStore[store.id] = true;
      mapDraft.allowEmptySave = false;
      const nextIndex = mapDraft.islands.length;
      mapDraft.islands.push({ name: "", left: { from: null, to: null }, right: null, gaps: { left: [], right: [] }, excluded: [], leftPresetId: "", rightPresetId: "" });
      expandedIslandIndexes.add(nextIndex);
      renderMapEditor();
    }

    function islandEditorHtml(island, index) {
      const left = island.left || {};
      const right = island.right || {};
      const parsed = parseIslandLayout({ islands: [island] });
      const row = parsed.rows[0] || { sides: [[], []], allSides: [[], []] };

      const summary = islandRangeSummary(island);

      return `
        <div class="island-card" data-island-index="${index}">

              <button class="small" data-edit-island-name="${index}">✎ 名前変更</button>

              <button class="small" data-delete-island="${index}">島を削除</button>

          </div>

    function islandSideInputHtml(index, side, label, value, presetId = "", gaps = []) {
      return `
        <div class="island-side">
          <h4>${label}</h4>
          <label class="hint" for="island_${index}_${side}_from">開始台番</label>
          <label class="hint" for="island_${index}_${side}_to">終了台番</label>
          <input id="island_${index}_${side}_from" data-island-input="${index}" data-side="${side}" data-part="from" inputmode="numeric" value="${escapeHtml(value.from ?? "")}">
          <input id="island_${index}_${side}_to" data-island-input="${index}" data-side="${side}" data-part="to" inputmode="numeric" value="${escapeHtml(value.to ?? "")}">
          <label class="hint" for="island_${index}_${side}_preset">機種</label>
          <select id="island_${index}_${side}_preset" data-island-input="${index}" data-side="${side}" data-part="presetId">
            <option value="">未設定</option>

          </select>
          <div class="field-row wide"><label for="island_${index}_${side}_gaps">区切り位置</label><input id="island_${index}_${side}_gaps" data-island-input="${index}" data-side="${side}" data-part="gaps" inputmode="numeric" value="${escapeHtml(formatGapList(gaps))}" placeholder="例: 297,303"><small>入力した台番の後に隙間を入れます。</small></div>
        </div>
      `;
    }

    function previewSideHtml(daiNos, excluded, gaps = []) {
      if (!daiNos.length) return '<span class="hint">片面なし</span>';
      const excludedSet = new Set((excluded || []).map(String));
      const gapSet = new Set((gaps || []).map(String));
      return daiNos.map((daiNo) => `
        <button class="preview-machine ${excludedSet.has(String(daiNo)) ? "excluded" : ""}" data-preview-dai="${escapeHtml(daiNo)}">${escapeHtml(daiNo)}</button>
        ${gapSet.has(String(daiNo)) ? '<div class="preview-gap" aria-label="区切り"></div>' : ""}
      `).join("");
    }

    function bindIslandEditor() {
      els.islandBuilder.querySelectorAll("[data-toggle-island]").forEach((button) => {
        button.addEventListener("click", () => {
          updateIslandDraftFromDom();
          const index = Number(button.dataset.toggleIsland);
          if (expandedIslandIndexes.has(index)) expandedIslandIndexes.delete(index);
          else expandedIslandIndexes.add(index);
          renderMapEditor();
        });
      });
      els.islandBuilder.querySelectorAll("[data-edit-island-name]").forEach((button) => {
        button.addEventListener("click", () => {
          updateIslandDraftFromDom();
          openIslandNameForm(Number(button.dataset.editIslandName));
        });
      });
      els.islandBuilder.querySelectorAll("[data-island-input]").forEach((input) => {
        input.addEventListener("input", () => {
          const focusId = input.id;
          const cursor = input.selectionStart;
          updateIslandDraftFromDom();
          renderMapEditor();
          const nextInput = byId(focusId);
          if (nextInput) {
            nextInput.focus();
            if (cursor !== null && typeof nextInput.setSelectionRange === "function") nextInput.setSelectionRange(cursor, cursor);
          }
        });
      });
      els.islandBuilder.querySelectorAll("[data-preview-dai]").forEach((button) => {
        button.addEventListener("click", () => {
          const card = button.closest("[data-island-index]");
          const index = Number(card.dataset.islandIndex);
          const daiNo = String(button.dataset.previewDai);
          const excluded = new Set((mapDraft.islands[index].excluded || []).map(String));
          if (excluded.has(daiNo)) excluded.delete(daiNo);
          else excluded.add(daiNo);
          mapDraft.islands[index].excluded = [...excluded];
          renderMapEditor();
        });
      });
      els.islandBuilder.querySelectorAll("[data-delete-island]").forEach((button) => {
        button.addEventListener("click", () => {
          updateIslandDraftFromDom();
          const index = Number(button.dataset.deleteIsland);
          mapDraft.islands.splice(index, 1);
          expandedIslandIndexes = new Set([...expandedIslandIndexes].filter((item) => item !== index).map((item) => item > index ? item - 1 : item));
          mapDraft.allowEmptySave = mapDraft.islands.length === 0;
          renderMapEditor();
        });
      });
    }

    function openIslandNameForm(index) {
      const island = mapDraft.islands[index];
      if (!island) return;
      openModal("島の名前", "空欄にすると、列機種または島番号から自動表示します。", `
        <div class="field-row"><label for="islandNameInput">島名</label><input id="islandNameInput" value="${escapeHtml(island.name || "")}" placeholder="${escapeHtml(islandDisplayName({ ...island, name: "" }, index))}"></div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          <button class="primary" id="saveIslandNameBtn">保存</button>
        </div>
      `);
      byId("saveIslandNameBtn").addEventListener("click", () => {
        mapDraft.islands[index].name = byId("islandNameInput").value.trim();
        closeModal();
        renderMapEditor();
      });
    }

    function updateIslandDraftFromDom() {
      mapDraft.islands = readIslandDraftFromDom();
    }

    function readIslandDraftFromDom() {
      return [...els.islandBuilder.querySelectorAll("[data-island-index]")].map((card) => {
        const index = Number(card.dataset.islandIndex);
        const existing = mapDraft.islands[index] || {};
        if (!byId(`island_${index}_left_from`) && !byId(`island_${index}_right_from`)) {
          return normalizeIsland(existing);
        }
        const left = readIslandSideFromDom(index, "left");
        const right = readIslandSideFromDom(index, "right");
        return {
          name: existing.name || "",
          left,
          right: right.from === null && right.to === null ? null : right,
          gaps: {
            left: readGapListFromDom(index, "left"),
            right: readGapListFromDom(index, "right")
          },
          leftPresetId: byId(`island_${index}_left_preset`)?.value || "",
          rightPresetId: byId(`island_${index}_right_preset`)?.value || "",
          excluded: (mapDraft.islands[index]?.excluded || []).map(String)
        };
      });
    }

    function readIslandSideFromDom(index, side) {
      const from = normalizeNumber(byId(`island_${index}_${side}_from`)?.value);
      const to = normalizeNumber(byId(`island_${index}_${side}_to`)?.value);
      return { from, to };
    }

    function readGapListFromDom(index, side) {
      return parseGapList(byId(`island_${index}_${side}_gaps`)?.value);
    }

    function parseGapList(value) {
      return [...new Set(String(value || "").split(/[,\s、]+/).map((item) => normalizeNumber(item)).filter((item) => item !== null).map(String))];
    }

    function formatGapList(gaps) {
      return (Array.isArray(gaps) ? gaps : []).map(String).join(", ");
    }

    function normalizeLayouts(layouts) {
      const normalized = {};
      Object.entries(layouts || {}).forEach(([storeId, layout]) => {
        normalized[storeId] = normalizeStoreLayout(layout);
      });
      return normalized;
    }

    function defaultMap(name = "メインフロア") {
      return {
        id: cryptoId("map"),
        name,
        assumedRate: null,
        islands: [],
        updatedAt: nowIso(),
        errors: []
      };
    }

    function normalizeStoreLayout(layout) {
      if (layout && Array.isArray(layout.maps)) {
        const maps = layout.maps.map((map, index) => normalizeNamedMap(map, index)).filter(Boolean);
        const fallback = maps[0] || defaultMap();
        return {
          maps: maps.length ? maps : [fallback],
          activeMapId: maps.some((map) => map.id === layout.activeMapId) ? layout.activeMapId : fallback.id
        };
      }
      if (layout && Array.isArray(layout.islands)) {
        const main = normalizeNamedMap({
          id: "map_main",
          name: "メインフロア",
          islands: layout.islands,
          updatedAt: layout.updatedAt,
          errors: layout.errors
        }, 0);
        return { maps: [main], activeMapId: main.id };
      }
      if (layout && typeof layout.source === "string") {
        const main = normalizeNamedMap({
          id: "map_main",
          name: "メインフロア",
          islands: textMapToIslands(layout.source),
          updatedAt: layout.updatedAt,
          errors: []
        }, 0);
        return { maps: [main], activeMapId: main.id };
      }
      const main = defaultMap();
      return { maps: [main], activeMapId: main.id };
    }

    function normalizeNamedMap(map, index = 0) {
      if (!map || typeof map !== "object") return null;
      return {
        id: map.id || (index === 0 ? "map_main" : cryptoId("map")),
        name: String(map.name || (index === 0 ? "メインフロア" : `マップ${index + 1}`)),
        islands: cloneIslands(map.islands || []),
        assumedRate: normalizeNumber(map.assumedRate),
        updatedAt: map.updatedAt || nowIso(),
        errors: Array.isArray(map.errors) ? map.errors : []
      };
    }

    function cloneIslands(islands) {
      return (Array.isArray(islands) ? islands : []).map((island) => normalizeIsland(island));
    }

    function normalizeIsland(island) {
      return {
        name: String(island?.name || "").trim(),
        left: normalizeIslandSide(island?.left),
        right: island?.right ? normalizeIslandSide(island.right) : null,
        gaps: normalizeIslandGaps(island?.gaps),
        leftPresetId: presetById(island?.leftPresetId) ? island.leftPresetId : "",
        rightPresetId: presetById(island?.rightPresetId) ? island.rightPresetId : "",
        excluded: Array.isArray(island?.excluded) ? [...new Set(island.excluded.map(String))] : [],
        displayIndex: Number.isInteger(island?.displayIndex) ? island.displayIndex : undefined
      };
    }

    function normalizeIslandSide(side) {
      return {
        from: normalizeNumber(side?.from),
        to: normalizeNumber(side?.to)
      };
    }

    function normalizeIslandGaps(gaps) {
      if (Array.isArray(gaps)) {
        const legacy = [...new Set(gaps.map((item) => normalizeNumber(item)).filter((item) => item !== null).map(String))];
        return { left: legacy, right: [] };
      }
      return {
        left: Array.isArray(gaps?.left) ? [...new Set(gaps.left.map((item) => normalizeNumber(item)).filter((item) => item !== null).map(String))] : [],
        right: Array.isArray(gaps?.right) ? [...new Set(gaps.right.map((item) => normalizeNumber(item)).filter((item) => item !== null).map(String))] : []
      };
    }

    function textMapToIslands(source) {
      const parsed = parseTextMapLayout(source);
      return parsed.rows.map((row) => {
        const left = daiNosToSide(row.sides[0]);
        const right = daiNosToSide(row.sides[1]);
        const leftExcluded = sideExcluded(row.sides[0], left);
        const rightExcluded = sideExcluded(row.sides[1], right);
        return {
          left,
          right: right.from === null || right.to === null ? null : right,
          excluded: [...leftExcluded, ...rightExcluded]
        };
      });
    }

    function daiNosToSide(daiNos) {
      if (!Array.isArray(daiNos) || !daiNos.length) return { from: null, to: null };
      return { from: normalizeNumber(daiNos[0]), to: normalizeNumber(daiNos[daiNos.length - 1]) };
    }

    function sideExcluded(existingDaiNos, side) {
      const wanted = new Set((existingDaiNos || []).map(String));
      return expandIslandSide(side).filter((daiNo) => !wanted.has(String(daiNo)));
    }

    function parseIslandLayout(layout) {
      const errors = [];
      const seen = new Set();
      const rows = cloneIslands(layout?.islands || []).map((island, index) => {
        const excluded = new Set((island.excluded || []).map(String));
        const allLeft = expandIslandSide(island.left);
        const allRight = island.right ? expandIslandSide(island.right) : [];
        const left = allLeft.filter((daiNo) => !excluded.has(String(daiNo)));
        const right = allRight.filter((daiNo) => !excluded.has(String(daiNo)));
        if (!allLeft.length) errors.push(`島${index + 1}: 左列の台番を入力してください`);
        [...left, ...right].forEach((daiNo) => {
          if (seen.has(daiNo)) errors.push(`島${index + 1}: 台番${daiNo}が重複しています`);
          seen.add(daiNo);
        });
        return { sides: [left, right], allSides: [allLeft, allRight], island, index: island.displayIndex ?? index };
      }).filter((row) => row.allSides[0].length || row.allSides[1].length);
      return { rows, errors, daiNos: [...seen] };
    }

    function expandIslandSide(side) {
      const from = normalizeNumber(side?.from);
      const to = normalizeNumber(side?.to);
      if (from === null || to === null) return [];
      const step = from <= to ? 1 : -1;
      const values = [];
      for (let n = from; step > 0 ? n <= to : n >= to; n += step) values.push(String(n));
      return values;
    }

    function parseTextMapLayout(source) {
      const errors = [];
      const seen = new Set();
      const rows = [];
      String(source || "").split(/\r?\n/).forEach((line, index) => {
        const trimmed = line.trim();
        if (!trimmed) return;
        const sides = trimmed.split("|").slice(0, 2).map((side) => parseMapSide(side, index + 1, errors));
        while (sides.length < 2) sides.push([]);
        sides.flat().forEach((daiNo) => {
          if (seen.has(daiNo)) errors.push(`${index + 1}行目: 台番${daiNo}が重複しています`);
          seen.add(daiNo);
        });
        rows.push({ sides });
      });
      return { rows, errors, daiNos: [...seen] };
    }

    function parseMapSide(side, lineNo, errors) {
      const values = [];
      String(side || "").split(/[,\s]+/).filter(Boolean).forEach((token) => {
        const range = token.match(/^(\d+)-(\d+)$/);
        if (range) {
          const start = Number(range[1]);
          const end = Number(range[2]);
          if (!Number.isInteger(start) || !Number.isInteger(end)) {
            errors.push(`${lineNo}行目: ${token} は不正なレンジです`);
            return;
          }
          const step = start <= end ? 1 : -1;
          for (let n = start; step > 0 ? n <= end : n >= end; n += step) values.push(String(n));
          return;
        }
        if (/^\d+$/.test(token)) {
          values.push(token);
          return;
        }
        errors.push(`${lineNo}行目: ${token} は読み取れません`);
      });
      return values;
    }

    function mapStatusHtml(parsed) {
      const count = parsed.daiNos.length;
      const chips = [`<span class="badge good">${count}台</span>`];
      if (parsed.errors.length) {
        chips.push(...parsed.errors.slice(0, 3).map((error) => `<span class="badge warn">${escapeHtml(error)}</span>`));
        if (parsed.errors.length > 3) chips.push(`<span class="badge warn">ほか${parsed.errors.length - 3}件</span>`);
      } else {
        chips.push('<span class="badge">読み取りOK</span>');
      }
      return chips.join("");
    }

    function syncMachinesFromMap(storeId, parsed) {
      parsed.daiNos.forEach((daiNo) => {
        if (!data.machines.some((machine) => machine.storeId === storeId && machine.daiNo === daiNo)) {
          data.machines.push({
            id: cryptoId("m"),
            storeId,
            daiNo,
            modelName: "",
            roundBalls: null,
            memo: "",
            nailRating: normalizeNailRating(null),
            presetId: "",
            evSupported: false
          });
        }
      });
    }

    function applyColumnPresetsToMachines(storeId, islands, parsed, previousIslands = []) {
      islands.forEach((island, islandIndex) => {
        ["left", "right"].forEach((sideName, sideIndex) => {
          const presetId = sideName === "left" ? island.leftPresetId : island.rightPresetId;
          const preset = presetById(presetId);
          if (!preset) return;
          const previousPresetId = sideName === "left" ? previousIslands[islandIndex]?.leftPresetId || "" : previousIslands[islandIndex]?.rightPresetId || "";
          const presetChanged = previousPresetId !== presetId;
          const daiNos = parsed.rows[islandIndex]?.sides?.[sideIndex] || [];
          const machines = daiNos.map((daiNo) => data.machines.find((machine) => machine.storeId === storeId && machine.daiNo === String(daiNo))).filter(Boolean);
          const alreadySet = machines.filter((machine) => {
            const currentPresetId = normalizeMachinePresetId(machine);
            const hasIndividualSetting = machineHasIndividualSetting(machine);
            return hasIndividualSetting && currentPresetId !== presetId;
          });
          const allowOverwrite = alreadySet.length && presetChanged ? confirm(`この列の台${alreadySet.length}台の機種を${preset.name}に更新しますか？`) : false;
          machines.forEach((machine) => {
            const currentPresetId = normalizeMachinePresetId(machine);
            const hasIndividualSetting = machineHasIndividualSetting(machine);
            if (hasIndividualSetting && currentPresetId !== presetId && !allowOverwrite) return;
            if (!currentPresetId || currentPresetId !== presetId) applyPresetToMachine(machine, preset);
          });
        });
      });
    }

    function machineHasIndividualSetting(machine) {
      return Boolean(normalizeMachinePresetId(machine) || machine.modelName || machine.roundBalls !== null || (machine.memoEntries || []).length || machine.evSupported);
    }

    function columnPresetForMachine(machine) {
      if (!machine) return null;
      const map = activeMap(machine.storeId);
      const parsed = parseIslandLayout(map);
      const wanted = String(machine.daiNo);
      for (const row of parsed.rows) {
        const left = (row.sides[0] || []).map(String);
        const right = (row.sides[1] || []).map(String);
        if (left.includes(wanted)) return presetById(row.island.leftPresetId);
        if (right.includes(wanted)) return presetById(row.island.rightPresetId);
      }
      return null;
    }

    function machineMatchesPreset(machine, preset) {
      if (!machine || !preset) return false;
      return normalizeMachinePresetId(machine) === preset.id
        && (machine.modelName || "") === preset.name
        && Number(machine.roundBalls) === Number(preset.roundBalls)
        && Boolean(machine.evSupported) === Boolean(preset.evSupported);
    }

    function machineModelDisplay(machine) {
      const columnPreset = columnPresetForMachine(machine);
      const machinePreset = presetById(normalizeMachinePresetId(machine));
      const hasMachineModelSetting = Boolean(machinePreset || machine?.modelName || machine?.roundBalls !== null || machine?.evSupported);
      if (columnPreset && (!hasMachineModelSetting || machineMatchesPreset(machine, columnPreset))) {
        return { name: columnPreset.name, source: "島の設定", action: "変更" };
      }
      if (hasMachineModelSetting) {
        return { name: machine.modelName || machinePreset?.name || "個別設定", source: "個別設定", action: "変更" };
      }
      return { name: "未設定", source: "", action: "設定" };
    }

    function applyPresetToMachine(machine, preset) {
      machine.presetId = preset.id;
      machine.modelName = preset.name;
      machine.roundBalls = preset.roundBalls;
      machine.evSupported = Boolean(preset.evSupported);
    }

    function findMachineByDai(daiNo) {
      const store = activeStore();
      if (!store) return null;
      return data.machines.find((machine) => machine.storeId === store.id && machine.daiNo === String(daiNo)) || null;
    }

    function openClosingCheckForm(daiNo) {
      const machine = findMachineByDai(daiNo);
      if (!machine) return;
      closingTargetDate = defaultClosingTargetDate();
      const sequence = closingColumnSequence(daiNo);
      const index = sequence.indexOf(String(daiNo));
      closingInputFlow = {
        sequence,
        index: index >= 0 ? index : 0,
        direction: null,
        awaitingDirection: false,
        buffer: "",
        recent: "",
        ended: false
      };
      hydrateClosingBuffer();
      renderClosingInputModal();
    }

    function closingColumnSequence(daiNo) {
      const store = activeStore();
      const parsed = parseIslandLayout(store ? selectedMapLayoutForParse(store.id) : { islands: [] });
      const wanted = String(daiNo);
      for (const row of parsed.rows) {
        for (const side of row.sides) {
          if ((side || []).map(String).includes(wanted)) return (side || []).map(String);
        }
      }
      return [wanted];
    }

    function hydrateClosingBuffer() {
      closingInputFlow.buffer = "";
    }

    function currentClosingSavedValue() {
      const machine = findMachineByDai(currentClosingDaiNo());
      return machine ? dailyStateFor(machine.id, closingTargetDate)?.closingSpin ?? null : null;
    }

    function currentClosingDaiNo() {
      return closingInputFlow?.sequence[closingInputFlow.index] || "";
    }

    function renderClosingInputModal() {
      if (!closingInputFlow) return;
      const daiNo = currentClosingDaiNo();
      const atStart = closingInputFlow.index <= 0;
      const atEnd = closingInputFlow.index >= closingInputFlow.sequence.length - 1;
      const leftDai = atStart ? null : closingInputFlow.sequence[closingInputFlow.index - 1];
      const rightDai = atEnd ? null : closingInputFlow.sequence[closingInputFlow.index + 1];
      const ended = closingInputFlow.ended;
      const savedValue = currentClosingSavedValue();
      openModal(`台 ${daiNo} の閉店回転数`, "端末キーボードを使わず、この画面だけで連続入力します。", `
        <p class="modal-dai-title">台 <strong>${escapeHtml(daiNo)}</strong> の閉店回転数</p>
        <button class="small" id="changeClosingTargetDateBtn">${escapeHtml(shortDate(closingTargetDate))} の閉店回転数として保存（タップで日付変更）</button>
        <input id="closingTargetDateInput" type="date" value="${escapeHtml(closingTargetDate)}" hidden>
        <div class="closing-display" id="closingDisplay">${escapeHtml(closingInputFlow.buffer || "0")}</div>
        <p class="hint">${savedValue !== null ? `保存済み: ${escapeHtml(savedValue)}` : "保存済み: -"}</p>
        <div class="closing-keypad">
          ${[7, 8, 9, 4, 5, 6, 1, 2, 3].map((digit) => `<button data-closing-digit="${digit}">${digit}</button>`).join("")}
          <button data-closing-clear>C</button>
          <button data-closing-digit="0">0</button>
          <button data-closing-back>⌫</button>
        </div>
        ${ended ? `<p class="hint warn">この列は終わりです。</p><div class="modal-actions"><button class="primary" data-close>マップへ戻る</button></div>` : closingInputFlow.direction === null ? `
          <div class="closing-direction">
            <p class="hint">数字を入れて方向をタップ＝保存して移動 / 空のまま＝スキップ</p>
            <div class="grid two">
              <button id="chooseClosingBackwardBtn" ${leftDai ? "" : "disabled"}>← ${escapeHtml(leftDai || "端") }へ</button>
              <button id="chooseClosingForwardBtn" ${rightDai ? "" : "disabled"}>${escapeHtml(rightDai || "端")}へ →</button>
            </div>
          </div>
        ` : `
          <div class="closing-flow-actions">
            <button id="skipClosingBtn">スキップ</button>
            <button class="primary" id="saveClosingNextBtn">確定して次へ</button>
          </div>
          <div class="closing-direction">
            <button class="small" id="toggleClosingDirectionBtn">進行方向: ${escapeHtml(directionPreviewText())}（切替▼）</button>
          </div>
        `}
        ${ended ? "" : `<div class="modal-actions"><button class="small" id="saveClosingCloseBtn">保存して閉じる</button></div>`}
        <div class="closing-recent">${escapeHtml(closingInputFlow.recent)}</div>
      `);
      bindClosingInputModal();
      modalCancel = () => {
        closingInputFlow = null;
        renderMachineMap();
      };
    }

    function directionPreviewText() {
      if (!closingInputFlow?.direction) return "未設定";
      const current = currentClosingDaiNo();
      const next = closingInputFlow.sequence[closingInputFlow.index + closingInputFlow.direction];
      return next ? `${current} → ${next}` : `${current} → 端`;
    }

    function bindClosingInputModal() {
      els.modalBody.querySelectorAll("[data-closing-digit]").forEach((button) => {
        button.addEventListener("click", () => {
          closingInputFlow.buffer = (closingInputFlow.buffer + button.dataset.closingDigit).replace(/^0+(\d)/, "$1");
          byId("closingDisplay").textContent = closingInputFlow.buffer || "0";
        });
      });
      const clearButton = els.modalBody.querySelector("[data-closing-clear]");
      if (clearButton) clearButton.addEventListener("click", () => {
        closingInputFlow.buffer = "";
        byId("closingDisplay").textContent = "0";
      });
      const backButton = els.modalBody.querySelector("[data-closing-back]");
      if (backButton) backButton.addEventListener("click", () => {
        closingInputFlow.buffer = closingInputFlow.buffer.slice(0, -1);
        byId("closingDisplay").textContent = closingInputFlow.buffer || "0";
      });
      const saveButton = byId("saveClosingNextBtn");
      if (saveButton) saveButton.addEventListener("click", saveClosingAndAdvance);
      const saveCloseButton = byId("saveClosingCloseBtn");
      if (saveCloseButton) saveCloseButton.addEventListener("click", saveClosingAndClose);
      const skipButton = byId("skipClosingBtn");
      if (skipButton) skipButton.addEventListener("click", () => advanceClosingFlow(false));
      const backwardButton = byId("chooseClosingBackwardBtn");
      if (backwardButton) backwardButton.addEventListener("click", () => chooseClosingDirection(-1));
      const forwardButton = byId("chooseClosingForwardBtn");
      if (forwardButton) forwardButton.addEventListener("click", () => chooseClosingDirection(1));
      const toggleButton = byId("toggleClosingDirectionBtn");
      if (toggleButton) toggleButton.addEventListener("click", () => {
        closingInputFlow.direction *= -1;
        renderClosingInputModal();
      });
      const dateButton = byId("changeClosingTargetDateBtn");
      if (dateButton) dateButton.addEventListener("click", () => {
        const input = byId("closingTargetDateInput");
        if (!input) return;
        input.hidden = false;
        input.focus();
        if (input.showPicker) input.showPicker();
      });
      const dateInput = byId("closingTargetDateInput");
      if (dateInput) dateInput.addEventListener("change", () => {
        if (!isDateString(dateInput.value)) return;
        closingTargetDate = dateInput.value;
        hydrateClosingBuffer();
        renderClosingInputModal();
      });
    }

    function saveClosingCurrent() {
      const value = normalizeNumber(closingInputFlow.buffer);
      if (value === null) {
        closingInputFlow.recent = "数値を入力してください";
        renderClosingInputModal();
        return false;
      }
      const daiNo = currentClosingDaiNo();
      const machine = findMachineByDai(daiNo);
      if (!machine) return false;
      const next = ensureDailyState(machine.id, closingTargetDate);
      next.closingSpin = value;
      if (!persist()) {
        closingInputFlow.recent = "保存に失敗しました";
        renderClosingInputModal();
        return false;
      }
      closingInputFlow.recent = `保存: ${daiNo}=${value}`;
      return true;
    }

    function saveClosingAndAdvance() {
      if (!saveClosingCurrent()) return;
      advanceClosingFlow(true);
    }

    function saveClosingAndClose() {
      if (!saveClosingCurrent()) return;
      closingInputFlow = null;
      closeModal();
      renderAll();
    }

    function chooseClosingDirection(direction) {
      closingInputFlow.direction = direction;
      closingInputFlow.awaitingDirection = false;
      closingInputFlow.ended = false;
      if (normalizeNumber(closingInputFlow.buffer) !== null) saveClosingAndAdvance();
      else advanceClosingFlow(false);
    }

    function advanceClosingFlow(savedCurrent) {
      if (!closingInputFlow) return;
      if (closingInputFlow.direction === null) {
        closingInputFlow.awaitingDirection = true;
        renderClosingInputModal();
        return;
      }
      const skippedDaiNo = currentClosingDaiNo();
      const nextIndex = closingInputFlow.index + closingInputFlow.direction;
      if (nextIndex < 0 || nextIndex >= closingInputFlow.sequence.length) {
        closingInputFlow.ended = true;
        renderClosingInputModal();
        return;
      }
      closingInputFlow.index = nextIndex;
      closingInputFlow.ended = false;
      hydrateClosingBuffer();
      if (!savedCurrent) closingInputFlow.recent = `スキップ: ${skippedDaiNo}`;
      renderClosingInputModal();
    }

    function openMorningCheckForm(daiNo) {
      const machine = findMachineByDai(daiNo);
      if (!machine) return;
      const sequence = closingColumnSequence(daiNo);
      const index = sequence.indexOf(String(daiNo));
      morningCheckFlow = {
        sequence,
        index: index >= 0 ? index : 0,
        direction: null,
        awaitingDirection: false,
        recent: "",
        ended: false
      };
      renderMorningCheckModal();
    }

    function currentMorningDaiNo() {
      return morningCheckFlow?.sequence[morningCheckFlow.index] || "";
    }

    function morningRamClearLabel(value) {
      if (value === RAM_CLEAR_VALUE) return "有り";
      if (value === RAM_NOT_CLEARED_VALUE) return "無し";
      if (value === RAM_UNKNOWN_VALUE) return "不明";
      return "";
    }

    function morningStateSummary(state) {
      const ramClear = normalizeRamClear(state?.ramClear);
      const prevInvalid = state?.prevInvalid === true;
      const parts = [];
      const ramLabel = morningRamClearLabel(ramClear);
      if (ramLabel) parts.push(`ラムクリ${ramLabel}`);
      if (prevInvalid) parts.push("前日無効");
      return parts.length ? parts.join("・") : "";
    }

    function renderMorningCheckModal() {
      if (!morningCheckFlow) return;
      const daiNo = currentMorningDaiNo();
      const machine = findMachineByDai(daiNo);
      const previous = machine ? closingInfoForDate(machine.id, offsetDate(today(), -1)) : null;
      const todayState = machine ? dailyStateFor(machine.id, today()) || {} : {};
      const prevInvalid = todayState.prevInvalid === true;
      const ramClear = normalizeRamClear(todayState.ramClear);
      const atStart = morningCheckFlow.index <= 0;
      const atEnd = morningCheckFlow.index >= morningCheckFlow.sequence.length - 1;
      const leftDai = atStart ? null : morningCheckFlow.sequence[morningCheckFlow.index - 1];
      const rightDai = atEnd ? null : morningCheckFlow.sequence[morningCheckFlow.index + 1];
      const ended = morningCheckFlow.ended;
      const savedSummary = morningStateSummary(todayState);
      openModal(`台 ${daiNo} / 前日ヤメ ${previous ? `${previous.spin}回転` : "-"}`, "朝の状態だけを記録します。前日分を無効にしても閉店チェック値は消しません。", `
        <p class="modal-dai-title">台 <strong>${escapeHtml(daiNo)}</strong> / 前日ヤメ ${previous ? `${escapeHtml(previous.spin)}回転` : "-"}</p>
        <p class="hint">${savedSummary ? `保存済み: ${escapeHtml(savedSummary)}` : "未登録"}</p>
        ${ended ? `<p class="hint warn">この列は終わりです。</p><div class="modal-actions"><button class="primary" data-close>マップへ戻る</button></div>` : `
          <div class="list">
            <label class="check-chip"><input id="morningPrevInvalid" type="checkbox" ${prevInvalid ? "checked" : ""}> 前日分を無効にする（当日すでに大当たり or リセット）</label>
            <div>
              <p class="hint">ラムクリ確認</p>
              <div class="ram-choice-row">
                <button class="small" data-morning-ram="${RAM_CLEAR_VALUE}" aria-pressed="${ramClear === RAM_CLEAR_VALUE ? "true" : "false"}">有り</button>
                <button class="small" data-morning-ram="${RAM_NOT_CLEARED_VALUE}" aria-pressed="${ramClear === RAM_NOT_CLEARED_VALUE ? "true" : "false"}">無し</button>
                <button class="small" data-morning-ram="${RAM_UNKNOWN_VALUE}" aria-pressed="${ramClear === RAM_UNKNOWN_VALUE ? "true" : "false"}">不明</button>
              </div>
            </div>
          </div>
          ${morningCheckFlow.direction === null ? `
            <div class="closing-direction">
              <p class="hint">チェックして方向をタップ＝保存して移動 / 未チェック＝スキップ</p>
              <div class="grid two">
                <button id="chooseMorningBackwardBtn" ${leftDai ? "" : "disabled"}>← ${escapeHtml(leftDai || "端") }へ</button>
                <button id="chooseMorningForwardBtn" ${rightDai ? "" : "disabled"}>${escapeHtml(rightDai || "端")}へ →</button>
              </div>
            </div>
          ` : `
            <div class="modal-actions">
              <button id="skipMorningBtn">スキップ</button>
              <button class="primary" id="saveMorningNextBtn">保存して次へ</button>
            </div>
            <div class="closing-direction">
              <button class="small" id="toggleMorningDirectionBtn">進行方向: ${escapeHtml(morningDirectionPreviewText())}（切替▼）</button>
            </div>
          `}
          <div class="modal-actions"><button class="small" id="saveMorningCloseBtn">保存して閉じる</button></div>
        `}
        <div class="closing-recent">${escapeHtml(morningCheckFlow.recent)}</div>
      `);
      bindMorningCheckModal();
      modalCancel = () => {
        morningCheckFlow = null;
        renderMachineMap();
      };
    }

    function morningDirectionPreviewText() {
      if (!morningCheckFlow?.direction) return "未設定";
      const current = currentMorningDaiNo();
      const next = morningCheckFlow.sequence[morningCheckFlow.index + morningCheckFlow.direction];
      return next ? `${current} → ${next}` : `${current} → 端`;
    }

    function bindMorningCheckModal() {
      const invalidInput = byId("morningPrevInvalid");
      els.modalBody.querySelectorAll("[data-morning-ram]").forEach((button) => {
        button.addEventListener("click", () => {
          const wasPressed = button.getAttribute("aria-pressed") === "true";
          els.modalBody.querySelectorAll("[data-morning-ram]").forEach((item) => item.setAttribute("aria-pressed", "false"));
          if (invalidInput?.dataset.ramAutoInvalid === "1") {
            invalidInput.checked = false;
            delete invalidInput.dataset.ramAutoInvalid;
          }
          if (!wasPressed) {
            button.setAttribute("aria-pressed", "true");
            if (button.dataset.morningRam === RAM_CLEAR_VALUE && invalidInput && !invalidInput.checked) {
              invalidInput.checked = true;
              invalidInput.dataset.ramAutoInvalid = "1";
            }
          }
        });
      });
      const saveButton = byId("saveMorningNextBtn");
      if (saveButton) saveButton.addEventListener("click", saveMorningAndAdvance);
      const saveCloseButton = byId("saveMorningCloseBtn");
      if (saveCloseButton) saveCloseButton.addEventListener("click", saveMorningAndClose);
      const skipButton = byId("skipMorningBtn");
      if (skipButton) skipButton.addEventListener("click", () => advanceMorningFlow(false));
      const backwardButton = byId("chooseMorningBackwardBtn");
      if (backwardButton) backwardButton.addEventListener("click", () => chooseMorningDirection(-1));
      const forwardButton = byId("chooseMorningForwardBtn");
      if (forwardButton) forwardButton.addEventListener("click", () => chooseMorningDirection(1));
      const toggleButton = byId("toggleMorningDirectionBtn");
      if (toggleButton) toggleButton.addEventListener("click", () => {
        morningCheckFlow.direction *= -1;
        renderMorningCheckModal();
      });
    }

    function saveMorningCurrent() {
      const daiNo = currentMorningDaiNo();
      const machine = findMachineByDai(daiNo);
      if (!machine) return false;
      const ramClear = currentMorningRamClearSelection();
      const prevInvalid = Boolean(byId("morningPrevInvalid")?.checked) || ramClear === RAM_CLEAR_VALUE;
      const state = ensureDailyState(machine.id, today());
      if (prevInvalid) state.prevInvalid = true;
      else delete state.prevInvalid;
      if (ramClear) state.ramClear = ramClear;
      else delete state.ramClear;
      cleanupEmptyDailyState(machine.id, today());
      if (!persist()) {
        morningCheckFlow.recent = "保存に失敗しました";
        renderMorningCheckModal();
        return false;
      }
      morningCheckFlow.recent = `保存: ${daiNo}=${morningStateSummary(state) || "未登録"}`;
      return true;
    }

    function saveMorningAndAdvance() {
      if (!saveMorningCurrent()) return;
      advanceMorningFlow(true);
    }

    function saveMorningAndClose() {
      if (!saveMorningCurrent()) return;
      morningCheckFlow = null;
      closeModal();
      renderAll();
    }

    function chooseMorningDirection(direction) {
      morningCheckFlow.direction = direction;
      morningCheckFlow.awaitingDirection = false;
      morningCheckFlow.ended = false;
      const hasCheckedState = Boolean(byId("morningPrevInvalid")?.checked || currentMorningRamClearSelection());
      if (hasCheckedState) saveMorningAndAdvance();
      else advanceMorningFlow(false);
    }

    function currentMorningRamClearSelection() {
      const selected = els.modalBody.querySelector("[data-morning-ram][aria-pressed='true']");
      return normalizeRamClear(selected?.dataset.morningRam);
    }

    function advanceMorningFlow(savedCurrent) {
      if (!morningCheckFlow) return;
      if (morningCheckFlow.direction === null) {
        morningCheckFlow.awaitingDirection = true;
        renderMorningCheckModal();
        return;
      }
      const skippedDaiNo = currentMorningDaiNo();
      const nextIndex = morningCheckFlow.index + morningCheckFlow.direction;
      if (nextIndex < 0 || nextIndex >= morningCheckFlow.sequence.length) {
        morningCheckFlow.ended = true;
        renderMorningCheckModal();
        return;
      }
      morningCheckFlow.index = nextIndex;
      morningCheckFlow.ended = false;
      if (!savedCurrent) morningCheckFlow.recent = `スキップ: ${skippedDaiNo}`;
      renderMorningCheckModal();
    }

    function machineMemoEntriesForDate(machine, dateValue) {
      return (machine?.memoEntries || []).filter((entry) => entry.date === dateValue);
    }

    function machineMemoEntriesHtml(machine) {
      const entries = normalizeMemoEntries(machine.memoEntries);
      if (!entries.length) return '<div class="row-card"><small>台メモはまだありません。</small></div>';
      return entries.map((entry) => `
        <div class="row-card">
          <strong>${entry.date ? escapeHtml(shortDate(entry.date)) : "日付不明"}</strong><br>
          <small>${escapeHtml(entry.text)}</small>
        </div>
      `).join("");
    }

    function machineMemoSectionHtml(machine, inputId = "machineMemoText", buttonId = "addMachineMemoBtn") {
      return `
        <div class="machine-memo-section">
          <div class="field-row">
            <label for="${escapeHtml(inputId)}">台メモ（釘・癖など）</label>
            <textarea id="${escapeHtml(inputId)}" placeholder="今日の気づきを追記"></textarea>
          </div>
          <div class="modal-actions" style="margin-top:6px">
            <button class="primary" id="${escapeHtml(buttonId)}">追加</button>
          </div>
          <div class="list" id="${escapeHtml(inputId)}List">
            ${machineMemoEntriesHtml(machine)}
          </div>
        </div>
      `;
    }

    function bindMachineMemoAdd(machine, inputId = "machineMemoText", buttonId = "addMachineMemoBtn") {
      const input = byId(inputId);
      const button = byId(buttonId);
      if (!machine || !input || !button) return;
      button.addEventListener("click", () => {
        const text = input.value.trim();
        if (!text) {
          showToast("台メモを入力してください", "error");
          return;
        }
        machine.memoEntries = normalizeMemoEntries(machine.memoEntries);
        machine.memoEntries.unshift({
          id: cryptoId("memo"),
          date: today(),
          text,
          createdAt: nowIso()
        });
        if (!persistWithToast(`台番${machine.daiNo}の台メモを追加しました`)) return;
        input.value = "";
        const list = byId(`${inputId}List`);
        if (list) list.innerHTML = machineMemoEntriesHtml(machine);
        const historyPanel = byId("machineHistoryPanel");
        if (historyPanel) historyPanel.innerHTML = machineHistoryHtml(machine);
        renderAll();
      });
    }

    function openMachineMemoEditor(machineId) {
      const machine = data.machines.find((item) => item.id === machineId);
      if (!machine) return;
      openModal("台メモ（釘・癖など）", "セッションのメモではなく、この台そのものに追記するメモです。過去メモは編集・削除しません。", `
        ${machineMemoSectionHtml(machine, "quickMemoEntryText", "addQuickMemoEntryBtn")}
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
        </div>
      `);
      bindMachineMemoAdd(machine, "quickMemoEntryText", "addQuickMemoEntryBtn");
    }

    function nailRatingSummary(machine) {
      const normalized = normalizeNailRating(machine?.nailRating);
      const values = {
        heso: dailyHesoRating(machine?.id),
        ...normalized
      };
      return NAIL_DISPLAY_KEYS
        .filter((key) => values[key] !== null)
        .map((key) => `${NAIL_RATING_LABELS[key]}${values[key]}`)
        .join("・");
    }

    function nailRatingSectionHtml(machine, options = {}) {
      const rating = normalizeNailRating(machine.nailRating);
      const todayHeso = dailyHesoRating(machine.id);
      const latestHeso = latestHesoRatingBefore(machine.id);
      const summary = nailRatingSummary(machine);
      return `
        <div class="nail-rating-section">
          ${options.showHeader === false ? "" : `<div><strong>釘・ネカセ</strong><br><small>${summary ? `釘: ${escapeHtml(summary)}` : "未評価"}</small></div>`}
          ${NAIL_DISPLAY_KEYS.map((key) => {
            const value = key === DAILY_NAIL_RATING_KEY ? todayHeso : rating[key];
            const reference = key === DAILY_NAIL_RATING_KEY && latestHeso ? `<small class="hint">前日参考: ${escapeHtml(latestHeso.value)}（${escapeHtml(shortDate(latestHeso.date))}）</small>` : "";
            return `
            <div class="nail-rating-row">
              <span>${escapeHtml(NAIL_RATING_LABELS[key])}${reference}</span>
              <div class="nail-rating-chips" data-nail-key="${escapeHtml(key)}">
                ${[1, 2, 3, 4, 5].map((buttonValue) => `<button type="button" data-nail-rating="${buttonValue}" aria-pressed="${value === buttonValue ? "true" : "false"}">${buttonValue}</button>`).join("")}
              </div>
            </div>
          `}).join("")}
        </div>
      `;
    }

    function machineHistoryHtml(machine) {
      const sessions = data.sessions
        .filter((session) => session.machineId === machine.id)
        .slice()
        .sort((a, b) => {
          const dateCompare = String(b.date || "").localeCompare(String(a.date || ""));
          return dateCompare || String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
        });
      const dates = new Set(sessions.map((session) => session.date).filter(Boolean));
      Object.values(data.dailyState?.[machine.id] || {}).forEach((state) => {
        if (state?.date && normalizeRatingValue(state.hesoRating) !== null) dates.add(state.date);
      });
      (machine.memoEntries || []).forEach((entry) => {
        if (entry?.date) dates.add(entry.date);
      });
      const sortedDates = [...dates].sort((a, b) => String(b).localeCompare(String(a)));
      if (!sortedDates.length) return '<div class="row-card"><small>この台の履歴はまだありません。</small></div>';
      return sortedDates.map((date) => {
        const heso = dailyHesoRating(machine.id, date);
        const dateSessions = sessions.filter((session) => session.date === date);
        const memoEntries = machineMemoEntriesForDate(machine, date);
        const hesoText = heso === null ? "未記録" : `${heso}`;
        const memoHtml = memoEntries.length ? `<div class="status-line">${memoEntries.map((entry) => `<span class="badge">${escapeHtml(entry.text)}</span>`).join("")}</div>` : "";
        const cards = dateSessions.length ? dateSessions.map((session) => {
          const derived = deriveSession(session, machine);
          const title = `${session.startTime || "--:--"} / ${session.status === "completed" ? "確定" : "稼働中"}`;
          return `
            <details class="row-card session-details">
              <summary>
                <div class="row-card-head">
                  <div><strong>${escapeHtml(title)}</strong></div>
                  <span class="badge ${session.status === "completed" ? "good" : "dark"}">${session.status === "completed" ? "確定" : "稼働中"}</span>
                </div>
              </summary>
              <small>ヘソ評価 ${escapeHtml(hesoText)} / 回転数 ${numberText(derived.normalSpins, "-")} / 回転率 ${rateText(derived)} /250玉</small><br>
              ${memoHtml}
            </details>
          `;
        }).join("") : `
          <div class="row-card">
            <strong>セッションなし</strong><br>
            <small>ヘソ評価 ${escapeHtml(hesoText)} / 回転数 - / 回転率 -</small><br>
            ${memoHtml}
          </div>
        `;
        return `<div class="ledger-day-heading">― ${escapeHtml(shortDate(date))} の履歴 ―</div>${cards}`;
      }).join("");
    }

    function bindNailRatingChips(machine, root = els.modalBody) {
      root.querySelectorAll("[data-nail-rating]").forEach((button) => {
        button.addEventListener("click", () => {
          const row = button.closest("[data-nail-key]");
          if (!row || !machine) return;
          const wasPressed = button.getAttribute("aria-pressed") === "true";
          row.querySelectorAll("[data-nail-rating]").forEach((item) => item.setAttribute("aria-pressed", "false"));
          if (!wasPressed) button.setAttribute("aria-pressed", "true");
          if (row.dataset.nailKey === DAILY_NAIL_RATING_KEY) {
            const state = ensureDailyState(machine.id, today());
            const selected = row.querySelector('[data-nail-rating][aria-pressed="true"]');
            const rating = normalizeRatingValue(selected?.dataset.nailRating);
            if (rating === null) delete state.hesoRating;
            else state.hesoRating = rating;
            cleanupEmptyDailyState(machine.id, today());
          } else {
            machine.nailRating = readNailRatingFromDom(root);
          }
          persist();
        });
      });
    }

    function readNailRatingFromDom(root = els.modalBody) {
      const rating = {};
      NAIL_RATING_KEYS.forEach((key) => {
        const selected = root.querySelector(`[data-nail-key="${key}"] [data-nail-rating][aria-pressed="true"]`);
        rating[key] = normalizeRatingValue(selected?.dataset.nailRating);
      });
      return normalizeNailRating(rating);
    }

      const summary = machineModelDisplay(machine);
      const source = summary.source ? `（${escapeHtml(summary.source)}）` : "";
      return `
        <div class="machine-summary-row">
          <strong>機種: ${escapeHtml(summary.name)}${source}</strong>
          <button class="small" id="toggleMachineFormBtn">${escapeHtml(summary.action)}</button>
        </div>
      `;
    }

    function machineDetailFormHtml(machine) {
      return `
        <div id="machineDetailForm">
          <div class="field-row" style="margin-top:12px"><label for="machinePreset">機種プリセット</label><select id="machinePreset">

          </select></div>

    function openMachineDetail(daiNo, machineFormExpanded = false) {
      const machine = findMachineByDai(daiNo);
      if (!machine) return;
      const sessions = data.sessions.filter((session) => session.machineId === machine.id);
