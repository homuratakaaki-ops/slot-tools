        </div>
      `);
      byId("saveYutimeBtn").addEventListener("click", () => {
        session.yutimeEnterBalls = normalizeNumber(byId("yutimeBalls").value);
        session.yutimeEnterSpin = normalizeNumber(byId("yutimeSpin").value);
        session.yutimeEnterTime = currentTime();
        session.hitVia = "yutime";
        session.updatedAt = nowIso();
        if (!persistWithToast("遊タイム突入玉を記録しました")) return;
        closeModal();
        renderAll();
      });
    }

    function openRateSummary(session) {
      const machine = data.machines.find((item) => item.id === session.machineId);
      const derived = deriveSession(session, machine);
      const totals = investmentTotals(session);
      openModal("戦果報告", "お疲れ様でした。記録は履歴に保存済みです。未入力は「記録の修正」から補完できます。", `
        <div class="metric-grid">
          <div class="metric"><span>通常回転数</span><strong>${numberText(derived.normalSpins, "-")}</strong></div>
          <div class="metric"><span>通常消費玉</span><strong>${numberText(derived.consumedBalls, "-")}</strong></div>
          <div class="metric"><span>セッション回転率</span><strong>${rateText(derived)}</strong></div>
          <div class="metric"><span>大当たり回数</span><strong>${numberText(session.hitCount, "-")}</strong></div>
          ${derived.estimatedRemainBalls !== null ? `<div class="metric"><span>当選時残り玉</span><strong>${numberText(derived.estimatedRemainBalls, "-")}（概算）</strong></div>` : ""}
          <div class="metric"><span>獲得出玉</span><strong>${payoutText(derived)}</strong></div>
          <div class="metric"><span>R数ベース出玉</span><strong>${numberText(derived.roundBasedPayout, "-")}</strong></div>
          <div class="metric"><span>差玉</span><strong>${numberText(derived.diffBalls, "-")}</strong></div>
          <div class="metric"><span>現金投入合計</span><strong>${numberText(totals.cashYen, 0)} 円</strong></div>
          <div class="metric"><span>換算収支</span><strong>${numberText(derived.profitYen, "-")} 円</strong><small>${derived.profitYen !== null ? `（${escapeHtml(exchangeBallsText(derived.exchangeBalls))}玉交換）` : ""}</small></div>
          ${session.hitVia === "yutime" ? `<div class="metric"><span>遊タイム玉減り</span><strong>${numberText(derived.yutimeLoss, "-")}</strong></div>` : ""}
        </div>
        ${derived.warnings?.length ? `<p class="hint warn">${escapeHtml(derived.warnings.join(" / "))}</p>` : ""}
        <div class="status-line">${missingFields(session).length ? '<span class="badge warn">未入力あり</span>' : '<span class="badge good">入力済み</span>'}</div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          <button id="summaryCarryoverBtn">この持ち玉で次の台へ</button>
          <button id="summarySameMachineBtn">同じ台で続行</button>
          <button class="primary" id="summaryLedgerBtn">履歴で見る</button>
        </div>
      `);
      byId("summaryCarryoverBtn").addEventListener("click", () => startCarryover(session));
      byId("summarySameMachineBtn").addEventListener("click", () => openSameMachineContinuePrompt(session));
      byId("summaryLedgerBtn").addEventListener("click", () => {
        closeModal();
        showView("ledgerView");
        setTimeout(() => {
          document.querySelector(`[data-session-row="${CSS.escape(session.id)}"]`)?.scrollIntoView({ block: "center" });
        }, 0);
      });
    }

    function openSessionEditor(sessionId) {
      const session = findSession(sessionId);
      if (!session) return;
      const labels = storeLabels(session.storeId);
      openModal("記録の修正", "スキップした項目もここで修正できます。", `
        <div class="grid two">
          ${fieldHtml("date", "日付", session.date, "date")}
          ${fieldHtml("startTime", "開始時刻", session.startTime, "time")}
          ${fieldHtml("startSpin", "開始回転数", session.startSpin)}
          ${fieldHtml("currentSpin", "現在回転数", session.currentSpin)}
          ${fieldHtml("startMochidama", "開始持ち玉", session.startMochidama)}
          ${fieldHtml("startSaipurei", "再プレイ残り", session.startSaipurei)}
          ${fieldHtml("startCredit", "カード残高（クレジット残金）", session.startCredit)}
          ${fieldHtml("startTotalHits", "開始時点の累計大当たり回数", session.startTotalHits)}
          ${fieldHtml("prevDayEndSpin", "閉店チェック由来の前日回転", session.prevDayEndSpin)}
          ${fieldHtml("hitSpin", "当選回転数", session.hitSpin)}
          ${fieldHtml("hitRemainBalls", "当選時残り玉", session.hitRemainBalls)}
          ${fieldHtml("yutimeEnterBalls", "遊タイム突入玉", session.yutimeEnterBalls)}
          ${fieldHtml("yutimeEnterSpin", "遊タイム突入時の回転数", session.yutimeEnterSpin)}
          ${fieldHtml("yutimeEnterTime", "遊タイム突入時刻", session.yutimeEnterTime, "time")}
          ${fieldHtml("endTotalHits", "ヤメ時点の累計大当たり回数", session.endTotalHits)}
          ${fieldHtml("hitCount", "大当たり回数", session.hitCount)}
          ${fieldHtml("totalRounds", "合計R数", session.totalRounds)}
          ${fieldHtml("endTotalBalls", "終了合計玉", session.endTotalBalls)}
          ${fieldHtml("endSpin", "ヤメ回転数", session.endSpin)}
          ${fieldHtml("endTime", "終了時刻", session.endTime, "time")}
          ${fieldHtml("zanhoryuBalls", "残保留増減", session.zanhoryuBalls)}
          ${fieldHtml("settlementRecoverYen", "回収金額", session.settlementRecoverYen)}
        </div>
        ${investmentTotalEditorHtml(session)}
        <div class="field-row"><label for="editHitVia">当選経路</label><select id="editHitVia"><option value="">未入力</option><option value="normal">通常</option><option value="yutime">遊タイム</option></select></div>
        <div class="field-row"><label>イベントメモ</label><div><p class="hint">${eventMemoHelp()}</p><div class="label-checks">${labels.map((label) => `<label class="check-chip"><input class="editLabel" type="checkbox" value="${escapeHtml(label)}" ${session.labels.includes(label) ? "checked" : ""}> ${escapeHtml(label)}</label>`).join("") || '<span class="hint">イベントメモ未登録</span>'}</div></div></div>
        <div class="field-row"><label for="editMemo">メモ</label><textarea id="editMemo">${escapeHtml(session.memo || "")}</textarea></div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          <button class="danger" id="deleteSessionBtn">この記録を削除</button>
          <button id="markCompletedBtn">確定扱い</button>
          <button class="primary" id="saveSessionEditBtn">保存</button>
        </div>
      `);
      byId("editHitVia").value = session.hitVia || "";
      byId("deleteSessionBtn").addEventListener("click", () => {
        if (!confirm("削除しますか？")) return;
        if (!confirm("元に戻せません。削除を確定しますか？")) return;
        data.sessions = data.sessions.filter((item) => item.id !== session.id);
        if (activeSessionId === session.id) activeSessionId = null;
        if (!persistWithToast("記録を削除しました")) return;
        closeModal();
        renderAll();
      });
      byId("markCompletedBtn").addEventListener("click", () => {
        session.status = "completed";
        byId("saveSessionEditBtn").click();
      });
      byId("saveSessionEditBtn").addEventListener("click", () => {
        ["date", "startTime", "endTime", "yutimeEnterTime"].forEach((key) => {
          const value = byId("edit_" + key).value.trim();
          session[key] = value || null;
        });
        ["startSpin", "currentSpin", "startMochidama", "startSaipurei", "startCredit", "startTotalHits", "prevDayEndSpin", "hitSpin", "hitRemainBalls", "yutimeEnterBalls", "yutimeEnterSpin", "endTotalHits", "hitCount", "totalRounds", "endTotalBalls", "endSpin", "zanhoryuBalls", "settlementRecoverYen"].forEach((key) => {
          session[key] = normalizeNumber(byId("edit_" + key).value);
        });
        if (!session.settlementRecoverYen) session.settlementRecoverYen = null;
        applyInvestmentTotalAdjustments(session);
        session.hitVia = byId("editHitVia").value || null;
        session.labels = [...document.querySelectorAll(".editLabel:checked")].map((input) => input.value);
        session.memo = byId("editMemo").value.trim();
        session.updatedAt = nowIso();
        if (!persistWithToast("編集を保存しました")) return;
        closeModal();
        renderAll();
      });
    }

    function fieldHtml(key, label, value, type = "text") {
      const inputMode = type === "text" ? ' inputmode="numeric"' : "";
      return `<div class="field-row"><label for="edit_${key}">${label}</label><input id="edit_${key}" type="${type}"${inputMode} value="${escapeHtml(value ?? "")}"></div>`;
    }

    function openModal(title, hint, html, mode = "") {
      els.modalTitle.textContent = title;
      els.modalHint.textContent = hint || "";
      els.modalBody.innerHTML = html;
      els.modalBackdrop.classList.toggle("wizard-mode", mode === "wizard");
      els.modalBackdrop.classList.add("open");
      els.modalBody.querySelectorAll("[data-close]").forEach((button) => button.addEventListener("click", closeModal));
    }

    function closeModal() {
      els.modalBackdrop.classList.remove("open");
      els.modalBackdrop.classList.remove("wizard-mode");
      els.modalBody.innerHTML = "";
      if (modalCancel) {
        const cancel = modalCancel;
        modalCancel = null;
        cancel();
      }
    }

    function findSession(sessionId) {
      return data.sessions.find((session) => session.id === sessionId) || null;
    }

    function activeSession() {
      const store = activeStore();
      if (!store) return null;
      const sessions = activeSessionsForStore(store.id);
      const selected = sessions.find((session) => session.id === activeSessionId);
      const session = selected || sessions[0] || null;
      const previousActiveSessionId = activeSessionId;
      activeSessionId = session?.id || null;
      if (previousActiveSessionId !== activeSessionId) resetRunningTrialState();
      return session;
    }

    function activeSessionsForStore(storeId = data.activeStoreId) {
      return data.sessions
        .filter((session) => session.storeId === storeId && session.status === "active")
        .sort((a, b) => activeSortKey(b).localeCompare(activeSortKey(a)));
    }

    function activeSortKey(session) {
      return String(session.updatedAt || session.createdAt || "") + String(session.createdAt || "");
    }

    function investmentToBalls(item, store = activeStore()) {
      if (investmentSource(item) === "cash") return Number(item.amount || 0) / lendRateForStore(store);
      return Number(item.amount || 0);
    }

    function deriveSession(session, machine = null) {
      const store = storeById(session.storeId);
      const normalInvestedBalls = session.investments.filter((item) => item.phase !== "yutime").reduce((sum, item) => sum + investmentToBalls(item, store), 0);
      const yutimeInvestedBalls = session.investments.filter((item) => item.phase === "yutime").reduce((sum, item) => sum + investmentToBalls(item, store), 0);
      const investedBalls = Math.round(normalInvestedBalls + yutimeInvestedBalls);
      const tapMode = usesTapInvestmentMode(session);
      const hasStartMochidama = session.startMochidama !== null && session.startMochidama !== undefined;
      const startingBalls = Number(session.startMochidama || 0);
      const totalInputBalls = tapMode ? investedBalls : startingBalls + investedBalls;
      const normalInputBalls = tapMode ? normalInvestedBalls : startingBalls + normalInvestedBalls;
      const preset = machine ? presetById(normalizeMachinePresetId(machine)) : null;
      const hasHit = Number(session.hitCount || 0) > 0;
      const warnings = [];
      const yutimeNormalEndSpin = !hasHit && (session.hitVia === "yutime" || session.yutimeEnterBalls !== null) ? yutimeEnterSpinForRate(session, preset) : null;
      const normalEndSpin = session.hitSpin !== null ? session.hitSpin : (hasHit ? null : (session.hitVia === "yutime" || session.yutimeEnterBalls !== null ? yutimeNormalEndSpin : session.endSpin));
      const rawNormalSpins = normalEndSpin !== null && session.startSpin !== null ? normalEndSpin - session.startSpin : null;
      const normalSpins = rawNormalSpins !== null && rawNormalSpins < 0 ? null : rawNormalSpins;
      if (rawNormalSpins !== null && rawNormalSpins < 0) warnings.push("通常回転数の入力を確認");
      const hitsRoundPayout = hasHit ? hitRoundBasedPayout(session, normalizeMachinePresetId(machine)) : null;
      const roundBasedPayout = hitsRoundPayout !== null ? hitsRoundPayout : (hasHit && machine?.roundBalls !== null && machine?.roundBalls !== undefined && session.totalRounds !== null && session.totalRounds !== undefined ? machine.roundBalls * session.totalRounds : null);
      const standardPayout = hasHit && preset?.standardPayout ? preset.standardPayout * session.hitCount : null;
      const estimatedPayout = hasHit ? (roundBasedPayout !== null ? roundBasedPayout : standardPayout) : null;
      const estimatedRemainBalls = hasHit && session.hitRemainBalls === null && estimatedPayout !== null && session.endTotalBalls !== null ? Math.max(0, session.endTotalBalls - estimatedPayout) : null;
      const normalEndBalls = session.yutimeEnterBalls !== null ? session.yutimeEnterBalls : (hasHit && session.hitRemainBalls !== null ? session.hitRemainBalls : estimatedRemainBalls);
      const rawConsumedBalls = normalSpins !== null ? (tapMode ? normalInputBalls : (normalEndBalls !== null ? normalInputBalls - Number(normalEndBalls || 0) : null)) : null;
      const consumedBalls = rawConsumedBalls !== null && rawConsumedBalls < 0 ? null : rawConsumedBalls;
      if (rawConsumedBalls !== null && rawConsumedBalls < 0) warnings.push("通常消費玉の入力を確認");
      const fallbackConsumed = normalSpins !== null && normalInputBalls >= 0 ? normalInputBalls : null;
      const rateBase = tapMode ? consumedBalls : (hasStartMochidama ? (normalEndBalls !== null ? consumedBalls : fallbackConsumed) : null);
      const rate = normalSpins !== null && rateBase > 0 ? normalSpins / rateBase * 250 : null;
      const rateUnavailableReason = !tapMode && !hasStartMochidama ? "持ち玉未入力" : "";
      const pointBalls = session.hitRemainBalls !== null ? session.hitRemainBalls : (estimatedRemainBalls !== null ? estimatedRemainBalls : totalInputBalls);
      const rawHitBalls = session.endTotalBalls !== null && hasHit && pointBalls !== null ? session.endTotalBalls - pointBalls : null;
      const hitBalls = session.hitRemainBalls === null && estimatedPayout !== null ? estimatedPayout : rawHitBalls;
      const averageRoundPayout = roundBasedPayout !== null && hasHit ? Math.round(roundBasedPayout / session.hitCount) : null;
      const yutimeEndBalls = session.hitRemainBalls !== null ? session.hitRemainBalls : (estimatedRemainBalls !== null ? estimatedRemainBalls : session.endTotalBalls);
      const rawYutimeLoss = session.hitVia === "yutime" && session.yutimeEnterBalls !== null && yutimeEndBalls !== null ? session.yutimeEnterBalls + yutimeInvestedBalls - yutimeEndBalls : null;
      const yutimeLoss = rawYutimeLoss !== null && rawYutimeLoss < 0 ? null : rawYutimeLoss;
      if (rawYutimeLoss !== null && rawYutimeLoss < 0) warnings.push("遊タイム玉減りの入力を確認");
      const externalInvestedBalls = session.investments.filter((item) => investmentSource(item) !== "mochidama").reduce((sum, item) => sum + investmentToBalls(item, store), 0);
      const diffInputBalls = tapMode ? startingBalls + externalInvestedBalls : totalInputBalls;
      const diffBalls = session.endTotalBalls !== null ? Math.round(session.endTotalBalls - diffInputBalls + Number(session.zanhoryuBalls || 0)) : null;
      const exchangeBalls = exchangeBallsForStore(store);
      const exchangeRate = exchangeRateForStore(store);
      const profitYen = diffBalls !== null ? Math.round(diffBalls * exchangeRate) : null;
      const isEstimatedPayout = session.hitRemainBalls === null && estimatedPayout !== null;
      const isEstimatedRate = isEstimatedPayout && rate !== null && (session.yutimeEnterBalls === null || session.yutimeEnterBalls === undefined);
      return {
        investedBalls,
        normalInvestedBalls: Math.round(normalInvestedBalls),
        yutimeInvestedBalls: Math.round(yutimeInvestedBalls),
        tapMode,
        totalInputBalls,
        normalSpins,
        consumedBalls: rateBase,
        rate,
        rateUnavailableReason,
        isEstimatedRate,
        hitBalls,
        estimatedRemainBalls,
        isEstimatedPayout,
        roundBasedPayout,
        averageRoundPayout,
        yutimeLoss: yutimeLoss !== null ? Math.round(yutimeLoss) : null,
        diffBalls,
        profitYen,
        exchangeBalls,
        exchangeRate,
        warnings
      };
    }

    function yutimeEnterSpinForRate(session, preset = null) {
      const explicitSpin = normalizeNumber(session.yutimeEnterSpin);
      if (explicitSpin !== null) return explicitSpin;
      const prevSpin = normalizeNumber(session.prevDayEndSpin);
      if (prevSpin === null) return null;
      const tenjo = preset?.spec?.tenjo || 950;
      const inferred = tenjo - prevSpin;
      return inferred >= 0 ? inferred : null;
    }

    function machineStats(machineId) {
      const sessions = filteredSessions().filter((session) => session.machineId === machineId);
      return aggregateStats(sessions);
    }

    function emptyStats() {
      return {
        spins: 0,
        consumed: 0,
        rate: null,
        estimatedCount: 0,
        hitBalls: 0,
        hitCount: 0,
        averagePayout: null,
        yutimeLoss: 0,
        yutimeLossCount: 0,
        averageYutimeLoss: null
      };
    }

    function buildMachineStatsMap(sessions) {
      const groups = new Map();
      sessions.forEach((session) => {
        if (!groups.has(session.machineId)) groups.set(session.machineId, []);
        groups.get(session.machineId).push(session);
      });
      const statsByMachine = new Map();
      groups.forEach((groupSessions, machineId) => {
        statsByMachine.set(machineId, aggregateStats(groupSessions));
      });
      return statsByMachine;
    }

    function rateToneClass(machine, rate) {
      const preset = presetById(normalizeMachinePresetId(machine));
      if (!preset?.evSupported || rate === null || rate === undefined) return "";
      if (rate >= RATE_THRESHOLDS.good) return "good";
      if (rate < RATE_THRESHOLDS.bad) return "bad";
      return "";
    }

    function aggregateStats(sessions) {
      let spins = 0;
      let consumed = 0;
      let estimatedCount = 0;
      let hitBalls = 0;
      let hitCount = 0;
      let yutimeLoss = 0;
      let yutimeLossCount = 0;
      sessions.forEach((session) => {
        const machine = data.machines.find((item) => item.id === session.machineId) || null;
        const derived = deriveSession(session, machine);
        const isEstimated = derived.isEstimatedRate || derived.isEstimatedPayout;
        if (derived.normalSpins !== null && derived.normalSpins > 0 && derived.consumedBalls > 0) {
          spins += derived.normalSpins;
          consumed += derived.consumedBalls;
        }
        if (derived.hitBalls !== null && session.hitCount > 0) {
          hitBalls += derived.hitBalls;
          hitCount += session.hitCount;
        }
        if (isEstimated) estimatedCount += 1;
        if (derived.yutimeLoss !== null) {
          yutimeLoss += derived.yutimeLoss;
          yutimeLossCount += 1;
        }
      });
      return {
        spins,
        consumed: Math.round(consumed),
        rate: consumed > 0 ? spins / consumed * 250 : null,
        estimatedCount,
        hitBalls: Math.round(hitBalls),
        hitCount,
        averagePayout: hitCount > 0 ? hitBalls / hitCount : null,
        yutimeLoss: Math.round(yutimeLoss),
        yutimeLossCount,
        averageYutimeLoss: yutimeLossCount > 0 ? yutimeLoss / yutimeLossCount : null
      };
    }

    function filteredSessions() {
      const store = activeStore();
      if (!store) return [];
      const sessions = data.sessions.filter((session) => session.storeId === store.id && session.status === "completed");
      if (!selectedLabelFilters.size) return sessions;
      return sessions.filter((session) => {
        const labels = [...automaticLabelsForDate(session.date), ...(session.labels || [])];
        return labels.some((label) => selectedLabelFilters.has(label));
      });
    }

    function latestEndInfo(machineId) {
      const candidates = data.sessions
        .filter((session) => session.machineId === machineId && session.endSpin !== null)
        .sort((a, b) => String(b.date + b.updatedAt).localeCompare(String(a.date + a.updatedAt)));
      const latest = candidates[0];
      return latest ? { spin: latest.endSpin, date: latest.date } : null;
    }

    function missingFields(session) {
      const keys = ["startSpin", "startTime", "startMochidama", "startSaipurei", "startCredit", "startTotalHits", "hitCount", "endTotalBalls", "endSpin", "endTime"];
      if (session.hitCount !== 0) keys.splice(5, 0, "hitSpin", "hitRemainBalls", "hitVia");
      if (session.hitCount !== 0) keys.splice(keys.indexOf("hitCount"), 0, "endTotalHits");
      return keys.filter((key) => session[key] === null || session[key] === undefined || session[key] === "");
    }

    function exportJson() {
      const raw = JSON.stringify(data, null, 2);
      const blob = new Blob([raw], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "yutime-v3-export-" + today() + ".json";
      a.click();
      URL.revokeObjectURL(url);
    }
  })();
  </script>
</body>
