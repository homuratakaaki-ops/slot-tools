          </div>
        </div>
      `;
    }

    function fieldHtml(key, label, value, type = "text") {
      const inputMode = type === "text" ? ' inputmode="numeric"' : "";
      return `<div class="field-row"><label for="edit_${key}">${label}</label><input id="edit_${key}" type="${type}"${inputMode} value="${escapeHtml(value ?? "")}"></div>`;
    }

    // B94: 入力・判断の場に「いまどの台か」を必ず出す。文字列は必ずここで組む
    function machineContextLine(target) {
      const machine = target && target.machineId
        ? data.machines.find((item) => item.id === target.machineId)
        : target;
      if (!machine) return "";
      return `<p class="machine-context">台${escapeHtml(machine.daiNo || "不明")} ／ ${escapeHtml(machine.modelName || "機種未設定")}</p>`;
    }

    function openModal(title, hint, html, mode = "") {
      modalGuard = null;
      els.modalTitle.textContent = title;
      els.modalHint.textContent = hint || "";
      els.modalBody.innerHTML = html;
      els.modalBackdrop.classList.toggle("wizard-mode", mode === "wizard");
      els.modalBackdrop.classList.add("open");
      els.modalBody.querySelectorAll("[data-close]").forEach((button) => button.addEventListener("click", closeModal));
    }

    function closeModal() {
      if (modalGuard && modalGuard() === false) return;
      modalGuard = null;
      els.modalBackdrop.classList.remove("open");
      els.modalBackdrop.classList.remove("wizard-mode");
      els.modalBody.innerHTML = "";
      if (modalCancel) {
        const cancel = modalCancel;
        modalCancel = null;
        cancel();
      }
    }

    function findSession(sessionId) {
      return data.sessions.find((session) => session.id === sessionId) || null;
    }

    function activeSession() {
      const store = activeStore();
      if (!store) return null;
      const sessions = activeSessionsForStore(store.id);
      const selected = sessions.find((session) => session.id === activeSessionId);
      const session = selected || sessions[0] || null;
      const previousActiveSessionId = activeSessionId;
      activeSessionId = session?.id || null;
      if (previousActiveSessionId !== activeSessionId) resetRunningTrialState();
      return session;
    }

    function activeSessionsForStore(storeId = data.activeStoreId) {
      return data.sessions
        .filter((session) => session.storeId === storeId && session.status === "active")
        .sort((a, b) => activeSortKey(b).localeCompare(activeSortKey(a)));
    }

    function activeSortKey(session) {
      return String(session.updatedAt || session.createdAt || "") + String(session.createdAt || "");
    }

    function investmentToBalls(item, store = activeStore()) {
      if (investmentSource(item) === "cash") return Number(item.amount || 0) / lendRateForStore(store);
      return Number(item.amount || 0);
    }

    function tapModeNormalEndSnapshot(session, hasHit = Number(session?.hitCount || 0) > 0) {
      const yutimeBalls = normalizeNumber(session?.yutimeEnterBalls);
      if (yutimeBalls !== null) return yutimeBalls;
      if (!hasHit) return null;
      return normalizeNumber(session?.hitRemainBalls);
    }

    function tapModeNormalBaselineBalls(session, store = storeById(session?.storeId)) {
      const normalExtraBalls = normalRateInvestments(session)
        .filter((item) => investmentSource(item) !== "mochidama")
        .reduce((sum, item) => sum + investmentToBalls(item, store), 0);
      return Number(session?.startMochidama || 0) + normalExtraBalls;
    }

    function tapModeNormalConsumptionFallback(session, hasHit = Number(session?.hitCount || 0) > 0, store = storeById(session?.storeId)) {
      return tapModeNormalConsumedCandidates(session, null, hasHit, store).fallback;
    }

    function tapModeNormalConsumedCandidates(session, normalInputBalls = null, hasHit = Number(session?.hitCount || 0) > 0, store = storeById(session?.storeId)) {
      const taps = normalizeNumber(normalInputBalls);
      const hitTrackedBalls = normalizeNumber(session?.hitTrackedBalls);
      if (usesTapInvestmentMode(session) && hitTrackedBalls !== null && normalizeNumber(session?.yutimeEnterBalls) === null) {
        const hitRemainBalls = normalizeNumber(session?.hitRemainBalls);
        const correction = hitRemainBalls === null ? 0 : hitRemainBalls - hitTrackedBalls;
        const corrected = taps === null ? null : taps - correction;
        return { tray: null, taps, corrected, correction, selected: normalizeConsumedBallsSource(session?.consumedBallsSource), fallback: false, divergent: false, threshold: CONSUMED_BALLS_DIVERGENCE_THRESHOLD };
      }
      const endBalls = tapModeNormalEndSnapshot(session, hasHit);
      if (endBalls === null) {
        return { tray: null, taps, selected: normalizeConsumedBallsSource(session?.consumedBallsSource), fallback: false, divergent: false, threshold: CONSUMED_BALLS_DIVERGENCE_THRESHOLD };
      }
      const baselineBalls = tapModeNormalBaselineBalls(session, store);
      const tray = baselineBalls >= endBalls ? baselineBalls - endBalls : null;
      const divergent = tray !== null && taps !== null && Math.abs(tray - taps) >= CONSUMED_BALLS_DIVERGENCE_THRESHOLD;
      return {
        tray,
        taps,
        selected: normalizeConsumedBallsSource(session?.consumedBallsSource),
        fallback: baselineBalls < endBalls,
        divergent,
        threshold: CONSUMED_BALLS_DIVERGENCE_THRESHOLD
      };
    }

    function tapModeNormalConsumedBalls(session, normalInputBalls, hasHit = Number(session?.hitCount || 0) > 0, store = storeById(session?.storeId), candidates = null) {
      const values = candidates || tapModeNormalConsumedCandidates(session, normalInputBalls, hasHit, store);
      if (values.corrected !== null && values.corrected !== undefined) return values.corrected;
      const selected = normalizeConsumedBallsSource(session?.consumedBallsSource);
      if (values.divergent && selected && values[selected] !== null && values[selected] !== undefined) return values[selected];
      return values.tray !== null && values.tray !== undefined ? values.tray : values.taps;
    }

    // S1: 通常時／遊タイムを区間（segment）として持つ。
    // startSpin / endSpin はカウンター基準の回転数、holdSpins は区間先頭の無料保留（S1では常に0）。
    function blankSegment(kind, overrides = {}) {
      return {
        id: null,
        kind: kind === "yutime" ? "yutime" : "normal",
        source: "migrated",
        startSpin: null,
        startAt: null,
        startTrackedBalls: null,
        holdSpins: 0,
        endSource: null,
        endSpin: null,
        endAt: null,
        endRemainBalls: null,
        endTrackedBalls: null,
        ...overrides
      };
    }

    function normalizeSegment(segment) {
      return blankSegment(segment?.kind, {
        id: segment?.id || null,
        source: segment?.source === "user" ? "user" : "migrated",
        startSpin: normalizeNumber(segment?.startSpin),
        startAt: segment?.startAt || null,
        startTrackedBalls: normalizeNumber(segment?.startTrackedBalls),
        holdSpins: normalizeNumber(segment?.holdSpins) ?? 0,
        endSource: ["hit", "yutime", "end"].includes(segment?.endSource) ? segment.endSource : null,
        endSpin: normalizeNumber(segment?.endSpin),
        endAt: segment?.endAt || null,
        endRemainBalls: normalizeNumber(segment?.endRemainBalls),
        endTrackedBalls: normalizeNumber(segment?.endTrackedBalls)
      });
    }

    // 移行の入口。読み込み時は segments を持つデータを再変換しない（二重移行の防止）。
    // 以降フラットフィールドが編集されたときの追従は resyncSessionSegments が担う。
    function normalizeSessionSegments(session) {
      const source = Array.isArray(session?.segments) && session.segments.length
        ? session.segments.map(normalizeSegment)
        : buildSessionSegments(session);
      return source.map((segment) => ({ ...segment, id: segment.id || cryptoId("seg") }));
    }

    // §2-1: 投資・当選を所属区間に紐づける。遊タイム中の投資は遊タイム区間、それ以外は通常区間。
    // 区間が組み直されて参照先が消えた segmentId は付け直す。
    function applySegmentIds(session) {
      const segments = Array.isArray(session?.segments) ? session.segments : [];
      const validIds = new Set(segments.map((segment) => segment.id).filter(Boolean));
      const normalSegmentId = segments.find((segment) => segment.kind === "normal")?.id || null;
      const yutimeSegmentId = segments.find((segment) => segment.kind === "yutime")?.id || null;
      session.investments = (Array.isArray(session.investments) ? session.investments : []).map((item) => ({
        ...item,
        segmentId: validIds.has(item.segmentId) ? item.segmentId : (item.phase === "yutime" ? yutimeSegmentId : normalSegmentId)
      }));
      session.hits = (Array.isArray(session.hits) ? session.hits : []).map((hit) => ({
        ...hit,
        segmentId: validIds.has(hit.segmentId) ? hit.segmentId : (session.hitVia === "yutime" && yutimeSegmentId ? yutimeSegmentId : normalSegmentId)
      }));
      return session;
    }

    // S1 では区間はフラットフィールドの写像。記録を修正しても両者がずれないよう、
    // 保存時に区間を組み直す。区間IDは種別ごとに引き継ぐ（segmentId の参照を切らないため）。
    // S2 で区間を直接編集できるようにするときは、ここで上書きしてよい範囲を見直すこと。
    function resyncSessionSegments(session) {
      const previous = Array.isArray(session?.segments) ? session.segments : [];
      if (!previous.some((segment) => segment?.source === "user")) {
        session.segments = buildSessionSegments(session).map((segment) => {
          const prior = previous.find((item) => item?.kind === segment.kind);
          return { ...segment, id: prior?.id || cryptoId("seg"), holdSpins: prior ? Number(prior.holdSpins || 0) : segment.holdSpins };
        });
        applySegmentIds(session);
        return session;
      }
      session.segments = syncSegmentEdges(session, previous.map(normalizeSegment));
      applySegmentIds(session);
      return session;
    }

    // S2: user 区間を含むセッションで、フラットフィールドと対応する端点だけを更新する。
    // 先頭区間の開始、セッション開始、遊タイム区間の境界、遊タイム突入。
    // endSource が "hit" / "end" の区間は当り欄 / ヤメ欄。それ以外は触らない。
    function syncSegmentEdges(session, segments) {
      if (!segments.length) return segments;
      const first = segments[0];
      first.startSpin = normalizeNumber(session?.startSpin);
      first.startAt = session?.startTime || null;
      first.startTrackedBalls = normalizeNumber(session?.startMochidama);
      const yutimeIndex = segments.findIndex((segment) => segment.kind === "yutime");
      if (yutimeIndex >= 0) {
        const enterSpin = normalizeNumber(session?.yutimeEnterSpin);
        segments[yutimeIndex].startSpin = enterSpin;
        segments[yutimeIndex].startAt = session?.yutimeEnterTime || null;
        segments[yutimeIndex].startTrackedBalls = normalizeNumber(session?.yutimeEnterBalls);
        const before = segments[yutimeIndex - 1];
        if (before) {
          before.endSpin = enterSpin;
          before.endAt = session?.yutimeEnterTime || null;
          before.endSource = "yutime";
        }
      }
      const hitSegment = lastSegmentByEndSource(segments, "hit");
      if (hitSegment) {
        hitSegment.endSpin = normalizeNumber(session?.hitSpin);
        hitSegment.endRemainBalls = normalizeNumber(session?.hitRemainBalls);
        hitSegment.endTrackedBalls = normalizeNumber(session?.hitTrackedBalls);
      }
      const endSegment = lastSegmentByEndSource(segments, "end");
      if (endSegment) endSegment.endSpin = normalizeNumber(session?.endSpin);
      return segments;
    }

    function lastSegmentByEndSource(segments, endSource) {
      for (let index = segments.length - 1; index >= 0; index -= 1) {
        if (segments[index]?.endSource === endSource) return segments[index];
      }
      return null;
    }

    // 旧フラットフィールドから区間を組み立てる。移行（normalizeData）と、
    // segments を持たない素のセッションを計算するときの両方で使う。
    // 当選時刻は HH:MM の記録欄が無いため endAt には入れない（TZ依存の値を保存しない）。
    function buildSessionSegments(session) {
      const hasHit = Number(session?.hitCount || 0) > 0;
      const hitSpin = normalizeNumber(session?.hitSpin);
      const yutimeEnterSpin = normalizeNumber(session?.yutimeEnterSpin);
      const normal = blankSegment("normal", {
        startSpin: normalizeNumber(session?.startSpin),
        startAt: session?.startTime || null,
        startTrackedBalls: normalizeNumber(session?.startMochidama),
        holdSpins: 0
      });
      const segments = [normal];
      if (yutimeEnterSpin !== null) {
        normal.endSpin = yutimeEnterSpin;
        normal.endSource = "yutime";
        normal.endAt = session?.yutimeEnterTime || null;
        const yutime = blankSegment("yutime", {
          startSpin: yutimeEnterSpin,
          startAt: session?.yutimeEnterTime || null,
          startTrackedBalls: normalizeNumber(session?.yutimeEnterBalls),
          holdSpins: 0
        });
        if (hasHit || hitSpin !== null) {
          yutime.endSpin = hitSpin;
          yutime.endSource = "hit";
          yutime.endRemainBalls = normalizeNumber(session?.hitRemainBalls);
          yutime.endTrackedBalls = normalizeNumber(session?.hitTrackedBalls);
        }
        segments.push(yutime);
      } else if (session?.hitVia !== "yutime" && (hasHit || hitSpin !== null)) {
        normal.endSpin = hitSpin;
        normal.endSource = "hit";
        normal.endRemainBalls = normalizeNumber(session?.hitRemainBalls);
        normal.endTrackedBalls = normalizeNumber(session?.hitTrackedBalls);
      }
      // S2/§3: 当らず終了したセッションは、末尾の未確定区間をヤメ回転数で閉じる。
      // 従来 segmentEndSpinForRate のフォールバックが返していた値と同じ。
      const endSpin = normalizeNumber(session?.endSpin);
      const last = segments[segments.length - 1];
      if (session?.status === "completed" && !hasHit && hitSpin === null && endSpin !== null && last.endSpin === null) {
        last.endSpin = endSpin;
        last.endSource = "end";
      }
      return segments;
    }

    function sessionSegments(session) {
      return Array.isArray(session?.segments) && session.segments.length
        ? session.segments
        : buildSessionSegments(session);
    }

    // §3.1: 区間の終端カウンター。保存済みの endSpin を優先し、
    // 端点が空になる旧データにはこれまでのフォールバック（ヤメ回転数・遊タイム突入回転数の推定）を残す。
    // S4/A-1: 稼働中に閉じていない通常区間は「いま打っている区間」なので、当選の有無に関わらず
    // 現在回転数で閉じる。当選が1回でもあると null を返していたため、2周目以降の回転率が
    // 前の区間の値で固定されていた。完了済みセッションの扱いは従来のまま変えない。
    function segmentEndSpinForRate(segment, session, preset = null) {
      if (segment?.endSpin !== null && segment?.endSpin !== undefined) return segment.endSpin;
      if (segment?.kind !== "normal") return null;
      if (session?.status !== "completed") {
        // 遊タイム突入回転数が未記録の旧データだけ、従来どおり推定値へフォールバックする。
        if (normalizeNumber(session?.yutimeEnterSpin) === null
          && (session?.hitVia === "yutime" || normalizeNumber(session?.yutimeEnterBalls) !== null)) {
          return yutimeEnterSpinForRate(session, preset);
        }
        return normalizeNumber(session?.currentSpin) ?? normalizeNumber(session?.endSpin);
      }
      if (Number(session?.hitCount || 0) > 0) return null;
      if (session?.hitVia === "yutime" || normalizeNumber(session?.yutimeEnterBalls) !== null) {
        return yutimeEnterSpinForRate(session, preset);
      }
      return normalizeNumber(session?.endSpin);
    }

    function segmentPlayedSpins(segment, session, preset = null) {
      const start = normalizeNumber(segment?.startSpin);
      const end = segmentEndSpinForRate(segment, session, preset);
      if (start === null || end === null) return null;
      const raw = end - start;
      if (raw < 0) return raw;
      return Math.max(0, raw - Math.max(0, Number(segment?.holdSpins || 0)));
    }

    // §3.1: 区間の消費玉。B95の補正（endRemainBalls − endTrackedBalls）と
    // B89の乖離時 consumedBallsSource は tapMode 側の既存関数がそのまま担う。
    // S1 の通常区間は1つなので、tapMode ではセッション単位の集計をそのまま区間の消費玉として使う。
    function segmentConsumedBalls(segment, context) {
      const { session, store, tapMode, hasHit, inputBalls, candidates, legacyEndBalls, multiNormal } = context;
      if (multiNormal) return segmentTapConsumedBalls(segment, session, store);
      if (tapMode) return tapModeNormalConsumedBalls(session, inputBalls, hasHit, store, candidates);
      const endBalls = segment?.endRemainBalls !== null && segment?.endRemainBalls !== undefined
        ? segment.endRemainBalls
        : legacyEndBalls;
      return endBalls !== null && endBalls !== undefined ? inputBalls - Number(endBalls || 0) : null;
    }

    // S2: 区間に紐づいた通常時投資（合計）に B95 の補正を掛ける。
    function segmentTapConsumedBalls(segment, session, store) {
      const taps = segmentNormalInvestments(session, segment?.id)
        .reduce((sum, item) => sum + investmentToBalls(item, store), 0);
      const endRemain = normalizeNumber(segment?.endRemainBalls);
      const endTracked = normalizeNumber(segment?.endTrackedBalls);
      const correction = endRemain !== null && endTracked !== null ? endRemain - endTracked : 0;
      return taps - correction;
    }

    function segmentNormalInvestments(session, segmentId) {
      if (!segmentId) return [];
      return (Array.isArray(session?.investments) ? session.investments : [])
        .filter((item) => item.phase !== "yutime" && item.segmentId === segmentId);
    }

    function sumSegmentValues(values) {
      if (!values.length) return null;
      if (values.some((value) => value === null || value === undefined)) return null;
      return values.reduce((sum, value) => sum + value, 0);
    }

    function deriveSession(session, machine = null) {
      const store = storeById(session.storeId);
      const segments = sessionSegments(session);
      const normalSegments = segments.filter((segment) => segment.kind === "normal");
      const multiNormal = normalSegments.length > 1;
      const normalInvestedBalls = (multiNormal
        ? (Array.isArray(session.investments) ? session.investments : []).filter((item) => item.phase !== "yutime")
        : normalRateInvestments(session)
      ).reduce((sum, item) => sum + investmentToBalls(item, store), 0);
      const yutimeInvestedBalls = session.investments.filter((item) => item.phase === "yutime").reduce((sum, item) => sum + investmentToBalls(item, store), 0);
      // S2: 2周目以降の投資は「当り前」フィルタから漏れるため、通常区間が複数のときは
      // 遊タイム以外の投資をすべて通常時として集計する。単一区間セッションは従来どおり。
      const investedBalls = Math.round(normalInvestedBalls + yutimeInvestedBalls);
      const tapMode = usesTapInvestmentMode(session);
      const hasStartMochidama = session.startMochidama !== null && session.startMochidama !== undefined;
      const startingBalls = Number(session.startMochidama || 0);
      const totalInputBalls = tapMode ? investedBalls : startingBalls + investedBalls;
      const normalInputBalls = tapMode ? normalInvestedBalls : startingBalls + normalInvestedBalls;
      const preset = machine ? presetById(normalizeMachinePresetId(machine)) : null;
      const hasHit = Number(session.hitCount || 0) > 0;
      const warnings = [];
      // §3.2: 通常時の表示値は通常区間の合算から求める。移行後の区間は1〜2個なので合算＝単区間。
      const rawNormalSpins = sumSegmentValues(normalSegments.map((segment) => segmentPlayedSpins(segment, session, preset)));
      const normalSpins = rawNormalSpins !== null && rawNormalSpins < 0 ? null : rawNormalSpins;
      if (rawNormalSpins !== null && rawNormalSpins < 0) warnings.push("通常回転数の入力を確認");
      const hitsRoundPayout = hasHit ? hitRoundBasedPayout(session, normalizeMachinePresetId(machine)) : null;
      const roundBasedPayout = hitsRoundPayout !== null ? hitsRoundPayout : (hasHit && machine?.roundBalls !== null && machine?.roundBalls !== undefined && session.totalRounds !== null && session.totalRounds !== undefined ? machine.roundBalls * session.totalRounds : null);
      const standardPayout = hasHit && preset?.standardPayout ? preset.standardPayout * session.hitCount : null;
      const estimatedPayout = hasHit ? (roundBasedPayout !== null ? roundBasedPayout : standardPayout) : null;
      const estimatedRemainBalls = hasHit && session.hitRemainBalls === null && estimatedPayout !== null && session.endTotalBalls !== null ? Math.max(0, session.endTotalBalls - estimatedPayout) : null;
      const normalEndBalls = session.yutimeEnterBalls !== null ? session.yutimeEnterBalls : (hasHit && session.hitRemainBalls !== null ? session.hitRemainBalls : estimatedRemainBalls);
      const tapConsumedCandidates = tapMode ? tapModeNormalConsumedCandidates(session, normalInputBalls, hasHit, store) : null;
      const consumedContext = { session, store, tapMode, hasHit, inputBalls: normalInputBalls, candidates: tapConsumedCandidates, legacyEndBalls: normalEndBalls, multiNormal };
      const rawConsumedBalls = normalSpins !== null ? sumSegmentValues(normalSegments.map((segment) => segmentConsumedBalls(segment, consumedContext))) : null;
      const consumedBalls = rawConsumedBalls !== null && rawConsumedBalls < 0 ? null : rawConsumedBalls;
      if (tapMode && normalSpins !== null && tapConsumedCandidates?.fallback) warnings.push("通常消費玉の入力を確認");
      if (rawConsumedBalls !== null && rawConsumedBalls < 0) warnings.push("通常消費玉の入力を確認");
      const fallbackConsumed = normalSpins !== null && normalInputBalls >= 0 ? normalInputBalls : null;
      const rateBase = tapMode ? consumedBalls : (hasStartMochidama ? (normalEndBalls !== null ? consumedBalls : fallbackConsumed) : null);
      const rate = normalSpins !== null && rateBase > 0 ? normalSpins / rateBase * 250 : null;
      const rateUnavailableReason = !tapMode && !hasStartMochidama ? "持ち玉未入力" : "";
      const pointBalls = session.hitRemainBalls !== null ? session.hitRemainBalls : (estimatedRemainBalls !== null ? estimatedRemainBalls : totalInputBalls);
      const rawHitBalls = session.endTotalBalls !== null && hasHit && pointBalls !== null ? session.endTotalBalls - pointBalls : null;
      const hitBalls = session.hitRemainBalls === null && estimatedPayout !== null ? estimatedPayout : rawHitBalls;
      const averageRoundPayout = roundBasedPayout !== null && hasHit ? Math.round(roundBasedPayout / session.hitCount) : null;
      const yutimeEndBalls = session.hitRemainBalls !== null ? session.hitRemainBalls : (estimatedRemainBalls !== null ? estimatedRemainBalls : session.endTotalBalls);
      const rawYutimeLoss = session.hitVia === "yutime" && session.yutimeEnterBalls !== null && yutimeEndBalls !== null ? session.yutimeEnterBalls + yutimeInvestedBalls - yutimeEndBalls : null;
      const yutimeLoss = rawYutimeLoss !== null && rawYutimeLoss < 0 ? null : rawYutimeLoss;
      if (rawYutimeLoss !== null && rawYutimeLoss < 0) warnings.push("遊タイム玉減りの入力を確認");
      const externalInvestedBalls = session.investments.filter((item) => investmentSource(item) !== "mochidama").reduce((sum, item) => sum + investmentToBalls(item, store), 0);
      const diffInputBalls = tapMode ? startingBalls + externalInvestedBalls : totalInputBalls;
      const diffBalls = session.endTotalBalls !== null ? Math.round(session.endTotalBalls - diffInputBalls + Number(session.zanhoryuBalls || 0)) : null;
      const exchangeBalls = exchangeBallsForStore(store);
      const exchangeRate = exchangeRateForStore(store);
      const profitYen = profitYenForSession(session, investmentTotals(session), store);
      const actualPayoutTotal = sessionActualBallsTotal(session);
      const isEstimatedPayout = session.hitRemainBalls === null && estimatedPayout !== null;
      const isEstimatedRate = isEstimatedPayout && rate !== null && (session.yutimeEnterBalls === null || session.yutimeEnterBalls === undefined);
      return {
        investedBalls,
        normalInvestedBalls: Math.round(normalInvestedBalls),
        yutimeInvestedBalls: Math.round(yutimeInvestedBalls),
        tapMode,
        totalInputBalls,
        normalSpins,
        consumedBalls: rateBase,
        consumedBallsSource: normalizeConsumedBallsSource(session.consumedBallsSource),
        consumedBallsCandidates: tapConsumedCandidates && normalSpins !== null ? {
          tray: tapConsumedCandidates.tray !== null ? Math.round(tapConsumedCandidates.tray) : null,
          taps: tapConsumedCandidates.taps !== null ? Math.round(tapConsumedCandidates.taps) : null,
          corrected: tapConsumedCandidates.corrected !== null && tapConsumedCandidates.corrected !== undefined ? Math.round(tapConsumedCandidates.corrected) : null,
          correction: tapConsumedCandidates.correction !== null && tapConsumedCandidates.correction !== undefined ? Math.round(tapConsumedCandidates.correction) : null,
          selected: tapConsumedCandidates.selected,
          fallback: tapConsumedCandidates.fallback,
          divergent: tapConsumedCandidates.divergent,
          threshold: tapConsumedCandidates.threshold
        } : null,
        rate,
        rateUnavailableReason,
        isEstimatedRate,
        hitBalls,
        actualPayoutTotal,
        estimatedRemainBalls,
        isEstimatedPayout,
        roundBasedPayout,
        averageRoundPayout,
        yutimeLoss: yutimeLoss !== null ? Math.round(yutimeLoss) : null,
        diffBalls,
        profitYen,
        exchangeBalls,
        exchangeRate,
        warnings
      };
    }

    function yutimeEnterSpinForRate(session, preset = null) {
      const explicitSpin = normalizeNumber(session.yutimeEnterSpin);
      if (explicitSpin !== null) return explicitSpin;
      const prevSpin = normalizeNumber(session.prevDayEndSpin);
      if (prevSpin === null) return null;
      // 前日ヤメ回転数も遊タイム突入回転数もカウンター基準なので、カウンター基準の天井から引く
      const tenjo = preset?.spec?.tenjo || 950;
      const counterTenjo = tenjo + counterOffsetForPresetId(preset?.id);
      const inferred = counterTenjo - prevSpin;
      return inferred >= 0 ? inferred : null;
    }

    function machineStats(machineId) {
      const sessions = filteredSessions().filter((session) => session.machineId === machineId);
      return aggregateStats(sessions);
    }

    function emptyStats() {
      return {
        spins: 0,
        consumed: 0,
        rate: null,
        estimatedCount: 0,
        hitBalls: 0,
        hitCount: 0,
        averagePayout: null,
        yutimeLoss: 0,
        yutimeLossCount: 0,
        averageYutimeLoss: null
      };
    }

    function buildMachineStatsMap(sessions) {
      const groups = new Map();
      sessions.forEach((session) => {
        if (!groups.has(session.machineId)) groups.set(session.machineId, []);
        groups.get(session.machineId).push(session);
      });
      const statsByMachine = new Map();
      groups.forEach((groupSessions, machineId) => {
        statsByMachine.set(machineId, aggregateStats(groupSessions));
      });
      return statsByMachine;
    }

    function rateToneClass(machine, rate) {
      const preset = presetById(normalizeMachinePresetId(machine));
      if (!preset?.evSupported || rate === null || rate === undefined) return "";
      if (rate >= RATE_THRESHOLDS.good) return "good";
      if (rate < RATE_THRESHOLDS.bad) return "bad";
      return "";
    }

    function aggregateStats(sessions) {
      let spins = 0;
      let consumed = 0;
      let estimatedCount = 0;
      let hitBalls = 0;
      let hitCount = 0;
      let yutimeLoss = 0;
      let yutimeLossCount = 0;
      sessions.forEach((session) => {
        const machine = data.machines.find((item) => item.id === session.machineId) || null;
        const derived = deriveSession(session, machine);
        const isEstimated = derived.isEstimatedRate || derived.isEstimatedPayout;
        if (derived.normalSpins !== null && derived.normalSpins > 0 && derived.consumedBalls > 0) {
          spins += derived.normalSpins;
          consumed += derived.consumedBalls;
        }
        if (derived.hitBalls !== null && session.hitCount > 0) {
          hitBalls += derived.hitBalls;
          hitCount += session.hitCount;
        }
        if (isEstimated) estimatedCount += 1;
        if (derived.yutimeLoss !== null) {
          yutimeLoss += derived.yutimeLoss;
          yutimeLossCount += 1;
        }
      });
      return {
        spins,
        consumed: Math.round(consumed),
        rate: consumed > 0 ? spins / consumed * 250 : null,
        estimatedCount,
        hitBalls: Math.round(hitBalls),
        hitCount,
        averagePayout: hitCount > 0 ? hitBalls / hitCount : null,
        yutimeLoss: Math.round(yutimeLoss),
        yutimeLossCount,
        averageYutimeLoss: yutimeLossCount > 0 ? yutimeLoss / yutimeLossCount : null
      };
    }

    function filteredSessions() {
      const store = activeStore();
      if (!store) return [];
      const sessions = data.sessions.filter((session) => session.storeId === store.id && session.status === "completed");
      if (!selectedLabelFilters.size) return sessions;
      return sessions.filter((session) => {
        const labels = [...automaticLabelsForDate(session.date), ...(session.labels || [])];
        return labels.some((label) => selectedLabelFilters.has(label));
      });
    }

    function latestEndInfo(machineId) {
      const candidates = data.sessions
        .filter((session) => session.machineId === machineId && session.endSpin !== null)
        .sort((a, b) => String(b.date + b.updatedAt).localeCompare(String(a.date + a.updatedAt)));
      const latest = candidates[0];
      return latest ? { spin: latest.endSpin, date: latest.date } : null;
    }

    function missingFields(session) {
      const keys = ["startSpin", "startTime", "startMochidama", "startSaipurei", "startCredit", "startTotalHits", "hitCount", "endTotalBalls", "endSpin", "endTime"];
      if (session.hitCount !== 0) keys.splice(5, 0, "hitSpin", "hitRemainBalls", "hitVia");
      if (session.hitCount !== 0) keys.splice(keys.indexOf("hitCount"), 0, "endTotalHits");
      return keys.filter((key) => session[key] === null || session[key] === undefined || session[key] === "");
    }

    function exportJson() {
      const raw = JSON.stringify(data, null, 2);
      const blob = new Blob([raw], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "yutime-v3-export-" + today() + ".json";
      a.click();
      URL.revokeObjectURL(url);
    }
  })();
  </script>
