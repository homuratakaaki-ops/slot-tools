<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>遊タイム実戦ツール v3</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f4ef;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #667085;
      --line: #d8d5ca;
      --accent: #236c68;
      --accent-dark: #174b48;
      --warn: #b45309;
      --danger: #b42318;
      --good: #1c7c54;
      --soft: #e8f3f1;
      --button: #f8fafc;
      --shadow: 0 10px 24px rgba(31, 41, 51, 0.08);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }

    body.running-fullscreen-lock {
      overflow: hidden;
      overscroll-behavior: none;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--button);
      color: var(--ink);
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active { transform: translateY(1px); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { background: var(--accent-dark); }
    button.danger { color: #fff; background: var(--danger); border-color: var(--danger); }
    button.ghost { background: transparent; }
    button.small { min-height: 36px; padding: 0 10px; }
    button.icon { width: 44px; padding: 0; display: inline-grid; place-items: center; }

    input, textarea, select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
    }

    input:disabled, textarea:disabled, select:disabled {
      background: #eef2f6;
      color: var(--muted);
    }

    #evPrevSpin:disabled {
      text-decoration: line-through;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.5;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 14px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      background: rgba(245, 244, 239, 0.95);
      backdrop-filter: blur(10px);
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .beta-badge {
      display: inline-flex;
      align-items: center;
      margin-left: 8px;
      padding: 2px 8px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent-dark);
      background: var(--soft);
      font-size: 12px;
      font-weight: 700;
      vertical-align: middle;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .beta-note {
      margin: 3px 0 0;
      color: var(--warn);
      font-size: 12px;
    }

    .article-link {
      margin: 4px 0 0;
      font-size: 12px;
    }

    .article-link a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(0, 0, 0, 0.15);
    }

    .store-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      white-space: nowrap;
      font-size: 14px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 6px 0 14px;
    }

    .tab {
      min-height: 42px;
      border-radius: 8px;
      background: #fff;
    }

    .tab.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .view { display: none; }
    .view.active { display: block; }
    #mapView.active { display: flex; flex-direction: column; gap: 0; }
    #mapView > .section:first-of-type { order: 2; }
    #mapView > .section:nth-of-type(2) { order: 1; }

    .section {
      margin: 0 0 14px;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .section-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      margin-bottom: 12px;
    }

    .section h2, .section h3 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .section p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .store-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .store-card {
      min-height: 72px;
      padding: 12px;
      text-align: left;
      background: #fff;
    }

    .store-card strong { display: block; font-size: 16px; }
    .store-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }

    .field-row {
      display: grid;
      grid-template-columns: minmax(120px, 180px) 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .field-row label {
      font-weight: 700;
      font-size: 13px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .warn {
      color: var(--warn);
      font-weight: 700;
    }

    .danger-text {
      color: var(--danger);
      font-weight: 700;
    }

    .status-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 8px 0 0;
    }

    .baseline-chip-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }

    .baseline-chip {
      min-width: 0;
      min-height: 42px;
      padding: 0 6px;
      font-size: 11px;
      text-align: center;
    }

    .baseline-chip strong {
      font-size: 16px;
      line-height: 1;
    }

    @media (max-width: 420px) {
      .baseline-chip-grid { grid-template-columns: minmax(0, 1fr); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #eef2f6;
      color: #344054;
      font-size: 12px;
      white-space: nowrap;
    }

    .badge.warn { background: #fff7ed; color: #9a3412; }
    .badge.good { background: #ecfdf3; color: #067647; }
    .badge.dark { background: var(--ink); color: #fff; }
    .machine-context {
      margin: 0 0 10px;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--panel2, #f4f2ec);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .state-badge-inline { margin-left: 6px; }

    .label-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 0;
      min-width: 0;
    }

    .check-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      min-width: 0;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 13px;
      white-space: normal;
    }

    .check-chip input {
      flex: 0 0 auto;
      width: auto;
      min-height: auto;
      padding: 0;
    }

    .filter-block {
      margin: 0 0 14px;
    }

    .filter-panel {
      display: grid;
      gap: 4px;
      margin-top: 8px;
    }

    .filter-block + .filter-block {
      margin-top: 12px;
    }

    .filter-status {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 0 0 14px;
      padding: 10px;
      border: 1px solid #7aa7a3;
      border-radius: 8px;
      background: var(--soft);
    }

    .machine-stats-filter {
      margin: 10px 0 12px;
    }

    .machine-stats-filter summary {
      cursor: pointer;
      font-weight: 700;
      min-height: 32px;
    }

    .machine-stats-selects {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .machine-stats-selects select {
      min-width: 0;
    }

    @media (max-width: 420px) {
      .machine-stats-selects { grid-template-columns: minmax(0, 1fr); }
    }

    .island-builder {
      display: grid;
      gap: 12px;
    }

    .island-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .island-card-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .island-card-head strong {
      font-size: 15px;
    }

    .island-name-button {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--ink);
      text-align: left;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .island-card-summary {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .island-sides {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .island-side {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }

    .island-side h4 {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 13px;
    }

    .island-side .wide {
      grid-column: 1 / -1;
    }

    .island-preview {
      display: grid;
      grid-template-columns: minmax(84px, 1fr) 34px minmax(84px, 1fr);
      gap: 12px;
      align-items: stretch;
      margin-top: 10px;
    }

    .preview-side {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .preview-machine {
      min-height: 44px;
      padding: 5px;
      font-weight: 800;
      background: #fff;
    }

    .preview-machine.excluded {
      color: #98a2b3;
      background: #eef2f6;
      text-decoration: line-through;
    }

    .map-gap,
    .preview-gap {
      min-height: 28px;
      display: grid;
      place-items: center;
      color: #667085;
    }

    .map-gap::before,
    .preview-gap::before {
      content: "";
      width: 6px;
      height: 100%;
      min-height: 26px;
      border-radius: 999px;
      background: repeating-linear-gradient(
        180deg,
        #98a2b3 0,
        #98a2b3 6px,
        #e4e7ec 6px,
        #e4e7ec 10px
      );
    }

    .preview-gap {
      min-height: 18px;
    }

    .map-wrap {
      overflow-x: auto;
      margin-top: 14px;
      padding-bottom: 8px;
    }

    .map-grid {
      display: grid;
      gap: 8px;
      align-items: start;
      min-width: 320px;
    }

    .map-row {
      display: grid;
      grid-template-columns: minmax(90px, 1fr) 34px minmax(90px, 1fr);
      gap: 12px;
      align-items: stretch;
    }

    .map-island-label {
      margin: 8px 0 2px;
      padding: 0 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .map-side {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .aisle {
      min-height: 48px;
      border-radius: 8px;
      background: repeating-linear-gradient(
        90deg,
        #e3e0d5,
        #e3e0d5 4px,
        #f3f0e7 4px,
        #f3f0e7 8px
      );
    }

    .machine-button {
      position: relative;
      min-height: 72px;
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 3px;
      padding: 7px 5px 8px;
      background: #fff;
      text-align: center;
    }

    .machine-button .dai {
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
    }

    .machine-button .rate {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--muted);
      min-height: 17px;
    }

    .machine-button .rate.good { color: var(--good); }
    .machine-button .rate.bad { color: var(--danger); }

    .machine-button .prev {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .machine-button .active-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      padding: 2px 5px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
    }

    .machine-button.has-data {
      border-color: #7aa7a3;
      background: var(--soft);
    }

    .machine-button.is-active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 2px rgba(35, 108, 104, 0.18);
    }

    .machine-button.ev-good {
      border-color: var(--good);
      box-shadow: inset 0 0 0 2px rgba(28, 124, 84, 0.22);
    }

    .machine-button.ev-assumed {
      border-style: dashed;
    }

    .machine-button .eve-sign {
      position: absolute;
      left: 4px;
      top: 4px;
      padding: 2px 5px;
      border-radius: 999px;
      background: #ecfdf3;
      color: #067647;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
    }

    .machine-button .state-badge {
      position: absolute;
      left: 4px;
      bottom: 4px;
      padding: 2px 5px;
      border-radius: 999px;
      background: #f2f4f7;
      color: #475467;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
    }

    .machine-button .state-badge.retained {
      background: #ecfdf3;
      color: #067647;
    }

    .ram-choice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .ram-choice-row button[aria-pressed="true"] {
      border-color: var(--accent);
      background: #ecfdf3;
      color: #067647;
      font-weight: 800;
    }

    .nail-rating-section {
      display: grid;
      gap: 8px;
      margin: 10px 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }

    .nail-rating-row {
      display: grid;
      grid-template-columns: 4.5em 1fr;
      gap: 8px;
      align-items: center;
    }

    .nail-rating-row span {
      font-weight: 800;
      font-size: 13px;
    }

    .nail-rating-chips {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }

    .nail-rating-chips button {
      min-height: 38px;
      padding: 0;
      font-weight: 800;
    }

    .nail-rating-chips button[aria-pressed="true"] {
      border-color: var(--accent);
      background: #ecfdf3;
      color: #067647;
    }

    .machine-button .prev.invalid {
      text-decoration: line-through;
      color: var(--muted);
    }

    .machine-button .memo-badge {
      position: absolute;
      right: 4px;
      bottom: 4px;
      padding: 2px 5px;
      border-radius: 999px;
      background: #fff4e5;
      color: #a15c07;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
    }

    .machine-button .rate small {
      display: block;
      margin-top: 1px;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.1;
    }

    .running-panel {
      border-color: #7aa7a3;
      background: #f3fbfa;
    }

    .running-panel.fullscreen {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100dvh;
      margin: 0;
      padding: 8px 8px clamp(112px, 22dvh, 160px);
      overflow: hidden;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .running-sticky {
      position: sticky;
      top: 78px;
      z-index: 15;
      margin: -2px -2px 12px;
      padding: 12px;
      border: 1px solid #7aa7a3;
      border-radius: 8px;
      background: #f3fbfa;
      box-shadow: var(--shadow);
    }

    .running-sticky.sticky-off {
      position: static;
      box-shadow: none;
    }

    .running-panel.fullscreen .running-sticky {
      position: static;
      flex: 1 1 auto;
      min-height: 0;
      margin: 0;
      padding: 8px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      border: 0;
      box-shadow: none;
    }

    .running-headline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
    }

    .running-headline-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .running-panel.fullscreen .running-headline {
      gap: 6px;
    }

    .running-panel.fullscreen .running-headline strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .running-panel.fullscreen .running-headline-actions button {
      min-height: 34px;
      padding: 0 8px;
      white-space: nowrap;
    }

    .running-live-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(35, 108, 104, .25);
      border-radius: 8px;
      background: #fff;
    }

    .running-live-row span,
    .running-total-row span {
      color: var(--muted);
      font-size: 12px;
    }
    .running-evaluation {
      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    .running-evaluation summary {
      cursor: pointer;
      font-weight: 700;
      min-height: 36px;
    }
    .running-nail-collapse {
      margin-top: 10px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }
    .running-nail-collapse summary {
      cursor: pointer;
      font-weight: 700;
      min-height: 34px;
    }
    .trial-rate-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(44px, auto)) minmax(92px, 1fr) repeat(2, minmax(44px, auto));
      gap: 6px;
      align-items: center;
      margin: 8px 0;
    }
    .trial-rate-controls button {
      min-height: 34px;
      padding: 0 8px;
      font-weight: 800;
    }
    .trial-rate-value {
      text-align: center;
      font-weight: 800;
      white-space: nowrap;
    }

    .running-live-row strong {
      font-size: 22px;
    }

    .running-panel.fullscreen .running-live-row {
      margin-top: 8px;
      padding: 6px 8px;
    }

    .running-panel.fullscreen .running-live-row strong {
      font-size: 20px;
    }

    .running-normal-summary {
      margin: 4px 10px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .consumed-choice {
      margin: 8px 10px;
      padding: 8px;
      border: 1px solid var(--warn);
      border-radius: 8px;
      background: #fff7ed;
    }

    .consumed-choice p {
      margin: 0 0 6px;
      font-size: 12px;
    }

    .consumed-choice-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .consumed-choice-options button {
      min-width: 0;
      white-space: normal;
      text-align: left;
    }

    .live-ev-line {
      margin: -2px 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .live-ev-line.warn {
      color: var(--danger);
    }

    .editable-value {
      border-style: dashed;
      background: #fff;
      text-align: left;
    }

    .editable-value strong {
      display: inline-block;
      margin-right: 6px;
    }

    .editable-value small {
      color: var(--muted);
      font-size: 11px;
    }

    .counter-row, .balance-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .running-panel.fullscreen .balance-row {
      margin-top: 8px;
    }

    .counter-row strong {
      font-size: 26px;
      line-height: 1;
    }

    .counter-row button, .balance-row button {
      min-height: 34px;
      padding: 0 10px;
    }

    .running-bottom-controls {
      position: sticky;
      bottom: 8px;
      z-index: 16;

    const BACKUP_KEY = STORAGE_PREFIX + "backup:latest";
    const CARRYOVER_KEY = STORAGE_PREFIX + "carryover";
    const MAP_BACKUP_KEY = STORAGE_PREFIX + "mapbackup";

    const STICKY_PREF_KEY = STORAGE_PREFIX + "running:sticky";

    const ISLAND_FILTER_KEY = STORAGE_PREFIX + "islandFilter";

    function exchangeBallsText(value) {
      const balls = normalizeExchangeBalls(value);
      return Number.isInteger(balls) ? String(balls) : balls.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
    }

    function normalizeInvestmentSource(value) {
      return value === "mochidama" || value === "saipurei" ? value : "cash";
    }

    function normalizeRamClear(value) {
      return value === RAM_CLEAR_VALUE || value === RAM_NOT_CLEARED_VALUE || value === RAM_UNKNOWN_VALUE ? value : null;
    }

    function normalizeRatingValue(value) {
      const number = normalizeNumber(value);
      return Number.isInteger(number) && number >= 1 && number <= 5 ? number : null;
    }

    function normalizeNailRating(source) {
      const input = source && typeof source === "object" ? source : {};
      const rating = {};
      NAIL_RATING_KEYS.forEach((key) => {
        rating[key] = normalizeRatingValue(input[key]);
      });
      return rating;
    }

    function dateFromIso(value) {
      const text = String(value || "");
      return /^\d{4}-\d{2}-\d{2}/.test(text) ? text.slice(0, 10) : null;
    }

    function normalizeMemoEntries(entries, legacyMemo = "", legacyCreatedAt = null) {
      const normalized = (Array.isArray(entries) ? entries : []).map((entry) => {
        const text = String(entry?.text || "").trim();
        if (!text) return null;
        return {
          id: entry.id || cryptoId("memo"),
          date: isDateString(entry.date) ? entry.date : null,
          text,
          createdAt: entry.createdAt || nowIso()
        };
      }).filter(Boolean);
      const legacyText = String(legacyMemo || "").trim();
      if (legacyText && !normalized.length) {
        const createdAt = legacyCreatedAt || nowIso();
        normalized.push({
          id: cryptoId("memo"),
          date: dateFromIso(legacyCreatedAt),
          text: legacyText,
          createdAt
        });
      }
      return normalized.sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
    }

    function normalizeStartEv(value) {
      if (!value || typeof value !== "object") return null;
      const evYen = normalizeNumber(value.evYen);
      const usedRate = normalizeNumber(value.usedRate);
      const effectiveSpin = normalizeNumber(value.effectiveSpin);
      if (evYen === null || usedRate === null || effectiveSpin === null) return null;
      return {
        evYen,
        usedRate,
        rateSource: value.rateSource || "",
        presetId: typeof value.presetId === "string" ? value.presetId : "",
        effectiveSpin,
        availableBalls: Math.max(0, normalizeNumber(value.availableBalls) ?? 0),
        mochidamaInput: Math.max(0, normalizeNumber(value.mochidamaInput) ?? 0),
        saipureiInput: Math.max(0, normalizeNumber(value.saipureiInput) ?? 0),
        mochidamaBalls: Math.max(0, normalizeNumber(value.mochidamaBalls) ?? 0),
        cashBalls: Math.max(0, normalizeNumber(value.cashBalls) ?? 0),
        normalCostYen: normalizeNumber(value.normalCostYen)
      };
    }

    function normalizeConsumedBallsSource(value) {
      return value === "tray" || value === "taps" ? value : null;
    }

    function investmentSource(item) {
      return normalizeInvestmentSource(item?.source || item?.type);
    }

    function usesTapInvestmentMode(session) {
      return Array.isArray(session.investments) && session.investments.some((item) => item.source);
    }

    function numberText(value, fallback = "未入力") {
      return value === null || value === undefined || value === "" ? fallback : String(value);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function presetById(id) {
      return MACHINE_PRESETS.find((preset) => preset.id === id) || null;
    }

    function presetByName(name) {
      return MACHINE_PRESETS.find((preset) => preset.name === name) || null;
    }

    function normalizeMachinePresetId(machine) {
      if (presetById(machine?.presetId)) return machine.presetId;
      const matched = presetByName(machine?.modelName || "");
      return matched ? matched.id : "";
    }

    function machineHasYutime(machine) {
      return Boolean(presetById(normalizeMachinePresetId(machine))?.hasYutime);
    }

    function tenjoForPresetId(presetId) {
      return normalizeNumber(presetById(presetId)?.spec?.tenjo) ?? YUTIME_EXPECTATION_ENGINE.preset.spec.tenjo;
    }

    // カウンター表示と内部低確回転数のずれ。数値の出所は期待値エンジンのプリセット1箇所だけにする
    function counterOffsetForPresetId(presetId) {
      const spec = YUTIME_EXPECTATION_ENGINE.presets[presetId]?.spec;
      return Math.max(0, normalizeNumber(spec?.counterOffset) ?? 0);
    }

    // 入力・記録された回転数はデータカウンター基準。エンジンと天井判定には内部回転数を渡す
    function engineSpinFromCounterSpin(counterSpin, presetId) {
      const spin = normalizeNumber(counterSpin);
      if (spin === null) return null;
      return Math.max(0, spin - counterOffsetForPresetId(presetId));
    }

    // 天井までの残りはカウンター基準で見せる。内部回転数に直してから引く
    function remainingSpinsFromCounterSpin(counterSpin, presetId) {
      const engineSpin = engineSpinFromCounterSpin(counterSpin, presetId);
      const tenjo = normalizeNumber(tenjoForPresetId(presetId));
      if (engineSpin === null || tenjo === null) return null;
      return Math.max(0, tenjo - engineSpin);
    }

    function presetNetBallsPerWin(presetId) {
      const preset = presetById(presetId);
      return positiveNumberOrDefault(data.presetSettings?.[presetId]?.netBallsPerWin, preset?.defaults?.netBallsPerWin || DEFAULT_NET_BALLS_PER_WIN);
    }

    // S9/§1-2: 1R実質出玉の採用順位。手入力 → 実測平均 → ラウンド集計 → 理論値。
    // manualInput は期待値判定パネルのその場の手入力で、プリセット設定の手入力より優先する。
    function netBallsPerWinInfo(presetId, machine = null, manualInput = null) {
      const preset = presetById(presetId);
      const settings = data.presetSettings?.[presetId] || {};
      const panelManual = normalizeNumber(manualInput);
      if (panelManual !== null && panelManual > 0) {
        return { value: panelManual, source: "手入力", count: null };
      }
      const manual = normalizeNumber(settings.netBallsPerWin);
      if (settings.netBallsPerWinManual === true && manual !== null && manual > 0) {
        return { value: manual, source: "手入力", count: null };
      }
      const sessions = filteredSessions().filter((session) => {
        if (machine) return session.machineId === machine.id;
        const sessionMachine = data.machines.find((item) => item.id === session.machineId);
        return normalizeMachinePresetId(sessionMachine) === presetId;
      });
      const hits = sessions.flatMap((session) => normalizeHits(session.hits));
      // S9/§1-2: 実測平均は当選ごとの「今回分」（S8）を出典にする。採用順位は
      // sessionActualBallsTotal と同じで、当選ごとの記録が無い旧データだけヤメ入力の累計を使う。
      let actualTotal = 0;
      let actualCount = 0;
      sessions.forEach((session) => {
        const sessionHits = normalizeHits(session.hits);
        const perHit = sessionHits.map((hit) => normalizeNumber(hit.actualBalls)).filter((value) => value !== null && value > 0);
        if (perHit.length) {
          perHit.forEach((value) => {
            actualTotal += value;
            actualCount += 1;
          });
          return;
        }
        const explicit = normalizeNumber(session.sessionActualBalls);
        if (explicit !== null && explicit > 0) {
          const count = sessionHits.length || normalizeNumber(session.hitCount) || 0;
          if (count > 0) {
            actualTotal += explicit;
            actualCount += count;
          }
        }
      });
      if (actualCount > 0) {
        return { value: actualTotal / actualCount, source: "実測平均", count: actualCount };
      }
      const roundHits = hits.map((hit) => roundTypeById(presetId, hit.roundTypeId)?.balls).filter((value) => Number(value) > 0);
      if (roundHits.length) {
        return { value: roundHits.reduce((sum, value) => sum + Number(value), 0) / roundHits.length, source: "ラウンド集計", count: roundHits.length };
      }
      return { value: preset?.defaults?.netBallsPerWin || DEFAULT_NET_BALLS_PER_WIN, source: "理論値", count: 0 };
    }

    function presetHoldSpins(presetId) {
      const preset = presetById(presetId);
      const fallback = normalizeNumber(preset?.defaults?.holdSpins) ?? 0;
      const value = normalizeNumber(data.presetSettings?.[presetId]?.holdSpins);
      return value === null ? fallback : Math.max(0, value);
    }

    function presetJitanBallsPerSpin(presetId, key) {
      const preset = presetById(presetId);
      const fallback = normalizeNumber(preset?.defaults?.[key]) ?? 0;
      return normalizeNumber(data.presetSettings?.[presetId]?.[key]) ?? fallback;
    }

    function presetYutimeBallsPerSpin(presetId) {
      return presetJitanBallsPerSpin(presetId, "yutimeBallsPerSpin");
    }

    function roundTypeById(presetId, roundTypeId) {
      const preset = presetById(presetId);
      return (preset?.roundTypes || []).find((type) => type.id === roundTypeId) || null;
    }

    function normalizeHits(hits) {
      return (Array.isArray(hits) ? hits : []).map((hit) => ({
        roundTypeId: String(hit?.roundTypeId || ""),
        segmentId: hit?.segmentId || null,
        hitSpin: normalizeNumber(hit?.hitSpin),
        actualBalls: normalizeNumber(hit?.actualBalls),
        at: hit?.at || nowIso()
      })).filter((hit) => hit.roundTypeId || hit.hitSpin !== null || hit.actualBalls !== null);
    }

    // 合計R数は totalRoundsForPreset と同じ定義（R種別のR数の合計）で保存する。
    // 玉数 ÷ 1R玉数の逆算にすると、その比がR数と一致しない機種で保存値と表示値がずれる。
    function syncSessionHitTotals(session, machines = data.machines) {
      if (!Array.isArray(session.hits) || !session.hits.length) return;
      session.hitCount = session.hits.length;
      const machine = machines.find((item) => item.id === session.machineId);
      const rounds = totalRoundsForPreset(session, normalizeMachinePresetId(machine));
      if (rounds > 0) session.totalRounds = rounds;
    }

    function hitRoundBasedPayout(session, presetId) {
      const hits = normalizeHits(session?.hits);
      if (!hits.length) return null;
      const total = hits.reduce((sum, hit) => {
        const roundType = roundTypeById(presetId, hit.roundTypeId);
        return roundType ? sum + Number(roundType.balls || 0) : sum;
      }, 0);
      return total > 0 ? total : null;
    }

    function activeMapAssumedRate(storeId = activeStore()?.id) {
      return normalizeNumber(selectedIslandFilter(storeId).map?.assumedRate);
    }

    function activeMapHasYutime(storeId = activeStore()?.id) {
      if (!storeId) return false;
      const selection = selectedIslandFilter(storeId);
      if (selection.islandIndex !== null) return islandHasYutime(selection.map.islands[selection.islandIndex], storeId);
      const parsed = parseIslandLayout(selectedMapLayoutForParse(storeId));
      return parsed.daiNos.some((daiNo) => machineHasYutime(findMachineByDai(daiNo)));
    }

    function islandHasYutime(island, storeId = activeStore()?.id) {
      if (!island) return false;
      if (presetById(island.leftPresetId)?.hasYutime || presetById(island.rightPresetId)?.hasYutime) return true;
      const parsed = parseIslandLayout({ islands: [island] });
      return parsed.daiNos.some((daiNo) => {
        const machine = data.machines.find((item) => item.storeId === storeId && item.daiNo === String(daiNo));
        return machineHasYutime(machine);
      });
    }

    // コーナー基準値はここで解決する。既定プリセットや1件目へフォールバックしない
    function selectedYutimePresetIds(storeId = activeStore()?.id) {
      if (!storeId) return [];
      const ids = [];
      const add = (presetId) => {
        if (presetId && presetById(presetId)?.hasYutime && !ids.includes(presetId)) ids.push(presetId);
      };
      const layout = selectedMapLayoutForParse(storeId);
      (layout.islands || []).forEach((island) => {
        add(island?.leftPresetId);
        add(island?.rightPresetId);
      });
      // 島に機種が未設定の列は、そこに並ぶ台の機種から補う
      parseIslandLayout(layout).daiNos.forEach((daiNo) => {
        const machine = data.machines.find((item) => item.storeId === storeId && item.daiNo === String(daiNo));
        add(normalizeMachinePresetId(machine));
      });
      return ids;
    }

    function islandDisplayName(island, index = 0) {
      const manualName = String(island?.name || "").trim();
      if (manualName) return manualName;
      const leftPreset = presetById(island?.leftPresetId);
      const rightPreset = presetById(island?.rightPresetId);
      const hasRightSide = Boolean(island?.right && (normalizeNumber(island.right.from) !== null || normalizeNumber(island.right.to) !== null));
      if (!hasRightSide && leftPreset) return leftPreset.name;
      if (hasRightSide && leftPreset && rightPreset && leftPreset.id === rightPreset.id) return leftPreset.name;
      return `島${(island?.displayIndex ?? index) + 1}`;
    }

    function islandRangeSummary(island) {
      const sideText = (side) => {
        const from = normalizeNumber(side?.from);
        const to = normalizeNumber(side?.to);
        if (from === null && to === null) return "未入力";
        if (from === null || to === null) return `${from ?? ""}-${to ?? ""}`;
        return `${from}-${to}`;
      };
      const left = sideText(island?.left);
      const right = island?.right ? sideText(island.right) : "右列なし";
      return `${left}｜${right}`;
    }

    function yenText(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "-";
      const rounded = Math.round(Number(value));
      return `${rounded >= 0 ? "+" : ""}${rounded.toLocaleString("ja-JP")}円`;
    }

    function hourText(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "-";
      return `${Number(value).toFixed(2)}h`;
    }

    function percentText(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "-";
      return `${Number(value).toFixed(1)}%`;
    }

    function evJudgment(result) {
      if (!result) return { className: "", label: "未判定" };
      const threshold = hourlyThresholdYen();
      const hourly = Number(result.hourlyYen);
      const hasHourly = Number(result.totalHours) > 0 && Number.isFinite(hourly);
      // 打てる＝時給がしきい値以上。時給が出せないときは期待値の符号だけで判定する
      if (hasHourly && hourly >= threshold) return { className: "good", label: "打てる" };
      if (Number(result.evYen) > 0) return { className: "warn", label: "微妙" };
      return { className: "bad", label: "打てない" };
    }

    function hourlyThresholdYen() {
      const value = normalizeNumber(data?.meta?.hourlyThresholdYen);
      return value === null ? DEFAULT_HOURLY_THRESHOLD_YEN : value;
    }

    function expectationYenPerBall(store) {
      return 100 / exchangeBallsFromStore(store);
    }

    // S9/§1-3,§1-4: 1R実質出玉の表示。587.5 のような小数はそのまま見せる（理論値の桁を落とさない）。
    function netBallsText(value) {
      const number = normalizeNumber(value);
      if (number === null) return "-";
      return `${(Math.round(number * 10) / 10).toLocaleString("ja-JP", { maximumFractionDigits: 1 })}玉`;
    }

    // 出典は「手入力」「実測平均・n=◯」「ラウンド集計・n=◯」「理論値」の4種。
    function netBallsSourceText(info) {
      if (!info) return "-";
      return `${info.source}${info.count ? `・n=${info.count}` : ""}`;
    }

    function netBallsUsedText(info) {
      return `${netBallsText(info?.value)}（${netBallsSourceText(info)}）`;
    }

    function expectationSettings(store, machine, manualNetBallsPerWin = null) {
      const presetId = normalizeMachinePresetId(machine);
      const preset = presetById(presetId);
      const defaults = preset?.defaults || YUTIME_EXPECTATION_ENGINE.preset.defaults;
      const netBallsInfo = netBallsPerWinInfo(presetId, machine, manualNetBallsPerWin);
      const netBallsPerWin = netBallsInfo.value;
      const jitanNormalBallsPerSpin = presetJitanBallsPerSpin(presetId, "jitanNormalBallsPerSpin");
      const jitanFastBallsPerSpin = presetJitanBallsPerSpin(presetId, "jitanFastBallsPerSpin");
      const yutimeBallsPerSpin = presetYutimeBallsPerSpin(presetId);
      const holdSpins = presetHoldSpins(presetId);
      const supportLabel = preset?.spec?.modelType === "st-certain"
        ? `ST・時短 ${jitanFastBallsPerSpin}玉/回転、遊タイム ${yutimeBallsPerSpin}玉/回転`
        : `時短100 ${jitanNormalBallsPerSpin}玉/回転、時短200 ${jitanFastBallsPerSpin}玉/回転、遊タイム ${yutimeBallsPerSpin}玉/回転`;
      return {
        settings: {
          ...defaults,
          presetId,
          yenPerBall: expectationYenPerBall(store),
          netBallsPerWin,
          jitanNormalBallsPerSpin,
          jitanFastBallsPerSpin,
          yutimeBallsPerSpin,
          holdSpins
        },
        netBallsInfo,
        // S9/§1-4: 根拠行に使用値と出典を出す。使用回転率と同じ書式でそろえる。
        netBallsSource: `使用1R実質出玉 ${netBallsUsedText(netBallsInfo)}`,
        payoutSource: supportLabel
      };
    }

    function expectationRate(stats, manualRate, store = null) {
      const manual = normalizeNumber(manualRate);
      if (manual !== null && manual > 0) return { rate: manual, source: "手入力" };
      if (stats?.rate) return { rate: stats.rate, source: "履歴累計" };
      const assumed = activeMapAssumedRate(store?.id);
      const assumedSourceName = String(store?.name || "").trim() || "島";
      if (assumed !== null && assumed > 0) return { rate: assumed, source: `${assumedSourceName}の想定回転率${assumed.toFixed(1)}使用`, assumed: true };
      return { rate: null, source: "回転率なし" };
    }

    function availableBallsFromParts(mochidamaInput, saipureiInput) {
      const mochidama = Math.max(0, normalizeNumber(mochidamaInput) ?? 0);
      const saipurei = Math.max(0, normalizeNumber(saipureiInput) ?? 0);
      return { mochidama, saipurei, total: mochidama + saipurei };
    }

    function calculateMachineExpectation(machine, options = {}) {
      const store = storeById(machine?.storeId);
      const preset = presetById(normalizeMachinePresetId(machine));
      if (!store || !preset?.evSupported) return { result: null, reason: "期待値対応プリセットではありません" };
      const stats = options.stats || machineStats(machine.id);
      const rateInfo = expectationRate(stats, options.manualRate, store);
      if (!rateInfo.rate) return { result: null, reason: "回転率データがありません" };
      const currentSpin = Math.max(0, Number(options.currentSpin) || 0);
      const previousSpin = Math.max(0, Number(options.previousSpin) || 0);
      const availableBalls = Math.max(0, normalizeNumber(options.availableBalls) ?? 0);
      const effectiveSpin = currentSpin + previousSpin;
      // effectiveSpin はカウンター基準。エンジンの天井は内部低確回転数なのでずれを引いて渡す
      const engineSpin = engineSpinFromCounterSpin(effectiveSpin, preset.id);
      const settingsInfo = expectationSettings(store, machine, options.manualNetBallsPerWin);
      const result = YUTIME_EXPECTATION_ENGINE.calculate({ presetId: preset.id, currentSpin: engineSpin, rotationRate: rateInfo.rate, availableBalls }, settingsInfo.settings);
      return {
        result,
        presetId: preset.id,
        currentSpin,
        previousSpin,
        availableBalls,
        effectiveSpin,
        rateSource: rateInfo.source,
        rateAssumed: Boolean(rateInfo.assumed),
        netBallsInfo: settingsInfo.netBallsInfo,
        netBallsSource: settingsInfo.netBallsSource,
        payoutSource: settingsInfo.payoutSource,
        exchangeBalls: exchangeBallsFromStore(store)
      };
    }

    function calculateStartEvSnapshot(session, machine, presets = {}) {
      if (!session || !machine) return null;
      const startSpin = normalizeNumber(session.startSpin);
      if (startSpin === null) return null;
      const availableParts = availableBallsFromParts(presets.mochidamaInput, presets.saipureiInput);
      const availableBalls = normalizeNumber(presets.availableBalls) ?? availableParts.total;
      const expectation = calculateMachineExpectation(machine, {
        currentSpin: startSpin,
        previousSpin: session.prevDayEndSpin,
        manualRate: presets.manualRate,
        manualNetBallsPerWin: presets.manualNetBallsPerWin,
        availableBalls
      });
      if (!expectation.result) return null;
      return {
        evYen: Math.round(expectation.result.evYen),
        usedRate: Number(expectation.result.rotationRate.toFixed(2)),
        rateSource: expectation.rateSource,
        presetId: expectation.presetId,
        effectiveSpin: expectation.effectiveSpin,
        availableBalls: expectation.availableBalls,
        mochidamaInput: availableParts.mochidama,
        saipureiInput: availableParts.saipurei,
        mochidamaBalls: Math.round(expectation.result.mochidamaBalls),
        cashBalls: Math.round(expectation.result.cashBalls),
        normalCostYen: Math.round(expectation.result.normalCostYen)
      };
    }

    function remainingSpinTextFromEffectiveSpin(effectiveSpin, presetId = YUTIME_EXPECTATION_ENGINE.preset.id) {
      const remaining = remainingSpinsFromCounterSpin(effectiveSpin, presetId);
      if (remaining === null) return "残り-回転";
      return `残り${remaining.toLocaleString("ja-JP")}回転`;
    }

    function expectationBasisText(result) {
      if (!result) return "";
      // 投資額は機械割の分母と同じ「持ち玉ぶん＋現金ぶん」の円換算合計
      const investYen = Math.round(Number(result.normalCostYen) || 0);
      const evYen = Number(result.evYen) || 0;
      const machineRate = investYen > 0 ? 100 + evYen / investYen * 100 : null;
      const spinsPerHour = Math.round(Number(result.spinsPerHour) || 0);
      const threshold = Math.round(hourlyThresholdYen());
      return `判定基準：時給${threshold.toLocaleString("ja-JP")}円以上で打てる ／ `
        + `投資 約${investYen.toLocaleString("ja-JP")}円に対し期待値 ${yenText(evYen)}`
        + `（機械割 ${machineRate === null ? "-" : `${machineRate.toFixed(1)}%`} ＝ 期待値÷投資額+100%）`
        + ` ／ 消化時間 ${hourText(result.totalHours)}（通常${hourText(result.normalHours)}＋当選${hourText(result.hitHours)}＋電サポ${hourText(result.densapoHours)}）`
        + ` ／ 通常時${spinsPerHour.toLocaleString("ja-JP")}回転/h想定`;
    }

    function expectationInvestmentText(mochidamaBalls, cashBalls, spinsToTenjo, rotationRate) {
      const mochidama = Math.max(0, Math.round(normalizeNumber(mochidamaBalls) || 0));
      const cash = Math.max(0, Math.round(normalizeNumber(cashBalls) || 0));
      const total = mochidama + cash;
      const cashYen = Math.round(cash / 250 * 1000);
      const spins = Math.max(0, normalizeNumber(spinsToTenjo) || 0);
      const rate = normalizeNumber(rotationRate) || 0;
      const maxNote = rate > 0
        ? `（途中当選込み・最大${Math.ceil(spins * 250 / rate).toLocaleString("ja-JP")}玉）`
        : "（途中当選込み）";
      if (mochidama <= 0) {
        return `遊タイムまで必要 平均約${total.toLocaleString("ja-JP")}玉${maxNote}／全額現金 約${cashYen.toLocaleString("ja-JP")}円`;
      }
      return `遊タイムまで必要 平均約${total.toLocaleString("ja-JP")}玉${maxNote}／持ち玉・再プレから${mochidama.toLocaleString("ja-JP")}玉・現金約${cashYen.toLocaleString("ja-JP")}円`;

    // 金額を含まない期待値の根拠だけを返す。金額は履歴カード上部の2枠が出すので重複させない
    function startEvBasisText(startEv) {
      const normalized = normalizeStartEv(startEv);
      if (!normalized) return "記録なし";
      const hasInvestmentBreakdown = Boolean(normalized.availableBalls || normalized.mochidamaBalls || normalized.cashBalls);

        : "";
      return `${Number(normalized.usedRate).toFixed(1)} /250玉 / ${normalized.rateSource || "ソース不明"} / ${remainingSpinTextFromEffectiveSpin(normalized.effectiveSpin, normalized.presetId)}${balanceText}`;

      const normalized = normalizeStartEv(startEv);
      if (!normalized) return "記録なし";
      return `${yenText(normalized.evYen)} / ${startEvBasisText(startEv)}`;

    function showToast(message, type = "success", options = {}) {
      clearTimeout(showToast.timer);
      els.toast.innerHTML = `${escapeHtml(message)}${options.undo ? ` <button id="toastUndoBtn">元に戻す</button>` : ""}`;
      els.toast.classList.toggle("error", type === "error");
      els.toast.classList.add("show");
      if (options.undo) byId("toastUndoBtn").addEventListener("click", () => {
        clearTimeout(showToast.timer);
        els.toast.classList.remove("show", "error");
        options.undo();
      });
      showToast.timer = setTimeout(() => {
        els.toast.classList.remove("show", "error");
      }, options.undo ? 4200 : 2200);
    }

    function persistWithToast(successMessage) {
      const ok = persist();
      if (ok) showToast(successMessage);
      else showToast("保存に失敗しました。容量を確認してください。", "error");
      return ok;
    }

    // S5/§1: 即保存の画面用。連続して保存してもトーストは最後の1回にまとめる。
    function persistWithQuietToast(successMessage) {
      const ok = persist();
      if (!ok) {
        clearTimeout(persistWithQuietToast.timer);
        showToast("保存に失敗しました。容量を確認してください。", "error");
        return false;
      }
      clearTimeout(persistWithQuietToast.timer);
      persistWithQuietToast.timer = setTimeout(() => showToast(successMessage), 400);
      return true;
    }

    function automaticLabelsForDate(dateValue) {
      const parts = String(dateValue || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!parts) return [];
      const year = Number(parts[1]);
      const month = Number(parts[2]);
      const day = Number(parts[3]);
      const date = new Date(year, month - 1, day);
      if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return [];
      const weekdays = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];
      const labels = [weekdays[date.getDay()], `${day % 10}のつく日`];
      if (day === 11 || day === 22) labels.push("ゾロ目日");
      return labels;
    }

    function dateWithAutoLabels(dateValue) {
      const labels = automaticLabelsForDate(dateValue);
      return `${dateValue || "日付未入力"}${labels.length ? " / " + labels.join("・") : ""}`;
    }

    function shortDate(dateValue) {
      const parts = String(dateValue || "").match(/^\d{4}-(\d{2})-(\d{2})$/);
      return parts ? `${Number(parts[1])}/${Number(parts[2])}` : (dateValue || "-");
    }

    function loadData() {
      const base = defaultData();
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return base;
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return base;
        if (parsed.version !== SCHEMA_VERSION && !localStorage.getItem(PREMIGRATE_KEY)) {
          localStorage.setItem(PREMIGRATE_KEY, raw);
        }
        if (needsSegmentMigration(parsed)) backupBeforeSegmentMigration(raw);
        return normalizeData(parsed);
      } catch (error) {
        console.warn("ytv3 load failed", error);
        preserveCorruptData(raw);
        return base;
      }
    }

    // §2-2: 区間への移行は不可逆なので、実行前に移行前データを1件退避する。
    function needsSegmentMigration(source) {
      const sessions = Array.isArray(source?.sessions) ? source.sessions : [];
      return sessions.some((session) => !Array.isArray(session?.segments) || !session.segments.length);
    }

    function backupBeforeSegmentMigration(raw) {
      if (!raw) return;
      try {
        localStorage.setItem(BACKUP_KEY, raw);
      } catch (error) {
        console.warn("ytv3 segment migration backup failed", error);
      }
    }

    function preserveCorruptData(raw) {
      if (!raw) return;
      try {
        localStorage.setItem(CORRUPT_PREFIX + new Date().toISOString(), raw);
        bootToastMessage = "保存データが読み取れなかったため退避しました";
      } catch (error) {
        console.warn("ytv3 corrupt preserve failed", error);
      }
    }

    function loadCarryover() {
      try {
        const parsed = JSON.parse(localStorage.getItem(CARRYOVER_KEY) || "null");
        if (!parsed || typeof parsed !== "object") return null;
        if (!parsed.storeId || !parsed.sourceSessionId || !parsed.date) return null;
        if (parsed.date !== today()) {
          localStorage.removeItem(CARRYOVER_KEY);
          return null;
        }
        return {
          storeId: parsed.storeId,
          sourceSessionId: parsed.sourceSessionId,
          sourceMachineId: parsed.sourceMachineId || null,
          sourceDaiNo: parsed.sourceDaiNo || "",
          date: parsed.date,
          mochidama: normalizeNumber(parsed.mochidama),
          credit: normalizeNumber(parsed.credit),
          saipurei: normalizeNumber(parsed.saipurei),
          createdAt: parsed.createdAt || nowIso()
        };
      } catch (error) {
        console.warn("ytv3 carryover load failed", error);
        return null;
      }
    }

    function saveCarryover(nextCarryover) {
      carryover = nextCarryover;
      if (!carryover) {
        localStorage.removeItem(CARRYOVER_KEY);
        renderAll();
        return true;
      }
      try {
        localStorage.setItem(CARRYOVER_KEY, JSON.stringify(carryover));
        renderAll();
        return true;
      } catch (error) {
        console.warn("ytv3 carryover save failed", error);
        showToast("引き継ぎの保存に失敗しました。容量を確認してください。", "error");
        return false;
      }
    }

    function normalizeData(source) {
      const base = defaultData();
      const next = {
        ...base,
        ...source,
        stores: Array.isArray(source.stores) ? source.stores : [],
        layouts: source.layouts && typeof source.layouts === "object" ? source.layouts : {},
        machines: Array.isArray(source.machines) ? source.machines : [],
        sessions: Array.isArray(source.sessions) ? source.sessions : [],
        dailyState: source.dailyState && typeof source.dailyState === "object" ? source.dailyState : {},
        presetSettings: source.presetSettings && typeof source.presetSettings === "object" ? source.presetSettings : {},
        labelsByStore: source.labelsByStore && typeof source.labelsByStore === "object" ? source.labelsByStore : {},
        meta: { ...base.meta, ...(source.meta || {}), hourlyThresholdYen: normalizeNumber(source.meta?.hourlyThresholdYen) ?? DEFAULT_HOURLY_THRESHOLD_YEN }
      };
      const sourceVersion = normalizeNumber(source.version) ?? 0;
      next.version = SCHEMA_VERSION;
      const legacyNetBallsPerWin = next.stores.map((store) => normalizeNumber(store.netBallsPerWin)).find((value) => value !== null && value > 0);
      if (!next.presetSettings["umi-sp5"]) next.presetSettings["umi-sp5"] = {};
      const hadPresetNetBalls = Object.prototype.hasOwnProperty.call(next.presetSettings["umi-sp5"], "netBallsPerWin");
      next.presetSettings["umi-sp5"].netBallsPerWin = positiveNumberOrDefault(next.presetSettings["umi-sp5"].netBallsPerWin ?? legacyNetBallsPerWin, DEFAULT_NET_BALLS_PER_WIN);
      next.presetSettings["umi-sp5"].netBallsPerWinManual = next.presetSettings["umi-sp5"].netBallsPerWinManual === true || (hadPresetNetBalls && next.presetSettings["umi-sp5"].netBallsPerWin !== DEFAULT_NET_BALLS_PER_WIN);
      next.presetSettings["umi-sp5"].jitanNormalBallsPerSpin = normalizeNumber(next.presetSettings["umi-sp5"].jitanNormalBallsPerSpin) ?? 0;
      next.presetSettings["umi-sp5"].jitanFastBallsPerSpin = normalizeNumber(next.presetSettings["umi-sp5"].jitanFastBallsPerSpin) ?? 0;
      next.presetSettings["umi-sp5"].yutimeBallsPerSpin = normalizeNumber(next.presetSettings["umi-sp5"].yutimeBallsPerSpin) ?? (sourceVersion < 26 ? 0 : (presetById("umi-sp5")?.defaults?.yutimeBallsPerSpin ?? 0));
      // B91: 残保留は既定5で補完する（既定値変更は意図した補正）
      next.presetSettings["umi-sp5"].holdSpins = normalizeNumber(next.presetSettings["umi-sp5"].holdSpins) ?? (presetById("umi-sp5")?.defaults?.holdSpins ?? 0);
      if (next.presetSettings["agnes-pe"]) {
        const agnesDefaults = presetById("agnes-pe")?.defaults || {};
        next.presetSettings["agnes-pe"].netBallsPerWin = positiveNumberOrDefault(next.presetSettings["agnes-pe"].netBallsPerWin, agnesDefaults.netBallsPerWin || DEFAULT_NET_BALLS_PER_WIN);
        next.presetSettings["agnes-pe"].netBallsPerWinManual = next.presetSettings["agnes-pe"].netBallsPerWinManual === true;
        next.presetSettings["agnes-pe"].jitanNormalBallsPerSpin = normalizeNumber(next.presetSettings["agnes-pe"].jitanNormalBallsPerSpin) ?? (agnesDefaults.jitanNormalBallsPerSpin ?? 0);
        next.presetSettings["agnes-pe"].jitanFastBallsPerSpin = normalizeNumber(next.presetSettings["agnes-pe"].jitanFastBallsPerSpin) ?? (agnesDefaults.jitanFastBallsPerSpin ?? 0);
        next.presetSettings["agnes-pe"].yutimeBallsPerSpin = normalizeNumber(next.presetSettings["agnes-pe"].yutimeBallsPerSpin) ?? (agnesDefaults.yutimeBallsPerSpin ?? 0);
        next.presetSettings["agnes-pe"].holdSpins = normalizeNumber(next.presetSettings["agnes-pe"].holdSpins) ?? (agnesDefaults.holdSpins ?? 0);
      }
      next.stores = next.stores.map((store) => ({
        id: store.id || cryptoId("st"),
        name: String(store.name || "無名店"),
        isPersonal: Boolean(store.isPersonal),
        lendRate: positiveNumberOrDefault(store.lendRate, DEFAULT_LEND_RATE),
        exchangeBalls: exchangeBallsFromStore(store),
        createdAt: store.createdAt || nowIso()
      }));
      next.layouts = normalizeLayouts(next.layouts);
      migrateStoreAssumedRatesToMaps(next, source.stores || []);
      next.machines = next.machines.map((machine) => {
        const presetId = normalizeMachinePresetId(machine);
        const preset = presetById(presetId);
        return {
          id: machine.id || cryptoId("m"),
          storeId: machine.storeId || null,
          daiNo: String(machine.daiNo || ""),
          modelName: presetId === "umi-sp5" && machine.presetId === "umi-sp5" ? preset?.name || machine.modelName || "" : machine.modelName || "",
          roundBalls: normalizeNumber(machine.roundBalls),
          memoEntries: normalizeMemoEntries(machine.memoEntries, machine.memo, machine.createdAt),
          nailRating: normalizeNailRating(machine.nailRating),
          presetId,
          evSupported: Boolean(preset?.evSupported || machine.evSupported)
        };
      }).filter((machine) => machine.storeId && machine.daiNo);
      next.sessions = next.sessions.map((session) => {
        const normalized = {
          ...blankSession(),
          ...session,
          startTotalHits: normalizeNumber(session.startTotalHits),
          endTotalHits: normalizeNumber(session.endTotalHits),
          currentSpin: normalizeNumber(session.currentSpin) ?? normalizeNumber(session.startSpin),
          startEv: normalizeStartEv(session.startEv),
          consumedBallsSource: normalizeConsumedBallsSource(session.consumedBallsSource),
          hitTrackedBalls: normalizeNumber(session.hitTrackedBalls),
          sessionActualBalls: normalizeNumber(session.sessionActualBalls),
          carriedFromSessionId: session.carriedFromSessionId || null,
          yutimeEnterSpin: normalizeNumber(session.yutimeEnterSpin),
          yutimeEnterTime: session.yutimeEnterTime || null,
          settlementRecoverYen: normalizeNumber(session.settlementRecoverYen),
          hits: normalizeHits(session.hits),
          investments: Array.isArray(session.investments) ? session.investments.map((item) => ({
          type: normalizeInvestmentSource(item.source || item.type),
          ...(item.source ? { source: normalizeInvestmentSource(item.source) } : {}),
          amount: normalizeNumber(item.amount),
          time: item.time || null,
          phase: item.phase === "yutime" ? "yutime" : "normal",
          spinAt: normalizeNumber(item.spinAt),
          adjustment: item.adjustment === true,
          segmentId: item.segmentId || null
        })).filter((item) => item.amount !== null) : [],
        charges: Array.isArray(session.charges) ? session.charges.map((item) => ({
          amount: normalizeNumber(item.amount),
          time: item.time || null
        })).filter((item) => item.amount !== null) : []
        };
        normalized.segments = normalizeSessionSegments(normalized);
        applySegmentIds(normalized);
        syncSessionHitTotals(normalized, next.machines);
        return normalized;
      });
      if (!next.stores.some((store) => store.id === next.activeStoreId)) next.activeStoreId = next.stores[0]?.id || null;
      next.dailyState = normalizeDailyState(next.dailyState, next.machines);
      return next;
    }

    function persist() {
      data.sessions.forEach(resyncSessionSegments);
      data.meta.updatedAt = nowIso();
      data.meta.sampleSessionChars = measureSampleSessionChars();
      data.meta.sampleMachineChars = measureSampleMachineChars();
      data.meta.mapLayoutChars = measureActiveMapLayoutChars();
      data.meta.lastSaveChars = 0;
      const draftRaw = JSON.stringify(data);
      data.meta.lastSaveChars = draftRaw.length;
      const raw = JSON.stringify(data);
      data.meta.lastSaveChars = raw.length;
      const finalRaw = JSON.stringify(data);
      if (finalRaw.length < 12) {
        console.warn("ytv3 empty-write guard blocked save");
        return false;
      }
      try {
        const before = localStorage.getItem(STORAGE_KEY);
        if (before) localStorage.setItem(BACKUP_KEY, before);
        localStorage.setItem(STORAGE_KEY, finalRaw);
        return true;
      } catch (error) {
        console.warn("ytv3 persist failed", error);
        return false;
      }
    }

    function normalizeDailyState(source, machines) {
      const validMachineIds = new Set(machines.map((machine) => machine.id));
      const next = {};
      Object.entries(source || {}).forEach(([machineId, byDate]) => {
        if (!validMachineIds.has(machineId) || !byDate || typeof byDate !== "object") return;
        Object.entries(byDate).forEach(([date, state]) => {
          if (!isDateString(date) || !state || typeof state !== "object") return;
          const normalized = { date };
          const legacyRamState = state.ramClear;
          const ramClear = normalizeRamClear(legacyRamState);
          const hasLegacyRamState = ["retained", "hitToday", "cleared"].includes(legacyRamState);
          const prevInvalid = state.prevInvalid === true || legacyRamState === "cleared" || legacyRamState === "hitToday";
          const closingSpin = normalizeNumber(state.closingSpin);
          const hesoRating = normalizeRatingValue(state.hesoRating);
          if (ramClear) normalized.ramClear = ramClear;
          if (prevInvalid) normalized.prevInvalid = true;
          else if (state.prevInvalid === false || legacyRamState === "retained") normalized.prevInvalid = false;
          if (closingSpin !== null) normalized.closingSpin = closingSpin;
          if (hesoRating !== null) normalized.hesoRating = hesoRating;
          if (normalized.ramClear || normalized.prevInvalid !== undefined || normalized.closingSpin !== undefined || normalized.hesoRating !== undefined) {
            if (!next[machineId]) next[machineId] = {};
            next[machineId][date] = normalized;
          }
        });
      });
      return next;
    }

    function migrateStoreAssumedRatesToMaps(nextData, legacyStores) {
      const legacyRates = new Map((legacyStores || []).map((store) => [store.id, normalizeNumber(store.assumedRate)]));
      Object.entries(nextData.layouts || {}).forEach(([storeId, layout]) => {
        const legacyRate = legacyRates.get(storeId);
        if (legacyRate === null || legacyRate <= 0 || !layout?.maps) return;
        layout.maps.forEach((map) => {
          if (normalizeNumber(map.assumedRate) !== null) return;
          const parsed = parseIslandLayout(map);
          const hasYutimeByMachine = parsed.daiNos.some((daiNo) => {
            const machine = nextData.machines.find((item) => item.storeId === storeId && item.daiNo === String(daiNo));
            return Boolean(presetById(normalizeMachinePresetId(machine))?.hasYutime);
          });
          const hasYutimeByColumn = (map.islands || []).some((island) => (
            Boolean(presetById(island.leftPresetId)?.hasYutime) || Boolean(presetById(island.rightPresetId)?.hasYutime)
          ));
          const hasYutime = hasYutimeByMachine || hasYutimeByColumn;
          if (hasYutime) map.assumedRate = legacyRate;
        });
      });
    }

    function loadIslandFilters() {
      try {
        const parsed = JSON.parse(localStorage.getItem(ISLAND_FILTER_KEY) || "{}");
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch {
        return {};
      }
