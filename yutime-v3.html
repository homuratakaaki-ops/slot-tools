    function saveCurrentMap() {
      const store = activeStore();
      if (!store) return;
      ensureMapDraft(store.id);
      const previousIslands = cloneIslands(data.layouts[store.id]?.islands || []);
      const islands = readIslandDraftFromDom();
      if (!islands.length && previousIslands.length && !mapDraft.allowEmptySave) {
        showToast(`フロアマップが空です。既存の${previousIslands.length}島を消す場合は、島ごとに[島を削除]してから保存してください。`, "error");
        renderMapEditor();
        return;
      }
      const parsed = parseIslandLayout({ islands });
      data.layouts[store.id] = { islands, updatedAt: nowIso(), errors: parsed.errors };
      mapDraft = { storeId: store.id, islands: cloneIslands(islands), allowEmptySave: false };
      syncMachinesFromMap(store.id, parsed);
      applyColumnPresetsToMachines(store.id, islands, parsed, previousIslands);
      if (!persistWithToast(`フロアマップを保存しました（${parsed.daiNos.length}台）`)) return;
      renderAll();
    }

    function ensureMapDraft(storeId) {
      if (mapDraft.storeId === storeId) return;
      const layout = data.layouts[storeId] || { islands: [] };
      mapDraft = { storeId, islands: cloneIslands(layout.islands || []), allowEmptySave: false };
    }

    function hydrateMapDraftFromSavedLayout(storeId) {
      const savedIslands = cloneIslands(data.layouts[storeId]?.islands || []);
      if (savedIslands.length && !mapDraft.islands.length && !mapDraft.allowEmptySave) {
        mapDraft = { storeId, islands: savedIslands, allowEmptySave: false };
      }
    }

    function addIslandDraft() {
      const store = activeStore();
      if (!store) return;
      ensureMapDraft(store.id);
      mapEditorOpenByStore[store.id] = true;
      mapDraft.allowEmptySave = false;
      mapDraft.islands.push({ left: { from: null, to: null }, right: null, excluded: [], leftPresetId: "", rightPresetId: "" });
      renderMapEditor();
    }

    function islandEditorHtml(island, index) {
      const left = island.left || {};
      const right = island.right || {};
      const parsed = parseIslandLayout({ islands: [island] });
      const row = parsed.rows[0] || { sides: [[], []], allSides: [[], []] };
      return `
        <div class="island-card" data-island-index="${index}">
          <div class="island-card-head">
            <strong>島 ${index + 1}</strong>
            <button class="small" data-delete-island="${index}">島を削除</button>
          </div>
          <div class="island-sides">
            ${islandSideInputHtml(index, "left", "左列", left, island.leftPresetId)}
            ${islandSideInputHtml(index, "right", "右列", right, island.rightPresetId)}
          </div>
          <div class="island-preview">
            <div class="preview-side">${previewSideHtml(row.allSides[0], island.excluded || [])}</div>
            <div class="aisle" aria-hidden="true"></div>
            <div class="preview-side">${previewSideHtml(row.allSides[1], island.excluded || [])}</div>
          </div>
        </div>
      `;
    }

    function islandSideInputHtml(index, side, label, value, presetId = "") {
      return `
        <div class="island-side">
          <h4>${label}</h4>
          <label class="hint" for="island_${index}_${side}_from">開始台番</label>
          <label class="hint" for="island_${index}_${side}_to">終了台番</label>
          <input id="island_${index}_${side}_from" data-island-input="${index}" data-side="${side}" data-part="from" inputmode="numeric" value="${escapeHtml(value.from ?? "")}">
          <input id="island_${index}_${side}_to" data-island-input="${index}" data-side="${side}" data-part="to" inputmode="numeric" value="${escapeHtml(value.to ?? "")}">
          <label class="hint" for="island_${index}_${side}_preset">機種</label>
          <select id="island_${index}_${side}_preset" data-island-input="${index}" data-side="${side}" data-part="presetId">
            <option value="">未設定</option>
            ${MACHINE_PRESETS.map((preset) => `<option value="${escapeHtml(preset.id)}" ${preset.id === presetId ? "selected" : ""}>${escapeHtml(preset.name)}</option>`).join("")}
          </select>
        </div>
      `;
    }

    function previewSideHtml(daiNos, excluded) {
      if (!daiNos.length) return '<span class="hint">片面なし</span>';
      const excludedSet = new Set((excluded || []).map(String));
      return daiNos.map((daiNo) => `
        <button class="preview-machine ${excludedSet.has(String(daiNo)) ? "excluded" : ""}" data-preview-dai="${escapeHtml(daiNo)}">${escapeHtml(daiNo)}</button>
      `).join("");
    }

    function bindIslandEditor() {
      els.islandBuilder.querySelectorAll("[data-island-input]").forEach((input) => {
        input.addEventListener("input", () => {
          const focusId = input.id;
          const cursor = input.selectionStart;
          updateIslandDraftFromDom();
          renderMapEditor();
          const nextInput = byId(focusId);
          if (nextInput) {
            nextInput.focus();
            if (cursor !== null && typeof nextInput.setSelectionRange === "function") nextInput.setSelectionRange(cursor, cursor);
          }
        });
      });
      els.islandBuilder.querySelectorAll("[data-preview-dai]").forEach((button) => {
        button.addEventListener("click", () => {
          const card = button.closest("[data-island-index]");
          const index = Number(card.dataset.islandIndex);
          const daiNo = String(button.dataset.previewDai);
          const excluded = new Set((mapDraft.islands[index].excluded || []).map(String));
          if (excluded.has(daiNo)) excluded.delete(daiNo);
          else excluded.add(daiNo);
          mapDraft.islands[index].excluded = [...excluded];
          renderMapEditor();
        });
      });
      els.islandBuilder.querySelectorAll("[data-delete-island]").forEach((button) => {
        button.addEventListener("click", () => {
          const index = Number(button.dataset.deleteIsland);
          mapDraft.islands.splice(index, 1);
          mapDraft.allowEmptySave = mapDraft.islands.length === 0;
          renderMapEditor();
        });
      });
    }

    function updateIslandDraftFromDom() {
      mapDraft.islands = readIslandDraftFromDom();
    }

    function readIslandDraftFromDom() {
      return [...els.islandBuilder.querySelectorAll("[data-island-index]")].map((card) => {
        const index = Number(card.dataset.islandIndex);
        const left = readIslandSideFromDom(index, "left");
        const right = readIslandSideFromDom(index, "right");
        return {
          left,
          right: right.from === null && right.to === null ? null : right,
          leftPresetId: byId(`island_${index}_left_preset`)?.value || "",
          rightPresetId: byId(`island_${index}_right_preset`)?.value || "",
          excluded: (mapDraft.islands[index]?.excluded || []).map(String)
        };
      });
    }

    function readIslandSideFromDom(index, side) {
      const from = normalizeNumber(byId(`island_${index}_${side}_from`)?.value);
      const to = normalizeNumber(byId(`island_${index}_${side}_to`)?.value);
      return { from, to };
    }

    function normalizeLayouts(layouts) {
      const normalized = {};
      Object.entries(layouts || {}).forEach(([storeId, layout]) => {
        if (layout && Array.isArray(layout.islands)) {
          normalized[storeId] = {
            islands: cloneIslands(layout.islands),
            updatedAt: layout.updatedAt || nowIso(),
            errors: Array.isArray(layout.errors) ? layout.errors : []
          };
          return;
        }
        if (layout && typeof layout.source === "string") {
          const islands = textMapToIslands(layout.source);
          normalized[storeId] = { islands, updatedAt: layout.updatedAt || nowIso(), errors: [] };
          return;
        }
        normalized[storeId] = { islands: [], updatedAt: nowIso(), errors: [] };
      });
      return normalized;
    }

    function cloneIslands(islands) {
      return (Array.isArray(islands) ? islands : []).map((island) => normalizeIsland(island));
    }

    function normalizeIsland(island) {
      return {
        left: normalizeIslandSide(island?.left),
        right: island?.right ? normalizeIslandSide(island.right) : null,
        leftPresetId: presetById(island?.leftPresetId) ? island.leftPresetId : "",
        rightPresetId: presetById(island?.rightPresetId) ? island.rightPresetId : "",
        excluded: Array.isArray(island?.excluded) ? [...new Set(island.excluded.map(String))] : []
      };
    }

    function normalizeIslandSide(side) {
      return {
        from: normalizeNumber(side?.from),
        to: normalizeNumber(side?.to)
      };
    }

    function textMapToIslands(source) {
      const parsed = parseTextMapLayout(source);
      return parsed.rows.map((row) => {
        const left = daiNosToSide(row.sides[0]);
        const right = daiNosToSide(row.sides[1]);
        const leftExcluded = sideExcluded(row.sides[0], left);
        const rightExcluded = sideExcluded(row.sides[1], right);
        return {
          left,
          right: right.from === null || right.to === null ? null : right,
          excluded: [...leftExcluded, ...rightExcluded]
        };
      });
    }

    function daiNosToSide(daiNos) {
      if (!Array.isArray(daiNos) || !daiNos.length) return { from: null, to: null };
      return { from: normalizeNumber(daiNos[0]), to: normalizeNumber(daiNos[daiNos.length - 1]) };
    }

    function sideExcluded(existingDaiNos, side) {
      const wanted = new Set((existingDaiNos || []).map(String));
      return expandIslandSide(side).filter((daiNo) => !wanted.has(String(daiNo)));
    }

    function parseIslandLayout(layout) {
      const errors = [];
      const seen = new Set();
      const rows = cloneIslands(layout?.islands || []).map((island, index) => {
        const excluded = new Set((island.excluded || []).map(String));
        const allLeft = expandIslandSide(island.left);
        const allRight = island.right ? expandIslandSide(island.right) : [];
        const left = allLeft.filter((daiNo) => !excluded.has(String(daiNo)));
        const right = allRight.filter((daiNo) => !excluded.has(String(daiNo)));
        if (!allLeft.length) errors.push(`島${index + 1}: 左列の台番を入力してください`);
        [...left, ...right].forEach((daiNo) => {
          if (seen.has(daiNo)) errors.push(`島${index + 1}: 台番${daiNo}が重複しています`);
          seen.add(daiNo);
        });
        return { sides: [left, right], allSides: [allLeft, allRight] };
      }).filter((row) => row.allSides[0].length || row.allSides[1].length);
      return { rows, errors, daiNos: [...seen] };
    }

    function expandIslandSide(side) {
      const from = normalizeNumber(side?.from);
      const to = normalizeNumber(side?.to);
      if (from === null || to === null) return [];
      const step = from <= to ? 1 : -1;
      const values = [];
      for (let n = from; step > 0 ? n <= to : n >= to; n += step) values.push(String(n));
      return values;
    }

    function parseTextMapLayout(source) {
      const errors = [];
      const seen = new Set();
      const rows = [];
      String(source || "").split(/\r?\n/).forEach((line, index) => {
        const trimmed = line.trim();
        if (!trimmed) return;
        const sides = trimmed.split("|").slice(0, 2).map((side) => parseMapSide(side, index + 1, errors));
        while (sides.length < 2) sides.push([]);
        sides.flat().forEach((daiNo) => {
          if (seen.has(daiNo)) errors.push(`${index + 1}行目: 台番${daiNo}が重複しています`);
          seen.add(daiNo);
        });
        rows.push({ sides });
      });
      return { rows, errors, daiNos: [...seen] };
    }

    function parseMapSide(side, lineNo, errors) {
      const values = [];
      String(side || "").split(/[,\s]+/).filter(Boolean).forEach((token) => {
        const range = token.match(/^(\d+)-(\d+)$/);
        if (range) {
          const start = Number(range[1]);
          const end = Number(range[2]);
          if (!Number.isInteger(start) || !Number.isInteger(end)) {
            errors.push(`${lineNo}行目: ${token} は不正なレンジです`);
            return;
          }
          const step = start <= end ? 1 : -1;
          for (let n = start; step > 0 ? n <= end : n >= end; n += step) values.push(String(n));
          return;
        }
        if (/^\d+$/.test(token)) {
          values.push(token);
          return;
        }
        errors.push(`${lineNo}行目: ${token} は読み取れません`);
      });
      return values;
    }

    function mapStatusHtml(parsed) {
      const count = parsed.daiNos.length;
      const chips = [`<span class="badge good">${count}台</span>`];
      if (parsed.errors.length) {
        chips.push(...parsed.errors.slice(0, 3).map((error) => `<span class="badge warn">${escapeHtml(error)}</span>`));
        if (parsed.errors.length > 3) chips.push(`<span class="badge warn">ほか${parsed.errors.length - 3}件</span>`);
      } else {
        chips.push('<span class="badge">読み取りOK</span>');
      }
      return chips.join("");
    }

    function syncMachinesFromMap(storeId, parsed) {
      parsed.daiNos.forEach((daiNo) => {
        if (!data.machines.some((machine) => machine.storeId === storeId && machine.daiNo === daiNo)) {
          data.machines.push({
            id: cryptoId("m"),
            storeId,
            daiNo,
            modelName: "",
            roundBalls: null,
            memo: "",
            presetId: "",
            evSupported: false
          });
        }
      });
    }

    function applyColumnPresetsToMachines(storeId, islands, parsed, previousIslands = []) {
      islands.forEach((island, islandIndex) => {
        ["left", "right"].forEach((sideName, sideIndex) => {
          const presetId = sideName === "left" ? island.leftPresetId : island.rightPresetId;
          const preset = presetById(presetId);
          if (!preset) return;
          const previousPresetId = sideName === "left" ? previousIslands[islandIndex]?.leftPresetId || "" : previousIslands[islandIndex]?.rightPresetId || "";
          const presetChanged = previousPresetId !== presetId;
          const daiNos = parsed.rows[islandIndex]?.sides?.[sideIndex] || [];
          const machines = daiNos.map((daiNo) => data.machines.find((machine) => machine.storeId === storeId && machine.daiNo === String(daiNo))).filter(Boolean);
          const alreadySet = machines.filter((machine) => {
            const currentPresetId = normalizeMachinePresetId(machine);
            const hasIndividualSetting = machineHasIndividualSetting(machine);
            return hasIndividualSetting && currentPresetId !== presetId;
          });
          const allowOverwrite = alreadySet.length && presetChanged ? confirm(`この列の台${alreadySet.length}台の機種を${preset.name}に更新しますか？`) : false;
          machines.forEach((machine) => {
            const currentPresetId = normalizeMachinePresetId(machine);
            const hasIndividualSetting = machineHasIndividualSetting(machine);
            if (hasIndividualSetting && currentPresetId !== presetId && !allowOverwrite) return;
            if (!currentPresetId || currentPresetId !== presetId) applyPresetToMachine(machine, preset);
          });
        });
      });
    }

    function machineHasIndividualSetting(machine) {
      return Boolean(normalizeMachinePresetId(machine) || machine.modelName || machine.roundBalls !== null || machine.memo || machine.evSupported);
    }

    function applyPresetToMachine(machine, preset) {
      machine.presetId = preset.id;
      machine.modelName = preset.name;
      machine.roundBalls = preset.roundBalls;
      machine.evSupported = Boolean(preset.evSupported);
    }

    function findMachineByDai(daiNo) {
      const store = activeStore();
      if (!store) return null;
      return data.machines.find((machine) => machine.storeId === store.id && machine.daiNo === String(daiNo)) || null;
    }

    function openClosingCheckForm(daiNo) {
      const machine = findMachineByDai(daiNo);
      if (!machine) return;
      const sequence = closingColumnSequence(daiNo);
      const index = sequence.indexOf(String(daiNo));
      closingInputFlow = {
        sequence,
        index: index >= 0 ? index : 0,
        direction: null,
        awaitingDirection: false,
        buffer: "",
        recent: "",
        ended: false
      };
      hydrateClosingBuffer();
      renderClosingInputModal();
    }

    function closingColumnSequence(daiNo) {
      const store = activeStore();
      const parsed = parseIslandLayout(data.layouts[store?.id] || { islands: [] });
      const wanted = String(daiNo);
      for (const row of parsed.rows) {
        for (const side of row.sides) {
          if ((side || []).map(String).includes(wanted)) return (side || []).map(String);
        }
      }
      return [wanted];
    }

    function hydrateClosingBuffer() {
      const machine = findMachineByDai(currentClosingDaiNo());
      const existing = machine ? dailyStateFor(machine.id, today())?.closingSpin ?? "" : "";
      closingInputFlow.buffer = existing === "" ? "" : String(existing);
    }

    function currentClosingDaiNo() {
      return closingInputFlow?.sequence[closingInputFlow.index] || "";
    }

    function renderClosingInputModal() {
      if (!closingInputFlow) return;
      const daiNo = currentClosingDaiNo();
      const atStart = closingInputFlow.index <= 0;
      const atEnd = closingInputFlow.index >= closingInputFlow.sequence.length - 1;
      const leftDai = atStart ? null : closingInputFlow.sequence[closingInputFlow.index - 1];
      const rightDai = atEnd ? null : closingInputFlow.sequence[closingInputFlow.index + 1];
      const ended = closingInputFlow.ended;
      openModal(`台 ${daiNo} の閉店回転数`, "端末キーボードを使わず、この画面だけで連続入力します。", `
        <div class="closing-display" id="closingDisplay">${escapeHtml(closingInputFlow.buffer || "0")}</div>
        <div class="closing-keypad">
          ${[7, 8, 9, 4, 5, 6, 1, 2, 3].map((digit) => `<button data-closing-digit="${digit}">${digit}</button>`).join("")}
          <button data-closing-clear>C</button>
          <button data-closing-digit="0">0</button>
          <button data-closing-back>⌫</button>
        </div>
        ${ended ? `<p class="hint warn">この列は終わりです。</p><div class="modal-actions"><button class="primary" data-close>マップへ戻る</button></div>` : `
          <div class="closing-flow-actions">
            <button id="skipClosingBtn">スキップ</button>
            <button class="primary" id="saveClosingNextBtn">確定して次へ</button>
          </div>
          <div class="closing-direction">
            ${closingInputFlow.direction === null && closingInputFlow.awaitingDirection ? `
              <p class="hint">最初の確定後、進む方向を選んでください。</p>
              <div class="grid two">
                <button id="chooseClosingBackwardBtn" ${leftDai ? "" : "disabled"}>← ${escapeHtml(leftDai || "端") }へ</button>
                <button id="chooseClosingForwardBtn" ${rightDai ? "" : "disabled"}>${escapeHtml(rightDai || "端")}へ →</button>
              </div>
            ` : closingInputFlow.direction === null ? `
              <p class="hint">最初に確定またはスキップすると、進行方向を選べます。</p>
            ` : `
              <button class="small" id="toggleClosingDirectionBtn">進行方向: ${escapeHtml(directionPreviewText())}（切替▼）</button>
            `}
          </div>
        `}
        <div class="closing-recent">${escapeHtml(closingInputFlow.recent)}</div>
      `);
      bindClosingInputModal();
      modalCancel = () => {
        closingInputFlow = null;
        renderMachineMap();
      };
    }

    function directionPreviewText() {
      if (!closingInputFlow?.direction) return "未設定";
      const current = currentClosingDaiNo();
      const next = closingInputFlow.sequence[closingInputFlow.index + closingInputFlow.direction];
      return next ? `${current} → ${next}` : `${current} → 端`;
    }

    function bindClosingInputModal() {
      els.modalBody.querySelectorAll("[data-closing-digit]").forEach((button) => {
        button.addEventListener("click", () => {
          closingInputFlow.buffer = (closingInputFlow.buffer + button.dataset.closingDigit).replace(/^0+(\d)/, "$1");
          byId("closingDisplay").textContent = closingInputFlow.buffer || "0";
        });
      });
      const clearButton = els.modalBody.querySelector("[data-closing-clear]");
      if (clearButton) clearButton.addEventListener("click", () => {
        closingInputFlow.buffer = "";
        byId("closingDisplay").textContent = "0";
      });
      const backButton = els.modalBody.querySelector("[data-closing-back]");
      if (backButton) backButton.addEventListener("click", () => {
        closingInputFlow.buffer = closingInputFlow.buffer.slice(0, -1);
        byId("closingDisplay").textContent = closingInputFlow.buffer || "0";
      });
      const saveButton = byId("saveClosingNextBtn");
      if (saveButton) saveButton.addEventListener("click", saveClosingAndAdvance);
      const skipButton = byId("skipClosingBtn");
      if (skipButton) skipButton.addEventListener("click", () => advanceClosingFlow(false));
      const backwardButton = byId("chooseClosingBackwardBtn");
      if (backwardButton) backwardButton.addEventListener("click", () => chooseClosingDirection(-1));
      const forwardButton = byId("chooseClosingForwardBtn");
      if (forwardButton) forwardButton.addEventListener("click", () => chooseClosingDirection(1));
      const toggleButton = byId("toggleClosingDirectionBtn");
      if (toggleButton) toggleButton.addEventListener("click", () => {
        closingInputFlow.direction *= -1;
        renderClosingInputModal();
      });
    }

    function saveClosingAndAdvance() {
      const value = normalizeNumber(closingInputFlow.buffer);
      if (value === null) {
        closingInputFlow.recent = "数値を入力してください";
        renderClosingInputModal();
        return;
      }
      const daiNo = currentClosingDaiNo();
      const machine = findMachineByDai(daiNo);
      if (!machine) return;
      const next = ensureDailyState(machine.id, today());
      next.closingSpin = value;
      if (!persist()) {
        closingInputFlow.recent = "保存に失敗しました";
        renderClosingInputModal();
        return;
      }
      closingInputFlow.recent = `保存: ${daiNo}=${value}`;
      advanceClosingFlow(true);
    }

    function chooseClosingDirection(direction) {
      closingInputFlow.direction = direction;
      closingInputFlow.awaitingDirection = false;
      closingInputFlow.ended = false;
      advanceClosingFlow(true);
    }

    function advanceClosingFlow(savedCurrent) {
      if (!closingInputFlow) return;
      if (closingInputFlow.direction === null) {
        closingInputFlow.awaitingDirection = true;
        renderClosingInputModal();
        return;
      }
      const skippedDaiNo = currentClosingDaiNo();
      const nextIndex = closingInputFlow.index + closingInputFlow.direction;
      if (nextIndex < 0 || nextIndex >= closingInputFlow.sequence.length) {
        closingInputFlow.ended = true;
        renderClosingInputModal();
        return;
      }
      closingInputFlow.index = nextIndex;
      closingInputFlow.ended = false;
      hydrateClosingBuffer();
      if (!savedCurrent) closingInputFlow.recent = `スキップ: ${skippedDaiNo}`;
      renderClosingInputModal();
    }

    function openMachineMemoEditor(machineId) {
      const machine = data.machines.find((item) => item.id === machineId);
      if (!machine) return;
      openModal("台メモ（釘・癖など）", "セッションのメモではなく、この台そのものに残すメモです。", `
        <div class="field-row"><label for="quickMachineMemo">台メモ（釘・癖など）</label><textarea id="quickMachineMemo" placeholder="＋台メモを追加">${escapeHtml(machine.memo || "")}</textarea></div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          <button class="primary" id="saveQuickMachineMemoBtn">保存</button>
        </div>
      `);
      byId("saveQuickMachineMemoBtn").addEventListener("click", () => {
        machine.memo = byId("quickMachineMemo").value.trim();
        if (!persistWithToast(`台番${machine.daiNo}の情報を保存しました`)) return;
        closeModal();
        renderAll();
      });
    }

    function openMachineDetail(daiNo) {
      const machine = findMachineByDai(daiNo);
      if (!machine) return;
      const sessions = data.sessions.filter((session) => session.machineId === machine.id);
      const stats = machineStats(machine.id);
      const presetId = normalizeMachinePresetId(machine);
      const latestEnd = latestEndInfo(machine.id);
      const closing = validClosingInfo(machine.id);
      const ramState = todayRamState(machine.id);
      const ramButtons = RAM_STATE_OPTIONS.map((option) => `<button class="${ramState === option.value ? "primary" : ""}" data-ram-state="${escapeHtml(option.value)}">${escapeHtml(option.label)}</button>`).join("");
      const closingStateNote = ramState && ramState !== "retained" ? `<small>${escapeHtml(ramStateOption(ramState)?.label || "")} / 前日は考慮しません</small>` : "";
      const filteredNote = selectedLabelFilters.size ? `<p class="hint warn">現在の統計は絞り込み後の記録だけで計算しています。</p>` : "";
      const averagePayoutNote = stats.estimatedCount ? "（概算含む）" : "";
      openModal(`台番 ${daiNo}`, "過去セッション概要を確認して開始します。", `
        <div class="status-line" style="margin-bottom:10px">
          ${ramButtons}
        </div>
        <div class="field-row"><label for="machineMemo">台メモ（釘・癖など）</label><textarea id="machineMemo" placeholder="＋台メモを追加">${escapeHtml(machine.memo || "")}</textarea></div>
        <div class="metric-grid">
          <div class="metric"><span>参考回転率</span><strong>${stats.rate ? `${stats.rate.toFixed(1)}回/千円` : "-"}</strong>${stats.estimatedCount ? `<small>概算${stats.estimatedCount}件を含む</small>` : ""}</div>
          <div class="metric"><span>通常回転サンプル</span><strong>${stats.spins}</strong></div>
          <div class="metric"><span>通常消費玉</span><strong>${stats.consumed}</strong></div>
          <div class="metric"><span>前回ヤメ（履歴）</span><strong>${latestEnd ? `${escapeHtml(latestEnd.spin)}回転` : "-"}</strong>${latestEnd ? `<small>（${escapeHtml(shortDate(latestEnd.date))} / 宵越し根拠には使いません）</small>` : ""}</div>
          <div class="metric"><span>閉店チェック</span><strong>${closing ? `${escapeHtml(closing.spin)}回転` : "-"}</strong>${closing ? `<small>（${escapeHtml(shortDate(closing.date))}）</small>` : closingStateNote}</div>
          <div class="metric"><span>平均出玉</span><strong>${stats.averagePayout !== null ? Math.round(stats.averagePayout) : "-"}</strong>${stats.averagePayout !== null ? `<small>${averagePayoutNote}</small>` : ""}</div>
          ${stats.averageYutimeLoss !== null ? `<div class="metric"><span>遊タイム玉減り</span><strong>${Math.round(stats.averageYutimeLoss)}</strong><small>${stats.yutimeLossCount}件平均</small></div>` : ""}
        </div>
        ${filteredNote}
        <div class="expectation-box">
          <div class="expectation-title" id="machineEvTitle"><span>期待値判定</span><small>未判定</small></div>
          <div class="expectation-inputs">
            <div class="field-row"><label for="evCurrentSpin">現在回転数</label><input id="evCurrentSpin" inputmode="numeric" value=""></div>
            <div class="field-row"><label for="evPrevSpin">前日ヤメ回転数</label><input id="evPrevSpin" inputmode="numeric" value="${escapeHtml(closing?.spin ?? "")}"></div>
            <div class="field-row"><label for="evManualRate">回転率（手入力）</label><input id="evManualRate" inputmode="decimal" placeholder="${stats.rate ? stats.rate.toFixed(1) : "台帳なし"}"></div>
          </div>
          <div class="metric-grid" id="machineEvMetrics"></div>
          <p class="hint" id="machineEvDetail"></p>
        </div>
        <div class="field-row" style="margin-top:12px"><label for="machinePreset">機種プリセット</label><select id="machinePreset">
          ${MACHINE_PRESETS.map((preset) => `<option value="${escapeHtml(preset.id)}">${escapeHtml(preset.name)}</option>`).join("")}
          <option value="">その他（自由入力）</option>
        </select></div>
        <div class="field-row"><label for="machineModel">機種名</label><input id="machineModel" value="${escapeHtml(machine.modelName || "")}" placeholder="任意"></div>
        <div class="field-row"><label for="roundBalls">1R玉数</label><input id="roundBalls" inputmode="numeric" value="${escapeHtml(machine.roundBalls ?? "")}" placeholder="例: 140"></div>
        <p class="hint">1ラウンドあたりの獲得玉数。例: 大海物語スペシャル5 なら 140</p>
        <p class="hint warn" id="presetSupportNote"></p>
        <div class="list">
          ${sessions.slice(-5).reverse().map((session) => {
            const derived = deriveSession(session, machine);
            return `<div class="row-card"><strong>${escapeHtml(session.date)}</strong><br><small>${session.status === "completed" ? "確定" : "稼働中"} / 回転率 ${rateText(derived)}${derived.isEstimatedRate || derived.isEstimatedPayout ? " / 概算" : ""}</small></div>`;
          }).join("") || '<div class="row-card"><small>過去セッションなし</small></div>'}
        </div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          <button id="saveMachineBtn">台情報保存</button>
          <button class="primary" id="startSessionBtn">この台を打つ</button>
        </div>
      `);
      byId("machinePreset").value = presetId;
      applyPresetSelectionToForm();
      renderMachineExpectation(machine.id);
      els.modalBody.querySelectorAll("[data-ram-state]").forEach((button) => {
        button.addEventListener("click", () => toggleRamState(machine.id, button.dataset.ramState));
      });
      ["evCurrentSpin", "evPrevSpin", "evManualRate"].forEach((id) => {
        byId(id).addEventListener("input", () => renderMachineExpectation(machine.id));
      });
      byId("machinePreset").addEventListener("change", () => {
        applyPresetSelectionToForm();
        readMachineDetailForm(machine);
        renderMachineExpectation(machine.id);
      });
      byId("saveMachineBtn").addEventListener("click", () => {
        readMachineDetailForm(machine);
        if (!persistWithToast(`台番${daiNo}の情報を保存しました`)) return;
        closeModal();
        renderAll();
      });
      byId("startSessionBtn").addEventListener("click", () => {
        readMachineDetailForm(machine);
        const startSpinPreset = normalizeNumber(byId("evCurrentSpin")?.value);
        const prevDayEndSpinPreset = normalizeNumber(byId("evPrevSpin")?.value);
        if (!persist()) {
          showToast("保存に失敗しました。容量を確認してください。", "error");
          return;
        }
        closeModal();
        openStartWizard(machine.id, { startSpin: startSpinPreset, prevDayEndSpin: prevDayEndSpinPreset });
      });
    }

    function toggleRamState(machineId, nextState) {
      nextState = normalizeRamState(nextState);
      if (!nextState) return;
      const state = ensureDailyState(machineId, today());
      if (state.ramClear === nextState) delete state.ramClear;
      else state.ramClear = nextState;
      cleanupEmptyDailyState(machineId, today());
      if (!persistWithToast("保存しました")) return;
      const machine = data.machines.find((item) => item.id === machineId);
      closeModal();
      if (machine) openMachineDetail(machine.daiNo);
      renderMachineMap();
    }

    function renderMachineExpectation(machineId) {
      const machine = data.machines.find((item) => item.id === machineId);
      const title = byId("machineEvTitle");
      const metrics = byId("machineEvMetrics");
      const detail = byId("machineEvDetail");
      if (!machine || !title || !metrics || !detail) return;
      const stats = machineStats(machine.id);
      const expectation = calculateMachineExpectation(machine, {
        currentSpin: byId("evCurrentSpin")?.value,
        previousSpin: byId("evPrevSpin")?.value,
        manualRate: byId("evManualRate")?.value,
        stats
      });
      title.className = "expectation-title";
      if (!expectation.result) {
        title.querySelector("small").textContent = "未判定";
        metrics.innerHTML = '<div class="metric"><span>判定</span><strong>-</strong></div>';
        detail.textContent = expectation.reason || "回転率を入力するか、台帳累計を作ってください。";
        return;
      }
      const judgment = evJudgment(expectation.result);
      title.classList.add(judgment.className);
      title.querySelector("small").textContent = judgment.label;
      metrics.innerHTML = `
        <div class="metric"><span>判定</span><strong>${escapeHtml(judgment.label)}</strong></div>
        <div class="metric"><span>残り回転数</span><strong>${expectation.result.spinsToTenjo.toLocaleString("ja-JP")}</strong></div>
        <div class="metric"><span>期待値</span><strong>${escapeHtml(yenText(expectation.result.evYen))}</strong></div>
        <div class="metric"><span>時給</span><strong>${escapeHtml(yenText(expectation.result.hourlyYen))}</strong></div>
        <div class="metric"><span>スロ換算機械割</span><strong>${escapeHtml(percentText(expectation.result.slotRate))}</strong></div>
        <div class="metric"><span>拘束時間</span><strong>${escapeHtml(hourText(expectation.result.totalHours))}</strong></div>
      `;
      const near = expectation.result.spinsToTenjo < 100 && expectation.result.spinsToTenjo > 0;
      detail.textContent = `使用回転率 ${expectation.result.rotationRate.toFixed(1)}（${expectation.rateSource}） / 実効${expectation.effectiveSpin}回転${expectation.previousSpin ? `（宵越し${expectation.previousSpin}+現在${expectation.currentSpin}）` : ""} / ${expectation.payoutSource} / ${exchangeBallsText(expectation.exchangeBalls)}玉交換${near ? " / 天井まで100回転未満です" : ""}`;
    }

    function applyPresetSelectionToForm() {
      const preset = presetById(byId("machinePreset").value);
      const modelInput = byId("machineModel");
      const roundInput = byId("roundBalls");
      const note = byId("presetSupportNote");
      if (preset) {
        modelInput.value = preset.name;
        roundInput.value = preset.roundBalls;
        modelInput.disabled = true;
        note.textContent = preset.evSupported ? "期待値算出はこのプリセット選択時のみ対応しています。" : "このプリセットは期待値算出に未対応です。";
      } else {
        modelInput.disabled = false;
        note.textContent = "期待値算出は P大海物語5スペシャル のプリセット選択時のみ対応しています。";
      }
    }

    function readMachineDetailForm(machine) {
      const preset = presetById(byId("machinePreset").value);
      machine.presetId = preset ? preset.id : "";
      machine.modelName = byId("machineModel").value.trim();
      machine.roundBalls = normalizeNumber(byId("roundBalls").value);
      machine.memo = byId("machineMemo").value.trim();
      machine.evSupported = Boolean(preset?.evSupported);
    }

    function openStartWizard(machineId, presets = {}) {
      const store = activeStore();
      const currentActive = activeSessionsForStore(store?.id)[0] || null;
      if (currentActive) {
        openActiveStartGuard(machineId, currentActive, presets);
        return;
      }
      beginStartWizard(machineId, presets);
    }

    function openActiveStartGuard(machineId, active, presets = {}) {
      const activeMachine = data.machines.find((item) => item.id === active.machineId);
      const daiNo = activeMachine?.daiNo || "不明";
      openModal("稼働中の記録があります", `台${daiNo}がヤメ入力されていません。`, `
        <div class="grid">
          <button class="primary" id="goActiveEndBtn">台${escapeHtml(daiNo)}のヤメ入力へ</button>
          <button id="forceStartBtn">そのまま新しく開始</button>
          <button class="ghost" data-close>キャンセル</button>
        </div>
      `);
      byId("goActiveEndBtn").addEventListener("click", () => {
        activeSessionId = active.id;
        closeModal();
        showView("runView");
        openEndWizard(active.id);
      });
      byId("forceStartBtn").addEventListener("click", () => {
        closeModal();
        setTimeout(() => beginStartWizard(machineId, presets), 0);
      });
    }

    function latestCompletedSessionForStoreToday(storeId) {
      return data.sessions
        .filter((session) => session.storeId === storeId && session.date === today() && session.status === "completed")
        .sort((a, b) => activeSortKey(b).localeCompare(activeSortKey(a)))[0] || null;
    }

    function latestCompletedSessionForMachineToday(machineId) {
      return data.sessions
        .filter((session) => session.machineId === machineId && session.date === today() && session.status === "completed")
        .sort((a, b) => activeSortKey(b).localeCompare(activeSortKey(a)))[0] || null;
    }

    function beginStartWizard(machineId, presets = {}) {
      const store = activeStore();
      const session = blankSession();
      session.storeId = store.id;
      session.machineId = machineId;
      const manualPrevDayEndSpin = normalizeNumber(presets.prevDayEndSpin);
      session.prevDayEndSpin = manualPrevDayEndSpin ?? validClosingInfo(machineId)?.spin ?? null;
      const activeCarryover = carryover && carryover.storeId === store.id ? carryover : null;
      if (activeCarryover) {
        session.carriedFromSessionId = activeCarryover.sourceSessionId;
        session.startMochidama = activeCarryover.mochidama;
        session.startSaipurei = activeCarryover.saipurei;
        session.startCredit = activeCarryover.credit;
      }
      const latestStoreSession = !activeCarryover ? latestCompletedSessionForStoreToday(store.id) : null;
      const latestStoreBalances = latestStoreSession ? deriveBalances(latestStoreSession) : null;
      const latestMachineSession = latestCompletedSessionForMachineToday(machineId);
      const startSpinPreset = normalizeNumber(presets.startSpin);
      const prevDayEndSpinWasManual = manualPrevDayEndSpin !== null;
      const startSaipureiPreset = !activeCarryover && latestStoreBalances?.saipurei != null ? latestStoreBalances.saipurei : null;
      const startCreditPreset = !activeCarryover && latestStoreBalances?.credit != null ? latestStoreBalances.credit : null;
      const startTotalHitsPreset = latestMachineSession?.endTotalHits ?? null;
      const previousBalanceHint = "本日の前の台の終了時点の残高を初期値にしています。台の表示と違う場合は修正してください。";
      const labels = storeLabels(store.id);
      runWizard("打ち始めウィザード", [
        {
          key: "startSpin",
          label: "現在回転数",
          type: "number",
          preset: startSpinPreset,
          hint: `${dateWithAutoLabels(session.date)}で記録します。` + (session.prevDayEndSpin !== null ? ` ${prevDayEndSpinWasManual ? "期待値判定に入力した前日ヤメ" : "閉店チェック"}${session.prevDayEndSpin}回転を宵越し候補として控えています。` : " 閉店チェック値は未記録、またはラムクリ確認済みです。") + (startSpinPreset !== null ? " 期待値判定に入力した現在回転数を初期値にしています。台の表示と違う場合は修正してください。" : "")
        },
        { key: "startTime", label: "時刻", type: "time", preset: currentTime(), hint: "現在時刻をプリセットしています。" },
        { key: "startMochidama", label: "持ち玉", type: "number", hint: activeCarryover ? "前の台から引き継いだ値です。必要なら修正できます。持ち玉なしで現金スタートなら 0 を入力してください。スキップすると回転率は算出されません。" : "持ち玉なしで現金スタートなら 0 を入力してください。スキップすると回転率は算出されません。" },
        { key: "startSaipurei", label: "再プレイ残り玉", type: "number", preset: startSaipureiPreset, hint: activeCarryover ? "前の台から引き継いだ値です。未入力だった場合は空欄のままです。" : (startSaipureiPreset !== null ? previousBalanceHint : "") },
        { key: "startCredit", label: "カード残高（クレジット残金）", type: "number", preset: startCreditPreset, hint: activeCarryover ? "前の台から引き継いだ値です。換金・休憩を挟んだ場合は修正してください。" : (startCreditPreset !== null ? previousBalanceHint : "") },
        { key: "startTotalHits", label: "データカウンタの累計大当たり回数", type: "number", preset: startTotalHitsPreset, hint: "台のデータカウンタに表示されている本日の大当たり回数。ヤメ時に差し引きで自分の当たり回数を自動計算します。" + (startTotalHitsPreset !== null ? " 同じ台の前回記録のヤメ時点累計を初期値にしています。台の表示と違う場合は修正してください。" : "") },
        { key: "labels", label: "店イベント", type: "labels", labels, hint: eventMemoHelp() }
      ], session, () => {
        if (session.currentSpin === null || session.currentSpin === undefined) session.currentSpin = session.startSpin;
        data.sessions.push(session);
        activeSessionId = session.id;
        if (!persistWithToast("稼働を開始しました")) return;
        if (activeCarryover) {
          carryover = null;
          localStorage.removeItem(CARRYOVER_KEY);
        }
        showView("runView");
      });
    }

    function openHitWizard(sessionId) {
      const session = findSession(sessionId);
      if (!session) return;
      const currentBalances = deriveBalances(session);
      const mochidamaPreset = currentBalances.mochidama;
      const balancePresetHint = "稼働中の持ち玉残を初期値にしています。台の表示と違う場合は修正してください。";
      runWizard("当選ウィザード", [
        { key: "hitSpin", label: "当選回転数", type: "number", preset: session.currentSpin, wizardHint: "初当たりの瞬間の記録です。大当たり回数・出玉は、連チャンが全て終わったあと [ヤメ] でまとめて入力します。" },
        { key: "hitRemainBalls", label: "残り玉", type: "number", preset: mochidamaPreset, hint: (mochidamaPreset !== null ? `${balancePresetHint} ` : "") + (activeStore()?.isPersonal ? "パーソナル店では確定回転率に使います。" : "非パーソナル店ではスキップ前提です。") }
      ], session, () => {
        if (!session.hitVia) session.hitVia = session.yutimeEnterBalls !== null ? "yutime" : "normal";
        session.updatedAt = nowIso();
        if (!persistWithToast("当選を記録しました")) return;
        renderAll();
        openHitResetPrompt(session);
      });
    }

    function hitResetOptions(machine) {
      const preset = presetById(normalizeMachinePresetId(machine));
      const values = [0];
      if (preset?.spec?.jitanNormal !== undefined) values.push(Number(preset.spec.jitanNormal));
      if (preset?.spec?.jitanChain !== undefined) values.push(Number(preset.spec.jitanChain));
      return [...new Set(values.filter((value) => Number.isFinite(value) && value >= 0))];
    }

    function openHitResetPrompt(session) {
      const machine = data.machines.find((item) => item.id === session.machineId);
      const options = hitResetOptions(machine);
      openModal("現在回転数をリセット", "選ばず閉じると現在回転数はそのままです。続行する場合だけ、時短消化後の起点に合わせてください。", `
        <div class="quick-invest">
          ${options.map((value) => `<button data-hit-reset="${value}">${value}</button>`).join("")}
        </div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
        </div>
      `);
      els.modalBody.querySelectorAll("[data-hit-reset]").forEach((button) => {
        button.addEventListener("click", () => {
          const value = Number(button.dataset.hitReset);
          closeModal();
          setCurrentSpinWithUndo(session, value);
          showToast(`現在回転数を${value}にリセットしました`);
        });
      });
    }

    function openEndWizard(sessionId) {
      const session = findSession(sessionId);
      if (!session) return;
      openModal("ヤメ入力", "結果を選んでから、必要な項目だけ記録します。", `
        <div class="grid two">
          <button class="primary" id="endWithHitBtn">大当たりあり</button>
          <button id="endNoHitBtn">当たらず終了（遊タイム抜け含む）</button>
        </div>
      `);
      byId("endWithHitBtn").addEventListener("click", () => {
        closeModal();
        runEndWizard(session, true);
      });
      byId("endNoHitBtn").addEventListener("click", () => {
        session.hitCount = 0;
        session.totalRounds = 0;
        closeModal();
        runEndWizard(session, false);
      });
    }

    function presetHitCountFromCounters(session) {
      if (session.startTotalHits === null || session.startTotalHits === undefined || session.endTotalHits === null || session.endTotalHits === undefined) return;
      const diff = Number(session.endTotalHits) - Number(session.startTotalHits);
      if (diff < 0) {
        showToast("累計大当たり回数を確認してください。ヤメ時点が開始時点より少なくなっています。", "error");
        if (session.hitCount === null || session.hitCount === undefined) session.hitCount = null;
        return;
      }
      session.hitCount = diff;
    }

    function runEndWizard(session, hasHit) {
      const currentBalances = deriveBalances(session);
      const endTotalBallsPreset = currentBalances.mochidama;
      const endTotalBallsHint = endTotalBallsPreset !== null ? "稼働中の持ち玉残を初期値にしています。台の表示と違う場合は修正してください。" : "";
      const endSpinPreset = !hasHit && session.hitSpin === null && Number(session.hitCount || 0) === 0 ? session.currentSpin : null;
      const endSpinHint = endSpinPreset !== null ? "稼働中カウンタの現在回転数を初期値にしています。台の表示と違う場合は修正してください。" : "";
      const steps = hasHit ? [
        { key: "endTotalHits", label: "ヤメ時点の累計大当たり回数", type: "number" },
        { key: "hitCount", label: "大当たり回数", type: "number" },
        { key: "totalRounds", label: "合計R数", type: "number", hint: "1R玉数と合わせてR数ベース出玉を計算します。" },
        { key: "endTotalBalls", label: "時短抜け後の合計玉数", type: "number", preset: endTotalBallsPreset, hint: endTotalBallsHint },
        { key: "endSpin", label: "ヤメ回転数", type: "number" },
        { key: "zanhoryuBalls", label: "残保留増減", type: "number" },
        { key: "memo", label: "メモ", type: "textarea" }
      ] : [
        { key: "endTotalBalls", label: "終了時玉数", type: "number", preset: endTotalBallsPreset, hint: endTotalBallsHint },
        { key: "endSpin", label: "ヤメ回転数", type: "number", preset: endSpinPreset, hint: endSpinHint },
        { key: "zanhoryuBalls", label: "残保留増減", type: "number" },
        { key: "memo", label: "メモ", type: "textarea" }
      ];
      runWizard("ヤメ入力", steps, session, () => {
        session.status = "completed";
        if (!hasHit) session.hitCount = 0;
        session.endTime = session.endTime || currentTime();
        session.updatedAt = nowIso();
        if (activeSessionId === session.id) activeSessionId = activeSessionsForStore(session.storeId).find((item) => item.id !== session.id)?.id || null;
        if (!persistWithToast("記録を保存しました")) return;
        showView("mapView");
        openRateSummary(session);
      }, {
        afterStep: (step) => {
          if (hasHit && step.key === "endTotalHits") presetHitCountFromCounters(session);
        }
      });
    }

    function runWizard(title, steps, target, done, options = {}) {
      let index = 0;
      const draft = target;
      const renderStep = () => {
        const step = steps[index];
        const wizardHint = step.wizardHint || `${index + 1} / ${steps.length}: ${step.label}。未入力でスキップできます。`;
        openModal(title, wizardHint, wizardInputHtml(step, draft[step.key]) + `
          <div class="modal-actions wizard-actions">
            <button class="primary" id="nextStepBtn">${index === steps.length - 1 ? "完了" : "次へ"}</button>
            <button id="skipStepBtn">スキップ</button>
            <button id="backStepBtn" ${index === 0 ? "disabled" : ""}>戻る</button>
          </div>
        `, "wizard");
        const input = byId("wizardValue");
        if (input && step.preset && !input.value) input.value = step.preset;
        if (input) {
          input.addEventListener("keydown", (event) => {
            if (event.key !== "Enter") return;
            if (step.type === "textarea" && !event.ctrlKey && !event.metaKey) return;
            event.preventDefault();
            byId("nextStepBtn").click();
          });
        }
        byId("skipStepBtn").addEventListener("click", () => {
          draft[step.key] = step.type === "labels" ? [] : null;
          if (options.afterStep) options.afterStep(step, draft, index);
          advance();
        });
        byId("backStepBtn").addEventListener("click", () => {
          if (index > 0) {
            draft[step.key] = readWizardValue(step);
            index -= 1;
            renderStep();
          }
        });
        byId("nextStepBtn").addEventListener("click", () => {
          draft[step.key] = readWizardValue(step);
          if (options.afterStep) options.afterStep(step, draft, index);
          advance();
        });
      };
      const advance = () => {
        if (index >= steps.length - 1) {
          closeModal();
          done();
        } else {
          index += 1;
          renderStep();
        }
      };
      modalCancel = () => renderAll();
      renderStep();
    }

    function wizardInputHtml(step, value) {
      if (step.type === "textarea") {
        return `<textarea id="wizardValue">${escapeHtml(value || "")}</textarea>${step.hint ? `<p class="hint">${escapeHtml(step.hint)}</p>` : ""}`;
      }
      if (step.type === "labels") {
        const chosen = new Set(Array.isArray(value) ? value : []);
        return `${step.hint ? `<p class="hint">${escapeHtml(step.hint)}</p>` : ""}<div class="label-checks">${(step.labels || []).map((label) => `
          <label class="check-chip"><input class="wizardLabel" type="checkbox" value="${escapeHtml(label)}" ${chosen.has(label) ? "checked" : ""}> ${escapeHtml(label)}</label>
        `).join("") || '<span class="hint">イベントメモ未登録です。</span>'}</div>`;
      }
      const inputType = step.type === "time" ? "time" : "text";
      const inputMode = step.type === "number" ? ' inputmode="numeric"' : "";
      const displayValue = value ?? step.preset ?? "";
      return `<input id="wizardValue" type="${inputType}"${inputMode} value="${escapeHtml(displayValue)}">${step.hint ? `<p class="hint">${escapeHtml(step.hint)}</p>` : ""}`;
    }

    function readWizardValue(step) {
      if (step.type === "labels") return [...document.querySelectorAll(".wizardLabel:checked")].map((input) => input.value);
      const input = byId("wizardValue");
      if (!input) return null;
      if (step.type === "number") return normalizeNumber(input.value);
      const value = input.value.trim();
      return value ? value : null;
    }

    function isYutimeInvestmentPhase(session) {
      return Boolean(session.yutimeEnterTime || session.yutimeEnterBalls !== null);
    }

    function currentInvestmentPhase(session) {
      return isYutimeInvestmentPhase(session) ? "yutime" : "normal";
    }

    function investmentPhaseLabel(item) {
      return item.phase === "yutime" ? "遊タイム中" : "通常時";
    }

    function investmentSourceLabel(source) {
      const normalized = normalizeInvestmentSource(source);
      if (normalized === "mochidama") return "持ち玉";
      if (normalized === "saipurei") return "再プレイ";
      return "現金";
    }

    function balanceText(value, unit) {
      return value === null ? "未入力" : `${numberText(value, 0)} ${unit}`;
    }

    function rateText(derived) {
      if (derived.rateUnavailableReason) return `-（${derived.rateUnavailableReason}）`;
      if (derived.rate === null) return "-";
      return `${derived.rate.toFixed(1)}${derived.isEstimatedRate ? "（概算）" : ""}`;
    }

    function payoutText(derived) {
      if (derived.hitBalls === null) return "-";
      return `${numberText(derived.hitBalls, "-")}${derived.isEstimatedPayout ? "（概算）" : ""}`;
    }

    function liveRunningRate(session) {
      if (session.startSpin === null || session.currentSpin === null || session.currentSpin === undefined) return null;
      const store = storeById(session.storeId);
      const normalInvestedBalls = session.investments.filter((item) => item.phase !== "yutime").reduce((sum, item) => sum + investmentToBalls(item, store), 0);
      const inputBalls = usesTapInvestmentMode(session) ? normalInvestedBalls : Number(session.startMochidama || 0) + normalInvestedBalls;
      const spins = Number(session.currentSpin) - Number(session.startSpin);
      return inputBalls > 0 && spins >= 0 ? spins / inputBalls * 250 : null;
    }

    function runningPanelRate(session) {
      if (session.startSpin === null || session.currentSpin === null || session.currentSpin === undefined) return null;
      const store = storeById(session.storeId);
      const investedBalls = session.investments.reduce((sum, item) => sum + investmentToBalls(item, store), 0);
      const inputBalls = usesTapInvestmentMode(session) ? investedBalls : Number(session.startMochidama || 0) + investedBalls;
      const spins = Number(session.currentSpin) - Number(session.startSpin);
      return inputBalls > 0 && spins >= 0 ? spins / inputBalls * 250 : null;
    }

    function runningYutimeRemaining(session, machine) {
      if (!session || !machine || isYutimeInvestmentPhase(session) || session.hitSpin !== null) return null;
      const preset = presetById(normalizeMachinePresetId(machine));
      if (!preset?.evSupported || !preset.spec?.tenjo) return null;
      const current = normalizeNumber(session.currentSpin ?? session.startSpin);
      if (current === null) return null;
      const previous = normalizeNumber(session.prevDayEndSpin) || 0;
      const effective = current + previous;
      const remaining = Math.max(0, Number(preset.spec.tenjo) - effective);
      return {
        remaining,
        near: remaining < 100,
        text: `遊タイム残り ${remaining.toLocaleString("ja-JP")}回転`
      };
    }

    function runningPanelInputBalls(session, derived = null) {
      const stats = derived || deriveSession(session);
      return usesTapInvestmentMode(session) ? stats.investedBalls : Math.round(stats.totalInputBalls || stats.investedBalls || 0);
    }

    function runningSpinCount(session) {
      if (session.startSpin === null || session.currentSpin === null || session.currentSpin === undefined) return null;
      return Number(session.currentSpin) - Number(session.startSpin);
    }

    function investmentSnapshot(session, investmentIndex) {
      const item = session.investments[investmentIndex];
      if (!item) return null;
      const store = storeById(session.storeId);
      const investedBalls = session.investments.slice(0, investmentIndex + 1).reduce((sum, investment) => sum + investmentToBalls(investment, store), 0);
      const inputBalls = usesTapInvestmentMode(session) ? investedBalls : Number(session.startMochidama || 0) + investedBalls;
      const spinAt = item.spinAt !== null && item.spinAt !== undefined ? Number(item.spinAt) : null;
      const spins = spinAt !== null && session.startSpin !== null ? spinAt - Number(session.startSpin) : null;
      const rate = inputBalls > 0 && spins !== null && spins >= 0 ? spins / inputBalls * 250 : null;
      return {
        inputBalls: Math.round(inputBalls),
        spins,
        rate
      };
    }

    function historyEntries(session) {
      const investments = session.investments.map((item, index) => ({
        kind: "investment",
        item,
        index,
        time: item.time || "",
        order: index
      }));
      const chargeOffset = session.investments.length;
      const charges = (session.charges || []).map((item, index) => ({
        kind: "charge",
        item,
        index,
        time: item.time || "",
        order: chargeOffset + index
      }));
      return investments.concat(charges).sort((a, b) => {
        const timeCompare = String(b.time).localeCompare(String(a.time));
        return timeCompare || b.order - a.order;
      });
    }

    function addCurrentSpin(session, amount) {
      setCurrentSpinWithUndo(session, Number(session.currentSpin ?? session.startSpin ?? 0) + amount);
    }

    function setCurrentSpinWithUndo(session, value) {
      const current = Number(session.currentSpin ?? session.startSpin ?? 0);
      const next = Number(value || 0);
      const amount = next - current;
      if (!spinUndoStacks[session.id]) spinUndoStacks[session.id] = [];
      spinUndoStacks[session.id].push(amount);
      if (spinUndoStacks[session.id].length > 20) spinUndoStacks[session.id].shift();
      session.currentSpin = next;
      session.updatedAt = nowIso();
      persist();
      renderRunning();
    }

    function undoCurrentSpin(session) {
      const stack = spinUndoStacks[session.id] || [];
      const amount = stack.pop();
      if (!amount) return;
      session.currentSpin = Number(session.currentSpin ?? session.startSpin ?? 0) - amount;
      session.updatedAt = nowIso();
      persist();
      renderRunning();
    }

    function deriveBalances(session) {
      const cashTotal = session.investments.filter((item) => investmentSource(item) === "cash").reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const replayTotal = session.investments.filter((item) => investmentSource(item) === "saipurei").reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const mochidamaTotal = session.investments.filter((item) => investmentSource(item) === "mochidama").reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const chargeTotal = (session.charges || []).reduce((sum, item) => sum + Number(item.amount || 0), 0);
      return {
        mochidama: session.startMochidama === null ? null : Number(session.startMochidama || 0) - mochidamaTotal,
        credit: session.startCredit === null ? null : Number(session.startCredit || 0) + chargeTotal - cashTotal,
        saipurei: session.startSaipurei === null ? null : Number(session.startSaipurei || 0) - replayTotal
      };
    }

    function investmentTotals(session) {
      return (session.investments || []).reduce((totals, item) => {
        const source = investmentSource(item);
        if (source === "cash") totals.cashYen += Number(item.amount || 0);
        if (source === "saipurei") totals.saipureiBalls += Number(item.amount || 0);
        if (source === "mochidama") totals.mochidamaBalls += Number(item.amount || 0);
        return totals;
      }, { cashYen: 0, saipureiBalls: 0, mochidamaBalls: 0 });
    }

    function balanceForSource(session, source) {
      const balances = deriveBalances(session);
      if (source === "mochidama") return balances.mochidama;
      if (source === "saipurei") return balances.saipurei;
      return balances.credit;
    }

    function canUseSource(session, source, amount) {
      const balance = balanceForSource(session, source);
      return balance !== null && balance >= amount;
    }

    function finalMochidamaForCarryover(session) {
      if (session.endTotalBalls === null || session.endTotalBalls === undefined) return null;
      return Number(session.endTotalBalls || 0) + Number(session.zanhoryuBalls || 0);
    }

    function createCarryoverFromSession(session) {
      const machine = data.machines.find((item) => item.id === session.machineId);
      const balances = deriveBalances(session);
      return {
        storeId: session.storeId,
        sourceSessionId: session.id,
        sourceMachineId: session.machineId,
        sourceDaiNo: machine?.daiNo || "",
        date: session.date,
        mochidama: finalMochidamaForCarryover(session),
        credit: balances.credit,
        saipurei: balances.saipurei,
        createdAt: nowIso()
      };
    }

    function startCarryover(session) {
      const nextCarryover = createCarryoverFromSession(session);
      if (!saveCarryover(nextCarryover)) return;
      closeModal();
      showView("mapView");
      showToast("持ち玉を引き継ぎ待機にしました");
    }

    function openSameMachineContinuePrompt(session) {
      const machine = data.machines.find((item) => item.id === session.machineId);
      const options = hitResetOptions(machine);
      openModal("同じ台で続行", "開始回転数を選ぶと、同じ台の新しい記録をすぐ開始します。値はあとから修正できます。", `
        <div class="quick-invest">
          ${options.map((value) => `<button class="${Number(session.currentSpin) === value ? "primary" : ""}" data-same-start="${value}">${value}</button>`).join("")}
        </div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
        </div>
      `);
      els.modalBody.querySelectorAll("[data-same-start]").forEach((button) => {
        button.addEventListener("click", () => startSameMachineContinuation(session, Number(button.dataset.sameStart)));
      });
    }

    function startSameMachineContinuation(sourceSession, startSpin) {
      const balances = deriveBalances(sourceSession);
      const next = blankSession();
      next.storeId = sourceSession.storeId;
      next.machineId = sourceSession.machineId;
      next.date = today();
      next.labels = Array.isArray(sourceSession.labels) ? [...sourceSession.labels] : [];
      next.carriedFromSessionId = sourceSession.id;
      next.startSpin = startSpin;
      next.currentSpin = startSpin;
      next.startTime = currentTime();
      next.startMochidama = finalMochidamaForCarryover(sourceSession);
      next.startSaipurei = balances.saipurei;
      next.startCredit = balances.credit;
      next.startTotalHits = sourceSession.endTotalHits ?? null;
      data.sessions.push(next);
      activeSessionId = next.id;
      if (!persistWithToast("同じ台で続行を開始しました")) return;
      closeModal();
      showView("runView");
      renderAll();
    }

    function addInvestment(session, source, amount, time = currentTime()) {
      if (amount === null) return;
      source = normalizeInvestmentSource(source);
      const balance = balanceForSource(session, source);
      if (balance === null) {
        showToast("先に残高を入力してください", "error");
        return;
      }
      if (balance < amount) {
        showToast("残高が不足しています", "error");
        return;
      }
      const item = { type: source, source, amount, time, phase: currentInvestmentPhase(session), spinAt: session.currentSpin ?? session.startSpin };
      session.investments.push(item);
      session.updatedAt = nowIso();
      const balls = Math.round(investmentToBalls(item, storeById(session.storeId)));
      if (!persist()) {
        showToast("保存に失敗しました。容量を確認してください。", "error");
        return;
      }
      showToast(`投資を追記しました（+${balls}玉）`, "success", {
        undo: () => {
          const index = session.investments.indexOf(item);
          if (index >= 0) {
            session.investments.splice(index, 1);
            session.updatedAt = nowIso();
            persist();
            renderAll();
          }
        }
      });
      renderAll();
    }

    function deleteInvestment(session, index) {
      if (!Number.isInteger(index) || !session.investments[index]) return;
      session.investments.splice(index, 1);
      session.updatedAt = nowIso();
      if (!persistWithToast("投資履歴を削除しました")) return;
      renderAll();
    }

    function addCharge(session, amount, time = currentTime()) {
      if (amount === null || amount <= 0) return;
      const item = { amount, time };
      if (!Array.isArray(session.charges)) session.charges = [];
      session.charges.push(item);
      session.updatedAt = nowIso();
      if (!persist()) {
        showToast("保存に失敗しました。容量を確認してください。", "error");
        return;
      }
      showToast(`入金を記録しました（+${amount}円）`, "success", {
        undo: () => {
          const index = session.charges.indexOf(item);
          if (index >= 0) {
            session.charges.splice(index, 1);
            session.updatedAt = nowIso();
            persist();
            renderAll();
          }
        }
      });
      renderAll();
    }

    function deleteCharge(session, index) {
      if (!Number.isInteger(index) || !session.charges?.[index]) return;
      session.charges.splice(index, 1);
      session.updatedAt = nowIso();
      if (!persistWithToast("入金履歴を削除しました")) return;
      renderAll();
    }

    function openInvestmentForm(type) {
      const session = activeSession();
      if (!session) return;
      const label = investmentSourceLabel(type);
      openModal(`${label}を直接入力`, "入力すると即時に投入履歴へ追記します。残高を超える入力は保存できません。", `
        <div class="field-row"><label for="investmentAmount">${type === "cash" ? "金額" : "玉数"}</label><input id="investmentAmount" inputmode="numeric"></div>
        <div class="field-row"><label for="investmentTime">時刻</label><input id="investmentTime" type="time" value="${currentTime()}"></div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          <button class="primary" id="saveInvestmentBtn">追記</button>
        </div>
      `);
      byId("saveInvestmentBtn").addEventListener("click", () => {
        const amount = normalizeNumber(byId("investmentAmount").value);
        if (amount === null) return;
        addInvestment(session, type, amount, byId("investmentTime").value || currentTime());
        closeModal();
      });
    }

    function openChargeForm(session) {
      openModal("入金", "カード残高を増やします。入金は投入玉・差玉には含めません。", `
        <div class="quick-invest">
          <button data-charge-amount="1000">+1,000円</button>
          <button data-charge-amount="5000">+5,000円</button>
          <button data-charge-amount="10000">+10,000円</button>
        </div>
        <div class="field-row"><label for="chargeAmount">直接入力</label><input id="chargeAmount" inputmode="numeric"></div>
        <div class="field-row"><label for="chargeTime">時刻</label><input id="chargeTime" type="time" value="${currentTime()}"></div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          <button class="primary" id="saveChargeBtn">入金</button>
        </div>
      `);
      els.modalBody.querySelectorAll("[data-charge-amount]").forEach((button) => {
        button.addEventListener("click", () => {
          addCharge(session, Number(button.dataset.chargeAmount), byId("chargeTime").value || currentTime());
          closeModal();
        });
      });
      byId("saveChargeBtn").addEventListener("click", () => {
        const amount = normalizeNumber(byId("chargeAmount").value);
        if (amount === null || amount <= 0) return;
        addCharge(session, amount, byId("chargeTime").value || currentTime());
        closeModal();
      });
    }

    function openBalanceEditForm(session, key) {
      const labels = {
        startMochidama: "持ち玉",

    function openSpinEditForm(session) {

        <div class="field-row"><label for="currentSpinValue">現在回転数</label><input id="currentSpinValue" inputmode="numeric" value="${escapeHtml(session.currentSpin ?? session.startSpin ?? "")}"></div>

          <button class="ghost" data-close>閉じる</button>
          <button class="primary" id="saveCurrentSpinBtn">保存</button>
        </div>
      `);
      byId("saveCurrentSpinBtn").addEventListener("click", () => {
        session.currentSpin = normalizeNumber(byId("currentSpinValue").value);
        session.updatedAt = nowIso();

    function openYutimeEnterForm(sessionId) {

      openModal("遊タイム突入", "突入時の玉数を入れると、後で玉減りを分けて見られます。", `

          <div class="metric"><span>獲得出玉</span><strong>${payoutText(derived)}</strong></div>

          ${session.hitVia === "yutime" ? `<div class="metric"><span>遊タイム玉減り</span><strong>${numberText(derived.yutimeLoss, "-")}</strong></div>` : ""}

        <div class="modal-actions">

      openModal("記録の修正", "スキップした項目もここで修正できます。", `

          ${fieldHtml("startCredit", "カード残高（クレジット残金）", session.startCredit)}
          ${fieldHtml("startTotalHits", "開始時点の累計大当たり回数", session.startTotalHits)}
