<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>遊タイム実戦ツール v3</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f4ef;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #667085;
      --line: #d8d5ca;
      --accent: #236c68;
      --accent-dark: #174b48;
      --warn: #b45309;
      --danger: #b42318;
      --good: #1c7c54;
      --soft: #e8f3f1;
      --button: #f8fafc;
      --shadow: 0 10px 24px rgba(31, 41, 51, 0.08);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }

    body.running-fullscreen-lock {
      overflow: hidden;
      overscroll-behavior: none;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--button);
      color: var(--ink);
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active { transform: translateY(1px); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { background: var(--accent-dark); }
    button.danger { color: #fff; background: var(--danger); border-color: var(--danger); }
    button.ghost { background: transparent; }
    button.small { min-height: 36px; padding: 0 10px; }
    button.icon { width: 44px; padding: 0; display: inline-grid; place-items: center; }

    input, textarea, select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.5;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 14px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      background: rgba(245, 244, 239, 0.95);
      backdrop-filter: blur(10px);
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .store-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      white-space: nowrap;
      font-size: 14px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 6px 0 14px;
    }

    .tab {
      min-height: 42px;
      border-radius: 8px;
      background: #fff;
    }

    .tab.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .view { display: none; }
    .view.active { display: block; }
    #mapView.active { display: flex; flex-direction: column; gap: 0; }
    #mapView > .section:first-of-type { order: 2; }
    #mapView > .section:nth-of-type(2) { order: 1; }

    .section {
      margin: 0 0 14px;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .section-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      margin-bottom: 12px;
    }

    .section h2, .section h3 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .section p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .store-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .store-card {
      min-height: 72px;
      padding: 12px;
      text-align: left;
      background: #fff;
    }

    .store-card strong { display: block; font-size: 16px; }
    .store-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }

    .field-row {
      display: grid;
      grid-template-columns: minmax(120px, 180px) 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .field-row label {
      font-weight: 700;
      font-size: 13px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .warn {
      color: var(--warn);
      font-weight: 700;
    }

    .danger-text {
      color: var(--danger);
      font-weight: 700;
    }

    .status-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 8px 0 0;
    }

    .baseline-chip-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }

    .baseline-chip {
      min-height: 42px;
      padding: 0 6px;
      white-space: nowrap;
      font-size: 11px;
      text-align: center;
    }

    .baseline-chip strong {
      font-size: 16px;
      line-height: 1;
    }

    @media (max-width: 340px) {
      .baseline-chip-grid { grid-template-columns: 1fr; }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #eef2f6;
      color: #344054;
      font-size: 12px;
      white-space: nowrap;
    }

    .badge.warn { background: #fff7ed; color: #9a3412; }
    .badge.good { background: #ecfdf3; color: #067647; }
    .badge.dark { background: var(--ink); color: #fff; }

    .label-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 0;
    }

    .check-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 13px;
    }

    .check-chip input {
      width: auto;
      min-height: auto;
      padding: 0;
    }

    .filter-block {
      margin: 0 0 14px;
    }

    .filter-panel {
      display: grid;
      gap: 4px;
      margin-top: 8px;
    }

    .filter-block + .filter-block {
      margin-top: 12px;
    }

    .filter-status {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 0 0 14px;
      padding: 10px;
      border: 1px solid #7aa7a3;
      border-radius: 8px;
      background: var(--soft);
    }

    .island-builder {
      display: grid;
      gap: 12px;
    }

    .island-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .island-card-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .island-card-head strong {
      font-size: 15px;
    }

    .island-name-button {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--ink);
      text-align: left;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .island-card-summary {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .island-sides {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .island-side {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }

    .island-side h4 {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 13px;
    }

    .island-side .wide {
      grid-column: 1 / -1;
    }

    .island-preview {
      display: grid;
      grid-template-columns: minmax(84px, 1fr) 34px minmax(84px, 1fr);
      gap: 12px;
      align-items: stretch;
      margin-top: 10px;
    }

    .preview-side {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .preview-machine {
      min-height: 44px;
      padding: 5px;
      font-weight: 800;
      background: #fff;
    }

    .preview-machine.excluded {
      color: #98a2b3;
      background: #eef2f6;
      text-decoration: line-through;
    }

    .map-gap,
    .preview-gap {
      min-height: 28px;
      display: grid;
      place-items: center;
      color: #667085;
    }

    .map-gap::before,
    .preview-gap::before {
      content: "";
      width: 6px;
      height: 100%;
      min-height: 26px;
      border-radius: 999px;
      background: repeating-linear-gradient(
        180deg,
        #98a2b3 0,
        #98a2b3 6px,
        #e4e7ec 6px,
        #e4e7ec 10px
      );
    }

    .preview-gap {
      min-height: 18px;
    }

    .map-wrap {
      overflow-x: auto;
      margin-top: 14px;
      padding-bottom: 8px;
    }

    .map-grid {
      display: grid;
      gap: 8px;
      align-items: start;
      min-width: 320px;
    }

    .map-row {
      display: grid;
      grid-template-columns: minmax(90px, 1fr) 34px minmax(90px, 1fr);
      gap: 12px;
      align-items: stretch;
    }

    .map-island-label {
      margin: 8px 0 2px;
      padding: 0 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .map-side {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .aisle {
      min-height: 48px;
      border-radius: 8px;
      background: repeating-linear-gradient(
        90deg,
        #e3e0d5,
        #e3e0d5 4px,
        #f3f0e7 4px,
        #f3f0e7 8px
      );
    }

    .machine-button {
      position: relative;
      min-height: 72px;
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 3px;
      padding: 7px 5px 8px;
      background: #fff;
      text-align: center;
    }

    .machine-button .dai {
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
    }

    .machine-button .rate {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--muted);
      min-height: 17px;
    }

    .machine-button .rate.good { color: var(--good); }
    .machine-button .rate.bad { color: var(--danger); }

    .machine-button .prev {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .machine-button .active-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      padding: 2px 5px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
    }

    .machine-button.has-data {
      border-color: #7aa7a3;
      background: var(--soft);
    }

    .machine-button.is-active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 2px rgba(35, 108, 104, 0.18);
    }

    .machine-button.ev-good {
      border-color: var(--good);
      box-shadow: inset 0 0 0 2px rgba(28, 124, 84, 0.22);
    }

    .machine-button.ev-assumed {
      border-style: dashed;
    }

    .machine-button .eve-sign {
      position: absolute;
      left: 4px;
      top: 4px;
      padding: 2px 5px;
      border-radius: 999px;
      background: #ecfdf3;
      color: #067647;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
    }

    .machine-button .state-badge {
      position: absolute;
      left: 4px;
      bottom: 4px;
      padding: 2px 5px;
      border-radius: 999px;
      background: #f2f4f7;
      color: #475467;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
    }

    .machine-button .state-badge.retained {
      background: #ecfdf3;
      color: #067647;
    }

    .ram-choice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .ram-choice-row button[aria-pressed="true"] {
      border-color: var(--accent);
      background: #ecfdf3;
      color: #067647;
      font-weight: 800;
    }

    .nail-rating-section {
      display: grid;
      gap: 8px;
      margin: 10px 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }

    .nail-rating-row {
      display: grid;
      grid-template-columns: 4.5em 1fr;
      gap: 8px;
      align-items: center;
    }

    .nail-rating-row span {
      font-weight: 800;
      font-size: 13px;
    }

    .nail-rating-chips {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }

    .nail-rating-chips button {
      min-height: 38px;
      padding: 0;
      font-weight: 800;
    }

    .nail-rating-chips button[aria-pressed="true"] {
      border-color: var(--accent);
      background: #ecfdf3;
      color: #067647;
    }

    .machine-button .prev.invalid {
      text-decoration: line-through;
      color: var(--muted);
    }

    .machine-button .memo-badge {
      position: absolute;
      right: 4px;
      bottom: 4px;
      padding: 2px 5px;
      border-radius: 999px;
      background: #fff4e5;
      color: #a15c07;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
    }

    .machine-button .rate small {
      display: block;
      margin-top: 1px;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.1;
    }

    .running-panel {
      border-color: #7aa7a3;
      background: #f3fbfa;
    }

    .running-panel.fullscreen {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100dvh;
      margin: 0;
      padding: 8px 8px clamp(112px, 22dvh, 160px);
      overflow: hidden;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .running-sticky {
      position: sticky;
      top: 78px;
      z-index: 15;
      margin: -2px -2px 12px;
      padding: 12px;
      border: 1px solid #7aa7a3;
      border-radius: 8px;
      background: #f3fbfa;
      box-shadow: var(--shadow);
    }

    .running-sticky.sticky-off {
      position: static;
      box-shadow: none;
    }

    .running-panel.fullscreen .running-sticky {
      position: static;
      flex: 1 1 auto;
      min-height: 0;
      margin: 0;
      padding: 8px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      border: 0;
      box-shadow: none;
    }

    .running-headline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
    }

    .running-headline-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .running-panel.fullscreen .running-headline {
      gap: 6px;
    }

    .running-panel.fullscreen .running-headline strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .running-panel.fullscreen .running-headline-actions button {
      min-height: 34px;
      padding: 0 8px;
      white-space: nowrap;
    }

    .running-live-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(35, 108, 104, .25);
      border-radius: 8px;
      background: #fff;
    }

    .running-live-row span,
    .running-total-row span {
      color: var(--muted);
      font-size: 12px;
    }
    .running-evaluation {
      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    .running-evaluation summary {
      cursor: pointer;
      font-weight: 700;
      min-height: 36px;
    }
    .running-nail-collapse {
      margin-top: 10px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }
    .running-nail-collapse summary {
      cursor: pointer;
      font-weight: 700;
      min-height: 34px;
    }
    .trial-rate-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(44px, auto)) minmax(92px, 1fr) repeat(2, minmax(44px, auto));
      gap: 6px;
      align-items: center;
      margin: 8px 0;
    }
    .trial-rate-controls button {
      min-height: 34px;
      padding: 0 8px;
      font-weight: 800;
    }
    .trial-rate-value {
      text-align: center;
      font-weight: 800;
      white-space: nowrap;
    }

    .running-live-row strong {
      font-size: 22px;
    }

    .running-panel.fullscreen .running-live-row {
      margin-top: 8px;
      padding: 6px 8px;
    }

    .running-panel.fullscreen .running-live-row strong {
      font-size: 20px;
    }

    .live-ev-line {
      margin: -2px 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .live-ev-line.warn {
      color: var(--danger);
    }

    .editable-value {
      border-style: dashed;
      background: #fff;
      text-align: left;
    }

    .editable-value strong {
      display: inline-block;
      margin-right: 6px;
    }

    .editable-value small {
      color: var(--muted);
      font-size: 11px;
    }

    .counter-row, .balance-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .running-panel.fullscreen .balance-row {
      margin-top: 8px;
    }

    .counter-row strong {
      font-size: 26px;
      line-height: 1;
    }

    .counter-row button, .balance-row button {
      min-height: 34px;
      padding: 0 10px;
    }

    .running-bottom-controls {
      position: sticky;
      bottom: 8px;
      z-index: 16;
      margin: 12px -2px 0;
      padding: 10px;
      border: 1px solid #7aa7a3;
      border-radius: 8px;
      background: rgba(243, 251, 250, .96);
      box-shadow: var(--shadow);
    }

    .running-panel.fullscreen .running-bottom-controls {
      position: static;
      z-index: auto;
      flex: 0 0 auto;
      margin: 8px 0 0;
      padding: 8px;
      border-radius: 8px;
      box-shadow: none;
      background: #f3fbfa;
    }

    .running-bottom-controls.sticky-off {
      position: static;
      box-shadow: none;
    }

    .source-chip-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .source-chip {
      min-height: 42px;
      background: #fff;
      display: grid;
      gap: 2px;
      align-content: center;
      padding: 0 6px;
      white-space: nowrap;
    }

    .running-panel.fullscreen .source-chip {
      min-height: 38px;
      font-size: 12px;
    }

    .source-chip.selected {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 800;
    }

    .source-chip.is-low {
      opacity: .48;
    }

    .source-chip strong {
      font-size: 13px;
      line-height: 1.2;
    }

    .machine-summary-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .machine-summary-row strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .unified-invest-row {
      display: grid;
      grid-template-columns: auto auto minmax(120px, 1fr) auto;
      gap: 8px;
      margin-bottom: 8px;
      align-items: stretch;
    }

    .unified-invest-row button {
      min-height: 72px;
      font-size: 18px;
      font-weight: 800;
    }

    .running-panel.fullscreen .unified-invest-row {
      margin-bottom: 6px;
    }

    .running-panel.fullscreen .unified-invest-row button {
      min-height: 68px;
    }

    .unified-invest-row #unifiedInvestBtn {
      font-size: 22px;
    }

    .unified-invest-row .small {
      min-height: 72px;
      padding: 0 12px;
      font-size: 13px;
    }

    .running-bottom-controls .counter-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr) auto;
      gap: 8px;

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">

    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    "use strict";

    const STORAGE_PREFIX = "ytv3:";
    const STORAGE_KEY = STORAGE_PREFIX + "data";
    const PREMIGRATE_KEY = STORAGE_PREFIX + "premigrate";
    const BACKUP_KEY = STORAGE_PREFIX + "backup:latest";
    const CARRYOVER_KEY = STORAGE_PREFIX + "carryover";
    const MAP_BACKUP_KEY = STORAGE_PREFIX + "mapbackup";
    const CORRUPT_PREFIX = STORAGE_PREFIX + "corrupt:";
    const STICKY_PREF_KEY = STORAGE_PREFIX + "running:sticky";
    const SOURCE_PREF_KEY = STORAGE_PREFIX + "running:source";
    const ISLAND_FILTER_KEY = STORAGE_PREFIX + "islandFilter";
    const SCHEMA_VERSION = 25;
    const DEFAULT_LEND_RATE = 4;
    const DEFAULT_EXCHANGE_BALLS = 25;
    const DEFAULT_NET_BALLS_PER_WIN = 1400;
    const RATE_THRESHOLDS = { good: 17.0, bad: 15.0 };
    const EV_THRESHOLDS = { good: 2000, warn: 0 };
    const AUTO_LABELS = [
      "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日", "日曜日",
      "1のつく日", "2のつく日", "3のつく日", "4のつく日", "5のつく日",
      "6のつく日", "7のつく日", "8のつく日", "9のつく日", "0のつく日",
      "ゾロ目日"
    ];
    const MACHINE_PRESETS = [
      { id: "umi-sp5", name: "P大海物語5スペシャル", roundBalls: 140, standardRounds: 10, standardPayout: 1400, roundTypes: [{ id: "r10", label: "10R", balls: 1400 }], evSupported: true, hasYutime: true, spec: { note: "B5時点の期待値対応プリセット" } }
    ];
    const RAM_CLEAR_VALUE = "cleared";
    const RAM_NOT_CLEARED_VALUE = "not_cleared";
    const RAM_UNKNOWN_VALUE = "unknown";
    const DAILY_NAIL_RATING_KEY = "heso";
    const NAIL_RATING_KEYS = ["yori", "michi", "nekase", "through", "warp"];
    const NAIL_DISPLAY_KEYS = ["heso", ...NAIL_RATING_KEYS];
    const NAIL_RATING_LABELS = {
      heso: "ヘソ",
      yori: "寄り",
      michi: "道",
      nekase: "ネカセ",
      through: "スルー",
      warp: "ワープ"
    };

    const YUTIME_EXPECTATION_ENGINE = (() => {
      const preset = {
        id: "umi-sp5",
        name: "P大海物語5スペシャル",
        spec: {
          hitProb: 0.00312891,
          hitProbLabel: "1/319.6",
          tenjo: 950,
          yutimeJitan: 350,
          kakuhenRate: 0.54,
          jitanNormal: 100,
          jitanChain: 200,
          jitanRule: "確変中・通常時の通常当り→時短100 / 時短中(遊タイム含む)の通常当り→時短200"
        },
        defaults: {
          netBallsPerWin: DEFAULT_NET_BALLS_PER_WIN,
          jitanNormalBallsPerSpin: 0,
          jitanFastBallsPerSpin: 0,
          densapoDelta: 0,
          spinsPerHour: 250,
          secPerHit: 120,
          secPerDensapoSpin: 6,
          slotGamesPerHour: 800,
          yenPerBall: 4
        }
      };
      function rebound(prob, spins) {
        return 1 - Math.pow(1 - prob, spins);
      }
      function finiteExpectedSpins(prob, limit) {
        return rebound(prob, limit) / prob;
      }
      function normalInvestmentSplit(prob, spinsToTenjo, ballsPerSpin, availableBalls) {
        const available = Math.max(0, Number(availableBalls) || 0);
        const totalBalls = finiteExpectedSpins(prob, spinsToTenjo) * ballsPerSpin;
        if (spinsToTenjo <= 0 || available <= 0) return { mochidamaBalls: 0, cashBalls: totalBalls };
        let mochidamaBalls = 0;
        let missProb = 1;
        for (let spin = 1; spin <= spinsToTenjo; spin += 1) {
          const endBalls = Math.min(spin * ballsPerSpin, available);
          mochidamaBalls += missProb * prob * endBalls;
          missProb *= 1 - prob;
        }
        mochidamaBalls += missProb * Math.min(spinsToTenjo * ballsPerSpin, available);
        return {
          mochidamaBalls,
          cashBalls: Math.max(0, totalBalls - mochidamaBalls)
        };
      }
      function chainValues(settings = {}) {
        const spec = preset.spec;
        const p = spec.hitProb;
        const kaku = spec.kakuhenRate;
        const normal = 1 - kaku;
        const r100 = rebound(p, spec.jitanNormal);
        const r200 = rebound(p, spec.jitanChain);
        const r350 = rebound(p, spec.yutimeJitan);
        const a = 1 - kaku;
        const b = -normal * r100;
        const c = -kaku;
        const d = 1 - normal * r200;
        const det = a * d - b * c;
        const wInit = (d - b) / det;
        const jitanHit = (a - c) / det;
        const s100 = finiteExpectedSpins(p, spec.jitanNormal);
        const s200 = finiteExpectedSpins(p, spec.jitanChain);
        const dA = 1 - kaku;
        const dB = -normal * r100;
        const dC = -kaku;
        const dD = 1 - normal * r200;
        const dDet = dA * dD - dB * dC;
        const dRightE = normal * s100;
        const dRightJ = normal * s200;
        const densapoInit = (dRightE * dD - dB * dRightJ) / dDet;
        const densapoJitanHit = (dA * dRightJ - dRightE * dC) / dDet;
        const normalRightE = normal * s100;
        const normalRightJ = 0;
        const fastRightE = 0;
        const fastRightJ = normal * s200;
        const jitanNormalInit = (normalRightE * dD - dB * normalRightJ) / dDet;
        const jitanNormalJitanHit = (dA * normalRightJ - normalRightE * dC) / dDet;
        const jitanFastInit = (fastRightE * dD - dB * fastRightJ) / dDet;
        const jitanFastJitanHit = (dA * fastRightJ - fastRightE * dC) / dDet;
        return { r100, r200, r350, wInit, jitanHit, yutimeWins: r350 * jitanHit, densapoInit, densapoJitanHit, jitanNormalInit, jitanNormalJitanHit, jitanFastInit, jitanFastJitanHit, settings };
      }
      function calculate(input, settings = {}) {
        const merged = { ...preset.defaults, ...settings };
        const p = preset.spec.hitProb;
        const currentSpin = Math.max(0, Number(input.currentSpin) || 0);
        const spinsToTenjo = Math.max(0, preset.spec.tenjo - currentSpin);
        const rate = Number(input.rotationRate) || 0;
        if (rate <= 0) return null;
        const chains = chainValues(merged);
        const pHit = rebound(p, spinsToTenjo);
        const pReach = Math.pow(1 - p, spinsToTenjo);
        const expectedNormalSpins = pHit / p;
        const expectedWins = pHit * chains.wInit + pReach * chains.yutimeWins;
        const yutimeDensapoBeforeHit = finiteExpectedSpins(p, preset.spec.yutimeJitan);
        const expectedJitanNormalSpins = pHit * chains.jitanNormalInit + pReach * chains.r350 * chains.jitanNormalJitanHit;
        const expectedJitanFastSpins = pHit * chains.jitanFastInit + pReach * (yutimeDensapoBeforeHit + chains.r350 * chains.jitanFastJitanHit);
        const expectedDensapoSpins = expectedJitanNormalSpins + expectedJitanFastSpins;
        const investBalls = expectedNormalSpins * 250 / rate;
        const split = normalInvestmentSplit(p, spinsToTenjo, 250 / rate, input.availableBalls);
        const winBalls = expectedWins * merged.netBallsPerWin + expectedJitanNormalSpins * merged.jitanNormalBallsPerSpin + expectedJitanFastSpins * merged.jitanFastBallsPerSpin;
        const evBalls = winBalls - investBalls;
        const mochidamaCostYen = split.mochidamaBalls * merged.yenPerBall;
        const cashSpentYen = split.cashBalls / 250 * 1000;
        const normalCostYen = mochidamaCostYen + cashSpentYen;
        const winBallsYen = winBalls * merged.yenPerBall;
        const evYen = winBallsYen - normalCostYen;
        const normalHours = expectedNormalSpins / merged.spinsPerHour;
        const hitHours = expectedWins * merged.secPerHit / 3600;
        const densapoHours = expectedDensapoSpins * merged.secPerDensapoSpin / 3600;
        const totalHours = normalHours + hitHours + densapoHours;
        const hourlyYen = totalHours > 0 ? evYen / totalHours : 0;
        const slotRate = 100 + hourlyYen / (merged.slotGamesPerHour * 3 * 20 * 0.01);
        return { currentSpin, spinsToTenjo, rotationRate: rate, pHit, pReach, expectedNormalSpins, expectedWins, expectedJitanNormalSpins, expectedJitanFastSpins, expectedDensapoSpins, investBalls, mochidamaBalls: split.mochidamaBalls, cashBalls: split.cashBalls, mochidamaCostYen, cashSpentYen, normalCostYen, winBalls, evBalls, winBallsYen, evYen, normalHours, hitHours, densapoHours, totalHours, hourlyYen, slotRate, chains };
      }
      function logRate(log) {
        const balls = Number(log.usedBalls ?? log.balls) || 0;
        const spins = Number(log.normalSpin ?? log.spins) || 0;
        return balls > 0 ? spins / (balls / 250) : 0;
      }
      return { preset, rebound, finiteExpectedSpins, normalInvestmentSplit, chainValues, calculate, logRate };

    function localDateString(date = new Date()) {
      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("-");
    }

    function offsetLocalDate(date, days) {
      const next = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      next.setDate(next.getDate() + days);
      return localDateString(next);
    }

    function offsetDate(dateValue, days) {
      const parts = String(dateValue || today()).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const base = parts ? new Date(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3])) : new Date();
      base.setDate(base.getDate() + days);
      return base.toISOString().slice(0, 10);
    }

    function currentTime() {
      const d = new Date();
      return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");

    function cryptoId(prefix) {
      const raw = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
      return prefix + "_" + raw.replace(/-/g, "").slice(0, 16);
    }

    function normalizeNumber(value) {
      if (value === "" || value === null || value === undefined) return null;
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function positiveNumberOrDefault(value, fallback) {
      const n = normalizeNumber(value);
      return n !== null && n > 0 ? n : fallback;
    }

    function normalizeExchangeBalls(value) {
      const n = normalizeNumber(value);
      return n !== null && n >= 20 && n <= 50 ? Number(n.toFixed(2)) : DEFAULT_EXCHANGE_BALLS;
    }

    function exchangeBallsFromStore(store) {
      if (store?.exchangeBalls !== undefined) return normalizeExchangeBalls(store.exchangeBalls);
      const oldRate = normalizeNumber(store?.exchangeRate);
      if (oldRate !== null && oldRate >= 2 && oldRate <= 5) return normalizeExchangeBalls(100 / oldRate);
      if (oldRate !== null && oldRate >= 20 && oldRate <= 50) return normalizeExchangeBalls(oldRate);
      return DEFAULT_EXCHANGE_BALLS;
    }

    function exchangeBallsText(value) {
      const balls = normalizeExchangeBalls(value);
      return Number.isInteger(balls) ? String(balls) : balls.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
    }

    function normalizeInvestmentSource(value) {
      return value === "mochidama" || value === "saipurei" ? value : "cash";
    }

    function normalizeRamClear(value) {
      return value === RAM_CLEAR_VALUE || value === RAM_NOT_CLEARED_VALUE || value === RAM_UNKNOWN_VALUE ? value : null;
    }

    function normalizeRatingValue(value) {
      const number = normalizeNumber(value);
      return Number.isInteger(number) && number >= 1 && number <= 5 ? number : null;
    }

    function normalizeNailRating(source) {
      const input = source && typeof source === "object" ? source : {};
      const rating = {};
      NAIL_RATING_KEYS.forEach((key) => {
        rating[key] = normalizeRatingValue(input[key]);
      });
      return rating;
    }

    function dateFromIso(value) {
      const text = String(value || "");
      return /^\d{4}-\d{2}-\d{2}/.test(text) ? text.slice(0, 10) : null;
    }

    function normalizeMemoEntries(entries, legacyMemo = "", legacyCreatedAt = null) {
      const normalized = (Array.isArray(entries) ? entries : []).map((entry) => {
        const text = String(entry?.text || "").trim();
        if (!text) return null;
        return {
          id: entry.id || cryptoId("memo"),
          date: isDateString(entry.date) ? entry.date : null,
          text,
          createdAt: entry.createdAt || nowIso()
        };
      }).filter(Boolean);
      const legacyText = String(legacyMemo || "").trim();
      if (legacyText && !normalized.length) {
        const createdAt = legacyCreatedAt || nowIso();
        normalized.push({
          id: cryptoId("memo"),
          date: dateFromIso(legacyCreatedAt),
          text: legacyText,
          createdAt
        });
      }
      return normalized.sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
    }

    function normalizeStartEv(value) {
      if (!value || typeof value !== "object") return null;
      const evYen = normalizeNumber(value.evYen);
      const usedRate = normalizeNumber(value.usedRate);
      const effectiveSpin = normalizeNumber(value.effectiveSpin);
      if (evYen === null || usedRate === null || effectiveSpin === null) return null;
      return {
        evYen,
        usedRate,
        rateSource: value.rateSource || "",
        effectiveSpin,
        availableBalls: Math.max(0, normalizeNumber(value.availableBalls) ?? 0),
        mochidamaInput: Math.max(0, normalizeNumber(value.mochidamaInput) ?? 0),
        saipureiInput: Math.max(0, normalizeNumber(value.saipureiInput) ?? 0),
        mochidamaBalls: Math.max(0, normalizeNumber(value.mochidamaBalls) ?? 0),
        cashBalls: Math.max(0, normalizeNumber(value.cashBalls) ?? 0),
        normalCostYen: normalizeNumber(value.normalCostYen)
      };
    }

    function investmentSource(item) {

    function usesTapInvestmentMode(session) {
      return Array.isArray(session.investments) && session.investments.some((item) => item.source);
    }

    function numberText(value, fallback = "未入力") {
      return value === null || value === undefined || value === "" ? fallback : String(value);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function presetById(id) {
      return MACHINE_PRESETS.find((preset) => preset.id === id) || null;
    }

    function presetByName(name) {
      return MACHINE_PRESETS.find((preset) => preset.name === name) || null;
    }

    function normalizeMachinePresetId(machine) {
      if (presetById(machine?.presetId)) return machine.presetId;
      const matched = presetByName(machine?.modelName || "");
      return matched ? matched.id : "";
    }

    function machineHasYutime(machine) {
      return Boolean(presetById(normalizeMachinePresetId(machine))?.hasYutime);
    }

    function presetNetBallsPerWin(presetId) {
      const preset = presetById(presetId);
      return positiveNumberOrDefault(data.presetSettings?.[presetId]?.netBallsPerWin, preset?.defaults?.netBallsPerWin || DEFAULT_NET_BALLS_PER_WIN);
    }

    function netBallsPerWinInfo(presetId, machine = null) {
      const preset = presetById(presetId);
      const settings = data.presetSettings?.[presetId] || {};
      const manual = normalizeNumber(settings.netBallsPerWin);
      if (settings.netBallsPerWinManual === true && manual !== null && manual > 0) {
        return { value: manual, source: "手入力", count: null };
      }
      const sessions = filteredSessions().filter((session) => {
        if (machine) return session.machineId === machine.id;
        const sessionMachine = data.machines.find((item) => item.id === session.machineId);
        return normalizeMachinePresetId(sessionMachine) === presetId;
      });
      const hits = sessions.flatMap((session) => normalizeHits(session.hits));
      const actualHits = hits.map((hit) => normalizeNumber(hit.actualBalls)).filter((value) => value !== null && value > 0);
      if (actualHits.length) {
        return { value: actualHits.reduce((sum, value) => sum + value, 0) / actualHits.length, source: "実測平均", count: actualHits.length };
      }
      const roundHits = hits.map((hit) => roundTypeById(presetId, hit.roundTypeId)?.balls).filter((value) => Number(value) > 0);
      if (roundHits.length) {
        return { value: roundHits.reduce((sum, value) => sum + Number(value), 0) / roundHits.length, source: "ラウンド集計", count: roundHits.length };
      }
      return { value: preset?.defaults?.netBallsPerWin || DEFAULT_NET_BALLS_PER_WIN, source: "理論値", count: 0 };
    }

    function presetJitanBallsPerSpin(presetId, key) {
      const preset = presetById(presetId);
      const fallback = normalizeNumber(preset?.defaults?.[key]) ?? 0;
      return normalizeNumber(data.presetSettings?.[presetId]?.[key]) ?? fallback;
    }

    function roundTypeById(presetId, roundTypeId) {
      const preset = presetById(presetId);
      return (preset?.roundTypes || []).find((type) => type.id === roundTypeId) || null;
    }

    function normalizeHits(hits) {
      return (Array.isArray(hits) ? hits : []).map((hit) => ({
        roundTypeId: String(hit?.roundTypeId || ""),
        hitSpin: normalizeNumber(hit?.hitSpin),
        actualBalls: normalizeNumber(hit?.actualBalls),
        at: hit?.at || nowIso()
      })).filter((hit) => hit.roundTypeId || hit.hitSpin !== null || hit.actualBalls !== null);
    }

    function syncSessionHitTotals(session, machines = data.machines) {
      if (!Array.isArray(session.hits) || !session.hits.length) return;
      session.hitCount = session.hits.length;
      const machine = machines.find((item) => item.id === session.machineId);
      const presetId = normalizeMachinePresetId(machine);
      const totalBalls = hitRoundBasedPayout(session, presetId) || 0;
      if (machine?.roundBalls) session.totalRounds = Math.round(totalBalls / machine.roundBalls);
    }

    function hitRoundBasedPayout(session, presetId) {
      const hits = normalizeHits(session?.hits);
      if (!hits.length) return null;
      const total = hits.reduce((sum, hit) => {
        const roundType = roundTypeById(presetId, hit.roundTypeId);
        return roundType ? sum + Number(roundType.balls || 0) : sum;
      }, 0);
      return total > 0 ? total : null;
    }

    function activeMapAssumedRate(storeId = activeStore()?.id) {
      return normalizeNumber(selectedIslandFilter(storeId).map?.assumedRate);
    }

    function activeMapHasYutime(storeId = activeStore()?.id) {
      if (!storeId) return false;
      const selection = selectedIslandFilter(storeId);
      if (selection.islandIndex !== null) return islandHasYutime(selection.map.islands[selection.islandIndex], storeId);
      const parsed = parseIslandLayout(selectedMapLayoutForParse(storeId));
      return parsed.daiNos.some((daiNo) => machineHasYutime(findMachineByDai(daiNo)));
    }

    function islandHasYutime(island, storeId = activeStore()?.id) {
      if (!island) return false;
      if (presetById(island.leftPresetId)?.hasYutime || presetById(island.rightPresetId)?.hasYutime) return true;
      const parsed = parseIslandLayout({ islands: [island] });
      return parsed.daiNos.some((daiNo) => {
        const machine = data.machines.find((item) => item.storeId === storeId && item.daiNo === String(daiNo));
        return machineHasYutime(machine);
      });
    }

    function islandDisplayName(island, index = 0) {
      const manualName = String(island?.name || "").trim();
      if (manualName) return manualName;
      const leftPreset = presetById(island?.leftPresetId);
      const rightPreset = presetById(island?.rightPresetId);
      const hasRightSide = Boolean(island?.right && (normalizeNumber(island.right.from) !== null || normalizeNumber(island.right.to) !== null));
      if (!hasRightSide && leftPreset) return leftPreset.name;
      if (hasRightSide && leftPreset && rightPreset && leftPreset.id === rightPreset.id) return leftPreset.name;
      return `島${(island?.displayIndex ?? index) + 1}`;
    }

    function islandRangeSummary(island) {
      const sideText = (side) => {
        const from = normalizeNumber(side?.from);
        const to = normalizeNumber(side?.to);
        if (from === null && to === null) return "未入力";
        if (from === null || to === null) return `${from ?? ""}-${to ?? ""}`;
        return `${from}-${to}`;
      };
      const left = sideText(island?.left);
      const right = island?.right ? sideText(island.right) : "右列なし";
      return `${left}｜${right}`;
    }

    function yenText(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "-";
      const rounded = Math.round(Number(value));
      return `${rounded >= 0 ? "+" : ""}${rounded.toLocaleString("ja-JP")}円`;
    }

    function hourText(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "-";
      return `${Number(value).toFixed(2)}h`;
    }

    function percentText(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "-";
      return `${Number(value).toFixed(1)}%`;
    }

    function evJudgment(result) {
      if (!result) return { className: "", label: "未判定" };
      if (result.evYen >= EV_THRESHOLDS.good) return { className: "good", label: "打てる" };
      if (result.evYen >= EV_THRESHOLDS.warn) return { className: "warn", label: "微妙" };
      return { className: "bad", label: "打てない" };
    }

    function expectationYenPerBall(store) {
      return 100 / exchangeBallsFromStore(store);
    }

    function expectationSettings(store, machine) {
      const defaults = YUTIME_EXPECTATION_ENGINE.preset.defaults;
      const presetId = normalizeMachinePresetId(machine);
      const netBallsInfo = netBallsPerWinInfo(presetId, machine);
      const netBallsPerWin = netBallsInfo.value;
      const jitanNormalBallsPerSpin = presetJitanBallsPerSpin(presetId, "jitanNormalBallsPerSpin");
      const jitanFastBallsPerSpin = presetJitanBallsPerSpin(presetId, "jitanFastBallsPerSpin");
      return {
        settings: {
          ...defaults,
          yenPerBall: expectationYenPerBall(store),
          netBallsPerWin,
          jitanNormalBallsPerSpin,
          jitanFastBallsPerSpin
        },
        payoutSource: `純払い出し${Math.round(netBallsPerWin).toLocaleString("ja-JP")}玉/回（${netBallsInfo.source}${netBallsInfo.count ? ` n=${netBallsInfo.count}` : ""}）、時短100 ${jitanNormalBallsPerSpin}玉/回転、時短200/遊タイム ${jitanFastBallsPerSpin}玉/回転`
      };
    }

    function expectationRate(stats, manualRate, store = null) {
      const manual = normalizeNumber(manualRate);
      if (manual !== null && manual > 0) return { rate: manual, source: "手入力" };
      if (stats?.rate) return { rate: stats.rate, source: "履歴累計" };
      const assumed = activeMapAssumedRate(store?.id);
      const assumedSourceName = String(store?.name || "").trim() || "島";
      if (assumed !== null && assumed > 0) return { rate: assumed, source: `${assumedSourceName}の想定回転率${assumed.toFixed(1)}使用`, assumed: true };
      return { rate: null, source: "回転率なし" };
    }

    function availableBallsFromParts(mochidamaInput, saipureiInput) {
      const mochidama = Math.max(0, normalizeNumber(mochidamaInput) ?? 0);
      const saipurei = Math.max(0, normalizeNumber(saipureiInput) ?? 0);
      return { mochidama, saipurei, total: mochidama + saipurei };
    }

    function calculateMachineExpectation(machine, options = {}) {
      const store = storeById(machine?.storeId);
      const preset = presetById(normalizeMachinePresetId(machine));
      if (!store || !preset?.evSupported) return { result: null, reason: "期待値対応プリセットではありません" };
      const stats = options.stats || machineStats(machine.id);
      const rateInfo = expectationRate(stats, options.manualRate, store);
      if (!rateInfo.rate) return { result: null, reason: "回転率データがありません" };
      const currentSpin = Math.max(0, Number(options.currentSpin) || 0);
      const previousSpin = Math.max(0, Number(options.previousSpin) || 0);
      const availableBalls = Math.max(0, normalizeNumber(options.availableBalls) ?? 0);
      const effectiveSpin = currentSpin + previousSpin;
      const settingsInfo = expectationSettings(store, machine);
      const result = YUTIME_EXPECTATION_ENGINE.calculate({ currentSpin: effectiveSpin, rotationRate: rateInfo.rate, availableBalls }, settingsInfo.settings);
      return {
        result,
        currentSpin,
        previousSpin,
        availableBalls,
        effectiveSpin,
        rateSource: rateInfo.source,
        rateAssumed: Boolean(rateInfo.assumed),
        payoutSource: settingsInfo.payoutSource,
        exchangeBalls: exchangeBallsFromStore(store)
      };
    }

    function calculateStartEvSnapshot(session, machine, presets = {}) {
      if (!session || !machine) return null;
      const startSpin = normalizeNumber(session.startSpin);
      if (startSpin === null) return null;
      const availableParts = availableBallsFromParts(presets.mochidamaInput, presets.saipureiInput);
      const availableBalls = normalizeNumber(presets.availableBalls) ?? availableParts.total;
      const expectation = calculateMachineExpectation(machine, {
        currentSpin: startSpin,
        previousSpin: session.prevDayEndSpin,
        manualRate: presets.manualRate,
        availableBalls
      });
      if (!expectation.result) return null;
      return {
        evYen: Math.round(expectation.result.evYen),
        usedRate: Number(expectation.result.rotationRate.toFixed(2)),
        rateSource: expectation.rateSource,
        effectiveSpin: expectation.effectiveSpin,
        availableBalls: expectation.availableBalls,
        mochidamaInput: availableParts.mochidama,
        saipureiInput: availableParts.saipurei,
        mochidamaBalls: Math.round(expectation.result.mochidamaBalls),
        cashBalls: Math.round(expectation.result.cashBalls),
        normalCostYen: Math.round(expectation.result.normalCostYen)
      };
    }

    function startEvText(startEv) {
      const normalized = normalizeStartEv(startEv);
      return normalized ? yenText(normalized.evYen) : "-";
    }

    function remainingSpinTextFromEffectiveSpin(effectiveSpin, tenjo = YUTIME_EXPECTATION_ENGINE.preset.spec.tenjo) {
      const effective = normalizeNumber(effectiveSpin);
      const ceiling = normalizeNumber(tenjo);
      if (effective === null || ceiling === null) return "残り-回転";
      return `残り${Math.max(0, ceiling - effective).toLocaleString("ja-JP")}回転`;
    }

    function expectationInvestmentText(mochidamaBalls, cashBalls) {
      const mochidama = Math.max(0, Math.round(normalizeNumber(mochidamaBalls) || 0));
      const cash = Math.max(0, Math.round(normalizeNumber(cashBalls) || 0));
      const total = mochidama + cash;
      const cashYen = Math.round(cash / 250 * 1000);
      if (mochidama <= 0) {
        return `遊タイムまで必要 約${total.toLocaleString("ja-JP")}玉（全額現金 約${cashYen.toLocaleString("ja-JP")}円）`;
      }
      return `遊タイムまで必要 約${total.toLocaleString("ja-JP")}玉（持ち玉から${mochidama.toLocaleString("ja-JP")}玉・現金で約${cashYen.toLocaleString("ja-JP")}円）`;
    }

    function startEvDetailText(startEv) {
      const normalized = normalizeStartEv(startEv);
      if (!normalized) return "記録なし";
      const hasInvestmentBreakdown = Boolean(normalized.availableBalls || normalized.mochidamaBalls || normalized.cashBalls);
      const balanceText = hasInvestmentBreakdown
        ? ` / 入力 持ち玉${Math.round(normalized.mochidamaInput || 0).toLocaleString("ja-JP")}玉・再プレ${Math.round(normalized.saipureiInput || 0).toLocaleString("ja-JP")}玉`
        : "";
      return `${yenText(normalized.evYen)} / ${Number(normalized.usedRate).toFixed(1)} /250玉 / ${normalized.rateSource || "ソース不明"} / ${remainingSpinTextFromEffectiveSpin(normalized.effectiveSpin)}${balanceText}`;
    }

    function showToast(message, type = "success", options = {}) {
      clearTimeout(showToast.timer);
      els.toast.innerHTML = `${escapeHtml(message)}${options.undo ? ` <button id="toastUndoBtn">元に戻す</button>` : ""}`;
      els.toast.classList.toggle("error", type === "error");
      els.toast.classList.add("show");
      if (options.undo) byId("toastUndoBtn").addEventListener("click", () => {
        clearTimeout(showToast.timer);
        els.toast.classList.remove("show", "error");
        options.undo();
      });
      showToast.timer = setTimeout(() => {

    function automaticLabelsForDate(dateValue) {
      const parts = String(dateValue || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!parts) return [];
      const year = Number(parts[1]);
      const month = Number(parts[2]);
      const day = Number(parts[3]);
      const date = new Date(year, month - 1, day);
      if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return [];
      const weekdays = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];
      const labels = [weekdays[date.getDay()], `${day % 10}のつく日`];
      if (day === 11 || day === 22) labels.push("ゾロ目日");
      return labels;
    }

    function dateWithAutoLabels(dateValue) {
      const labels = automaticLabelsForDate(dateValue);
      return `${dateValue || "日付未入力"}${labels.length ? " / " + labels.join("・") : ""}`;
    }

    function shortDate(dateValue) {
      const parts = String(dateValue || "").match(/^\d{4}-(\d{2})-(\d{2})$/);
      return parts ? `${Number(parts[1])}/${Number(parts[2])}` : (dateValue || "-");
    }

    function loadData() {
      const base = defaultData();
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return base;
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return base;
        if (parsed.version !== SCHEMA_VERSION && !localStorage.getItem(PREMIGRATE_KEY)) {
          localStorage.setItem(PREMIGRATE_KEY, raw);
        }
        return normalizeData(parsed);
      } catch (error) {
        console.warn("ytv3 load failed", error);
        preserveCorruptData(raw);
        return base;
      }
    }

    function preserveCorruptData(raw) {
      if (!raw) return;
      try {
        localStorage.setItem(CORRUPT_PREFIX + new Date().toISOString(), raw);
        bootToastMessage = "保存データが読み取れなかったため退避しました";
      } catch (error) {
        console.warn("ytv3 corrupt preserve failed", error);
      }
    }

    function loadCarryover() {
      try {
        const parsed = JSON.parse(localStorage.getItem(CARRYOVER_KEY) || "null");
        if (!parsed || typeof parsed !== "object") return null;
        if (!parsed.storeId || !parsed.sourceSessionId || !parsed.date) return null;
        if (parsed.date !== today()) {
          localStorage.removeItem(CARRYOVER_KEY);
          return null;
        }
        return {
          storeId: parsed.storeId,
          sourceSessionId: parsed.sourceSessionId,
          sourceMachineId: parsed.sourceMachineId || null,
          sourceDaiNo: parsed.sourceDaiNo || "",
          date: parsed.date,
          mochidama: normalizeNumber(parsed.mochidama),
          credit: normalizeNumber(parsed.credit),
          saipurei: normalizeNumber(parsed.saipurei),
          createdAt: parsed.createdAt || nowIso()
        };
      } catch (error) {
        console.warn("ytv3 carryover load failed", error);
        return null;
      }
    }

    function saveCarryover(nextCarryover) {
      carryover = nextCarryover;
      if (!carryover) {
        localStorage.removeItem(CARRYOVER_KEY);
        renderAll();
        return true;
      }
      try {
        localStorage.setItem(CARRYOVER_KEY, JSON.stringify(carryover));
        renderAll();
        return true;
      } catch (error) {
        console.warn("ytv3 carryover save failed", error);
        showToast("引き継ぎの保存に失敗しました。容量を確認してください。", "error");
        return false;
      }
    }

    function normalizeData(source) {
      const base = defaultData();
      const next = {
        ...base,
        ...source,
        stores: Array.isArray(source.stores) ? source.stores : [],
        layouts: source.layouts && typeof source.layouts === "object" ? source.layouts : {},
        machines: Array.isArray(source.machines) ? source.machines : [],
        sessions: Array.isArray(source.sessions) ? source.sessions : [],
        dailyState: source.dailyState && typeof source.dailyState === "object" ? source.dailyState : {},
        presetSettings: source.presetSettings && typeof source.presetSettings === "object" ? source.presetSettings : {},
        labelsByStore: source.labelsByStore && typeof source.labelsByStore === "object" ? source.labelsByStore : {},
        meta: { ...base.meta, ...(source.meta || {}) }
      };
      next.version = SCHEMA_VERSION;
      const legacyNetBallsPerWin = next.stores.map((store) => normalizeNumber(store.netBallsPerWin)).find((value) => value !== null && value > 0);
      if (!next.presetSettings["umi-sp5"]) next.presetSettings["umi-sp5"] = {};
      const hadPresetNetBalls = Object.prototype.hasOwnProperty.call(next.presetSettings["umi-sp5"], "netBallsPerWin");
      next.presetSettings["umi-sp5"].netBallsPerWin = positiveNumberOrDefault(next.presetSettings["umi-sp5"].netBallsPerWin ?? legacyNetBallsPerWin, DEFAULT_NET_BALLS_PER_WIN);
      next.presetSettings["umi-sp5"].netBallsPerWinManual = next.presetSettings["umi-sp5"].netBallsPerWinManual === true || (hadPresetNetBalls && next.presetSettings["umi-sp5"].netBallsPerWin !== DEFAULT_NET_BALLS_PER_WIN);
      next.presetSettings["umi-sp5"].jitanNormalBallsPerSpin = normalizeNumber(next.presetSettings["umi-sp5"].jitanNormalBallsPerSpin) ?? 0;
      next.presetSettings["umi-sp5"].jitanFastBallsPerSpin = normalizeNumber(next.presetSettings["umi-sp5"].jitanFastBallsPerSpin) ?? 0;
      next.stores = next.stores.map((store) => ({
        id: store.id || cryptoId("st"),
        name: String(store.name || "無名店"),
        isPersonal: Boolean(store.isPersonal),
        lendRate: positiveNumberOrDefault(store.lendRate, DEFAULT_LEND_RATE),
        exchangeBalls: exchangeBallsFromStore(store),
        createdAt: store.createdAt || nowIso()
      }));
      next.layouts = normalizeLayouts(next.layouts);
      migrateStoreAssumedRatesToMaps(next, source.stores || []);
      next.machines = next.machines.map((machine) => {
        const presetId = normalizeMachinePresetId(machine);
        const preset = presetById(presetId);
        return {
          id: machine.id || cryptoId("m"),
          storeId: machine.storeId || null,
          daiNo: String(machine.daiNo || ""),
          modelName: presetId === "umi-sp5" && machine.presetId === "umi-sp5" ? preset?.name || machine.modelName || "" : machine.modelName || "",
          roundBalls: normalizeNumber(machine.roundBalls),
          memoEntries: normalizeMemoEntries(machine.memoEntries, machine.memo, machine.createdAt),
          nailRating: normalizeNailRating(machine.nailRating),
          presetId,
          evSupported: Boolean(preset?.evSupported || machine.evSupported)
        };
      }).filter((machine) => machine.storeId && machine.daiNo);
      next.sessions = next.sessions.map((session) => {
        const normalized = {
          ...blankSession(),
          ...session,
          startTotalHits: normalizeNumber(session.startTotalHits),
          endTotalHits: normalizeNumber(session.endTotalHits),
          currentSpin: normalizeNumber(session.currentSpin) ?? normalizeNumber(session.startSpin),
          startEv: normalizeStartEv(session.startEv),
          carriedFromSessionId: session.carriedFromSessionId || null,
          yutimeEnterSpin: normalizeNumber(session.yutimeEnterSpin),
          yutimeEnterTime: session.yutimeEnterTime || null,
          settlementRecoverYen: normalizeNumber(session.settlementRecoverYen),
          hits: normalizeHits(session.hits),
          investments: Array.isArray(session.investments) ? session.investments.map((item) => ({
          type: normalizeInvestmentSource(item.source || item.type),
          ...(item.source ? { source: normalizeInvestmentSource(item.source) } : {}),
          amount: normalizeNumber(item.amount),
          time: item.time || null,
          phase: item.phase === "yutime" ? "yutime" : "normal",
          spinAt: normalizeNumber(item.spinAt),
          adjustment: item.adjustment === true
        })).filter((item) => item.amount !== null) : [],
        charges: Array.isArray(session.charges) ? session.charges.map((item) => ({
          amount: normalizeNumber(item.amount),
          time: item.time || null
        })).filter((item) => item.amount !== null) : []
        };
        syncSessionHitTotals(normalized, next.machines);
        return normalized;
      });
      if (!next.stores.some((store) => store.id === next.activeStoreId)) next.activeStoreId = next.stores[0]?.id || null;
      next.dailyState = normalizeDailyState(next.dailyState, next.machines);
      return next;
    }

    function persist() {
      data.meta.updatedAt = nowIso();
      data.meta.sampleSessionChars = measureSampleSessionChars();
      data.meta.sampleMachineChars = measureSampleMachineChars();
      data.meta.mapLayoutChars = measureActiveMapLayoutChars();
      data.meta.lastSaveChars = 0;
      const draftRaw = JSON.stringify(data);
      data.meta.lastSaveChars = draftRaw.length;
      const raw = JSON.stringify(data);
      data.meta.lastSaveChars = raw.length;
      const finalRaw = JSON.stringify(data);
      if (finalRaw.length < 12) {
        console.warn("ytv3 empty-write guard blocked save");
        return false;
      }
      try {
        const before = localStorage.getItem(STORAGE_KEY);
        if (before) localStorage.setItem(BACKUP_KEY, before);
        localStorage.setItem(STORAGE_KEY, finalRaw);
        return true;
      } catch (error) {
        console.warn("ytv3 persist failed", error);
        return false;
      }
    }

    function normalizeDailyState(source, machines) {
      const validMachineIds = new Set(machines.map((machine) => machine.id));
      const next = {};
      Object.entries(source || {}).forEach(([machineId, byDate]) => {
        if (!validMachineIds.has(machineId) || !byDate || typeof byDate !== "object") return;
        Object.entries(byDate).forEach(([date, state]) => {
          if (!isDateString(date) || !state || typeof state !== "object") return;
          const normalized = { date };
          const legacyRamState = state.ramClear;
          const ramClear = normalizeRamClear(legacyRamState);
          const hasLegacyRamState = ["retained", "hitToday", "cleared"].includes(legacyRamState);
          const prevInvalid = state.prevInvalid === true || legacyRamState === "cleared" || legacyRamState === "hitToday";
          const closingSpin = normalizeNumber(state.closingSpin);
          const hesoRating = normalizeRatingValue(state.hesoRating);
          if (ramClear) normalized.ramClear = ramClear;
          if (prevInvalid) normalized.prevInvalid = true;
          else if (state.prevInvalid === false || legacyRamState === "retained") normalized.prevInvalid = false;
          if (closingSpin !== null) normalized.closingSpin = closingSpin;
          if (hesoRating !== null) normalized.hesoRating = hesoRating;
          if (normalized.ramClear || normalized.prevInvalid !== undefined || normalized.closingSpin !== undefined || normalized.hesoRating !== undefined) {
            if (!next[machineId]) next[machineId] = {};
            next[machineId][date] = normalized;
          }
        });
      });
      return next;
    }

    function migrateStoreAssumedRatesToMaps(nextData, legacyStores) {
      const legacyRates = new Map((legacyStores || []).map((store) => [store.id, normalizeNumber(store.assumedRate)]));
      Object.entries(nextData.layouts || {}).forEach(([storeId, layout]) => {
        const legacyRate = legacyRates.get(storeId);
        if (legacyRate === null || legacyRate <= 0 || !layout?.maps) return;
        layout.maps.forEach((map) => {
          if (normalizeNumber(map.assumedRate) !== null) return;
          const parsed = parseIslandLayout(map);
          const hasYutimeByMachine = parsed.daiNos.some((daiNo) => {
            const machine = nextData.machines.find((item) => item.storeId === storeId && item.daiNo === String(daiNo));
            return Boolean(presetById(normalizeMachinePresetId(machine))?.hasYutime);
          });
          const hasYutimeByColumn = (map.islands || []).some((island) => (
            Boolean(presetById(island.leftPresetId)?.hasYutime) || Boolean(presetById(island.rightPresetId)?.hasYutime)
          ));
          const hasYutime = hasYutimeByMachine || hasYutimeByColumn;
          if (hasYutime) map.assumedRate = legacyRate;
        });
      });
    }

    function islandFilterValue(mapId, islandIndex = null) {
      return islandIndex === null ? `map:${mapId}` : `island:${mapId}:${islandIndex}`;
    }

    function parseIslandFilterValue(value) {
      const parts = String(value || "").split(":");
      if (parts[0] === "island" && parts.length === 3) {
        const index = Number(parts[2]);
        return { mapId: parts[1], islandIndex: Number.isInteger(index) && index >= 0 ? index : null };
      }
      if (parts[0] === "map" && parts[1]) return { mapId: parts[1], islandIndex: null };
      return null;
    }

    function selectedIslandFilter(storeId = data.activeStoreId) {
      const layout = storeLayout(storeId);
      const fallbackMap = activeMap(storeId);
      const requested = parseIslandFilterValue(islandFilterByStore[storeId]) || { mapId: layout.activeMapId || fallbackMap.id, islandIndex: null };
      const map = layout.maps.find((item) => item.id === requested.mapId) || fallbackMap;
      const islandIndex = requested.islandIndex !== null && map.islands[requested.islandIndex] ? requested.islandIndex : null;
      const value = islandFilterValue(map.id, islandIndex);
      layout.activeMapId = map.id;
      if (islandFilterByStore[storeId] !== value) {
        islandFilterByStore[storeId] = value;
        saveIslandFilters();
      }
      return { map, mapId: map.id, islandIndex, value };
    }

    function setSelectedIslandFilter(storeId, value) {
      const layout = storeLayout(storeId);
      const parsed = parseIslandFilterValue(value);
      const map = parsed ? layout.maps.find((item) => item.id === parsed.mapId) : null;
      if (!map) return false;
      const islandIndex = parsed.islandIndex !== null && map.islands[parsed.islandIndex] ? parsed.islandIndex : null;
      islandFilterByStore[storeId] = islandFilterValue(map.id, islandIndex);
      layout.activeMapId = map.id;
      saveIslandFilters();
      return true;
    }

      const selection = selectedIslandFilter(storeId);

      return { ...selection.map, islands: island ? [{ ...island, displayIndex: selection.islandIndex }] : [] };

    function filterChipHtml(label) {
      return `
        <label class="check-chip">

    function dailyStateFor(machineId, dateValue = today()) {
      return data.dailyState?.[machineId]?.[dateValue] || null;
    }

    function ensureDailyState(machineId, dateValue = today()) {
      if (!data.dailyState[machineId]) data.dailyState[machineId] = {};
      if (!data.dailyState[machineId][dateValue]) data.dailyState[machineId][dateValue] = { date: dateValue };
      return data.dailyState[machineId][dateValue];
    }

    function cleanupEmptyDailyState(machineId, dateValue) {
      const state = data.dailyState?.[machineId]?.[dateValue];
      if (!state) return;
      if (!state.ramClear && state.prevInvalid === undefined && state.closingSpin === undefined && state.hesoRating === undefined) delete data.dailyState[machineId][dateValue];
      if (data.dailyState[machineId] && !Object.keys(data.dailyState[machineId]).length) delete data.dailyState[machineId];
    }

    function dailyHesoRating(machineId, dateValue = today()) {
      return normalizeRatingValue(dailyStateFor(machineId, dateValue)?.hesoRating);
    }

    function latestHesoRatingBefore(machineId, beforeDate = today()) {
      const entries = Object.values(data.dailyState?.[machineId] || {})
        .filter((state) => state?.date && state.date < beforeDate && normalizeRatingValue(state.hesoRating) !== null)
        .sort((a, b) => String(b.date).localeCompare(String(a.date)));
      if (!entries.length) return null;
      return { date: entries[0].date, value: normalizeRatingValue(entries[0].hesoRating) };
    }

    function todayRamClear(machineId) {
      return dailyStateFor(machineId, today())?.ramClear || null;
    }

    function todayPrevInvalid(machineId) {
      return dailyStateFor(machineId, today())?.prevInvalid === true;
    }

    function closingInfoForDate(machineId, dateValue = offsetDate(today(), -1)) {
      const state = dailyStateFor(machineId, dateValue);
      if (!state || state.closingSpin === undefined) return null;
      return { spin: state.closingSpin, date: state.date };
    }

    function validClosingInfo(machineId) {
      if (todayPrevInvalid(machineId)) return null;
      return closingInfoForDate(machineId, offsetDate(today(), -1));
    }

    function defaultClosingTargetDate(now = new Date()) {
      return now.getHours() >= 18 ? localDateString(now) : offsetLocalDate(now, -1);
    }

    function renderMachineMap() {
      const store = activeStore();
      if (!store) {
        els.machineMap.innerHTML = '<div class="row-card">店を選択してください。</div>';
        return;

        return;
      }
      const statsByMachine = buildMachineStatsMap(filteredSessions());
      const activeMachineIds = new Set(data.sessions.filter((session) => session.storeId === store.id && session.status === "active").map((session) => session.machineId));
      els.machineMap.innerHTML = parsed.rows.map((row) => {
        const left = row.sides[0] || [];
        const right = row.sides[1] || [];
        return `
          <div class="map-island">
            <div class="map-island-label">${escapeHtml(islandDisplayName(row.island, row.index))}</div>
            <div class="map-row">
              <div class="map-side">${mapSideHtml(left, row.island?.gaps?.left, statsByMachine, activeMachineIds, hasYutime)}</div>
              <div class="aisle" aria-hidden="true"></div>
              <div class="map-side">${mapSideHtml(right, row.island?.gaps?.right, statsByMachine, activeMachineIds, hasYutime)}</div>
            </div>

        `;
      }).join("");
      els.machineMap.querySelectorAll("[data-dai-no]").forEach((button) => {

          if (closingCheckMode) openClosingCheckForm(button.dataset.daiNo);
          else if (morningCheckMode) openMorningCheckForm(button.dataset.daiNo);
          else openMachineDetail(button.dataset.daiNo);
        });
      });

    function mapSideHtml(daiNos, gaps = [], statsByMachine = null, activeMachineIds = new Set(), showYutimeTools = true) {
      const gapSet = new Set((gaps || []).map(String));
      return (daiNos || []).map((daiNo) => `
        ${machineButtonHtml(daiNo, statsByMachine, activeMachineIds, showYutimeTools)}
        ${gapSet.has(String(daiNo)) ? '<div class="map-gap" aria-label="区切り"></div>' : ""}
      `).join("");
    }

    function machineButtonHtml(daiNo, statsByMachine = null, activeMachineIds = new Set(), showYutimeTools = true) {
      const machine = findMachineByDai(daiNo);
      const stats = machine ? (statsByMachine?.get(machine.id) || emptyStats()) : null;
      const closing = showYutimeTools && machine ? validClosingInfo(machine.id) : null;
      const targetClosing = showYutimeTools && machine ? dailyStateFor(machine.id, closingTargetDate)?.closingSpin ?? null : null;
      const rawClosing = showYutimeTools && machine ? closingInfoForDate(machine.id, offsetDate(today(), -1)) : null;
      const prevInvalid = showYutimeTools && machine ? todayPrevInvalid(machine.id) : false;
      const ramClear = showYutimeTools && machine ? todayRamClear(machine.id) : null;
      const hasMachineMemo = (machine?.memoEntries || []).length > 0;
      const rate = stats && stats.rate ? stats.rate.toFixed(1) : "-";
      const rateClass = machine && stats?.rate ? rateToneClass(machine, stats.rate) : "";
      const estimatedMark = stats?.estimatedCount ? "&#8776;" : "";
      const isActive = machine && activeMachineIds.has(machine.id);
      const eveSign = showYutimeTools && machine ? mapExpectationSign(machine, stats, closing) : null;
      return `
        <button class="machine-button ${stats?.rate || closing || hasMachineMemo ? "has-data" : ""} ${isActive ? "is-active" : ""} ${eveSign?.good ? "ev-good" : ""} ${eveSign?.assumed ? "ev-assumed" : ""}" data-dai-no="${escapeHtml(daiNo)}">
          ${isActive ? '<span class="active-badge">稼働中</span>' : ""}
          ${eveSign?.good ? `<span class="eve-sign">${eveSign.assumed ? "宵≈" : "宵"}</span>` : ""}
          ${ramClear === RAM_CLEAR_VALUE ? '<span class="state-badge">ラ</span>' : ""}
          ${ramClear === RAM_NOT_CLEARED_VALUE ? '<span class="state-badge retained">据✓</span>' : ""}
          ${ramClear === RAM_UNKNOWN_VALUE ? '<span class="state-badge">?</span>' : ""}
          ${hasMachineMemo ? '<span class="memo-badge">メ</span>' : ""}
          <span class="dai">${escapeHtml(daiNo)}</span>
          <span class="rate ${rateClass}">${escapeHtml(rate)}${estimatedMark}<small>回/千円</small></span>
          ${closingCheckMode && targetClosing !== null ? `<span class="prev">✓ ${escapeHtml(targetClosing)}回転</span>` : prevInvalid && rawClosing ? `<span class="prev invalid">宵${escapeHtml(rawClosing.spin)} <small>${escapeHtml(shortDate(rawClosing.date))}</small></span>` : closing ? `<span class="prev">宵${escapeHtml(closing.spin)} <small>${escapeHtml(shortDate(closing.date))}</small></span>` : ""}
        </button>
      `;
    }

    function mapExpectationSign(machine, stats, closing) {
      if (!closing) return null;
      const expectation = calculateMachineExpectation(machine, { currentSpin: 0, previousSpin: closing.spin, stats });
      if (!expectation.result || expectation.result.evYen < EV_THRESHOLDS.good) return null;
      return { good: true, assumed: Boolean(expectation.rateAssumed) };
    }

    function renderRunning() {
      const store = activeStore();
      if (!store) {
        setRunningFullscreenLock(false);
        els.runningArea.innerHTML = '<div class="section"><h2>稼働中</h2><p>店を選択してください。</p></div>';
        return;
      }
      const session = activeSession();
      if (!session) {
        setRunningFullscreenLock(false);
        els.runningArea.innerHTML = '<div class="section"><h2>稼働中</h2><p>現在進行中のセッションはありません。マップから台を選んで開始してください。</p></div>';
        return;
      }
      const machine = data.machines.find((item) => item.id === session.machineId);
      const derived = deriveSession(session, machine);
      const balances = deriveBalances(session);
      const yutimeMode = isYutimeInvestmentPhase(session);
      const otherActiveSessions = activeSessionsForStore(store.id).filter((item) => item.id !== session.id);
      const currentSpin = session.currentSpin ?? session.startSpin;
      const liveRate = runningPanelRate(session);
      const yutimeRemaining = runningYutimeRemaining(session, machine);
      const totals = investmentTotals(session);
      const totalSpins = runningSpinCount(session);
      const panelInputBalls = runningPanelInputBalls(session, derived);
      const showHistory = expandedInvestmentSessions.has(session.id);
      const entries = historyEntries(session);
      const replayCollapsed = balances.saipurei === 0 && !expandedReplayRows.has(session.id);
      const stickyClass = runningStickyEnabled ? "" : " sticky-off";
      const fullscreenMode = runningStickyEnabled && currentView === "runView";
      setRunningFullscreenLock(fullscreenMode);
