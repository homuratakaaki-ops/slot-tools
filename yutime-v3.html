            const reference = key === DAILY_NAIL_RATING_KEY && latestHeso ? `<small class="hint">前日参考: ${escapeHtml(latestHeso.value)}（${escapeHtml(shortDate(latestHeso.date))}）</small>` : "";
            return `
            <div class="nail-rating-row">
              <span>${escapeHtml(NAIL_RATING_LABELS[key])}${reference}</span>
              <div class="nail-rating-chips" data-nail-key="${escapeHtml(key)}">
                ${[1, 2, 3, 4, 5].map((buttonValue) => `<button type="button" data-nail-rating="${buttonValue}" aria-pressed="${value === buttonValue ? "true" : "false"}">${buttonValue}</button>`).join("")}
              </div>
            </div>
          `}).join("")}
        </div>
      `;
    }

    function machineHistoryHtml(machine) {
      const sessions = data.sessions
        .filter((session) => session.machineId === machine.id)
        .slice()
        .sort((a, b) => {
          const dateCompare = String(b.date || "").localeCompare(String(a.date || ""));
          return dateCompare || String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
        });
      const dates = new Set(sessions.map((session) => session.date).filter(Boolean));
      Object.values(data.dailyState?.[machine.id] || {}).forEach((state) => {
        if (state?.date && normalizeRatingValue(state.hesoRating) !== null) dates.add(state.date);
      });
      (machine.memoEntries || []).forEach((entry) => {
        if (entry?.date) dates.add(entry.date);
      });
      const sortedDates = [...dates].sort((a, b) => String(b).localeCompare(String(a)));
      if (!sortedDates.length) return '<div class="row-card"><small>この台の履歴はまだありません。</small></div>';
      return sortedDates.map((date) => {
        const heso = dailyHesoRating(machine.id, date);
        const dateSessions = sessions.filter((session) => session.date === date);
        const memoEntries = machineMemoEntriesForDate(machine, date);
        const hesoText = heso === null ? "未記録" : `${heso}`;
        const memoHtml = memoEntries.length ? `<div class="status-line">${memoEntries.map((entry) => `<span class="badge">${escapeHtml(entry.text)}</span>`).join("")}</div>` : "";
        const cards = dateSessions.length ? dateSessions.map((session) => {
          const derived = deriveSession(session, machine);
          const title = `${session.startTime || "--:--"} / ${session.status === "completed" ? "確定" : "稼働中"}`;
          return `
            <details class="row-card session-details">
              <summary>
                <div class="row-card-head">
                  <div><strong>${escapeHtml(title)}</strong></div>
                  <span class="badge ${session.status === "completed" ? "good" : "dark"}">${session.status === "completed" ? "確定" : "稼働中"}</span>
                </div>
              </summary>
              <small>ヘソ評価 ${escapeHtml(hesoText)} / 回転数 ${numberText(derived.normalSpins, "-")} / 回転率 ${rateText(derived)} /250玉</small><br>
              ${memoHtml}
            </details>
          `;
        }).join("") : `
          <div class="row-card">
            <strong>セッションなし</strong><br>
            <small>ヘソ評価 ${escapeHtml(hesoText)} / 回転数 - / 回転率 -</small><br>
            ${memoHtml}
          </div>
        `;
        return `<div class="ledger-day-heading">― ${escapeHtml(shortDate(date))} の履歴 ―</div>${cards}`;
      }).join("");
    }

    function bindNailRatingChips(machine, root = els.modalBody) {
      root.querySelectorAll("[data-nail-rating]").forEach((button) => {
        button.addEventListener("click", () => {
          const row = button.closest("[data-nail-key]");
          if (!row || !machine) return;
          const wasPressed = button.getAttribute("aria-pressed") === "true";
          row.querySelectorAll("[data-nail-rating]").forEach((item) => item.setAttribute("aria-pressed", "false"));
          if (!wasPressed) button.setAttribute("aria-pressed", "true");
          if (row.dataset.nailKey === DAILY_NAIL_RATING_KEY) {
            const state = ensureDailyState(machine.id, today());
            const selected = row.querySelector('[data-nail-rating][aria-pressed="true"]');
            const rating = normalizeRatingValue(selected?.dataset.nailRating);
            if (rating === null) delete state.hesoRating;
            else state.hesoRating = rating;
            cleanupEmptyDailyState(machine.id, today());
          } else {
            machine.nailRating = readNailRatingFromDom(root);
          }
          persist();
        });
      });
    }

    function readNailRatingFromDom(root = els.modalBody) {
      const rating = {};
      NAIL_RATING_KEYS.forEach((key) => {
        const selected = root.querySelector(`[data-nail-key="${key}"] [data-nail-rating][aria-pressed="true"]`);
        rating[key] = normalizeRatingValue(selected?.dataset.nailRating);
      });
      return normalizeNailRating(rating);
    }

    function machineModelSummaryHtml(machine) {
      const summary = machineModelDisplay(machine);
      const source = summary.source ? `（${escapeHtml(summary.source)}）` : "";
      return `
        <div class="machine-summary-row">
          <strong>機種: ${escapeHtml(summary.name)}${source}</strong>
          <button class="small" id="toggleMachineFormBtn">${escapeHtml(summary.action)}</button>
        </div>
      `;
    }

    function machineDetailFormHtml(machine) {
      return `
        <div id="machineDetailForm">
          <div class="field-row" style="margin-top:12px"><label for="machinePreset">機種プリセット</label><select id="machinePreset">
            ${MACHINE_PRESETS.map((preset) => `<option value="${escapeHtml(preset.id)}">${escapeHtml(preset.name)}</option>`).join("")}
            <option value="">その他（自由入力）</option>
          </select></div>
          <div class="field-row"><label for="machineModel">機種名</label><input id="machineModel" value="${escapeHtml(machine.modelName || "")}" placeholder="任意"></div>
          <div class="field-row"><label for="roundBalls">1R玉数</label><input id="roundBalls" inputmode="numeric" value="${escapeHtml(machine.roundBalls ?? "")}" placeholder="例: 140"></div>
          <p class="hint">1ラウンドあたりの獲得玉数。例: 大海物語スペシャル5 なら 140</p>
          <p class="hint warn" id="presetSupportNote"></p>
        </div>
      `;
    }

    function defaultMachineStatsFilterState() {
      return {
        dateMode: "all",
        weekday: "",
        date: "",
        labels: new Set(),
        heso: new Set()
      };
    }

    function resetMachineStatsFilterState() {
      machineStatsFilterState = defaultMachineStatsFilterState();
    }

    function machineStatsFilterActive(filter = machineStatsFilterState) {
      return filter.dateMode !== "all" || filter.labels.size > 0 || filter.heso.size > 0;
    }

    function weekdayValueForDate(dateValue) {
      const parts = String(dateValue || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!parts) return "";
      const date = new Date(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3]));
      if (date.getFullYear() !== Number(parts[1]) || date.getMonth() !== Number(parts[2]) - 1 || date.getDate() !== Number(parts[3])) return "";
      return String(date.getDay());
    }

    function sessionFilterLabels(session) {
      return [...new Set([...automaticLabelsForDate(session.date), ...(Array.isArray(session.labels) ? session.labels : [])])];
    }

    function machineStatsBaseSessions(machineId) {
      return filteredSessions().filter((session) => session.machineId === machineId);
    }

    function machineStatsFilterOptions(machine, sessions) {
      const labels = new Set(storeLabels(machine.storeId || data.activeStoreId));
      const dates = new Set();
      sessions.forEach((session) => {
        if (session.date) dates.add(session.date);
        sessionFilterLabels(session).forEach((label) => labels.add(label));
      });
      return {
        labels: [...labels].filter(Boolean).sort((a, b) => String(a).localeCompare(String(b), "ja")),
        dates: [...dates].sort((a, b) => String(b).localeCompare(String(a)))
      };
    }

    function machineStatsSessionMatches(machine, session, filter = machineStatsFilterState) {
      if (filter.dateMode === "recent7" || filter.dateMode === "recent14" || filter.dateMode === "recent30") {
        const days = Number(filter.dateMode.replace("recent", ""));
        const from = offsetDate(today(), -(days - 1));
        if (!session.date || session.date < from || session.date > today()) return false;
      } else if (filter.dateMode === "weekday" && filter.weekday !== "") {
        if (weekdayValueForDate(session.date) !== filter.weekday) return false;
      } else if (filter.dateMode === "date" && filter.date) {
        if (session.date !== filter.date) return false;
      }
      if (filter.labels.size > 0) {
        const labels = sessionFilterLabels(session);
        if (!labels.some((label) => filter.labels.has(label))) return false;
      }
      if (filter.heso.size > 0) {
        const heso = dailyHesoRating(machine.id, session.date);
        if (heso === null || !filter.heso.has(String(heso))) return false;
      }
      return true;
    }

    function filteredMachineStatsSessions(machine, sessions, filter = machineStatsFilterState) {
      if (!machineStatsFilterActive(filter)) return sessions;
      return sessions.filter((session) => machineStatsSessionMatches(machine, session, filter));
    }

    function machineStatsFilterHtml(machine, allSessions, filteredSessions, options = {}) {
      const filter = machineStatsFilterState;
      const filterOptions = machineStatsFilterOptions(machine, allSessions);
      const active = machineStatsFilterActive(filter);
      const weekdayLabels = ["日", "月", "火", "水", "木", "金", "土"];
      const dateModeChip = (value, label) => `
        <label class="check-chip">
          <input type="radio" name="machineStatsDateMode" data-stats-date-mode value="${value}" ${filter.dateMode === value ? "checked" : ""}>
          ${label}
        </label>
      `;
      const labelChip = (label) => `
        <label class="check-chip">
          <input type="checkbox" data-stats-label value="${escapeHtml(label)}" ${filter.labels.has(label) ? "checked" : ""}>
          ${escapeHtml(label)}
        </label>
      `;
      const hesoChip = (value) => `
        <label class="check-chip">
          <input type="checkbox" data-stats-heso value="${value}" ${filter.heso.has(String(value)) ? "checked" : ""}>
          ヘソ${value}
        </label>
      `;
      return `
        <details class="row-card machine-stats-filter" id="machineStatsFilter" ${options.open ? "open" : ""}>
          <summary>絞り込み${active ? `（該当${filteredSessions.length}セッション）` : ""}</summary>
          <div class="filter-block">
            <small>日にち</small>
            <div class="label-checks">
              ${dateModeChip("all", "すべて")}
              ${dateModeChip("recent7", "直近7日")}
              ${dateModeChip("recent14", "直近14日")}
              ${dateModeChip("recent30", "直近30日")}
              ${dateModeChip("weekday", "曜日選択")}
              ${dateModeChip("date", "日付選択")}
            </div>
            <div class="machine-stats-selects">
              <select id="machineStatsWeekday" ${filter.dateMode === "weekday" ? "" : "disabled"}>
                <option value="">曜日</option>
                ${weekdayLabels.map((label, index) => `<option value="${index}" ${filter.weekday === String(index) ? "selected" : ""}>${label}曜日</option>`).join("")}
              </select>
              <select id="machineStatsDate" ${filter.dateMode === "date" ? "" : "disabled"}>
                <option value="">日付</option>
                ${filterOptions.dates.map((date) => `<option value="${escapeHtml(date)}" ${filter.date === date ? "selected" : ""}>${escapeHtml(dateWithAutoLabels(date))}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="filter-block">
            <small>イベント</small>
            <div class="label-checks">${filterOptions.labels.length ? filterOptions.labels.map(labelChip).join("") : '<span class="hint">イベントラベルはありません。</span>'}</div>
          </div>
          <div class="filter-block">
            <small>ヘソ調整</small>
            <div class="label-checks">${[1, 2, 3, 4, 5].map(hesoChip).join("")}</div>
          </div>
          <div class="modal-actions compact-actions">
            <button class="ghost" id="clearMachineStatsFilterBtn" type="button">クリア</button>
          </div>
        </details>
      `;
    }

    function openMachineDetail(daiNo, machineFormExpanded = false, options = {}) {
      const machine = findMachineByDai(daiNo);
      if (!machine) return;
      if (!options.preserveStatsFilter) resetMachineStatsFilterState();
      const sessions = data.sessions.filter((session) => session.machineId === machine.id);
      const baseStatsSessions = machineStatsBaseSessions(machine.id);
      const filteredStatsSessions = filteredMachineStatsSessions(machine, baseStatsSessions);
      const baseStats = aggregateStats(baseStatsSessions);
      const stats = aggregateStats(filteredStatsSessions);
      const statsFilterActive = machineStatsFilterActive();
      const presetId = normalizeMachinePresetId(machine);
      const showExpectationBlock = machineHasYutime(machine);
      // S9/§1-3: 参考1R出玉は参考回転率と同じ台単位の集計。手入力欄の初期表示にも使う
      const netBallsInfo = netBallsPerWinInfo(presetId, machine);
      const closing = validClosingInfo(machine.id);
      const closingStateNote = todayPrevInvalid(machine.id) ? `<small>朝チェックで前日分を無効にしています</small>` : "";
      const filteredNote = selectedLabelFilters.size ? `<p class="hint warn">現在の統計は絞り込み後の記録だけで計算しています。</p>` : "";
      const statsFilterNote = statsFilterActive ? `<p class="hint">絞り込み中（該当${filteredStatsSessions.length}セッション）${filteredStatsSessions.length ? "" : " / 該当するサンプルがありません"}</p>` : "";
      const averagePayoutNote = baseStats.estimatedCount ? "（概算含む）" : "";
      openModal(`台番 ${daiNo}`, "過去セッション概要を確認して開始します。", `
        ${machineMemoSectionHtml(machine)}
        ${nailRatingSectionHtml(machine)}
        <div class="metric-grid">
          <div class="metric"><span>参考回転率</span><strong>${stats.rate ? `${stats.rate.toFixed(1)}回/千円` : "-"}</strong>${stats.estimatedCount ? `<small>概算${stats.estimatedCount}件を含む</small>` : ""}</div>
          ${showExpectationBlock ? `<div class="metric"><span>参考1R出玉</span><strong>${escapeHtml(netBallsText(netBallsInfo.value))}</strong><small>${escapeHtml(netBallsSourceText(netBallsInfo))}</small></div>` : ""}
          <div class="metric"><span>通常回転サンプル</span><strong>${stats.spins}</strong></div>
          <div class="metric"><span>通常消費玉</span><strong>${stats.consumed}</strong></div>
          <div class="metric"><span>閉店チェック</span><strong>${closing ? `${escapeHtml(closing.spin)}回転` : "-"}</strong>${closing ? `<small>（${escapeHtml(shortDate(closing.date))}）</small>` : closingStateNote}</div>
          <div class="metric"><span>平均出玉</span><strong>${baseStats.averagePayout !== null ? Math.round(baseStats.averagePayout) : "-"}</strong>${baseStats.averagePayout !== null ? `<small>${averagePayoutNote}</small>` : ""}</div>
          ${baseStats.averageYutimeLoss !== null ? `<div class="metric"><span>遊タイム玉減り</span><strong>${Math.round(baseStats.averageYutimeLoss)}</strong><small>${baseStats.yutimeLossCount}件平均</small></div>` : ""}
        </div>
        ${statsFilterNote}
        ${machineStatsFilterHtml(machine, baseStatsSessions, filteredStatsSessions, { open: options.statsFilterOpen })}
        ${filteredNote}
        ${showExpectationBlock ? `<div class="expectation-box">
          <div class="expectation-title" id="machineEvTitle"><span>期待値判定</span><small>未判定</small></div>
          <div class="expectation-inputs">
            <div class="field-row"><label for="evStartTotalHits">開始時点の累計大当たり回数</label><input id="evStartTotalHits" inputmode="numeric" value=""></div>
            <div class="field-row ev-ramclear-row"><label for="evPrevDisabled">ラムクリア</label><label class="check-chip"><input id="evPrevDisabled" type="checkbox"> あり</label></div>
            <div class="field-row"><label for="evPrevSpin">前日ヤメ回転数（実機：前日の最終回転数。閉店チェックがあれば自動）</label><input id="evPrevSpin" inputmode="numeric" value="${escapeHtml(closing?.spin ?? "")}"></div>
            <div class="field-row"><label for="evCurrentSpin">現在回転数（実機：データカウンターの回転数）</label><input id="evCurrentSpin" inputmode="numeric" value=""></div>
            <div class="field-row"><label for="evManualRate">回転率（手入力）</label><input id="evManualRate" inputmode="decimal" placeholder="${baseStats.rate ? baseStats.rate.toFixed(1) : "履歴なし"}"></div>
            <div class="field-row"><label for="evManualNetBalls">1R実質出玉（手入力）</label><input id="evManualNetBalls" inputmode="decimal" placeholder="${escapeHtml(netBallsUsedText(netBallsInfo))}"></div>
            <div class="field-row expectation-spacer"></div>
            <div class="field-row"><label for="evMochidamaBalls">持ち玉（玉）</label><input id="evMochidamaBalls" inputmode="numeric" value="" placeholder="0"></div>
            <div class="field-row"><label for="evSaipureiBalls">再プレイ（玉）</label><input id="evSaipureiBalls" inputmode="numeric" value="" placeholder="0"></div>
            <div class="field-row"><label for="evStartCredit">開始時のカード残高</label><input id="evStartCredit" inputmode="numeric" value=""></div>
          </div>
          <p class="hint" id="machineEvContext"></p>
          <p class="hint" id="machineEvPrevHint">${closing ? `閉店チェック${escapeHtml(closing.spin)}回転を使用中。開始時点の累計大当たりが1以上、またはラムクリアありの場合は前日ヤメ回転数を使いません。` : "前日ヤメ回転数は未入力です。"}</p>
          <div class="metric-grid" id="machineEvMetrics"></div>
          <p class="hint" id="machineEvDetail"></p>
          <p class="hint" id="machineEvBasis"></p>
        </div>` : ""}
        ${machineModelSummaryHtml(machine)}
        ${machineFormExpanded ? machineDetailFormHtml(machine) : ""}
        <div class="list">
          ${sessions.slice(-5).reverse().map((session) => {
            const derived = deriveSession(session, machine);
            return `<div class="row-card"><strong>${escapeHtml(session.date)}</strong><br><small>${session.status === "completed" ? "確定" : "稼働中"} / 回転率 ${rateText(derived)}${derived.isEstimatedRate || derived.isEstimatedPayout ? " / 概算" : ""}</small></div>`;
          }).join("") || '<div class="row-card"><small>過去セッションなし</small></div>'}
        </div>
        <div class="machine-history-panel" id="machineHistoryPanel" hidden>
          ${machineHistoryHtml(machine)}
        </div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          <button class="ghost" id="toggleMachineHistoryBtn">履歴</button>
          <button class="primary" id="startSessionBtn">この台を打つ</button>
        </div>
      `);
      const toggleMachineFormBtn = byId("toggleMachineFormBtn");
      bindMachineMemoAdd(machine);
      bindNailRatingChips(machine);
      bindMachineStatsFilter(machine, daiNo, machineFormExpanded);
      if (toggleMachineFormBtn) toggleMachineFormBtn.addEventListener("click", () => {
        openMachineDetail(daiNo, true, { preserveStatsFilter: true });
      });
      if (machineFormExpanded) {
        byId("machinePreset").value = presetId;
        applyPresetSelectionToForm();
        // S5/§1: 台情報は釘評価チップと同じく変更した時点で保存する。保存ボタンは置かない。
        const commitMachineDetailForm = () => {
          readMachineDetailForm(machine);
          if (!persistWithQuietToast(`台番${daiNo}の情報を保存しました`)) return;
          if (showExpectationBlock) renderMachineExpectation(machine.id);
          renderAll();
        };
        byId("machinePreset").addEventListener("change", () => {
          applyPresetSelectionToForm();
          commitMachineDetailForm();
        });
        byId("machineModel").addEventListener("change", commitMachineDetailForm);
        byId("roundBalls").addEventListener("change", commitMachineDetailForm);
      }
      byId("toggleMachineHistoryBtn").addEventListener("click", () => {
        const panel = byId("machineHistoryPanel");
        const button = byId("toggleMachineHistoryBtn");
        if (!panel || !button) return;
        const hidden = !panel.hidden;
        panel.hidden = hidden;
        button.textContent = hidden ? "履歴" : "履歴を閉じる";
      });
      if (showExpectationBlock) {
        renderMachineExpectation(machine.id);
        ["evCurrentSpin", "evPrevSpin", "evManualRate", "evManualNetBalls", "evMochidamaBalls", "evSaipureiBalls", "evStartTotalHits"].forEach((id) => {
          byId(id).addEventListener("input", () => renderMachineExpectation(machine.id));
        });
        byId("evPrevDisabled").addEventListener("change", () => renderMachineExpectation(machine.id));
      }
      byId("startSessionBtn").addEventListener("click", () => {
        if (machineFormExpanded) readMachineDetailForm(machine);
        else readMachineMemoForm(machine);
        const presets = expectationPanelPresets();
        if (!persist()) {
          showToast("保存に失敗しました。容量を確認してください。", "error");
          return;
        }
        closeModal();
        openStartSession(machine.id, presets);
      });
    }

    function bindMachineStatsFilter(machine, daiNo, machineFormExpanded) {
      const filterRoot = byId("machineStatsFilter");
      if (!filterRoot) return;
      const rerender = () => openMachineDetail(daiNo, machineFormExpanded, { preserveStatsFilter: true, statsFilterOpen: true });
      filterRoot.querySelectorAll("[data-stats-date-mode]").forEach((input) => {
        input.addEventListener("change", () => {
          if (!input.checked) return;
          machineStatsFilterState.dateMode = input.value || "all";
          rerender();
        });
      });
      byId("machineStatsWeekday")?.addEventListener("change", (event) => {
        machineStatsFilterState.weekday = event.target.value;
        machineStatsFilterState.dateMode = "weekday";
        rerender();
      });
      byId("machineStatsDate")?.addEventListener("change", (event) => {
        machineStatsFilterState.date = event.target.value;
        machineStatsFilterState.dateMode = "date";
        rerender();
      });
      filterRoot.querySelectorAll("[data-stats-label]").forEach((input) => {
        input.addEventListener("change", () => {
          if (input.checked) machineStatsFilterState.labels.add(input.value);
          else machineStatsFilterState.labels.delete(input.value);
          rerender();
        });
      });
      filterRoot.querySelectorAll("[data-stats-heso]").forEach((input) => {
        input.addEventListener("change", () => {
          if (input.checked) machineStatsFilterState.heso.add(input.value);
          else machineStatsFilterState.heso.delete(input.value);
          rerender();
        });
      });
      byId("clearMachineStatsFilterBtn")?.addEventListener("click", () => {
        resetMachineStatsFilterState();
        rerender();
      });
    }

    function renderMachineExpectation(machineId) {
      const machine = data.machines.find((item) => item.id === machineId);
      const title = byId("machineEvTitle");
      const metrics = byId("machineEvMetrics");
      const detail = byId("machineEvDetail");
      if (!machine || !title || !metrics || !detail) return;
      const contextLine = byId("machineEvContext");
      if (contextLine) contextLine.innerHTML = machineContextLine(machine);
      const stats = machineStats(machine.id);
      const previousState = expectationPreviousSpinState();
      const previousDisabled = previousState.disabled;
      const prevInput = byId("evPrevSpin");
      if (prevInput) prevInput.disabled = previousDisabled;
      const prevHint = byId("machineEvPrevHint");
      if (prevHint) {
        const prevValue = normalizeNumber(prevInput?.value);
        prevHint.textContent = previousState.autoDisabled
          ? "当日当選済みのため前日ヤメ回転数は使いません。0回転として計算しています。"
          : (previousState.ramClearDisabled
            ? "ラムクリアありのため前日ヤメ回転数は使いません。0回転として計算しています。"
            : (prevValue !== null ? `前日ヤメ${prevValue.toLocaleString("ja-JP")}回転を使用中。開始時点の累計大当たりが1以上、またはラムクリアありの場合は前日ヤメ回転数を使いません。` : "前日ヤメ回転数は未入力です。"));
      }
      const expectation = calculateMachineExpectation(machine, {
        currentSpin: byId("evCurrentSpin")?.value,
        previousSpin: previousDisabled ? 0 : byId("evPrevSpin")?.value,
        manualRate: byId("evManualRate")?.value,
        manualNetBallsPerWin: byId("evManualNetBalls")?.value,
        availableBalls: availableBallsFromParts(byId("evMochidamaBalls")?.value, byId("evSaipureiBalls")?.value).total,
        stats
      });
      title.className = "expectation-title";
      if (!expectation.result) {
        title.querySelector("small").textContent = "未判定";
        metrics.innerHTML = '<div class="metric"><span>判定</span><strong>-</strong></div>';
        detail.textContent = expectation.reason || "回転率を入力するか、履歴累計を作ってください。";
        const basisEmpty = byId("machineEvBasis");
        if (basisEmpty) basisEmpty.textContent = "";
        return;
      }
      const judgment = evJudgment(expectation.result);
      title.classList.add(judgment.className);
      title.querySelector("small").textContent = judgment.label;
      metrics.innerHTML = `
        <div class="metric"><span>判定</span><strong>${escapeHtml(judgment.label)}</strong></div>
        <div class="metric"><span>残り回転数</span><strong>${expectation.result.spinsToTenjo.toLocaleString("ja-JP")}</strong></div>
        <div class="metric"><span>期待値</span><strong>${escapeHtml(yenText(expectation.result.evYen))}</strong></div>
        <div class="metric"><span>時給</span><strong>${escapeHtml(yenText(expectation.result.hourlyYen))}</strong></div>
        <div class="metric"><span>スロ換算機械割</span><strong>${escapeHtml(percentText(expectation.result.slotRate))}</strong></div>
        <div class="metric"><span>拘束時間</span><strong>${escapeHtml(hourText(expectation.result.totalHours))}</strong></div>
      `;
      const near = expectation.result.spinsToTenjo < 100 && expectation.result.spinsToTenjo > 0;
      const costSource = expectationInvestmentText(expectation.result.mochidamaBalls, expectation.result.cashBalls, expectation.result.spinsToTenjo, expectation.result.rotationRate);
      detail.textContent = `使用回転率 ${expectation.result.rotationRate.toFixed(1)}（${expectation.rateSource}） / ${expectation.netBallsSource} / 残り${expectation.result.spinsToTenjo.toLocaleString("ja-JP")}回転${expectation.previousSpin ? `（前日${expectation.previousSpin}+現在${expectation.currentSpin}）` : ""} / ${costSource} / ${expectation.payoutSource} / ${exchangeBallsText(expectation.exchangeBalls)}玉交換${near ? " / 天井まで100回転未満です" : ""}`;
      const basis = byId("machineEvBasis");
      if (basis) basis.textContent = expectationBasisText(expectation.result);
    }

    function expectationPreviousSpinState() {
      const startTotalHits = normalizeNumber(byId("evStartTotalHits")?.value);
      const autoDisabled = startTotalHits !== null && startTotalHits >= 1;
      const ramClearDisabled = Boolean(byId("evPrevDisabled")?.checked);
      return { autoDisabled, ramClearDisabled, disabled: autoDisabled || ramClearDisabled };
    }

    function expectationPanelPresets() {
      const mochidamaInput = normalizeNumber(byId("evMochidamaBalls")?.value);
      const saipureiInput = normalizeNumber(byId("evSaipureiBalls")?.value);
      const availableBalls = availableBallsFromParts(mochidamaInput, saipureiInput);
      const yoiDisabled = expectationPreviousSpinState().disabled;
      return {
        startSpin: normalizeNumber(byId("evCurrentSpin")?.value),
        prevDayEndSpin: yoiDisabled ? null : normalizeNumber(byId("evPrevSpin")?.value),
        prevDayDisabled: yoiDisabled,
        manualRate: normalizeNumber(byId("evManualRate")?.value),
        manualNetBallsPerWin: normalizeNumber(byId("evManualNetBalls")?.value),
        availableBalls: availableBalls.total,
        mochidamaInput: availableBalls.mochidama,
        saipureiInput: availableBalls.saipurei,
        startTotalHits: normalizeNumber(byId("evStartTotalHits")?.value),
        startCredit: normalizeNumber(byId("evStartCredit")?.value)
      };
    }

    function applyPresetSelectionToForm() {
      const preset = presetById(byId("machinePreset").value);
      const modelInput = byId("machineModel");
      const roundInput = byId("roundBalls");
      const note = byId("presetSupportNote");
      if (preset) {
        modelInput.value = preset.name;
        roundInput.value = preset.roundBalls;
        modelInput.disabled = true;
        note.textContent = preset.evSupported ? "期待値算出はこのプリセット選択時のみ対応しています。" : "このプリセットは期待値算出に未対応です。";
      } else {
        modelInput.disabled = false;
        note.textContent = "期待値算出は対応プリセット選択時のみ利用できます。";
      }
    }

    function readMachineMemoForm(machine) {
      if (!machine) return;
      machine.memoEntries = normalizeMemoEntries(machine.memoEntries);
    }

    function readMachineDetailForm(machine) {
      const preset = presetById(byId("machinePreset").value);
      machine.presetId = preset ? preset.id : "";
      machine.modelName = byId("machineModel").value.trim();
      machine.roundBalls = normalizeNumber(byId("roundBalls").value);
      readMachineMemoForm(machine);
      machine.evSupported = Boolean(preset?.evSupported);
    }

    function openStartWizard(machineId, presets = {}) {
      const store = activeStore();
      const currentActive = activeSessionsForStore(store?.id)[0] || null;
      if (currentActive) {
        openActiveStartGuard(machineId, currentActive, presets, () => beginStartWizard(machineId, presets));
        return;
      }
      beginStartWizard(machineId, presets);
    }

    function openStartSession(machineId, presets = {}) {
      const store = activeStore();
      const currentActive = activeSessionsForStore(store?.id)[0] || null;
      if (currentActive) {
        openActiveStartGuard(machineId, currentActive, presets, () => beginStartSession(machineId, presets));
        return;
      }
      beginStartSession(machineId, presets);
    }

    function openActiveStartGuard(machineId, active, presets = {}, startCallback = null) {
      const activeMachine = data.machines.find((item) => item.id === active.machineId);
      const daiNo = activeMachine?.daiNo || "不明";
      openModal("稼働中の記録があります", `台${daiNo}がヤメ入力されていません。`, `
        <div class="grid">
          <button class="primary" id="goActiveEndBtn">台${escapeHtml(daiNo)}のヤメ入力へ</button>
          <button id="forceStartBtn">そのまま新しく開始</button>
          <button class="ghost" data-close>キャンセル</button>
        </div>
      `);
      byId("goActiveEndBtn").addEventListener("click", () => {
        activeSessionId = active.id;
        closeModal();
        showView("runView");
        openEndWizard(active.id);
      });
      byId("forceStartBtn").addEventListener("click", () => {
        closeModal();
        setTimeout(() => (startCallback || (() => beginStartWizard(machineId, presets)))(), 0);
      });
    }

    function presetsDisablePrevDay(presets = {}) {
      const startTotalHits = normalizeNumber(presets.startTotalHits);
      return presets.prevDayDisabled === true || (startTotalHits !== null && startTotalHits >= 1);
    }

    function latestCompletedSessionForStoreToday(storeId) {
      return data.sessions
        .filter((session) => session.storeId === storeId && session.date === today() && session.status === "completed")
        .sort((a, b) => activeSortKey(b).localeCompare(activeSortKey(a)))[0] || null;
    }

    function latestCompletedSessionForMachineToday(machineId) {
      return data.sessions
        .filter((session) => session.machineId === machineId && session.date === today() && session.status === "completed")
        .sort((a, b) => activeSortKey(b).localeCompare(activeSortKey(a)))[0] || null;
    }

    function startSessionBase(machineId, presets = {}) {
      const store = activeStore();
      if (!store) return null;
      const session = blankSession();
      session.storeId = store.id;
      session.machineId = machineId;
      const manualPrevDayEndSpin = normalizeNumber(presets.prevDayEndSpin);
      const prevDayDisabled = presetsDisablePrevDay(presets);
      const hasPrevDayPreset = Object.prototype.hasOwnProperty.call(presets, "prevDayEndSpin") || prevDayDisabled;
      session.prevDayEndSpin = prevDayDisabled ? null : (hasPrevDayPreset ? manualPrevDayEndSpin : (validClosingInfo(machineId)?.spin ?? null));
      const activeCarryover = carryover && carryover.storeId === store.id ? carryover : null;
      if (activeCarryover) {
        session.carriedFromSessionId = activeCarryover.sourceSessionId;
        session.startMochidama = activeCarryover.mochidama;
        session.startSaipurei = activeCarryover.saipurei;
        session.startCredit = activeCarryover.credit;
      }
      return { session, store, activeCarryover, manualPrevDayEndSpin };
    }

    function beginStartSession(machineId, presets = {}) {
      const base = startSessionBase(machineId, presets);
      if (!base) return;
      const { session, activeCarryover } = base;
      session.startSpin = normalizeNumber(presets.startSpin);
      session.currentSpin = session.startSpin;
      session.startTime = currentTime();
      session.startMochidama = normalizeNumber(presets.mochidamaInput);
      session.startSaipurei = normalizeNumber(presets.saipureiInput);
      session.startCredit = normalizeNumber(presets.startCredit);
      session.startTotalHits = normalizeNumber(presets.startTotalHits);
      const machine = data.machines.find((item) => item.id === machineId);
      session.startEv = calculateStartEvSnapshot(session, machine, presets);
      data.sessions.push(session);
      activeSessionId = session.id;
      const toast = presetsDisablePrevDay(presets) ? "稼働を開始しました。宵越し無効で記録しています。取り消しは記録の修正・削除から行えます。" : "稼働を開始しました。取り消しは記録の修正・削除から行えます。";
      if (!persistWithToast(toast)) return;
      if (activeCarryover) {
        carryover = null;
        localStorage.removeItem(CARRYOVER_KEY);
      }
      showView("runView");
    }

    function beginStartWizard(machineId, presets = {}) {
      const base = startSessionBase(machineId, presets);
      if (!base) return;
      const { session, store, activeCarryover, manualPrevDayEndSpin } = base;
      const latestStoreSession = !activeCarryover ? latestCompletedSessionForStoreToday(store.id) : null;
      const latestStoreBalances = latestStoreSession ? deriveBalances(latestStoreSession) : null;
      const latestMachineSession = latestCompletedSessionForMachineToday(machineId);
      const startSpinPreset = normalizeNumber(presets.startSpin);
      const prevDayEndSpinWasManual = manualPrevDayEndSpin !== null;
      const startSaipureiPreset = !activeCarryover && latestStoreBalances?.saipurei != null ? latestStoreBalances.saipurei : null;
      const startCreditPreset = !activeCarryover && latestStoreBalances?.credit != null ? latestStoreBalances.credit : null;
      const startTotalHitsPreset = latestMachineSession?.endTotalHits ?? null;
      const previousBalanceHint = "本日の前の台の終了時点の残高を初期値にしています。台の表示と違う場合は修正してください。";
      const labels = storeLabels(store.id);
      runWizard("打ち始めウィザード", [
        {
          key: "startSpin",
          label: "現在回転数（実機：データカウンターの回転数）",
          type: "number",
          preset: startSpinPreset,
          hint: `${dateWithAutoLabels(session.date)}で記録します。` + (presetsDisablePrevDay(presets) ? " 期待値判定で宵越し無効を選択しています。" : (session.prevDayEndSpin !== null ? ` ${prevDayEndSpinWasManual ? "期待値判定に入力した前日ヤメ" : "閉店チェック"}${session.prevDayEndSpin}回転を宵越し候補として控えています。` : " 閉店チェック値は未記録、または朝チェックで前日分を無効にしています。")) + (startSpinPreset !== null ? " 期待値判定に入力した現在回転数を初期値にしています。台の表示と違う場合は修正してください。" : "")
        },
        { key: "startTime", label: "時刻", type: "time", preset: currentTime(), hint: "現在時刻をプリセットしています。" },
        { key: "startMochidama", label: "開始時の持ち玉", type: "number", hint: activeCarryover ? "前の台から引き継いだ値です。必要なら修正できます。持ち玉なしで現金スタートなら 0 を入力してください。スキップすると回転率は算出されません。" : "持ち玉なしで現金スタートなら 0 を入力してください。スキップすると回転率は算出されません。" },
        { key: "startSaipurei", label: "開始時の再プレイ残り", type: "number", preset: startSaipureiPreset, hint: activeCarryover ? "前の台から引き継いだ値です。未入力だった場合は空欄のままです。" : (startSaipureiPreset !== null ? previousBalanceHint : "") },
        { key: "startCredit", label: "開始時のカード残高", type: "number", preset: startCreditPreset, hint: activeCarryover ? "前の台から引き継いだ値です。換金・休憩を挟んだ場合は修正してください。" : (startCreditPreset !== null ? previousBalanceHint : "") },
        { key: "startTotalHits", label: "開始時点の累計大当たり回数（実機：データカウンターの本日大当り回数）", type: "number", preset: startTotalHitsPreset, hint: "台のデータカウンタに表示されている本日の大当たり回数。ヤメ時に差し引きで自分の当たり回数を自動計算します。" + (startTotalHitsPreset !== null ? " 同じ台の前回記録のヤメ時点累計を初期値にしています。台の表示と違う場合は修正してください。" : "") },
        { key: "labels", label: "店イベント", type: "labels", labels, hint: eventMemoHelp() }
      ], session, () => {
        if (session.currentSpin === null || session.currentSpin === undefined) session.currentSpin = session.startSpin;
        const machine = data.machines.find((item) => item.id === machineId);
        session.startEv = calculateStartEvSnapshot(session, machine, presets);
        data.sessions.push(session);
        activeSessionId = session.id;
        if (!persistWithToast("稼働を開始しました")) return;
        if (activeCarryover) {
          carryover = null;
          localStorage.removeItem(CARRYOVER_KEY);
        }
        showView("runView");
      });
    }

    function openHitWizard(sessionId) {
      const session = findSession(sessionId);
      if (!session) return;
      const currentBalances = deriveBalances(session);
      const mochidamaPreset = currentBalances.mochidama;
      const hitRemainHint = () => mochidamaPreset !== null
        ? `今ある持ち玉を台の表示どおりに入力してください。ツールの計算値（${mochidamaPreset.toLocaleString("ja-JP")}玉）と違う分だけ、消費玉を補正します。`
        : "今ある持ち玉を入力してください（再プレイ分は含めない）。正確な回転率と、当選時点の持ち玉が記録されます。";
      const balancePresetHint = "稼働中の持ち玉残を初期値にしています。台の表示と違う場合は修正してください。";
      openModal("当選ウィザード", "初当たりの瞬間の記録です。大当たり回数・出玉は [ヤメ] でまとめて入力します。", `
        ${machineContextLine(session)}
        <div class="field-row">
          <label for="hitWizardSpin">当選回転数（実機：当選時のデータカウンター）</label>
          <input id="hitWizardSpin" inputmode="numeric" value="${escapeHtml(session.currentSpin ?? "")}">
        </div>
        <div class="field-row">
          <label for="hitWizardRemainBalls">残り持ち玉（実機：台の持ち玉表示）</label>
          <div>
            <input id="hitWizardRemainBalls" inputmode="numeric" value="${escapeHtml(mochidamaPreset ?? "")}">
            <p class="hint">${hitRemainHint()}${activeStore()?.isPersonal ? "" : " 非パーソナル店では空欄のままで構いません。"}</p>
          </div>
        </div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          <button class="primary" id="saveHitWizardBtn">完了</button>
        </div>
      `);
      byId("saveHitWizardBtn").addEventListener("click", () => {
        session.hitSpin = normalizeNumber(byId("hitWizardSpin")?.value);
        session.hitRemainBalls = normalizeNumber(byId("hitWizardRemainBalls")?.value);
        session.hitTrackedBalls = mochidamaPreset;
        if (!session.hitVia) session.hitVia = session.yutimeEnterBalls !== null ? "yutime" : "normal";
        closeSegmentOnHit(session);
        session.updatedAt = nowIso();
        if (!persistWithToast("当選を記録しました")) return;
        renderAll();
        openHitResetPrompt(session);
      });
    }

    function hitResetOptions(machine) {
      const preset = presetById(normalizeMachinePresetId(machine));
      const values = [0];
      if (preset?.spec?.jitanNormal !== undefined) values.push(Number(preset.spec.jitanNormal));
      if (preset?.spec?.jitanChain !== undefined) values.push(Number(preset.spec.jitanChain));
      return [...new Set(values.filter((value) => Number.isFinite(value) && value >= 0))];
    }

    // S2/§1-1: 時短抜けの選択肢はプリセットの時短回数から作る。値をここに書かない。
    // 表示するカウンター値 = 時短回数 + ST回転数（spec.stSpins）。
    // ST機（アグネスPE）は spec.jitanTable、確変ループ機（大海5SP）は spec.jitanNormal / jitanChain から拾う。
    function jitanExitOptions(presetId) {
      const spec = presetById(presetId)?.spec || {};
      const stSpins = Math.max(0, normalizeNumber(spec.stSpins) ?? 0);
      const fromTable = Array.isArray(spec.jitanTable) ? spec.jitanTable.map((row) => normalizeNumber(row?.spins)) : [];
      const fromChain = [normalizeNumber(spec.jitanNormal), normalizeNumber(spec.jitanChain)];
      const jitanSpins = (fromTable.length ? fromTable : fromChain).filter((value) => value !== null && value >= 0);
      return [...new Set(jitanSpins)]
        .sort((a, b) => a - b)
        .map((spins) => ({ jitanSpins: spins, counterSpin: spins + stSpins }));
    }

    // S2: 区間の実体を必ず用意してから操作する（古いデータ・空のセッション対策）。
    function ensureSessionSegments(session) {
      if (!Array.isArray(session.segments) || !session.segments.length) {
        session.segments = normalizeSessionSegments(session);
      }
      return session.segments;
    }

    function openSegmentOf(session) {
      const segments = ensureSessionSegments(session);
      for (let index = segments.length - 1; index >= 0; index -= 1) {
        const segment = segments[index];
        if (segment.endSpin === null || segment.endSpin === undefined) return segment;
      }
      return null;
    }

    // S2/§1-2: 時短抜けで新しい通常時区間を開始する。変更前の区間には触れない。
    function startNormalSegmentAfterJitan(session, counterSpin) {
      const segments = ensureSessionSegments(session);
      const machine = data.machines.find((item) => item.id === session.machineId);
      const presetId = normalizeMachinePresetId(machine);
      const segment = blankSegment("normal", {
        id: cryptoId("seg"),
        source: "user",
        startSpin: normalizeNumber(counterSpin),
        startAt: currentTime(),
        startTrackedBalls: deriveBalances(session).mochidama,
        holdSpins: presetHoldSpins(presetId)
      });
      segments.push(segment);
      return segment;
    }

    // S2: 当りで「いま打っている区間」を閉じる。開いた区間がなければ末尾を更新する。
    function closeSegmentOnHit(session) {
      const segments = ensureSessionSegments(session);
      const target = openSegmentOf(session) || segments[segments.length - 1];
      if (!target) return null;
      target.endSpin = normalizeNumber(session.hitSpin);
      target.endRemainBalls = normalizeNumber(session.hitRemainBalls);
      target.endTrackedBalls = normalizeNumber(session.hitTrackedBalls);
      target.endSource = "hit";
      return target;
    }

    // S2/§1-3: 遊タイム突入で通常区間を閉じ、遊タイム区間（holdSpins:0）を開く。
    function startYutimeSegment(session) {
      const segments = ensureSessionSegments(session);
      if (segments.some((segment) => segment.kind === "yutime")) return null;
      const enterSpin = normalizeNumber(session.yutimeEnterSpin);
      const open = openSegmentOf(session);
      if (open) {
        open.endSpin = enterSpin;
        open.endAt = session.yutimeEnterTime || null;
        open.endSource = "yutime";
      }
      const segment = blankSegment("yutime", {
        id: cryptoId("seg"),
        source: "user",
        startSpin: enterSpin,
        startAt: session.yutimeEnterTime || null,
        startTrackedBalls: normalizeNumber(session.yutimeEnterBalls),
        holdSpins: 0
      });
      segments.push(segment);
      return segment;
    }

    // S2/§3: ヤメで終わった区間の終端を確定する。当りではないので率計算系は null のまま。
    function closeTrailingSegmentOnEnd(session) {
      const target = openSegmentOf(session);
      if (!target) return null;
      const endSpin = normalizeNumber(session.endSpin);
      if (endSpin === null) return null;
      target.endSpin = endSpin;
      target.endSource = "end";
      return target;
    }

    // S2: 投資は「いま開いている区間」に紐づける。
    function currentSegmentId(session) {
      const segments = Array.isArray(session?.segments) ? session.segments : [];
      if (!segments.length) return null;
      const wantYutime = currentInvestmentPhase(session) === "yutime";
      const open = segments.filter((segment) => segment.endSpin === null || segment.endSpin === undefined);
      const pool = open.length ? open : segments;
      for (let index = pool.length - 1; index >= 0; index -= 1) {
        if ((pool[index].kind === "yutime") === wantYutime) return pool[index].id;
      }
      return pool[pool.length - 1].id;
    }

    // S4/C-4: R種別ごとの内訳と合計R。引いていない種別は行にしない。
    function roundBreakdown(hits, presetId) {
      const roundTypes = presetById(presetId)?.roundTypes || [];
      const counts = (Array.isArray(hits) ? hits : []).reduce((map, hit) => {
        if (!hit?.roundTypeId) return map;
        map.set(hit.roundTypeId, (map.get(hit.roundTypeId) || 0) + 1);
        return map;
      }, new Map());
      let totalRounds = 0;
      const rows = roundTypes.map((type) => {
        const count = counts.get(type.id) || 0;
        if (!count) return "";
        const rounds = roundCountFromRoundType(type);
        if (rounds === null) return "";
        totalRounds += rounds * count;
        return `${type.label}×${count.toLocaleString("ja-JP")}`;
      }).filter(Boolean);
      return { rows, totalRounds, hitCount: (Array.isArray(hits) ? hits : []).length };
    }

    // S4/C-4: 今回の連チャン＝最新の当選と同じ区間に紐づく当たり群。区間モデルで機械的に切り出す。
    function currentChainHits(session, hits = normalizeHits(session?.hits)) {
      if (!hits.length) return [];
      const chainSegmentId = resolveHitSegmentId(session, hits[hits.length - 1]);
      if (!chainSegmentId) return hits;
      return hits.filter((hit) => resolveHitSegmentId(session, hit) === chainSegmentId);
    }

    // S4/C-4,C-5,C-7: 連チャンとセッション合計を分けて出す。出玉は実測の1R当たり玉数だけを見せ、
    // 実測が無いときは理論値（R数×公称）で代用しない。
    function hitRoundSummaryHtml(session, presetId) {
      const hits = normalizeHits(session?.hits);
      const sessionBreakdown = roundBreakdown(hits, presetId);
      const chainBreakdown = roundBreakdown(currentChainHits(session, hits), presetId);
      const totalRounds = sessionBreakdown.totalRounds;
      const latestHit = hits.at(-1);
      const latestRounds = roundCountFromRoundType(roundTypeById(presetId, latestHit?.roundTypeId));
      const latestActualBalls = normalizeNumber(latestHit?.actualBalls);
      const actualPayout = cumulativeActualBallsBeforeHit(session);
      const ballsPerRound = sessionBallsPerRound(session, presetId);
      const breakdownLine = (label, breakdown, countLabel = "") => `<p class="hint">${label} ${breakdown.rows.length ? breakdown.rows.join(" ／ ") : "-"}（${countLabel}${breakdown.hitCount.toLocaleString("ja-JP")}回・${breakdown.totalRounds.toLocaleString("ja-JP")}R）</p>`;
      return `
        <div class="hit-round-summary">
          <div class="hit-round-result">
            <strong>今回の当選 ${latestRounds !== null ? `${latestRounds.toLocaleString("ja-JP")}R` : "-"} ／ 合計 ${totalRounds.toLocaleString("ja-JP")}R</strong>
            <small>1R当たり ${ballsPerRoundText(ballsPerRound)}</small>
          </div>
          ${breakdownLine("今回の連チャン", chainBreakdown)}
          ${breakdownLine("このセッション", sessionBreakdown, "今回")}
          <hr>
          <p class="hint">実測獲得出玉 今回 ${actualPayout > 0 ? `${Math.round(Math.max(0, latestActualBalls ?? 0)).toLocaleString("ja-JP")}玉／累計 ${Math.round(actualPayout).toLocaleString("ja-JP")}玉` : "—"}</p>
        </div>
      `;
    }

    // S4/C-5・S5/§4: 実測の獲得出玉合計 ÷ 合計R。理論値（R数×公称玉数）では代用しない。
    // 分子は戦果報告の「獲得出玉」と同じ sessionActualBallsTotal（当選ごとの今回分の合計・S8/§1-2）。
    // 分母はリザルトの1R平均と同じ totalRoundsForPreset（当選履歴が無ければヤメ入力の合計R数）。
    function sessionBallsPerRound(session, presetId) {
      const totalRounds = totalRoundsForPreset(session, presetId);
      const actualPayout = sessionActualBallsTotal(session);
      return actualPayout !== null && actualPayout > 0 && totalRounds > 0 ? actualPayout / totalRounds : null;
    }

    function ballsPerRoundText(value) {
      return value !== null ? `${Math.round(value).toLocaleString("ja-JP")}玉` : "—";
    }

    function openHitResetPrompt(session) {
      const machine = data.machines.find((item) => item.id === session.machineId);
      const balances = deriveBalances(session);
      const presetId = normalizeMachinePresetId(machine);
      const jitanOptions = jitanExitOptions(presetId);
      const roundTypes = presetById(presetId)?.roundTypes || [];
      const hitCounterSpin = hitCounterSpinForRecord(session);
      openModal("大当たり登録", "R数と獲得出玉を記録し、時短が終わったらカウンターの表示に合わせてください。選ばずに閉じると、現在回転数はそのままです。", `
        ${machineContextLine(session)}
        <div class="field-row">
          <label>当選ごとのラウンド記録</label>
          <div class="hit-round-layout">
            <div>
              <div class="quick-invest">
                ${roundTypes.map((type) => `<button data-hit-round="${escapeHtml(type.id)}">${escapeHtml(type.label)} +1</button>`).join("") || '<span class="hint">このプリセットにはラウンド種別がありません。</span>'}
              </div>
              <p class="hint">当選カウンター <strong>${numberText(hitCounterSpin, "-")}</strong>（当選ウィザードで記録した値です。変えるときは「大当たり履歴」から）</p>
              <label for="hitRecordActualBalls">この連チャンの累計出玉</label>
              <input id="hitRecordActualBalls" inputmode="numeric" placeholder="この連チャンの累計出玉（実機：データカウンター）任意">
              <p class="hint">いま表示されている、この連チャンの累計出玉を入力してください。時短が終わると0に戻ります。前回の入力との差が、今回の当たりの出玉になります。</p>
            </div>
            ${hitRoundSummaryHtml(session, presetId)}
          </div>
        </div>
        <div class="field-row">
          <label for="hitMochidamaValue">持ち玉</label>
          <div>
            <span class="hint">現在 <strong id="hitMochidamaCurrent">${balanceText(balances.mochidama, "玉")}</strong> → </span>
            <input id="hitMochidamaValue" inputmode="numeric" placeholder="消化後の値">
            <span class="hint"> 玉（任意）</span>
            <p class="hint">台の玉数表示に合わせて入力してください。入力した時点で反映されます。</p>
          </div>
        </div>
        <div class="field-row">
          <label>時短が終わりました（実機：データカウンターの表示）</label>
          <div>
            <div class="quick-invest">
              ${jitanOptions.map((option) => `<button data-hit-reset="${option.counterSpin}">時短${option.jitanSpins} → カウンター${option.counterSpin}</button>`).join("") || '<span class="hint">この機種には時短のプリセットがありません。直接入力してください。</span>'}
            </div>
            <div class="grid two">
              <input id="jitanExitSpin" inputmode="numeric" placeholder="直接入力（回転数）">
              <button id="applyJitanExitBtn">この回転数で開始</button>
            </div>
            <p class="hint">選ばずに閉じると、現在回転数はそのままです。</p>
          </div>
        </div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          <button id="openHitHistoryBtn">大当たり履歴</button>
        </div>
      `);
      // C-6: 確定ボタンを置かず、入力した時点（フォーカスが外れた時点）で反映する。
      const hitMochidamaInput = byId("hitMochidamaValue");
      if (hitMochidamaInput) hitMochidamaInput.addEventListener("change", () => {
        if (!saveHitMochidamaInput(session)) return;
        const currentText = byId("hitMochidamaCurrent");
        if (currentText) currentText.textContent = balanceText(deriveBalances(session).mochidama, "玉");
      });
      byId("openHitHistoryBtn").addEventListener("click", () => {
        openHitHistory(session, { back: () => openHitResetPrompt(session) });
      });
      els.modalBody.querySelectorAll("[data-hit-round]").forEach((button) => {
        button.addEventListener("click", () => {
          appendHitRecord(session, button.dataset.hitRound);
          openHitResetPrompt(session);
        });
      });
      els.modalBody.querySelectorAll("[data-hit-reset]").forEach((button) => {
        button.addEventListener("click", () => {
          closeModal();
          applyJitanExit(session, Number(button.dataset.hitReset));
        });
      });
      byId("applyJitanExitBtn").addEventListener("click", () => {
        const value = normalizeNumber(byId("jitanExitSpin")?.value);
        if (value === null || value < 0) {
          showToast("回転数を数値で入力してください", "error");
          return;
        }
        closeModal();
        applyJitanExit(session, value);
      });
    }

    // S2/§1-2: 新しい通常時区間を追加してから現在回転数を合わせる（順序を入れ替えないこと）。
    // setCurrentSpinWithUndo が persist して区間を保存するため。
    function applyJitanExit(session, counterSpin) {
      startNormalSegmentAfterJitan(session, counterSpin);
      setCurrentSpinWithUndo(session, counterSpin);
      const switched = switchInvestmentSourceToMochidama(session);
      showToast(`現在回転数を${counterSpin}にリセットしました${switched ? "／投資元を持ち玉に切り替えました" : ""}`);
    }

    // S4/C-8: 時短抜け後は出玉を使って打つ。再プレイのままだと気づかずに再プレイを減らすため、
    // 持ち玉があるときだけ投資元を持ち玉へ寄せる。手動で戻すことは従来どおりできる。
    function switchInvestmentSourceToMochidama(session) {
      if (runningSource === "mochidama") return false;
      const mochidama = deriveBalances(session).mochidama;
      if (mochidama === null || mochidama <= 0) return false;
      runningSource = "mochidama";
      localStorage.setItem(SOURCE_PREF_KEY, runningSource);
      renderRunning();
      return true;
    }

    // index より前の当選の獲得出玉合計。セッションの実測出玉合計（S8/§1-2）の基準になる。
    function cumulativeActualBallsBefore(session, index = Infinity) {
      return (Array.isArray(session?.hits) ? session.hits : [])
        .slice(0, index)
        .map((hit) => normalizeNumber(hit?.actualBalls))
        .filter((value) => value !== null && value > 0)
        .reduce((sum, value) => sum + value, 0);
    }

    function cumulativeActualBallsBeforeHit(session) {
      return cumulativeActualBallsBefore(session);
    }

    // S8/§1-1: 累計入力の範囲は連チャン＝同じ区間に紐づく当たり群（S4/C-4の切り出しと同じ）。
    // データカウンターの獲得出玉は時短が終わると0に戻るため、セッション累計では解釈できない。
    // index が末尾（これから追加する当選）のときは、その当選が紐づく区間で切る。
    function chainSegmentIdForHit(session, index = Infinity) {
      const hits = Array.isArray(session?.hits) ? session.hits : [];
      const target = index < hits.length ? hits[index] : null;
      return target ? resolveHitSegmentId(session, target) : hitRecordSegmentId(session);
    }

    // 同じ連チャン内で、index より前に記録された獲得出玉の合計。
    function chainActualBallsBefore(session, index = Infinity, chainSegmentId = chainSegmentIdForHit(session, index)) {
      return (Array.isArray(session?.hits) ? session.hits : [])
        .slice(0, index)
        .filter((hit) => chainSegmentId === null || resolveHitSegmentId(session, hit) === chainSegmentId)
        .map((hit) => normalizeNumber(hit?.actualBalls))
        .filter((value) => value !== null && value > 0)
        .reduce((sum, value) => sum + value, 0);
    }

    // S4/C-2: 当選カウンターは当選ウィザードの記録値を使う。大当たり登録画面では編集しない。
    function hitCounterSpinForRecord(session) {
      return normalizeNumber(session?.hitSpin) ?? normalizeNumber(session?.currentSpin);
    }

    // S4/B-1: 当選は、当選ウィザードが閉じた区間（まだ開いた区間が残っていればその区間）に紐づける。
    // 時短抜けで次の区間が開くので、連チャンの区切りが区間の境界と一致する。
    function hitRecordSegmentId(session) {
      const segments = ensureSessionSegments(session);
      const target = openSegmentOf(session) || segments[segments.length - 1];
      return target?.id || null;
    }

    // S8/§1-2: セッションの実測出玉合計は当選ごとの「今回分」の単純合計。連チャンをまたいでも正しい。
    // sessionActualBalls（B90のヤメ入力）は当選ごとの記録が無い旧データのフォールバックとしてだけ使う。
    function sessionActualBallsTotal(session) {
      const perHit = cumulativeActualBallsBeforeHit(session);
      if (perHit > 0) return perHit;
      const explicit = normalizeNumber(session?.sessionActualBalls);
      return explicit !== null && explicit > 0 ? explicit : null;
    }

    // S8/§1-1: 入力値はその連チャンの累計。今回分＝入力値 − 同じ連チャン内のそれ以前の合計。
    function actualBallsFromCumulativeInput(session, cumulativeInput, index = Infinity) {
      const cumulativeBalls = normalizeNumber(cumulativeInput);
      if (cumulativeBalls === null) return { actualBalls: null, warning: false };
      const previousTotal = chainActualBallsBefore(session, index);
      if (cumulativeBalls < previousTotal) return { actualBalls: 0, warning: true };
      return { actualBalls: cumulativeBalls - previousTotal, warning: false };
    }

    function appendHitRecord(session, roundTypeId) {
      if (!Array.isArray(session.hits)) session.hits = [];
      const actualBallsResult = actualBallsFromCumulativeInput(session, byId("hitRecordActualBalls")?.value);
      session.hits.push({
        roundTypeId,
        hitSpin: hitCounterSpinForRecord(session),
        actualBalls: actualBallsResult.actualBalls,
        segmentId: hitRecordSegmentId(session),
        at: nowIso()
      });
      syncSessionHitTotals(session);
      session.updatedAt = nowIso();
      const saved = persistWithToast("当選を1件追加しました");
      if (saved && actualBallsResult.warning) {
        showToast("入力値が前回までの累計を下回っています。カウンターの累計を入力してください", "error");
      }
    }

    function saveHitMochidamaInput(session, options = {}) {
      const input = byId("hitMochidamaValue");
      if (!input) return false;
      const raw = input.value.trim();
      if (!raw) return false;
      const value = normalizeNumber(raw);
      if (value === null) {
        if (!options.silentEmpty) showToast("持ち玉を数値で入力してください", "error");
        return false;
      }
      updateMochidamaBalanceWithUndo(session, value);
      input.value = "";
      return true;
    }

    // S4/B-1: 区間の見出し。リザルトの「区間ごとの内訳」と同じ数え方にそろえる。
    function segmentHistoryLabels(session) {
      const marks = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨"];
      let normalIndex = 0;
      return sessionSegments(session).map((segment) => {
        if (segment.kind === "yutime") {
          return { id: segment.id, label: `遊タイム（${numberText(segment.startSpin, "-")}から）` };
        }
        const mark = marks[normalIndex] || String(normalIndex + 1);
        normalIndex += 1;
        const from = normalIndex === 1 ? "打ち始め" : `時短抜け${numberText(segment.startSpin, "-")}`;
        return { id: segment.id, label: `区間${mark}（${from}から）` };
      });
    }

    // S4/B-1: 当選がどの区間に属するか。記録済みの segmentId を優先し、
    // 区間より前に記録された旧データは当選カウンターで寄せる。
    function resolveHitSegmentId(session, hit) {
      const segments = sessionSegments(session);
      if (!segments.length) return null;
      const validIds = new Set(segments.map((segment) => segment.id).filter(Boolean));
      if (hit?.segmentId && validIds.has(hit.segmentId)) return hit.segmentId;
      const spin = normalizeNumber(hit?.hitSpin);
      if (spin !== null) {
        for (let index = segments.length - 1; index >= 0; index -= 1) {
          const start = normalizeNumber(segments[index].startSpin);
          if (start !== null && spin >= start) return segments[index].id;
        }
      }
      return segments[segments.length - 1].id;
    }

    // S4/B-1: 一覧の行。添字は保存配列の添字（修正・削除がそのまま使う）。
    // S8/§1-1: 累計出玉は連チャン（＝区間）ごとに古い順で積み上げる。カウンターの表示と同じ単位にする。
    function hitHistoryRows(session) {
      const hits = Array.isArray(session?.hits) ? session.hits : [];
      const chainState = new Map();
      return hits.map((hit, index) => {
        const segmentId = resolveHitSegmentId(session, hit);
        const state = chainState.get(segmentId) || { cumulative: 0, hasActual: false };
        const actualBalls = normalizeNumber(hit?.actualBalls);
        if (actualBalls !== null && actualBalls > 0) {
          state.hasActual = true;
          state.cumulative += actualBalls;
        }
        chainState.set(segmentId, state);
        return {
          index,
          number: index + 1,
          hit,
          segmentId,
          cumulativeBalls: state.hasActual ? state.cumulative : null
        };
      });
    }

    // S4/B-1: 新しい区間が上。区間に紐づかない当選は末尾にまとめる。
    function hitHistoryGroups(session) {
      const rows = hitHistoryRows(session);
      const labels = segmentHistoryLabels(session);
      const groups = labels.map((entry) => ({ id: entry.id, label: entry.label, rows: rows.filter((row) => row.segmentId === entry.id) }));
      const orphans = rows.filter((row) => !labels.some((entry) => entry.id === row.segmentId));
      const ordered = groups.filter((group) => group.rows.length).reverse();
      if (orphans.length) ordered.push({ id: null, label: "区間不明", rows: orphans });
      return ordered;
    }

    // S4/B-1: 当選を修正・削除したあとの合計を作り直す。0件になったら当選なしへ戻す。
    function applyHitTotals(session) {
      if (Array.isArray(session.hits) && session.hits.length) {
        syncSessionHitTotals(session);
        return;
      }
      session.hitCount = 0;
      session.totalRounds = 0;
    }

    function removeHitRecord(session, index) {
      const hits = Array.isArray(session.hits) ? session.hits : [];
      if (!Number.isInteger(index) || !hits[index]) return false;
      hits.splice(index, 1);
      applyHitTotals(session);
      session.updatedAt = nowIso();
      if (!persistWithToast("当選を削除しました")) return false;
      renderAll();
      return true;
    }

    function openHitHistory(session, options = {}) {
      const machine = data.machines.find((item) => item.id === session.machineId);
      const presetId = normalizeMachinePresetId(machine);
      const back = typeof options.back === "function" ? options.back : null;
      const groups = hitHistoryGroups(session);
      const body = groups.length ? groups.map((group) => `
        <div class="hit-history-group">
          <div class="hit-history-group-title">${escapeHtml(group.label)}</div>
          ${group.rows.slice().reverse().map((row) => {
            const rounds = roundCountFromRoundType(roundTypeById(presetId, row.hit?.roundTypeId));
            const cumulativeText = row.cumulativeBalls === null ? "-" : `${Math.round(row.cumulativeBalls).toLocaleString("ja-JP")}玉`;
            return `
              <div class="row-card">
                <div class="row-card-head">
                  <div>
                    <strong>#${row.number} ${rounds !== null ? `${rounds.toLocaleString("ja-JP")}R` : "R種別なし"}</strong>
                    <br><small>当選カウンター ${numberText(normalizeNumber(row.hit?.hitSpin), "-")} / この連チャンの累計出玉 ${escapeHtml(cumulativeText)}</small>
                  </div>
                  <div class="hit-history-actions">
                    <button class="small" data-edit-hit="${row.index}">修正</button>
                    <button class="small danger" data-delete-hit="${row.index}">削除</button>
                  </div>
                </div>
              </div>`;
          }).join("")}
        </div>`).join("") : '<p class="hint">まだ当選は記録されていません。</p>';
      openModal("大当たり履歴", "このセッションの当選です。新しいものが上。", `
        ${machineContextLine(session)}
        <div class="list">${body}</div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          ${back ? '<button id="hitHistoryBackBtn">戻る</button>' : ""}
        </div>
      `);
      els.modalBody.querySelectorAll("[data-edit-hit]").forEach((button) => {
        button.addEventListener("click", () => openHitEditForm(session, Number(button.dataset.editHit), options));
      });
      els.modalBody.querySelectorAll("[data-delete-hit]").forEach((button) => {
        button.addEventListener("click", () => {
          const index = Number(button.dataset.deleteHit);
          if (!confirm("この当選を削除しますか？")) return;
          if (!confirm("元に戻せません。削除を確定しますか？")) return;
          if (!removeHitRecord(session, index)) return;
          openHitHistory(session, options);
        });
      });
      const backButton = byId("hitHistoryBackBtn");
      if (backButton) backButton.addEventListener("click", () => back());
    }

    // S4/B-1: R種別・当選カウンター・この連チャンの累計出玉を直す。
    // S8/§1-1: 入力欄も連チャン単位の差分方式で扱い、同じ連チャンでこの当選までの累計を受け取って今回分を出し直す。
    function openHitEditForm(session, index, options = {}) {
      const hit = Array.isArray(session.hits) ? session.hits[index] : null;
      if (!hit) return;
      const machine = data.machines.find((item) => item.id === session.machineId);
      const presetId = normalizeMachinePresetId(machine);
      const roundTypes = presetById(presetId)?.roundTypes || [];
      const hasActualBalls = normalizeNumber(hit.actualBalls) !== null;
      const cumulativeBalls = chainActualBallsBefore(session, index + 1, chainSegmentIdForHit(session, index));
      openModal("当選の修正", `#${index + 1} の記録を直します。`, `
        ${machineContextLine(session)}
        <div class="field-row">
          <label for="editHitRoundType">R種別</label>
          <select id="editHitRoundType">
            <option value="">未設定</option>
            ${roundTypes.map((type) => `<option value="${escapeHtml(type.id)}"${type.id === hit.roundTypeId ? " selected" : ""}>${escapeHtml(type.label)}</option>`).join("")}
          </select>
        </div>
        <div class="field-row">
          <label for="editHitSpin">当選カウンター（実機：当選時のデータカウンター）</label>
          <input id="editHitSpin" inputmode="numeric" value="${escapeHtml(normalizeNumber(hit.hitSpin) ?? "")}">
        </div>
        <div class="field-row">
          <label for="editHitActualBalls">この連チャンの累計出玉（実機：データカウンター）</label>
          <div>
            <input id="editHitActualBalls" inputmode="numeric" value="${escapeHtml(hasActualBalls ? Math.round(cumulativeBalls) : "")}">
            <p class="hint">この連チャンで、この当選までの累計です。同じ連チャン内のここまでの合計を引いた分が、今回の獲得出玉として記録し直されます。</p>
          </div>
        </div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          <button id="cancelHitEditBtn">戻る</button>
          <button class="primary" id="saveHitEditBtn">保存</button>
        </div>
      `);
      byId("cancelHitEditBtn").addEventListener("click", () => openHitHistory(session, options));
      byId("saveHitEditBtn").addEventListener("click", () => {
        const target = Array.isArray(session.hits) ? session.hits[index] : null;
        if (!target) return;
        const result = actualBallsFromCumulativeInput(session, byId("editHitActualBalls").value, index);
        target.roundTypeId = byId("editHitRoundType").value || "";
        target.hitSpin = normalizeNumber(byId("editHitSpin").value);
        target.actualBalls = result.actualBalls;
        applyHitTotals(session);
        session.updatedAt = nowIso();
        if (!persistWithToast("当選を修正しました")) return;
        if (result.warning) showToast("入力値が前回までの累計を下回っています。カウンターの累計を入力してください", "error");
        renderAll();
        openHitHistory(session, options);
      });
    }

    function openEndWizard(sessionId) {
      const session = findSession(sessionId);
      if (!session) return;
      openModal("ヤメ入力", "結果を選んでから、必要な項目だけ記録します。", `
        ${machineContextLine(session)}
        <div class="grid two">
          <button class="primary" id="endWithHitBtn">大当たりあり</button>
          <button id="endNoHitBtn">当たらず終了（遊タイム抜け含む）</button>
        </div>
      `);
      byId("endWithHitBtn").addEventListener("click", () => {
        closeModal();
        runEndWizard(session, true);
      });
      byId("endNoHitBtn").addEventListener("click", () => {
        closeModal();
        runEndWizard(session, false);
      });
    }

    function presetHitCountFromCounters(session) {
      if (session.startTotalHits === null || session.startTotalHits === undefined || session.endTotalHits === null || session.endTotalHits === undefined) return;
      const diff = Number(session.endTotalHits) - Number(session.startTotalHits);
      if (diff < 0) {
        showToast("累計大当たり回数を確認してください。ヤメ時点が開始時点より少なくなっています。", "error");
        if (session.hitCount === null || session.hitCount === undefined) session.hitCount = null;
        return;
      }
      session.hitCount = diff;
    }

    function zanhoryuPresetFromHit(session, hasHit) {
      if (!hasHit) return null;
      const currentSpin = normalizeNumber(session.currentSpin);
      const hitSpin = normalizeNumber(session.hitSpin);
      if (currentSpin === null || hitSpin === null) return null;
      const diff = currentSpin - hitSpin;
      return diff >= 0 ? diff : null;
    }

    function runEndWizard(session, hasHit) {
      const currentBalances = deriveBalances(session);
      const endTotalBallsPreset = currentBalances.mochidama;
      const endTotalBallsHint = (endTotalBallsPreset !== null ? "稼働中の持ち玉残を初期値にしています。 " : "") + "（実機：計数機に流す玉数）そのまま入力してください。";
      const endSpinPreset = !hasHit && session.hitSpin === null && Number(session.hitCount || 0) === 0 ? session.currentSpin : null;
      const endSpinHint = endSpinPreset !== null ? "稼働中カウンタの現在回転数を初期値にしています。台の表示と違う場合は修正してください。" : "";
      const zanhoryuPreset = zanhoryuPresetFromHit(session, hasHit);
      const zanhoryuHint = zanhoryuPreset !== null ? "時短抜け後に消化した回転数から推定した値です。打ち込んだ場合は実際の残保留に修正してください。" : "";
      const hitRecordSteps = Array.isArray(session.hits) && session.hits.length ? [] : [
        { key: "hitCount", label: "大当たり回数", type: "number" },
        { key: "totalRounds", label: "合計R数", type: "number", hint: "実測の獲得出玉と合わせて1R当たりの玉数を計算します。" }
      ];
      // S8/§1-3: 実機はセッション累計の獲得出玉を表示しないため、ヤメ入力に累計獲得出玉は置かない。
      // 実測出玉合計は当選ごとの記録（sessionActualBallsTotal）だけで確定する。
      const steps = hasHit ? [
        { key: "endTotalBalls", label: "時短抜け後の合計玉数", type: "number", preset: endTotalBallsPreset, hint: endTotalBallsHint },
        { key: "endSpin", label: "ヤメ回転数（実機：ヤメ時のデータカウンター）", type: "number" },
        { key: "zanhoryuBalls", label: "残保留増減", type: "number", preset: zanhoryuPreset, hint: zanhoryuHint },
        { key: "memo", label: "メモ", type: "textarea" },
        ...hitRecordSteps
      ] : [
        { key: "endTotalBalls", label: "終了時玉数", type: "number", preset: endTotalBallsPreset, hint: endTotalBallsHint },
        { key: "endSpin", label: "ヤメ回転数（実機：ヤメ時のデータカウンター）", type: "number", preset: endSpinPreset, hint: endSpinHint },
        { key: "zanhoryuBalls", label: "残保留増減", type: "number" },
        { key: "memo", label: "メモ", type: "textarea" }
      ];
      openEndForm(session, hasHit, steps);
    }

    function openEndForm(session, hasHit, steps) {
      openModal("ヤメ入力", "必要な項目だけ入力して保存します。空欄はスキップ扱いです。", `
        ${machineContextLine(session)}
        <div class="end-form">
          ${steps.map((step) => endFormFieldHtml(step, session)).join("")}
        </div>
        <div class="modal-actions">
          <button class="primary" id="saveEndFormBtn">保存</button>
          <button data-close>閉じる</button>
        </div>
      `);
      byId("saveEndFormBtn").addEventListener("click", () => {
        steps.forEach((step) => {
          session[step.key] = readEndFormValue(step);
        });
        completeEndSession(session, hasHit);
      });
      modalCancel = () => renderAll();
    }

    function endFormFieldHtml(step, session) {
      const value = session[step.key] ?? step.preset ?? "";
      const hint = step.hint ? `<p class="hint">${escapeHtml(step.hint)}</p>` : "";
      if (step.type === "textarea") {
        return `<div class="field-row"><label for="end_${step.key}">${escapeHtml(step.label)}</label><div><textarea id="end_${step.key}">${escapeHtml(value || "")}</textarea>${hint}</div></div>`;
      }
      const inputMode = step.type === "number" ? ' inputmode="numeric"' : "";
      return `<div class="field-row"><label for="end_${step.key}">${escapeHtml(step.label)}</label><div><input id="end_${step.key}" type="text"${inputMode} value="${escapeHtml(value)}">${hint}</div></div>`;
    }

    function readEndFormValue(step) {
      const input = byId(`end_${step.key}`);
      if (!input) return null;
      if (step.type === "number") return normalizeNumber(input.value);
      const value = input.value.trim();
      return value ? value : null;
    }

    function completeEndSession(session, hasHit) {
      session.status = "completed";
      if (!hasHit) {
        session.hitCount = 0;
        session.totalRounds = 0;
      } else {
        syncSessionHitTotals(session);
      }
      session.endTime = session.endTime || currentTime();
      closeTrailingSegmentOnEnd(session);
      session.updatedAt = nowIso();
      if (activeSessionId === session.id) activeSessionId = activeSessionsForStore(session.storeId).find((item) => item.id !== session.id)?.id || null;
      if (!persistWithToast("記録を保存しました")) return;
      modalCancel = null;
      closeModal();
      showView("mapView");
      openRateSummary(session);
    }

    function runWizard(title, steps, target, done, options = {}) {
      let index = 0;
      const draft = target;
      const renderStep = () => {
        const step = steps[index];
        const wizardHint = step.wizardHint || `${index + 1} / ${steps.length}: ${step.label}。未入力でスキップできます。`;
        openModal(title, wizardHint, wizardInputHtml(step, draft[step.key]) + `
          <div class="modal-actions wizard-actions">
            <button class="primary" id="nextStepBtn">${index === steps.length - 1 ? "完了" : "次へ"}</button>
            <button id="skipStepBtn">スキップ</button>
            <button id="backStepBtn" ${index === 0 && !options.firstBackCancels ? "disabled" : ""}>戻る</button>
          </div>
        `, "wizard");
        const input = byId("wizardValue");
        if (input && step.preset && !input.value) input.value = step.preset;
        if (input) {
          input.addEventListener("keydown", (event) => {
            if (event.key !== "Enter") return;
            if (step.type === "textarea" && !event.ctrlKey && !event.metaKey) return;
            event.preventDefault();
            byId("nextStepBtn").click();
          });
        }
        byId("skipStepBtn").addEventListener("click", () => {
          draft[step.key] = step.type === "labels" ? [] : null;
          if (options.afterStep) options.afterStep(step, draft, index);
          advance();
        });
        byId("backStepBtn").addEventListener("click", () => {
          if (index === 0 && options.firstBackCancels) {
            closeModal();
            return;
          }
          if (index > 0) {
            draft[step.key] = readWizardValue(step);
            index -= 1;
            renderStep();
          }
        });
        byId("nextStepBtn").addEventListener("click", () => {
          draft[step.key] = readWizardValue(step);
          if (options.afterStep) options.afterStep(step, draft, index);
          advance();
        });
      };
      const advance = () => {
        if (index >= steps.length - 1) {
          closeModal();
          done();
        } else {
          index += 1;
          renderStep();
        }
      };
      modalCancel = () => renderAll();
      renderStep();
    }

    function wizardInputHtml(step, value) {
      if (step.type === "textarea") {
        return `<textarea id="wizardValue">${escapeHtml(value || "")}</textarea>${step.hint ? `<p class="hint">${escapeHtml(step.hint)}</p>` : ""}`;
      }
      if (step.type === "labels") {
        const chosen = new Set(Array.isArray(value) ? value : []);
        return `${step.hint ? `<p class="hint">${escapeHtml(step.hint)}</p>` : ""}<div class="label-checks">${(step.labels || []).map((label) => `
          <label class="check-chip"><input class="wizardLabel" type="checkbox" value="${escapeHtml(label)}" ${chosen.has(label) ? "checked" : ""}> ${escapeHtml(label)}</label>
        `).join("") || '<span class="hint">イベントメモ未登録です。</span>'}</div>`;
      }
      const inputType = step.type === "time" ? "time" : "text";
      const inputMode = step.type === "number" ? ' inputmode="numeric"' : "";
      const displayValue = value ?? step.preset ?? "";
      return `<input id="wizardValue" type="${inputType}"${inputMode} value="${escapeHtml(displayValue)}">${step.hint ? `<p class="hint">${escapeHtml(step.hint)}</p>` : ""}`;
    }

    function readWizardValue(step) {
      if (step.type === "labels") return [...document.querySelectorAll(".wizardLabel:checked")].map((input) => input.value);
      const input = byId("wizardValue");
      if (!input) return null;
      if (step.type === "number") return normalizeNumber(input.value);
      const value = input.value.trim();
      return value ? value : null;
    }

    // B94: いまツールがどの状態として扱っているかを1語で出す
    // S4/D-1: S2で時短抜けを入力できるようになり、当選後の宙ぶらりんな状態がほぼ無くなった。
    // 状態は「通常時」「遊タイム中」の2つだけにする。
    function runningStateBadge(session) {
      if (isYutimeInvestmentPhase(session)) return { label: "遊タイム中", className: "warn" };
      return { label: "通常時", className: "" };
    }

    function isYutimeInvestmentPhase(session) {
      return Boolean(session.yutimeEnterTime || session.yutimeEnterBalls !== null);
    }

    function currentInvestmentPhase(session) {
      return isYutimeInvestmentPhase(session) ? "yutime" : "normal";
    }

    function investmentPhaseLabel(item) {
      return item.phase === "yutime" ? "遊タイム中" : "通常時";
    }

    function investmentSourceLabel(source) {
      const normalized = normalizeInvestmentSource(source);
      if (normalized === "mochidama") return "持ち玉";
      if (normalized === "saipurei") return "再プレイ";
      return "現金";
    }

    function investmentSourceShortLabel(source) {
      const normalized = normalizeInvestmentSource(source);
      if (normalized === "mochidama") return "持ち玉";
      if (normalized === "saipurei") return "再プレ";
      return "現金";
    }

    function balanceText(value, unit) {
      return value === null ? "未入力" : `${numberText(value, 0)} ${unit}`;
    }

    function sourceChipBalanceText(value) {
      return value === null ? "-" : numberText(value, 0);
    }

    function investmentUnitForSource(source) {
      return normalizeInvestmentSource(source) === "cash" ? 500 : 125;
    }

    function investmentAmountForSource(session, source, requestedAmount = investmentUnitForSource(source)) {
      const requested = Math.max(0, Number(requestedAmount || 0));
      const balance = balanceForSource(session, source);
      return balance !== null && balance > 0 && balance < requested ? balance : requested;
    }

    function investmentButtonText(source, amount) {
      const normalized = normalizeInvestmentSource(source);
      return `-${numberText(amount, 0)}${normalized === "cash" ? "円" : "玉"}`;
    }

    function sourceUnavailableMessage(session, source, amount) {
      const balance = balanceForSource(session, source);
      const label = investmentSourceShortLabel(source);
      if (balance === null) return `${label}が未入力です。`;
      if (balance < amount) return `${label}がありません。値をタップして修正するか、他のソースを選んでください。`;
      return "";
    }

    function rateText(derived) {
      if (derived.rateUnavailableReason) return `-（${derived.rateUnavailableReason}）`;
      if (derived.rate === null) return "-";
      return `${derived.rate.toFixed(1)}${derived.isEstimatedRate ? "（概算）" : ""}`;
    }

    function payoutText(derived) {
      if (derived.actualPayoutTotal !== null && derived.actualPayoutTotal !== undefined) return `${numberText(derived.actualPayoutTotal, "-")}（実測）`;
      if (derived.hitBalls === null) return "-";
      return `${numberText(derived.hitBalls, "-")}${derived.isEstimatedPayout ? "（概算）" : ""}`;
    }

    function liveRunningRate(session, derived = null) {
      return runningPanelRate(session, derived);
    }

    function firstHitRecordedAt(session) {
      return (Array.isArray(session?.hits) ? session.hits : [])
        .map((hit) => hit?.at)
        .filter(Boolean)
        .sort()[0] || null;
    }

    function timeToMinutes(value) {
      const match = String(value || "").match(/^(\d{1,2}):(\d{2})/);
      if (!match) return null;
      const hour = Number(match[1]);
      const minute = Number(match[2]);
      return Number.isFinite(hour) && Number.isFinite(minute) ? hour * 60 + minute : null;
    }

    function isoTimeToMinutes(value) {
      const date = value ? new Date(value) : null;
      return date && !Number.isNaN(date.getTime()) ? date.getHours() * 60 + date.getMinutes() : null;
    }

    function investmentBeforeHit(item, session, hitSpin) {
      if (item?.phase === "yutime") return false;
      const hitTime = isoTimeToMinutes(firstHitRecordedAt(session));
      const itemTime = timeToMinutes(item?.time);
      if (hitTime !== null && itemTime !== null) return itemTime <= hitTime;
      const spinAt = normalizeNumber(item?.spinAt);
