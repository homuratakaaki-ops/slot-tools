<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>遊タイム実戦ツール v3</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f4ef;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #667085;
      --line: #d8d5ca;
      --accent: #236c68;
      --accent-dark: #174b48;
      --warn: #b45309;
      --danger: #b42318;
      --good: #1c7c54;
      --soft: #e8f3f1;
      --button: #f8fafc;
      --shadow: 0 10px 24px rgba(31, 41, 51, 0.08);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--button);
      color: var(--ink);
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active { transform: translateY(1px); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { background: var(--accent-dark); }
    button.danger { color: #fff; background: var(--danger); border-color: var(--danger); }
    button.ghost { background: transparent; }
    button.small { min-height: 36px; padding: 0 10px; }
    button.icon { width: 44px; padding: 0; display: inline-grid; place-items: center; }

    input, textarea, select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.5;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 14px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      background: rgba(245, 244, 239, 0.95);
      backdrop-filter: blur(10px);
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .store-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      white-space: nowrap;
      font-size: 14px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 6px 0 14px;
    }

    .tab {
      min-height: 42px;
      border-radius: 8px;
      background: #fff;
    }

    .tab.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .view { display: none; }
    .view.active { display: block; }

    .section {
      margin: 0 0 14px;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .section-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      margin-bottom: 12px;
    }

    .section h2, .section h3 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .section p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .store-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .store-card {
      min-height: 72px;
      padding: 12px;
      text-align: left;
      background: #fff;
    }

    .store-card strong { display: block; font-size: 16px; }
    .store-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }

    .field-row {
      display: grid;
      grid-template-columns: minmax(120px, 180px) 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .field-row label {
      font-weight: 700;
      font-size: 13px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .warn {
      color: var(--warn);
      font-weight: 700;
    }

    .danger-text {
      color: var(--danger);
      font-weight: 700;
    }

    .status-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 8px 0 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #eef2f6;
      color: #344054;
      font-size: 12px;
      white-space: nowrap;
    }

    .badge.warn { background: #fff7ed; color: #9a3412; }
    .badge.good { background: #ecfdf3; color: #067647; }
    .badge.dark { background: var(--ink); color: #fff; }

    .label-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 0;
    }

    .check-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 13px;
    }

    .check-chip input {
      width: auto;
      min-height: auto;
      padding: 0;
    }

    .filter-block {
      margin: 0 0 14px;
    }

    .filter-block + .filter-block {
      margin-top: 12px;
    }

    .island-builder {
      display: grid;
      gap: 12px;
    }

    .island-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .island-card-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .island-card-head strong {
      font-size: 15px;
    }

    .island-sides {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .island-side {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }

    .island-side h4 {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 13px;
    }

    .island-preview {
      display: grid;
      grid-template-columns: minmax(84px, 1fr) 34px minmax(84px, 1fr);
      gap: 12px;
      align-items: stretch;
      margin-top: 10px;
    }

    .preview-side {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .preview-machine {
      min-height: 44px;
      padding: 5px;
      font-weight: 800;
      background: #fff;
    }

    .preview-machine.excluded {
      color: #98a2b3;
      background: #eef2f6;
      text-decoration: line-through;
    }

    .map-wrap {
      overflow-x: auto;
      margin-top: 14px;
      padding-bottom: 8px;
    }

    .map-grid {
      display: grid;
      gap: 8px;
      align-items: start;
      min-width: 320px;
    }

    .map-row {
      display: grid;
      grid-template-columns: minmax(90px, 1fr) 34px minmax(90px, 1fr);
      gap: 12px;
      align-items: stretch;
    }

    .map-side {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .aisle {
      min-height: 48px;
      border-radius: 8px;
      background: repeating-linear-gradient(
        90deg,
        #e3e0d5,
        #e3e0d5 4px,
        #f3f0e7 4px,
        #f3f0e7 8px
      );
    }

    .machine-button {
      min-height: 58px;
      display: grid;
      grid-template-rows: auto auto;
      gap: 2px;
      padding: 7px 5px;
      background: #fff;
      text-align: center;
    }

    .machine-button .dai {
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
    }

    .machine-button .meta {
      display: flex;
      justify-content: center;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      min-height: 15px;
      white-space: nowrap;
    }

    .machine-button.has-data {
      border-color: #7aa7a3;
      background: var(--soft);
    }

    .running-panel {
      border-color: #7aa7a3;
      background: #f3fbfa;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }

    .metric {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      display: block;
      margin-top: 2px;
      font-size: 18px;
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .row-card {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .row-card-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
    }

    .row-card strong { font-size: 15px; }
    .row-card small { color: var(--muted); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: end;
      justify-content: center;
      padding: 12px;
      background: rgba(15, 23, 42, 0.42);
    }

    .modal-backdrop.open { display: flex; }

    .modal-backdrop.wizard-mode {
      align-items: flex-start;
      padding-top: max(8px, env(safe-area-inset-top));
    }

    .modal {
      width: min(680px, 100%);
      max-height: min(86vh, 760px);
      overflow: auto;
      padding: 16px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.22);
    }

    .modal-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 12px;
    }

    .modal h2 {
      margin: 0;
      font-size: 18px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .modal-actions.wizard-actions {
      grid-template-columns: 1fr;
    }

    .quick-invest {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .phase-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .carryover-banner {
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #e3b341;
      border-radius: 8px;
      background: #fff8dc;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .carryover-banner strong {
      display: block;
      margin-bottom: 2px;
    }

    .hidden { display: none !important; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 120;
      display: none;
      width: min(520px, calc(100% - 24px));
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
      transform: translateX(-50%);
      font-weight: 700;
      font-size: 14px;
      line-height: 1.4;
    }

    .toast.show { display: block; }
    .toast.error { background: var(--danger); }

    .footer-note {
      margin: 16px 0 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 720px) {
      .app { padding: 10px; }
      .topbar { grid-template-columns: 1fr; }
      .tabs { grid-template-columns: repeat(2, 1fr); }
      .two, .three { grid-template-columns: 1fr; }
      .field-row { grid-template-columns: 1fr; gap: 5px; }
      .section-head { grid-template-columns: 1fr; }
      .island-sides { grid-template-columns: 1fr; }
      .map-row { grid-template-columns: minmax(118px, 1fr) 28px minmax(118px, 1fr); gap: 10px; }
      .map-side { grid-template-columns: 1fr; }
      .modal-actions { grid-template-columns: 1fr; }
      .carryover-banner { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>遊タイム実戦ツール v3</h1>
        <p>店を選び、台を探し、実戦の時系列で追記する記録台帳</p>
      </div>
      <div class="store-pill" id="currentStorePill">店未選択</div>
    </header>

    <nav class="tabs" aria-label="画面切替">
      <button class="tab active" data-view="storesView">店</button>
      <button class="tab" data-view="mapView">マップ</button>
      <button class="tab" data-view="runView">稼働中</button>
      <button class="tab" data-view="ledgerView">台帳</button>
    </nav>

    <section class="view active" id="storesView">
      <div class="section">
        <div class="section-head">
          <div>
            <h2>店選択</h2>
            <p>v3専用データです。v2とはlocalStorageキーを共有しません。</p>
          </div>
          <button class="primary small" id="openStoreFormBtn">店を追加</button>
        </div>
        <div class="store-list" id="storeList"></div>
      </div>
    </section>

    <section class="view" id="mapView">
      <div class="section">
        <div class="section-head">
          <div>
            <h2>フロアマップ作成</h2>
            <p>島ごとに台番の範囲を入力します。存在しない台番はプレビューをタップして除外できます。</p>
          </div>
          <div class="status-line">
            <button class="small" id="addIslandBtn">島を追加</button>
            <button class="primary small" id="saveMapBtn">保存</button>
          </div>
        </div>
        <div id="islandBuilder" class="island-builder"></div>
        <div class="status-line" id="mapStatus"></div>
      </div>

      <div class="section">
        <div class="section-head">
          <div>
            <h2>台を探す</h2>
            <p>台番をタップすると過去概要を確認して、打ち始めに進めます。</p>
          </div>
          <button class="small" id="openLabelFormBtn">店イベントの登録</button>
        </div>
        <div id="labelFilters" class="label-checks"></div>
        <div id="carryoverBanner"></div>
        <div class="map-wrap">
          <div id="machineMap" class="map-grid"></div>
        </div>
      </div>
    </section>

    <section class="view" id="runView">
      <div id="runningArea"></div>
    </section>

    <section class="view" id="ledgerView">
      <div class="section">
        <div class="section-head">
          <div>
            <h2>セッション台帳</h2>
            <p>未入力ありの記録は、ここから後で補完できます。</p>
          </div>
          <button class="small" id="exportBtn">JSON書き出し</button>
        </div>
        <div class="metric-grid" id="ledgerSummary"></div>
        <div class="list" id="sessionList"></div>
      </div>
    </section>

    <p class="footer-note" id="storageNote"></p>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle"></h2>
          <p class="hint" id="modalHint"></p>
        </div>
        <button class="icon" id="closeModalBtn" aria-label="閉じる">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    "use strict";

    const STORAGE_PREFIX = "ytv3:";
    const STORAGE_KEY = STORAGE_PREFIX + "data";
    const PREMIGRATE_KEY = STORAGE_PREFIX + "premigrate";
    const BACKUP_KEY = STORAGE_PREFIX + "backup:latest";
    const CARRYOVER_KEY = STORAGE_PREFIX + "carryover";
    const CORRUPT_PREFIX = STORAGE_PREFIX + "corrupt:";
    const SCHEMA_VERSION = 6;
    const DEFAULT_LEND_RATE = 4;
    const DEFAULT_EXCHANGE_RATE = 4;
    const AUTO_LABELS = [
      "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日", "日曜日",
      "1のつく日", "2のつく日", "3のつく日", "4のつく日", "5のつく日",
      "6のつく日", "7のつく日", "8のつく日", "9のつく日", "0のつく日",
      "ゾロ目日"
    ];
    const MACHINE_PRESETS = [
      { id: "umi-sp5", name: "P大海物語スペシャル5", roundBalls: 140, standardRounds: 10, standardPayout: 1400, evSupported: true, spec: { note: "B5時点の期待値対応プリセット" } }
    ];

    const blankSession = () => ({
      id: cryptoId("s"),
      storeId: null,
      machineId: null,
      date: today(),
      status: "active",
      labels: [],
      carriedFromSessionId: null,
      startSpin: null,
      startTime: null,
      startMochidama: null,
      startSaipurei: null,
      startCredit: null,
      prevDayEndSpin: null,
      investments: [],
      hitSpin: null,
      hitRemainBalls: null,
      hitVia: null,
      yutimeEnterBalls: null,
      yutimeEnterTime: null,
      hitCount: null,
      totalRounds: null,
      endTotalBalls: null,
      endSpin: null,
      endTime: null,
      zanhoryuBalls: null,
      memo: "",
      createdAt: nowIso(),
      updatedAt: nowIso()
    });

    const defaultData = () => ({
      version: SCHEMA_VERSION,
      stores: [],
      layouts: {},
      machines: [],
      sessions: [],
      labelsByStore: {},
      activeStoreId: null,
      meta: {
        createdAt: nowIso(),
        updatedAt: nowIso(),
        lastSaveChars: 0,
        sampleSessionChars: 0,
        mapLayoutChars: 0,
        sampleMachineChars: 0,
        schemaBudgetNote: "v3 schema 6: 店レート/概算出玉/破損退避追加後のStore chars、セッションchars、carryover charsを記録"
      }
    });

    let bootToastMessage = "";
    let data = loadData();
    let carryover = loadCarryover();
    let currentView = "storesView";
    let selectedLabelFilters = new Set();
    let mapDraft = { storeId: null, islands: [] };
    let modalCancel = null;

    const els = {
      currentStorePill: byId("currentStorePill"),
      storeList: byId("storeList"),
      islandBuilder: byId("islandBuilder"),
      mapStatus: byId("mapStatus"),
      carryoverBanner: byId("carryoverBanner"),
      machineMap: byId("machineMap"),
      labelFilters: byId("labelFilters"),
      runningArea: byId("runningArea"),
      ledgerSummary: byId("ledgerSummary"),
      sessionList: byId("sessionList"),
      storageNote: byId("storageNote"),
      toast: byId("toast"),
      modalBackdrop: byId("modalBackdrop"),
      modalTitle: byId("modalTitle"),
      modalHint: byId("modalHint"),
      modalBody: byId("modalBody")
    };

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => showView(button.dataset.view));
    });

    byId("addIslandBtn").addEventListener("click", addIslandDraft);
    byId("openStoreFormBtn").addEventListener("click", openStoreForm);
    byId("saveMapBtn").addEventListener("click", saveCurrentMap);
    byId("openLabelFormBtn").addEventListener("click", openLabelForm);
    byId("exportBtn").addEventListener("click", exportJson);
    byId("closeModalBtn").addEventListener("click", closeModal);
    els.modalBackdrop.addEventListener("click", (event) => {
      if (event.target === els.modalBackdrop) closeModal();
    });

    renderAll();
    if (bootToastMessage) showToast(bootToastMessage);

    function byId(id) {
      return document.getElementById(id);
    }

    function nowIso() {
      return new Date().toISOString();
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function currentTime() {
      const d = new Date();
      return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }

    function cryptoId(prefix) {
      const raw = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
      return prefix + "_" + raw.replace(/-/g, "").slice(0, 16);
    }

    function showView(viewId) {
      currentView = viewId;
      document.querySelectorAll(".view").forEach((view) => view.classList.toggle("active", view.id === viewId));
      document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.view === viewId));
      renderAll();
    }

    function normalizeNumber(value) {
      if (value === "" || value === null || value === undefined) return null;
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function positiveNumberOrDefault(value, fallback) {
      const n = normalizeNumber(value);
      return n !== null && n > 0 ? n : fallback;
    }

    function numberText(value, fallback = "未入力") {
      return value === null || value === undefined || value === "" ? fallback : String(value);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function presetById(id) {
      return MACHINE_PRESETS.find((preset) => preset.id === id) || null;
    }

    function presetByName(name) {
      return MACHINE_PRESETS.find((preset) => preset.name === name) || null;
    }

    function normalizeMachinePresetId(machine) {
      if (presetById(machine?.presetId)) return machine.presetId;
      const matched = presetByName(machine?.modelName || "");
      return matched ? matched.id : "";
    }

    function showToast(message, type = "success") {
      clearTimeout(showToast.timer);
      els.toast.textContent = message;
      els.toast.classList.toggle("error", type === "error");
      els.toast.classList.add("show");
      showToast.timer = setTimeout(() => {
        els.toast.classList.remove("show", "error");
      }, 2200);
    }

    function persistWithToast(successMessage) {
      const ok = persist();
      if (ok) showToast(successMessage);
      else showToast("保存に失敗しました。容量を確認してください。", "error");
      return ok;
    }

    function automaticLabelsForDate(dateValue) {
      const parts = String(dateValue || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!parts) return [];
      const year = Number(parts[1]);
      const month = Number(parts[2]);
      const day = Number(parts[3]);
      const date = new Date(year, month - 1, day);
      if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return [];
      const weekdays = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];
      const labels = [weekdays[date.getDay()], `${day % 10}のつく日`];
      if (day === 11 || day === 22) labels.push("ゾロ目日");
      return labels;
    }

    function dateWithAutoLabels(dateValue) {
      const labels = automaticLabelsForDate(dateValue);
      return `${dateValue || "日付未入力"}${labels.length ? " / " + labels.join("・") : ""}`;
    }

    function loadData() {
      const base = defaultData();
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return base;
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return base;
        if (parsed.version !== SCHEMA_VERSION && !localStorage.getItem(PREMIGRATE_KEY)) {
          localStorage.setItem(PREMIGRATE_KEY, raw);
        }
        return normalizeData(parsed);
      } catch (error) {
        console.warn("ytv3 load failed", error);
        preserveCorruptData(raw);
        return base;
      }
    }

    function preserveCorruptData(raw) {
      if (!raw) return;
      try {
        localStorage.setItem(CORRUPT_PREFIX + new Date().toISOString(), raw);
        bootToastMessage = "保存データが読み取れなかったため退避しました";
      } catch (error) {
        console.warn("ytv3 corrupt preserve failed", error);
      }
    }

    function loadCarryover() {
      try {
        const parsed = JSON.parse(localStorage.getItem(CARRYOVER_KEY) || "null");
        if (!parsed || typeof parsed !== "object") return null;
        if (!parsed.storeId || !parsed.sourceSessionId || !parsed.date) return null;
        if (parsed.date !== today()) {
          localStorage.removeItem(CARRYOVER_KEY);
          return null;
        }
        return {
          storeId: parsed.storeId,
          sourceSessionId: parsed.sourceSessionId,
          sourceMachineId: parsed.sourceMachineId || null,
          sourceDaiNo: parsed.sourceDaiNo || "",
          date: parsed.date,
          mochidama: normalizeNumber(parsed.mochidama),
          credit: normalizeNumber(parsed.credit),
          saipurei: normalizeNumber(parsed.saipurei),
          createdAt: parsed.createdAt || nowIso()
        };
      } catch (error) {
        console.warn("ytv3 carryover load failed", error);
        return null;
      }
    }

    function saveCarryover(nextCarryover) {
      carryover = nextCarryover;
      if (!carryover) {
        localStorage.removeItem(CARRYOVER_KEY);
        renderAll();
        return true;
      }
      try {
        localStorage.setItem(CARRYOVER_KEY, JSON.stringify(carryover));
        renderAll();
        return true;
      } catch (error) {
        console.warn("ytv3 carryover save failed", error);
        showToast("引き継ぎの保存に失敗しました。容量を確認してください。", "error");
        return false;
      }
    }

    function normalizeData(source) {
      const base = defaultData();
      const next = {
        ...base,
        ...source,
        stores: Array.isArray(source.stores) ? source.stores : [],
        layouts: source.layouts && typeof source.layouts === "object" ? source.layouts : {},
        machines: Array.isArray(source.machines) ? source.machines : [],
        sessions: Array.isArray(source.sessions) ? source.sessions : [],
        labelsByStore: source.labelsByStore && typeof source.labelsByStore === "object" ? source.labelsByStore : {},
        meta: { ...base.meta, ...(source.meta || {}) }
      };
      next.version = SCHEMA_VERSION;
      next.stores = next.stores.map((store) => ({
        id: store.id || cryptoId("st"),
        name: String(store.name || "無名店"),
        isPersonal: Boolean(store.isPersonal),
        lendRate: positiveNumberOrDefault(store.lendRate, DEFAULT_LEND_RATE),
        exchangeRate: positiveNumberOrDefault(store.exchangeRate, DEFAULT_EXCHANGE_RATE),
        createdAt: store.createdAt || nowIso()
      }));
      next.layouts = normalizeLayouts(next.layouts);
      next.machines = next.machines.map((machine) => ({
        id: machine.id || cryptoId("m"),
        storeId: machine.storeId || null,
        daiNo: String(machine.daiNo || ""),
        modelName: machine.modelName || "",
        roundBalls: normalizeNumber(machine.roundBalls),
        memo: machine.memo || "",
        presetId: normalizeMachinePresetId(machine),
        evSupported: Boolean(presetById(normalizeMachinePresetId(machine))?.evSupported || machine.evSupported)
      })).filter((machine) => machine.storeId && machine.daiNo);
      next.sessions = next.sessions.map((session) => ({
        ...blankSession(),
        ...session,
        carriedFromSessionId: session.carriedFromSessionId || null,
        yutimeEnterTime: session.yutimeEnterTime || null,
        investments: Array.isArray(session.investments) ? session.investments.map((item) => ({
          type: item.type === "saipurei" ? "saipurei" : "cash",
          amount: normalizeNumber(item.amount),
          time: item.time || null,
          phase: item.phase === "yutime" ? "yutime" : "normal"
        })).filter((item) => item.amount !== null) : []
      }));
      if (!next.stores.some((store) => store.id === next.activeStoreId)) next.activeStoreId = next.stores[0]?.id || null;
      return next;
    }

    function persist() {
      data.meta.updatedAt = nowIso();
      data.meta.sampleSessionChars = measureSampleSessionChars();
      data.meta.sampleMachineChars = measureSampleMachineChars();
      data.meta.mapLayoutChars = measureActiveMapLayoutChars();
      data.meta.lastSaveChars = 0;
      const draftRaw = JSON.stringify(data);
      data.meta.lastSaveChars = draftRaw.length;
      const raw = JSON.stringify(data);
      data.meta.lastSaveChars = raw.length;
      const finalRaw = JSON.stringify(data);
      if (finalRaw.length < 12) {
        console.warn("ytv3 empty-write guard blocked save");
        return false;
      }
      try {
        const before = localStorage.getItem(STORAGE_KEY);
        if (before) localStorage.setItem(BACKUP_KEY, before);
        localStorage.setItem(STORAGE_KEY, finalRaw);
        return true;
      } catch (error) {
        console.warn("ytv3 persist failed", error);
        return false;
      }
    }

    function updateIslandDraftFromDom() {
      mapDraft.islands = readIslandDraftFromDom();

    function readIslandDraftFromDom() {
      return [...els.islandBuilder.querySelectorAll("[data-island-index]")].map((card) => {
        const index = Number(card.dataset.islandIndex);
        const left = readIslandSideFromDom(index, "left");
        const right = readIslandSideFromDom(index, "right");
        return {
          left,
          right: right.from === null && right.to === null ? null : right,
          excluded: (mapDraft.islands[index]?.excluded || []).map(String)
        };
      });
    }

    function readIslandSideFromDom(index, side) {
      const from = normalizeNumber(byId(`island_${index}_${side}_from`)?.value);
      const to = normalizeNumber(byId(`island_${index}_${side}_to`)?.value);
      return { from, to };
    }

    function normalizeLayouts(layouts) {
      const normalized = {};
      Object.entries(layouts || {}).forEach(([storeId, layout]) => {
        if (layout && Array.isArray(layout.islands)) {
          normalized[storeId] = {
            islands: cloneIslands(layout.islands),
            updatedAt: layout.updatedAt || nowIso(),
            errors: Array.isArray(layout.errors) ? layout.errors : []
          };
          return;
        }
        if (layout && typeof layout.source === "string") {
          const islands = textMapToIslands(layout.source);
          normalized[storeId] = { islands, updatedAt: layout.updatedAt || nowIso(), errors: [] };
          return;
        }
        normalized[storeId] = { islands: [], updatedAt: nowIso(), errors: [] };
      });
      return normalized;
    }

    function cloneIslands(islands) {
      return (Array.isArray(islands) ? islands : []).map((island) => normalizeIsland(island));
    }

    function normalizeIsland(island) {
      return {
        left: normalizeIslandSide(island?.left),
        right: island?.right ? normalizeIslandSide(island.right) : null,
        excluded: Array.isArray(island?.excluded) ? [...new Set(island.excluded.map(String))] : []
      };
    }

    function normalizeIslandSide(side) {
      return {
        from: normalizeNumber(side?.from),
        to: normalizeNumber(side?.to)
      };
    }

    function textMapToIslands(source) {
      const parsed = parseTextMapLayout(source);
      return parsed.rows.map((row) => {
        const left = daiNosToSide(row.sides[0]);
        const right = daiNosToSide(row.sides[1]);
        const leftExcluded = sideExcluded(row.sides[0], left);
        const rightExcluded = sideExcluded(row.sides[1], right);
        return {
          left,
          right: right.from === null || right.to === null ? null : right,
          excluded: [...leftExcluded, ...rightExcluded]
        };
      });
    }

    function daiNosToSide(daiNos) {
      if (!Array.isArray(daiNos) || !daiNos.length) return { from: null, to: null };
      return { from: normalizeNumber(daiNos[0]), to: normalizeNumber(daiNos[daiNos.length - 1]) };
    }

    function sideExcluded(existingDaiNos, side) {
      const wanted = new Set((existingDaiNos || []).map(String));
      return expandIslandSide(side).filter((daiNo) => !wanted.has(String(daiNo)));
    }

    function parseIslandLayout(layout) {
      const errors = [];
      const seen = new Set();
      const rows = cloneIslands(layout?.islands || []).map((island, index) => {
        const excluded = new Set((island.excluded || []).map(String));
        const allLeft = expandIslandSide(island.left);
        const allRight = island.right ? expandIslandSide(island.right) : [];
        const left = allLeft.filter((daiNo) => !excluded.has(String(daiNo)));
        const right = allRight.filter((daiNo) => !excluded.has(String(daiNo)));
        if (!allLeft.length) errors.push(`島${index + 1}: 左列の台番を入力してください`);
        [...left, ...right].forEach((daiNo) => {
          if (seen.has(daiNo)) errors.push(`島${index + 1}: 台番${daiNo}が重複しています`);
          seen.add(daiNo);
        });
        return { sides: [left, right], allSides: [allLeft, allRight] };
      }).filter((row) => row.allSides[0].length || row.allSides[1].length);
      return { rows, errors, daiNos: [...seen] };
    }

    function expandIslandSide(side) {
      const from = normalizeNumber(side?.from);
      const to = normalizeNumber(side?.to);
      if (from === null || to === null) return [];
      const step = from <= to ? 1 : -1;
      const values = [];
      for (let n = from; step > 0 ? n <= to : n >= to; n += step) values.push(String(n));
      return values;
    }

    function parseTextMapLayout(source) {
      const errors = [];
      const seen = new Set();
      const rows = [];
      String(source || "").split(/\r?\n/).forEach((line, index) => {
        const trimmed = line.trim();
        if (!trimmed) return;
        const sides = trimmed.split("|").slice(0, 2).map((side) => parseMapSide(side, index + 1, errors));
        while (sides.length < 2) sides.push([]);
        sides.flat().forEach((daiNo) => {
          if (seen.has(daiNo)) errors.push(`${index + 1}行目: 台番${daiNo}が重複しています`);
          seen.add(daiNo);
        });
        rows.push({ sides });
      });
      return { rows, errors, daiNos: [...seen] };
    }

    function parseMapSide(side, lineNo, errors) {
      const values = [];
      String(side || "").split(/[,\s]+/).filter(Boolean).forEach((token) => {
        const range = token.match(/^(\d+)-(\d+)$/);
        if (range) {
          const start = Number(range[1]);
          const end = Number(range[2]);
          if (!Number.isInteger(start) || !Number.isInteger(end)) {
            errors.push(`${lineNo}行目: ${token} は不正なレンジです`);
            return;
          }
          const step = start <= end ? 1 : -1;
          for (let n = start; step > 0 ? n <= end : n >= end; n += step) values.push(String(n));
          return;
        }
        if (/^\d+$/.test(token)) {
          values.push(token);
          return;
        }
        errors.push(`${lineNo}行目: ${token} は読み取れません`);
      });
      return values;
    }

    function mapStatusHtml(parsed) {

      } else {
        chips.push('<span class="badge">読み取りOK</span>');
      }
      return chips.join("");
    }

        {

          hint: `${dateWithAutoLabels(session.date)}で記録します。` + (session.prevDayEndSpin !== null ? ` 据え置きなら 前日${session.prevDayEndSpin} + 現在表示値 を別途確認してください。` : " 前日ヤメ回転数は未記録です。")
        },
        { key: "startTime", label: "時刻", type: "time", preset: currentTime(), hint: "現在時刻をプリセットしています。" },
        { key: "startMochidama", label: "持ち玉", type: "number", hint: activeCarryover ? "前の台から引き継いだ値です。必要なら修正できます。持ち玉なしで現金スタートなら 0 を入力してください。スキップすると回転率は算出されません。" : "持ち玉なしで現金スタートなら 0 を入力してください。スキップすると回転率は算出されません。" },
        { key: "startSaipurei", label: "再プレイ残り玉", type: "number", hint: activeCarryover ? "前の台から引き継いだ値です。未入力だった場合は空欄のままです。" : "" },
        { key: "startCredit", label: "カード残高（クレジット残金）", type: "number", hint: activeCarryover ? "前の台から引き継いだ値です。換金・休憩を挟んだ場合は修正してください。" : "" },
        { key: "labels", label: "店イベント", type: "labels", labels, hint: eventMemoHelp() }
      ], session, () => {
        data.sessions.push(session);
        if (!persistWithToast("稼働を開始しました")) return;
        if (activeCarryover) {
          carryover = null;
          localStorage.removeItem(CARRYOVER_KEY);
        }
        showView("runView");
      });
    }

    function openHitWizard(sessionId) {
      const session = findSession(sessionId);
      if (!session) return;
      runWizard("当選ウィザード", [
        { key: "hitSpin", label: "当選回転数", type: "number" },
        { key: "hitRemainBalls", label: "残り玉", type: "number", hint: activeStore()?.isPersonal ? "パーソナル店では確定回転率に使います。" : "非パーソナル店ではスキップ前提です。" }
      ], session, () => {
        if (!session.hitVia) session.hitVia = session.yutimeEnterBalls !== null ? "yutime" : "normal";
        session.updatedAt = nowIso();
        if (!persistWithToast("当選を記録しました")) return;
        renderAll();
        openRateSummary(session);
      });
    }

    function openEndWizard(sessionId) {
      const session = findSession(sessionId);
      if (!session) return;
      openModal("終了入力", "結果を選んでから、必要な項目だけ記録します。", `
        <div class="grid two">
          <button class="primary" id="endWithHitBtn">大当たりあり</button>
          <button id="endNoHitBtn">当たらず終了（遊タイム抜け含む）</button>
        </div>
      `);
      byId("endWithHitBtn").addEventListener("click", () => {
        closeModal();
        runEndWizard(session, true);
      });
      byId("endNoHitBtn").addEventListener("click", () => {
        session.hitCount = 0;
        session.totalRounds = 0;
        closeModal();
        runEndWizard(session, false);
      });
    }

    function runEndWizard(session, hasHit) {
      const steps = hasHit ? [
        { key: "hitCount", label: "大当たり回数", type: "number" },
        { key: "totalRounds", label: "合計R数", type: "number", hint: "1R玉数と合わせてR数ベース出玉を計算します。" },
        { key: "endTotalBalls", label: "時短抜け後の合計玉数", type: "number" },
        { key: "endSpin", label: "ヤメ回転数", type: "number" },
        { key: "zanhoryuBalls", label: "残保留増減", type: "number" },
        { key: "memo", label: "メモ", type: "textarea" }
      ] : [
        { key: "endTotalBalls", label: "終了時玉数", type: "number" },
        { key: "endSpin", label: "ヤメ回転数", type: "number" },
        { key: "zanhoryuBalls", label: "残保留増減", type: "number" },
        { key: "memo", label: "メモ", type: "textarea" }
      ];
      runWizard("終了ウィザード", steps, session, () => {
        session.status = "completed";
        if (!hasHit) session.hitCount = 0;
        session.endTime = session.endTime || currentTime();
        session.updatedAt = nowIso();
        if (!persistWithToast("記録を保存しました")) return;
        showView("mapView");
        openRateSummary(session);
      });
    }

    function runWizard(title, steps, target, done) {
      let index = 0;
      const draft = target;
      const renderStep = () => {
        const step = steps[index];
        openModal(title, `${index + 1} / ${steps.length}: ${step.label}。未入力でスキップできます。`, wizardInputHtml(step, draft[step.key]) + `
          <div class="modal-actions wizard-actions">
            <button class="primary" id="nextStepBtn">${index === steps.length - 1 ? "完了" : "次へ"}</button>
            <button id="skipStepBtn">スキップ</button>
            <button id="backStepBtn" ${index === 0 ? "disabled" : ""}>戻る</button>
          </div>
        `, "wizard");
        const input = byId("wizardValue");
        if (input && step.preset && !input.value) input.value = step.preset;
        if (input) {
          input.addEventListener("keydown", (event) => {
            if (event.key !== "Enter") return;
            if (step.type === "textarea" && !event.ctrlKey && !event.metaKey) return;
            event.preventDefault();
            byId("nextStepBtn").click();
          });
        }
        byId("skipStepBtn").addEventListener("click", () => {
          draft[step.key] = step.type === "labels" ? [] : null;
          advance();
        });
        byId("backStepBtn").addEventListener("click", () => {
          if (index > 0) {
            draft[step.key] = readWizardValue(step);
            index -= 1;
            renderStep();
          }
        });
        byId("nextStepBtn").addEventListener("click", () => {
          draft[step.key] = readWizardValue(step);
          advance();
        });
      };
      const advance = () => {
        if (index >= steps.length - 1) {
          closeModal();
          done();
        } else {
          index += 1;
          renderStep();
        }
      };
      modalCancel = () => renderAll();
      renderStep();
    }

    function wizardInputHtml(step, value) {
      if (step.type === "textarea") {
        return `<textarea id="wizardValue">${escapeHtml(value || "")}</textarea>${step.hint ? `<p class="hint">${escapeHtml(step.hint)}</p>` : ""}`;
      }
      if (step.type === "labels") {
        const chosen = new Set(Array.isArray(value) ? value : []);
        return `${step.hint ? `<p class="hint">${escapeHtml(step.hint)}</p>` : ""}<div class="label-checks">${(step.labels || []).map((label) => `
          <label class="check-chip"><input class="wizardLabel" type="checkbox" value="${escapeHtml(label)}" ${chosen.has(label) ? "checked" : ""}> ${escapeHtml(label)}</label>
        `).join("") || '<span class="hint">イベントメモ未登録です。</span>'}</div>`;
      }
      const inputType = step.type === "time" ? "time" : "text";
      const inputMode = step.type === "number" ? ' inputmode="numeric"' : "";
      const displayValue = value ?? step.preset ?? "";
      return `<input id="wizardValue" type="${inputType}"${inputMode} value="${escapeHtml(displayValue)}">${step.hint ? `<p class="hint">${escapeHtml(step.hint)}</p>` : ""}`;
    }

    function readWizardValue(step) {
      if (step.type === "labels") return [...document.querySelectorAll(".wizardLabel:checked")].map((input) => input.value);
      const input = byId("wizardValue");
      if (!input) return null;
      if (step.type === "number") return normalizeNumber(input.value);
      const value = input.value.trim();
      return value ? value : null;
    }

    function isYutimeInvestmentPhase(session) {
      return Boolean(session.yutimeEnterTime || session.yutimeEnterBalls !== null);
    }

    function currentInvestmentPhase(session) {
      return isYutimeInvestmentPhase(session) ? "yutime" : "normal";
    }

    function investmentPhaseLabel(item) {
      return item.phase === "yutime" ? "遊タイム中" : "通常時";
    }

    function balanceText(value, unit) {
      return value === null ? "未入力" : `${numberText(value, 0)} ${unit}`;
    }

    function rateText(derived) {
      if (derived.rateUnavailableReason) return `-（${derived.rateUnavailableReason}）`;
      if (derived.rate === null) return "-";
      return `${derived.rate.toFixed(1)}${derived.isEstimatedRate ? "（概算）" : ""}`;
    }

    function payoutText(derived) {
      if (derived.hitBalls === null) return "-";
      return `${numberText(derived.hitBalls, "-")}${derived.isEstimatedPayout ? "（概算）" : ""}`;
    }

    function deriveBalances(session) {
      const cashTotal = session.investments.filter((item) => item.type === "cash").reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const replayTotal = session.investments.filter((item) => item.type === "saipurei").reduce((sum, item) => sum + Number(item.amount || 0), 0);
      return {
        credit: session.startCredit === null ? null : Number(session.startCredit || 0) - cashTotal,
        saipurei: session.startSaipurei === null ? null : Number(session.startSaipurei || 0) - replayTotal
      };
    }

    function finalMochidamaForCarryover(session) {
      if (session.endTotalBalls === null || session.endTotalBalls === undefined) return null;
      return Number(session.endTotalBalls || 0) + Number(session.zanhoryuBalls || 0);
    }

    function createCarryoverFromSession(session) {
      const machine = data.machines.find((item) => item.id === session.machineId);
      const balances = deriveBalances(session);
      return {
        storeId: session.storeId,
        sourceSessionId: session.id,
        sourceMachineId: session.machineId,
        sourceDaiNo: machine?.daiNo || "",
        date: session.date,
        mochidama: finalMochidamaForCarryover(session),
        credit: balances.credit,
        saipurei: balances.saipurei,
        createdAt: nowIso()
      };
    }

    function startCarryover(session) {
      const nextCarryover = createCarryoverFromSession(session);
      if (!saveCarryover(nextCarryover)) return;
      closeModal();
      showView("mapView");
      showToast("持ち玉を引き継ぎ待機にしました");
    }

    function addInvestment(session, type, amount, time = currentTime()) {
      if (amount === null) return;
      const item = { type, amount, time, phase: currentInvestmentPhase(session) };
      session.investments.push(item);
      session.updatedAt = nowIso();
      const balls = Math.round(investmentToBalls(item, storeById(session.storeId)));
      const balances = deriveBalances(session);
      const negative = (type === "cash" && balances.credit !== null && balances.credit < 0) || (type === "saipurei" && balances.saipurei !== null && balances.saipurei < 0);
      const message = negative ? `投資を追記しました（+${balls}玉）。残高がマイナスです` : `投資を追記しました（+${balls}玉）`;
      if (!persist()) {
        showToast("保存に失敗しました。容量を確認してください。", "error");
        return;
      }
      showToast(message, negative ? "error" : "success");
      renderAll();
    }

    function deleteInvestment(session, index) {
      if (!Number.isInteger(index) || !session.investments[index]) return;
      session.investments.splice(index, 1);
      session.updatedAt = nowIso();
      if (!persistWithToast("投資履歴を削除しました")) return;
      renderAll();
    }

    function openInvestmentForm(type) {
      const session = activeSession();
      if (!session) return;
      openModal(type === "cash" ? "現金投資" : "再プレイ", "入力すると即時に投資履歴へ追記します。", `
        <div class="field-row"><label for="investmentAmount">${type === "cash" ? "金額" : "玉数"}</label><input id="investmentAmount" inputmode="numeric"></div>

        </div>

      byId("saveInvestmentBtn").addEventListener("click", () => {

          <div class="metric"><span>獲得出玉</span><strong>${payoutText(derived)}</strong></div>

      openModal("記録の修正", "スキップした項目もここで修正できます。", `
        <div class="grid two">
          ${fieldHtml("date", "日付", session.date, "date")}
          ${fieldHtml("startTime", "開始時刻", session.startTime, "time")}
          ${fieldHtml("startSpin", "開始回転数", session.startSpin)}
          ${fieldHtml("startMochidama", "開始持ち玉", session.startMochidama)}
          ${fieldHtml("startSaipurei", "再プレイ残り", session.startSaipurei)}
          ${fieldHtml("startCredit", "カード残高（クレジット残金）", session.startCredit)}
          ${fieldHtml("prevDayEndSpin", "前日ヤメ", session.prevDayEndSpin)}
          ${fieldHtml("hitSpin", "当選回転数", session.hitSpin)}
          ${fieldHtml("hitRemainBalls", "当選時残り玉", session.hitRemainBalls)}
          ${fieldHtml("yutimeEnterBalls", "遊タイム突入玉", session.yutimeEnterBalls)}
          ${fieldHtml("yutimeEnterTime", "遊タイム突入時刻", session.yutimeEnterTime, "time")}
          ${fieldHtml("hitCount", "大当たり回数", session.hitCount)}
          ${fieldHtml("totalRounds", "合計R数", session.totalRounds)}
          ${fieldHtml("endTotalBalls", "終了合計玉", session.endTotalBalls)}
          ${fieldHtml("endSpin", "ヤメ回転数", session.endSpin)}
          ${fieldHtml("endTime", "終了時刻", session.endTime, "time")}
          ${fieldHtml("zanhoryuBalls", "残保留増減", session.zanhoryuBalls)}
        </div>
        <div class="field-row"><label for="editHitVia">当選経路</label><select id="editHitVia"><option value="">未入力</option><option value="normal">通常</option><option value="yutime">遊タイム</option></select></div>
        <div class="field-row"><label>イベントメモ</label><div><p class="hint">${eventMemoHelp()}</p><div class="label-checks">${labels.map((label) => `<label class="check-chip"><input class="editLabel" type="checkbox" value="${escapeHtml(label)}" ${session.labels.includes(label) ? "checked" : ""}> ${escapeHtml(label)}</label>`).join("") || '<span class="hint">イベントメモ未登録</span>'}</div></div></div>
        <div class="field-row"><label for="editMemo">メモ</label><textarea id="editMemo">${escapeHtml(session.memo || "")}</textarea></div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
          <button id="markCompletedBtn">確定扱い</button>
          <button class="primary" id="saveSessionEditBtn">保存</button>
        </div>
      `);
      byId("editHitVia").value = session.hitVia || "";
      byId("markCompletedBtn").addEventListener("click", () => {
        session.status = "completed";
        byId("saveSessionEditBtn").click();
      });
      byId("saveSessionEditBtn").addEventListener("click", () => {
        ["date", "startTime", "endTime", "yutimeEnterTime"].forEach((key) => {
          const value = byId("edit_" + key).value.trim();
          session[key] = value || null;
        });
        ["startSpin", "startMochidama", "startSaipurei", "startCredit", "prevDayEndSpin", "hitSpin", "hitRemainBalls", "yutimeEnterBalls", "hitCount", "totalRounds", "endTotalBalls", "endSpin", "zanhoryuBalls"].forEach((key) => {
          session[key] = normalizeNumber(byId("edit_" + key).value);
        });
        session.hitVia = byId("editHitVia").value || null;
        session.labels = [...document.querySelectorAll(".editLabel:checked")].map((input) => input.value);
        session.memo = byId("editMemo").value.trim();
        session.updatedAt = nowIso();
        if (!persistWithToast("編集を保存しました")) return;
        closeModal();

    function fieldHtml(key, label, value, type = "text") {
      const inputMode = type === "text" ? ' inputmode="numeric"' : "";
      return `<div class="field-row"><label for="edit_${key}">${label}</label><input id="edit_${key}" type="${type}"${inputMode} value="${escapeHtml(value ?? "")}"></div>`;
    }

    function openModal(title, hint, html, mode = "") {
      els.modalTitle.textContent = title;
      els.modalHint.textContent = hint || "";
      els.modalBody.innerHTML = html;
      els.modalBackdrop.classList.toggle("wizard-mode", mode === "wizard");
      els.modalBackdrop.classList.add("open");
      els.modalBody.querySelectorAll("[data-close]").forEach((button) => button.addEventListener("click", closeModal));
    }

    function closeModal() {
      els.modalBackdrop.classList.remove("open");
      els.modalBackdrop.classList.remove("wizard-mode");
      els.modalBody.innerHTML = "";
      if (modalCancel) {
        const cancel = modalCancel;
        modalCancel = null;
        cancel();
      }
    }

    function findSession(sessionId) {
      return data.sessions.find((session) => session.id === sessionId) || null;
    }

    function activeSession() {
      const store = activeStore();
      if (!store) return null;
      return data.sessions.find((session) => session.storeId === store.id && session.status === "active") || null;
    }

    function investmentToBalls(item, store = activeStore()) {
      if (item.type === "cash") return Number(item.amount || 0) / lendRateForStore(store);
      return Number(item.amount || 0);
    }

    function deriveSession(session, machine = null) {
      const store = storeById(session.storeId);
      const normalInvestedBalls = session.investments.filter((item) => item.phase !== "yutime").reduce((sum, item) => sum + investmentToBalls(item, store), 0);
      const yutimeInvestedBalls = session.investments.filter((item) => item.phase === "yutime").reduce((sum, item) => sum + investmentToBalls(item, store), 0);
      const investedBalls = Math.round(normalInvestedBalls + yutimeInvestedBalls);
      const hasStartMochidama = session.startMochidama !== null && session.startMochidama !== undefined;
      const startingBalls = Number(session.startMochidama || 0);
      const totalInputBalls = startingBalls + investedBalls;
      const normalInputBalls = startingBalls + normalInvestedBalls;
      const normalSpins = session.hitSpin !== null && session.startSpin !== null ? session.hitSpin - session.startSpin : null;
      const preset = machine ? presetById(normalizeMachinePresetId(machine)) : null;
      const roundBasedPayout = machine?.roundBalls !== null && machine?.roundBalls !== undefined && session.totalRounds !== null && session.totalRounds !== undefined ? machine.roundBalls * session.totalRounds : null;
      const standardPayout = preset?.standardPayout && session.hitCount > 0 ? preset.standardPayout * session.hitCount : null;
      const estimatedPayout = roundBasedPayout !== null ? roundBasedPayout : standardPayout;
      const estimatedRemainBalls = session.hitRemainBalls === null && estimatedPayout !== null && session.endTotalBalls !== null ? Math.max(0, session.endTotalBalls - estimatedPayout) : null;
      const normalEndBalls = session.yutimeEnterBalls !== null ? session.yutimeEnterBalls : (session.hitRemainBalls !== null ? session.hitRemainBalls : estimatedRemainBalls);
      const consumedBalls = normalSpins !== null && normalEndBalls !== null ? Math.max(0, normalInputBalls - Number(normalEndBalls || 0)) : null;
      const fallbackConsumed = normalSpins !== null ? Math.max(0, normalInputBalls) : null;
      const rateBase = hasStartMochidama ? (normalEndBalls !== null ? consumedBalls : fallbackConsumed) : null;
      const rate = normalSpins !== null && rateBase > 0 ? normalSpins / rateBase * 250 : null;
      const rateUnavailableReason = !hasStartMochidama ? "持ち玉未入力" : "";
      const pointBalls = session.hitRemainBalls !== null ? session.hitRemainBalls : (estimatedRemainBalls !== null ? estimatedRemainBalls : totalInputBalls);
      const rawHitBalls = session.endTotalBalls !== null && session.hitCount > 0 && pointBalls !== null ? session.endTotalBalls - pointBalls : null;
      const hitBalls = session.hitRemainBalls === null && estimatedPayout !== null ? estimatedPayout : rawHitBalls;
      const averageRoundPayout = roundBasedPayout !== null && session.hitCount > 0 ? Math.round(roundBasedPayout / session.hitCount) : null;
      const yutimeEndBalls = session.hitRemainBalls !== null ? session.hitRemainBalls : session.endTotalBalls;
      const yutimeLoss = session.hitVia === "yutime" && session.yutimeEnterBalls !== null && yutimeEndBalls !== null ? session.yutimeEnterBalls + yutimeInvestedBalls - yutimeEndBalls : null;
      const diffBalls = session.endTotalBalls !== null ? session.endTotalBalls - totalInputBalls + Number(session.zanhoryuBalls || 0) : null;
      const exchangeRate = exchangeRateForStore(store);
      const profitYen = diffBalls !== null ? Math.round(diffBalls * exchangeRate) : null;
      const isEstimatedPayout = session.hitRemainBalls === null && estimatedPayout !== null;
      const isEstimatedRate = isEstimatedPayout && rate !== null && (session.yutimeEnterBalls === null || session.yutimeEnterBalls === undefined);
      return {
        investedBalls,
        normalInvestedBalls: Math.round(normalInvestedBalls),
        yutimeInvestedBalls: Math.round(yutimeInvestedBalls),
        totalInputBalls,
        normalSpins,
        consumedBalls: rateBase,
        rate,
        rateUnavailableReason,
        isEstimatedRate,
        hitBalls,
        estimatedRemainBalls,
        isEstimatedPayout,
        roundBasedPayout,
        averageRoundPayout,
        yutimeLoss: yutimeLoss !== null ? Math.round(yutimeLoss) : null,
        diffBalls,
        profitYen,
        exchangeRate
      };
    }

    function machineStats(machineId) {
      const sessions = filteredSessions().filter((session) => session.machineId === machineId);
      return aggregateStats(sessions);
    }

    function aggregateStats(sessions) {
      let spins = 0;
      let consumed = 0;
      let estimatedCount = 0;
      sessions.forEach((session) => {
        const machine = data.machines.find((item) => item.id === session.machineId) || null;
        const derived = deriveSession(session, machine);
        if (derived.normalSpins !== null && derived.normalSpins > 0 && derived.consumedBalls > 0) {
          spins += derived.normalSpins;
          consumed += derived.consumedBalls;
          if (derived.isEstimatedRate || derived.isEstimatedPayout) estimatedCount += 1;
        }
      });
      return { spins, consumed: Math.round(consumed), rate: consumed > 0 ? spins / consumed * 250 : null, estimatedCount };
    }

    function filteredSessions() {
      const store = activeStore();
      if (!store) return [];
      const sessions = data.sessions.filter((session) => session.storeId === store.id && session.status === "completed");
      if (!selectedLabelFilters.size) return sessions;
      return sessions.filter((session) => {
        const labels = [...automaticLabelsForDate(session.date), ...(session.labels || [])];
        return labels.some((label) => selectedLabelFilters.has(label));
      });
    }

    function latestEndSpin(machineId) {
      const candidates = data.sessions
        .filter((session) => session.machineId === machineId && session.endSpin !== null)
        .sort((a, b) => String(b.date + b.updatedAt).localeCompare(String(a.date + a.updatedAt)));
      return candidates[0]?.endSpin ?? null;
    }

    function missingFields(session) {
      const keys = ["startSpin", "startTime", "startMochidama", "startSaipurei", "startCredit", "hitCount", "endTotalBalls", "endSpin", "endTime"];
      if (session.hitCount !== 0) keys.splice(5, 0, "hitSpin", "hitRemainBalls", "hitVia");
      return keys.filter((key) => session[key] === null || session[key] === undefined || session[key] === "");
    }

    function exportJson() {
      const raw = JSON.stringify(data, null, 2);
      const blob = new Blob([raw], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "yutime-v3-export-" + today() + ".json";
      a.click();
      URL.revokeObjectURL(url);
    }
  })();
  </script>
