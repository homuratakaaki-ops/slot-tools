      if (spinAt !== null) return spinAt <= hitSpin;
      return true;
    }

    function normalRateInvestments(session) {
      const investments = Array.isArray(session?.investments) ? session.investments : [];
      const hitSpin = normalizeNumber(session?.hitSpin);
      if (hitSpin === null) return investments.filter((item) => item.phase !== "yutime");
      return investments.filter((item) => investmentBeforeHit(item, session, hitSpin));
    }

    // S4/A-1: 通常時の回転数は区間モデルの合算で出す。当選時点で止まっていた旧実装
    // （hitSpin - startSpin で固定）では、時短抜け後に回した分が加算されなかった。
    function runningSessionDerived(session, derived = null) {
      if (derived) return derived;
      const machine = data.machines.find((item) => item.id === session?.machineId) || null;
      return deriveSession(session, machine);
    }

    function runningNormalSpinCount(session, derived = null) {
      const spins = runningSessionDerived(session, derived).normalSpins;
      return spins !== null && spins !== undefined && spins >= 0 ? spins : null;
    }

    function runningPanelRate(session, derived = null) {
      const stats = runningSessionDerived(session, derived);
      const inputBalls = runningNormalInputBalls(session, stats);
      const spins = runningNormalSpinCount(session, stats);
      return inputBalls > 0 && spins !== null && spins >= 0 ? spins / inputBalls * 250 : null;
    }

    function runningYutimeRemaining(session, machine) {
      if (!session || !machine || isYutimeInvestmentPhase(session) || session.hitSpin !== null) return null;
      const preset = presetById(normalizeMachinePresetId(machine));
      if (!preset?.evSupported || !preset.spec?.tenjo) return null;
      const current = normalizeNumber(session.currentSpin ?? session.startSpin);
      if (current === null) return null;
      const previous = runningPreviousSpin(session);
      const effective = current + previous;
      const remaining = remainingSpinsFromCounterSpin(effective, preset.id);
      if (remaining === null) return null;
      return {
        remaining,
        near: remaining < 100,
        text: `遊タイム残り ${remaining.toLocaleString("ja-JP")}回転`
      };
    }

    function clampTrialRate(value) {
      const number = normalizeNumber(value);
      if (number === null) return null;
      return Math.min(50, Math.max(1, Number(number.toFixed(1))));
    }

    function runningPreviousSpin(session) {
      return Number(session?.hitCount || 0) > 0 ? 0 : (normalizeNumber(session?.prevDayEndSpin) || 0);
    }

    function initialRunningTrialRate(session, liveRate) {
      const startEv = normalizeStartEv(session?.startEv);
      return clampTrialRate(startEv?.usedRate ?? liveRate);
    }

    function runningTrialRateFor(session, liveRate) {
      if (!session) return null;
      if (runningTrialSessionId !== session.id) {
        runningTrialSessionId = session.id;
        runningTrialRate = initialRunningTrialRate(session, liveRate);
      } else if (runningTrialRate === null) {
        runningTrialRate = initialRunningTrialRate(session, liveRate);
      }
      return runningTrialRate;
    }

    function resetRunningTrialState() {
      runningTrialSessionId = null;
      runningTrialRate = null;
      runningEvaluationOpen = false;
      runningNailOpen = false;
    }

    function adjustRunningTrialRate(delta) {
      const session = activeSession();
      const current = runningTrialRateFor(session, runningPanelRate(session));
      if (current === null) return;
      runningTrialRate = clampTrialRate(current + Number(delta || 0));
      updateRunningTrialCard(session);
    }

    function trialExpectationLine(label, expectation, detail) {
      if (!expectation?.result) return `<p class="hint warn">${escapeHtml(label)}: ${escapeHtml(expectation?.reason || "試算できません")}</p>`;
      return `<p class="hint"><strong>${escapeHtml(label)}</strong> ${escapeHtml(yenText(expectation.result.evYen))}（${escapeHtml(detail)}）</p>`;
    }

    function runningTrialCalculations(session, machine, trialRate, balances) {
      if (!machine) return "";
      const currentSpin = normalizeNumber(session.currentSpin);
      const currentAvailableBalls = Math.max(0, Number(balances?.mochidama || 0));
      const currentExpectation = calculateMachineExpectation(machine, {
        currentSpin,
        previousSpin: runningPreviousSpin(session),
        manualRate: trialRate,
        availableBalls: currentAvailableBalls
      });
      const startEv = normalizeStartEv(session.startEv);
      const startExpectation = startEv ? calculateMachineExpectation(machine, {
        currentSpin: startEv.effectiveSpin,
        manualRate: trialRate,
        availableBalls: startEv.availableBalls
      }) : null;
      return { currentExpectation, startExpectation };
    }

    function runningTrialLinesHtml(session, machine, trialRate, balances) {
      const calculations = runningTrialCalculations(session, machine, trialRate, balances);
      if (!calculations) return { currentLine: "", startLine: "" };
      const currentLine = trialExpectationLine("今から打つ場合", calculations.currentExpectation, `残り${calculations.currentExpectation.result ? calculations.currentExpectation.result.spinsToTenjo.toLocaleString("ja-JP") : "-"}回転`);
      const startLine = calculations.startExpectation
        ? trialExpectationLine("打ち始めから", calculations.startExpectation, `残り${calculations.startExpectation.result ? calculations.startExpectation.result.spinsToTenjo.toLocaleString("ja-JP") : "-"}回転`)
        : "";
      return { currentLine, startLine };
    }

    function updateRunningTrialCard(session) {
      const machine = data.machines.find(item => item.id === session?.machineId);
      const trialRate = runningTrialRateFor(session, runningPanelRate(session));
      if (!machine || trialRate === null) return;
      const lines = runningTrialLinesHtml(session, machine, trialRate, deriveBalances(session));
      const rateValue = byId("runningTrialRateValue");
      const currentLine = byId("runningTrialCurrentLine");
      const startLine = byId("runningTrialStartLine");
      if (rateValue) rateValue.textContent = `${trialRate.toFixed(1)} /250玉`;
      if (currentLine) currentLine.innerHTML = lines.currentLine;
      if (startLine) startLine.innerHTML = lines.startLine;
    }

    function runningTrialExpectationHtml(session, machine, trialRate, balances) {
      if (!machine) return "";
      if (trialRate === null) {
        return '<p class="hint warn">打ち始めの回転率が記録されていません</p>';
      }
      const lines = runningTrialLinesHtml(session, machine, trialRate, balances);
      return `
        <div class="row-card">
          <strong>回転率を変えて試算</strong>
          <div class="trial-rate-controls">
            <button type="button" data-trial-rate-delta="-1">-1</button>
            <button type="button" data-trial-rate-delta="-0.5">-0.5</button>
            <div class="trial-rate-value" id="runningTrialRateValue">${trialRate.toFixed(1)} /250玉</div>
            <button type="button" data-trial-rate-delta="0.5">+0.5</button>
            <button type="button" data-trial-rate-delta="1">+1</button>
          </div>
          <div id="runningTrialCurrentLine">${lines.currentLine}</div>
          <div id="runningTrialStartLine">${lines.startLine}</div>
        </div>
      `;
    }

    function runningExpectationHtml(session, machine, liveRate, balances) {
      const startText = startEvDetailText(session.startEv);
      const nailSummary = machine ? nailRatingSummary(machine) : "";
      const trialRate = runningTrialRateFor(session, liveRate);
      let liveHtml = '<p class="hint warn">回転率のサンプルが足りません</p>';
      if (liveRate !== null && machine) {
        const currentSpin = normalizeNumber(session.currentSpin);
        const availableBalls = Math.max(0, Number(balances?.mochidama || 0));
        const expectation = calculateMachineExpectation(machine, {
          currentSpin,
          previousSpin: runningPreviousSpin(session),
          manualRate: liveRate,
          availableBalls
        });
        if (expectation.result) {
          const judgment = evJudgment(expectation.result);
          liveHtml = `
            <div class="metric-grid">
              <div class="metric"><span>再判定</span><strong>${escapeHtml(judgment.label)}</strong></div>
              <div class="metric"><span>期待値</span><strong>${escapeHtml(yenText(expectation.result.evYen))}</strong></div>
              <div class="metric"><span>残り回転数</span><strong>${expectation.result.spinsToTenjo.toLocaleString("ja-JP")}</strong></div>
              <div class="metric"><span>時給</span><strong>${escapeHtml(yenText(expectation.result.hourlyYen))}</strong></div>
            </div>
            <p class="hint">現在${numberText(currentSpin, "-")}回転 / 実測${liveRate.toFixed(1)} /250玉 / 参考1R出玉 ${escapeHtml(netBallsUsedText(expectation.netBallsInfo))} / 持ち玉${Math.round(availableBalls).toLocaleString("ja-JP")}玉を使う前提</p>
          `;
        } else {
          liveHtml = `<p class="hint warn">${escapeHtml(expectation.reason || "再判定できません")}</p>`;
        }
      }
      return `
        <details class="running-evaluation" id="runningEvaluationSection"${runningEvaluationOpen ? " open" : ""}>
          <summary>期待値</summary>
          <div class="row-card">
            <strong>打ち始めの想定期待値</strong><br>
            <small>${escapeHtml(startText)}</small>
          </div>
          <div class="row-card">
            <strong>現在の実測回転率で再判定</strong>
            ${liveHtml}
          </div>
          ${runningTrialExpectationHtml(session, machine, trialRate, balances)}
        </details>
        ${machine ? `
          <details class="running-nail-collapse" id="runningNailSection"${runningNailOpen ? " open" : ""}>
            <summary>釘・ネカセ <small>${nailSummary ? `釘: ${escapeHtml(nailSummary)}` : "未評価"}</small></summary>
            ${nailRatingSectionHtml(machine, { showHeader: false })}
          </details>
        ` : ""}
      `;
    }

    function consumedBallsRateText(normalSpins, balls) {
      return normalSpins !== null && balls > 0 ? `${(normalSpins / balls * 250).toFixed(1)}` : "-";
    }

    function consumedBallsChoiceHtml(session, derived) {
      const info = derived?.consumedBallsCandidates;
      if (!info?.divergent) return "";
      const selected = normalizeConsumedBallsSource(session?.consumedBallsSource);
      const buttons = ["tray", "taps"].map((source) => {
        const value = info[source];
        if (value === null || value === undefined) return "";
        const label = CONSUMED_BALLS_SOURCE_LABELS[source];
        const rate = consumedBallsRateText(derived.normalSpins, value);
        return `<button type="button" class="check-chip${selected === source ? " selected" : ""}" data-consumed-source="${source}" aria-pressed="${selected === source ? "true" : "false"}">${label} ${numberText(value, "-")}玉（回転率 ${rate}）</button>`;
      }).join("");
      return `
        <div class="consumed-choice">
          <p><strong>⚠ 2つの値が食い違っています</strong></p>
          <div class="consumed-choice-options">${buttons}</div>
          <p class="hint">通常消費玉としてどちらを使いますか。未選択時は台上差を優先します。</p>
        </div>
      `;
    }

    function setConsumedBallsSource(session, source, onSaved = renderAll) {
      session.consumedBallsSource = normalizeConsumedBallsSource(source);
      session.updatedAt = nowIso();
      if (!persistWithToast("通常消費玉の採用値を更新しました")) return;
      onSaved();
    }

    function bindConsumedBallsChoice(root, session, onSaved = renderAll) {
      root.querySelectorAll("[data-consumed-source]").forEach((button) => {
        button.addEventListener("click", () => setConsumedBallsSource(session, button.dataset.consumedSource, onSaved));
      });
    }

    function runningPanelInputBalls(session, derived = null) {
      const stats = derived || deriveSession(session);
      return usesTapInvestmentMode(session) ? stats.investedBalls : Math.round(stats.totalInputBalls || stats.investedBalls || 0);
    }

    // S4/A-1: 消費玉も区間モデルの合算（deriveSession の rateBase）を使う。
    // 区間から出せないセッションだけ、従来の投入合計にフォールバックする。
    function runningNormalInputBalls(session, derived = null) {
      const segmentBalls = runningSessionDerived(session, derived).consumedBalls;
      if (segmentBalls !== null && segmentBalls !== undefined && segmentBalls > 0) return Math.round(segmentBalls);
      const store = storeById(session.storeId);
      const investedBalls = normalRateInvestments(session).reduce((sum, item) => sum + investmentToBalls(item, store), 0);
      const tapMode = usesTapInvestmentMode(session);
      const hasHit = Number(session?.hitCount || 0) > 0;
      const inputBalls = tapMode ? tapModeNormalConsumedBalls(session, investedBalls, hasHit, store) : Number(session.startMochidama || 0) + investedBalls;
      return inputBalls > 0 ? Math.round(inputBalls) : null;
    }

    function runningSpinCount(session, derived = null) {
      return runningNormalSpinCount(session, derived);
    }

    function investmentSnapshot(session, investmentIndex) {
      const item = session.investments[investmentIndex];
      if (!item || item.adjustment) return null;
      const store = storeById(session.storeId);
      const investedBalls = session.investments.slice(0, investmentIndex + 1).reduce((sum, investment) => {
        return investment.adjustment ? sum : sum + investmentToBalls(investment, store);
      }, 0);
      const inputBalls = usesTapInvestmentMode(session) ? investedBalls : Number(session.startMochidama || 0) + investedBalls;
      const spinAt = item.spinAt !== null && item.spinAt !== undefined ? Number(item.spinAt) : null;
      const spins = spinAt !== null && session.startSpin !== null ? spinAt - Number(session.startSpin) : null;
      const rate = inputBalls > 0 && spins !== null && spins >= 0 ? spins / inputBalls * 250 : null;
      return {
        inputBalls: Math.round(inputBalls),
        spins,
        rate
      };
    }

    function historyEntries(session) {
      const investments = session.investments.map((item, index) => ({
        kind: "investment",
        item,
        index,
        time: item.time || "",
        order: index
      }));
      const chargeOffset = session.investments.length;
      const charges = (session.charges || []).map((item, index) => ({
        kind: "charge",
        item,
        index,
        time: item.time || "",
        order: chargeOffset + index
      }));
      return investments.concat(charges).sort((a, b) => {
        const timeCompare = String(b.time).localeCompare(String(a.time));
        return timeCompare || b.order - a.order;
      });
    }

    function addCurrentSpin(session, amount) {
      setCurrentSpinWithUndo(session, Number(session.currentSpin ?? session.startSpin ?? 0) + amount);
    }

    function setCurrentSpinWithUndo(session, value) {
      const current = Number(session.currentSpin ?? session.startSpin ?? 0);
      const next = Number(value || 0);
      const amount = next - current;
      if (!spinUndoStacks[session.id]) spinUndoStacks[session.id] = [];
      spinUndoStacks[session.id].push(amount);
      if (spinUndoStacks[session.id].length > 20) spinUndoStacks[session.id].shift();
      session.currentSpin = next;
      session.updatedAt = nowIso();
      persist();
      renderRunning();
    }

    function undoCurrentSpin(session) {
      const stack = spinUndoStacks[session.id] || [];
      const amount = stack.pop();
      if (!amount) return;
      session.currentSpin = Number(session.currentSpin ?? session.startSpin ?? 0) - amount;
      session.updatedAt = nowIso();
      persist();
      renderRunning();
    }

    function deriveBalances(session) {
      const cashTotal = session.investments.filter((item) => investmentSource(item) === "cash").reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const replayTotal = session.investments.filter((item) => investmentSource(item) === "saipurei").reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const mochidamaTotal = session.investments.filter((item) => investmentSource(item) === "mochidama").reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const chargeTotal = (session.charges || []).reduce((sum, item) => sum + Number(item.amount || 0), 0);
      return {
        mochidama: session.startMochidama === null ? null : Number(session.startMochidama || 0) - mochidamaTotal,
        credit: session.startCredit === null ? null : Number(session.startCredit || 0) + chargeTotal - cashTotal,
        saipurei: session.startSaipurei === null ? null : Number(session.startSaipurei || 0) - replayTotal
      };
    }

    function balanceStartValueForCurrent(session, key, currentValue) {
      const value = Number(currentValue || 0);
      const totals = investmentTotals(session);
      if (key === "startMochidama") return value + totals.mochidamaBalls;
      if (key === "startSaipurei") return value + totals.saipureiBalls;
      if (key === "startCredit") {
        const chargeTotal = (session.charges || []).reduce((sum, item) => sum + Number(item.amount || 0), 0);
        return value - chargeTotal + totals.cashYen;
      }
      return value;
    }

    function currentBalanceForStartKey(session, key) {
      const balances = deriveBalances(session);
      if (key === "startMochidama") return balances.mochidama;
      if (key === "startSaipurei") return balances.saipurei;
      if (key === "startCredit") return balances.credit;
      return null;
    }

    function updateMochidamaBalanceWithUndo(session, value) {
      const previous = session.startMochidama;
      session.startMochidama = balanceStartValueForCurrent(session, "startMochidama", value);
      session.updatedAt = nowIso();
      if (!persist()) {
        session.startMochidama = previous;
        showToast("保存に失敗しました。容量を確認してください。", "error");
        return false;
      }
      renderAll();
      showToast("持ち玉を更新しました", "success", {
        undo: () => {
          session.startMochidama = previous;
          session.updatedAt = nowIso();
          persist();
          renderAll();
        }
      });
      return true;
    }

    function investmentTotals(session) {
      return (session.investments || []).reduce((totals, item) => {
        const source = investmentSource(item);
        if (source === "cash") totals.cashYen += Number(item.amount || 0);
        if (source === "saipurei") totals.saipureiBalls += Number(item.amount || 0);
        if (source === "mochidama") totals.mochidamaBalls += Number(item.amount || 0);
        return totals;
      }, { cashYen: 0, saipureiBalls: 0, mochidamaBalls: 0 });
    }

    function profitYenForSession(session, totals = investmentTotals(session), store = storeById(session.storeId)) {
      const endTotalBalls = normalizeNumber(session.endTotalBalls);
      if (endTotalBalls === null) return null;
      const exchangeRate = exchangeRateForStore(store);
      const recoverBalls = endTotalBalls + Number(session.zanhoryuBalls || 0);
      const personalTapMode = usesTapInvestmentMode(session) && Boolean(store?.isPersonal);
      const investedPlayerBalls = personalTapMode
        ? Number(session.startMochidama || 0) + Number(totals.saipureiBalls || 0)
        : Number(totals.mochidamaBalls || 0) + Number(totals.saipureiBalls || 0);
      const cashYen = Number(totals.cashYen || 0);
      return Math.round((recoverBalls - investedPlayerBalls) * exchangeRate - cashYen);
    }

    function investmentTotalEditorHtml(session) {
      const totals = investmentTotals(session);
      return `
        <div class="section compact">
          <h3>投資合計</h3>
          <div class="grid three">
            ${investmentTotalFieldHtml("mochidama", "持ち玉投入", totals.mochidamaBalls, "玉")}
            ${investmentTotalFieldHtml("saipurei", "再プレ引き出し", totals.saipureiBalls, "玉")}
            ${investmentTotalFieldHtml("cash", "現金", totals.cashYen, "円")}
          </div>
          <p class="hint">修正は差分だけを調整レコードとして追加します。タップ履歴は書き換えません。遊タイム中の投資修正は対象外です。</p>
        </div>
      `;
    }

    function investmentTotalFieldHtml(source, label, value, unit) {
      return `<div class="field-row"><label for="editInvest_${source}">${label}</label><input id="editInvest_${source}" inputmode="numeric" value="${escapeHtml(value)}"><small>${unit}</small></div>`;
    }

    function applyInvestmentTotalAdjustments(session) {
      const current = investmentTotals(session);
      const targets = {
        mochidama: normalizeNumber(byId("editInvest_mochidama")?.value),
        saipurei: normalizeNumber(byId("editInvest_saipurei")?.value),
        cash: normalizeNumber(byId("editInvest_cash")?.value)
      };
      const diffs = {
        mochidama: targets.mochidama === null ? 0 : targets.mochidama - current.mochidamaBalls,
        saipurei: targets.saipurei === null ? 0 : targets.saipurei - current.saipureiBalls,
        cash: targets.cash === null ? 0 : targets.cash - current.cashYen
      };
      Object.entries(diffs).forEach(([source, diff]) => {
        if (!diff) return;
        session.investments.push({
          type: source,
          source,
          amount: diff,
          time: currentTime(),
          phase: "normal",
          spinAt: null,
          adjustment: true
        });
      });
    }

    // S3b: リザルトのヘッダ用。session.date（YYYY-MM-DD）から組むのでTZに依存しない。
    function longDateText(dateValue) {
      const parts = String(dateValue || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!parts) return dateValue || "-";
      const year = Number(parts[1]);
      const month = Number(parts[2]);
      const day = Number(parts[3]);
      const weekday = ["日", "月", "火", "水", "木", "金", "土"][new Date(year, month - 1, day).getDay()];
      return `${year}年${month}月${day}日（${weekday}）`;
    }

    // S3b: リザルトのブロック1〜3。値はすべて既存の算出をそのまま使う（新しい計算をしない）。
    function sessionResultSummary(session) {
      const machine = data.machines.find((item) => item.id === session.machineId) || null;
      const derived = deriveSession(session, machine);
      const transfer = transferSummaryForSession(session);
      const startEv = normalizeStartEv(session.startEv);
      const presetId = startEv?.presetId || normalizeMachinePresetId(machine);
      const workedHours = sessionWorkedHours(session);
      const hourlyYen = derived.profitYen !== null && workedHours !== null && workedHours > 0
        ? derived.profitYen / workedHours
        : null;
      // 回転率は大きいほど良い。実測 − 想定 で符号を取る（想定18.0・実測18.5 → +0.5）
      const rateDiff = startEv && derived.rate !== null ? derived.rate - startEv.usedRate : null;
      const evDiffYen = startEv && derived.profitYen !== null ? derived.profitYen - startEv.evYen : null;
      return {
        machine, derived, transfer, startEv, presetId, workedHours, hourlyYen, rateDiff, evDiffYen,
        remainingSpins: startEv ? remainingSpinsFromCounterSpin(startEv.effectiveSpin, presetId) : null,
        averageRoundBalls: transfer.averageRoundBalls
      };
    }

    // S3b/G4: 区間ごとの内訳。区間が1つだけなら空配列（＝ブロックを出さない）。
    // 通常区間の消費玉は、S2で通常区間が複数のときに使う区間別の式をそのまま使う。
    // 通常区間が1つのセッション（＋遊タイム区間）では、通常区間の消費玉はセッションの値と一致する。
    function segmentBreakdownRows(session, derived, machine) {
      const segments = sessionSegments(session);
      if (segments.length < 2) return [];
      const store = storeById(session.storeId);
      const preset = machine ? presetById(normalizeMachinePresetId(machine)) : null;
      const multiNormal = segments.filter((segment) => segment.kind === "normal").length > 1;
      let normalIndex = 0;
      return segments.map((segment, index) => {
        const isNormal = segment.kind === "normal";
        if (isNormal) normalIndex += 1;
        const startLabel = !isNormal ? "遊タイム" : (normalIndex === 1 ? "打ち始め" : "時短抜け");
        const endLabel = segment.endSource === "hit" ? "当選"
          : segment.endSource === "yutime" ? "遊タイム突入"
          : segment.endSource === "end" ? "ヤメ"
          : "継続中";
        const holdSpins = Math.max(0, Number(segment.holdSpins || 0));
        const spins = isNormal ? segmentPlayedSpins(segment, session, preset) : null;
        const consumed = isNormal
          ? (multiNormal ? segmentTapConsumedBalls(segment, session, store) : derived.consumedBalls)
          : derived.yutimeLoss;
        return {
          index: index + 1,
          kind: segment.kind,
          startLabel,
          startSpin: normalizeNumber(segment.startSpin),
          endLabel,
          endSpin: normalizeNumber(segment.endSpin),
          holdSpins,
          spins: spins !== null && spins < 0 ? null : spins,
          consumed: consumed === null || consumed === undefined ? null : Math.round(consumed),
          rate: spins !== null && spins >= 0 && consumed > 0 ? spins / consumed * 250 : null
        };
      });
    }

    // S3b: 積み上げの集計軸キー。プリセットが解決できない台は機種名で束ねる。
    function resultScopeKey(machine) {
      const presetId = normalizeMachinePresetId(machine);
      return presetId || String(machine?.modelName || "");
    }

    // S3b: 同一機種の確定済みセッションと、同一店×同一機種の2軸。
    function resultScopeSessions(session) {
      const machineOf = (item) => data.machines.find((entry) => entry.id === item.machineId) || null;
      const key = resultScopeKey(machineOf(session));
      const model = key
        ? data.sessions.filter((item) => item.status === "completed" && resultScopeKey(machineOf(item)) === key)
        : [];
      return { key, model, store: model.filter((item) => item.storeId === session.storeId) };
    }

    // S3b: 実働・期待値合計・実収支合計と、それぞれの時給。判定は出さない。
    // 実働はB96の日別サマリーと同じ算出（時刻欠損は除外、日またぎは0扱い）。
    function resultAggregate(sessions) {
      const list = Array.isArray(sessions) ? sessions : [];
      let workedHours = null;
      let evYen = null;
      let profitYen = null;
      list.forEach((session) => {
        const machine = data.machines.find((item) => item.id === session.machineId) || null;
        const derived = deriveSession(session, machine);
        const startEv = normalizeStartEv(session.startEv);
        const hours = sessionWorkedHours(session);
        if (hours !== null) workedHours = (workedHours ?? 0) + Math.max(0, hours);
        if (startEv) evYen = (evYen ?? 0) + startEv.evYen;
        if (derived.profitYen !== null) profitYen = (profitYen ?? 0) + derived.profitYen;
      });
      const hourly = (value) => value !== null && workedHours !== null && workedHours > 0 ? value / workedHours : null;
      return {
        count: list.length,
        workedHours,
        evYen,
        profitYen,
        diffYen: profitYen !== null && evYen !== null ? profitYen - evYen : null,
        evHourlyYen: hourly(evYen),
        profitHourlyYen: hourly(profitYen),
        rate: aggregateStats(list).rate
      };
    }

    function openSessionResult(sessionId) {
      const session = findSession(sessionId);
      if (!session) return;
      const summary = sessionResultSummary(session);
      const { machine, derived, startEv } = summary;
      const store = storeById(session.storeId);
      const sourceMachine = carryoverSourceMachine(session);
      const sameMachineCarryover = sourceMachine && sourceMachine.id === machine?.id;
      const labels = [...automaticLabelsForDate(session.date), ...(Array.isArray(session.labels) ? session.labels : [])];
      const headParts = [
        longDateText(session.date),
        labels.length ? labels.join("・") : "",
        store?.name || "店未設定",
        machine?.daiNo ? `台${machine.daiNo}` : "台不明",
        machine?.modelName || "機種未設定"
      ].filter(Boolean);
      const statusBadges = [
        missingFields(session).length ? '<span class="badge warn">未入力あり</span>' : '<span class="badge good">入力済み</span>',
        derived.isEstimatedRate || derived.isEstimatedPayout ? '<span class="badge warn">概算</span>' : "",
        sourceMachine ? `<span class="badge">${sameMachineCarryover ? "⇐ 同台続行" : `⇐ 台${escapeHtml(sourceMachine.daiNo)}から続き`}</span>` : ""
      ].join("");
      const diffRateText = summary.rateDiff === null ? "-" : `${summary.rateDiff >= 0 ? "+" : ""}${summary.rateDiff.toFixed(1)}`;
      const actualRateText = derived.rate === null || derived.rate === undefined ? "-" : derived.rate.toFixed(1);
      const startEvHtml = startEv ? `
        <div class="result-block">
          <div class="result-block-title">打つ前の判断（記録）</div>
          <div class="result-line">開始カウンター ${escapeHtml(startEv.effectiveSpin)} ／ 遊タイムまで残り ${escapeHtml(summary.remainingSpins ?? "-")}回転</div>
          <div class="result-line">想定回転率 ${escapeHtml(startEv.usedRate.toFixed(1))}（${escapeHtml(startEv.rateSource || "-")}）／ 開始期待値 ${escapeHtml(yenText(startEv.evYen))}</div>
        </div>
        <div class="result-block">
          <div class="result-block-title">想定と実測のズレ</div>
          <div class="result-table-wrap">
            <table class="result-table">
              <thead><tr><th>項目</th><th>想定</th><th>実測</th><th>差</th></tr></thead>
              <tbody>
                <tr><td>回転率</td><td>${escapeHtml(startEv.usedRate.toFixed(1))}</td><td>${escapeHtml(actualRateText)}</td><td>${escapeHtml(diffRateText)}</td></tr>
                <tr><td>期待値との差</td><td>${escapeHtml(yenText(startEv.evYen))}</td><td>${escapeHtml(yenText(derived.profitYen))}</td><td>${escapeHtml(yenText(summary.evDiffYen))}</td></tr>
              </tbody>
            </table>
          </div>
          <p class="hint">1回のブレです。判断の良し悪しは下の通算で見ます。</p>
        </div>` : '<p class="hint">開始時の期待値は記録されていません。</p>';
      const segmentRows = segmentBreakdownRows(session, derived, machine);
      const normalMarks = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨"];
      let normalRowIndex = 0;
      const segmentHtml = segmentRows.length ? `
        <div class="result-block">
          <div class="result-block-title">区間ごとの内訳</div>
          ${segmentRows.map((row) => {
            const startSpin = row.startSpin === null ? "-" : row.startSpin.toLocaleString("ja-JP");
            const endSpin = row.endSpin === null ? "-" : row.endSpin.toLocaleString("ja-JP");
            const consumed = row.consumed === null ? "-" : row.consumed.toLocaleString("ja-JP");
            if (row.kind === "yutime") {
              return `<div class="result-seg">遊タイム ${startSpin} → ${escapeHtml(row.endLabel)} ${endSpin}　消費 ${consumed}玉</div>`;
            }
            const mark = normalMarks[normalRowIndex] || String(normalRowIndex + 1);
            normalRowIndex += 1;
            const spins = row.spins === null ? "-" : row.spins.toLocaleString("ja-JP");
            const holdText = row.holdSpins > 0 ? `（保留${row.holdSpins}控除後）` : "";
            const rate = row.rate === null ? "-" : row.rate.toFixed(1);
            return `<div class="result-seg">区間${mark}　${escapeHtml(row.startLabel)} ${startSpin} → ${escapeHtml(row.endLabel)} ${endSpin}　${spins}回転${holdText} / ${consumed}玉 / ${rate}回転</div>`;
          }).join("")}
        </div>` : "";
      const scopes = resultScopeSessions(session);
      const modelAggregate = resultAggregate(scopes.model);
      const storeAggregate = resultAggregate(scopes.store);
      const storeRateText = storeAggregate.rate === null || storeAggregate.rate === undefined ? "-" : storeAggregate.rate.toFixed(1);
      const aggregateHtml = `
        <div class="result-block">
          <div class="result-block-title">これまでの積み上げ</div>
          <div class="result-line">この機種の積み上げ（${modelAggregate.count}台）</div>
          <div class="result-line">実働 ${escapeHtml(hourText(modelAggregate.workedHours))} ／ 期待値合計 ${escapeHtml(yenText(modelAggregate.evYen))} ／ 実収支合計 ${escapeHtml(yenText(modelAggregate.profitYen))} ／ 差 ${escapeHtml(yenText(modelAggregate.diffYen))}</div>
          <div class="result-line">期待値時給 ${escapeHtml(yenText(modelAggregate.evHourlyYen))} ／ 実収支時給 ${escapeHtml(yenText(modelAggregate.profitHourlyYen))}</div>
          <div class="result-line" style="margin-top:8px">この店 × この機種（${storeAggregate.count}台）</div>
          <div class="result-line">実働 ${escapeHtml(hourText(storeAggregate.workedHours))} ／ 平均回転率 ${escapeHtml(storeRateText)}</div>
          <div class="result-line">期待値合計 ${escapeHtml(yenText(storeAggregate.evYen))} ／ 実収支合計 ${escapeHtml(yenText(storeAggregate.profitYen))}</div>
          <div class="result-line">期待値時給 ${escapeHtml(yenText(storeAggregate.evHourlyYen))} ／ 実収支時給 ${escapeHtml(yenText(storeAggregate.profitHourlyYen))}</div>
        </div>`;
      const html = `
        <div class="result-head">
          <div>${escapeHtml(headParts.join(" ／ "))}</div>
          <div class="status-line">${statusBadges}</div>
        </div>
        <div class="result-block">
          <div class="result-block-title">今回の結果</div>
          <div class="result-headline">${escapeHtml(yenText(derived.profitYen))}</div>
          <div class="result-line">実測回転率 ${escapeHtml(rateText(derived))} ／ 大当たり ${escapeHtml(numberText(session.hitCount, "-"))}回 ／ 1R平均 ${escapeHtml(transferOptionalRoundAverageText(summary.averageRoundBalls))}</div>
          <div class="result-line">実働 ${escapeHtml(hourText(summary.workedHours))} ／ 時給 ${escapeHtml(yenText(summary.hourlyYen))}</div>
        </div>
        ${startEvHtml}
        ${segmentHtml}
        ${aggregateHtml}
        <div class="result-block">
          ${transferSummaryHtml(session)}
        </div>
        <div class="modal-actions">
          <button class="ghost" data-close>実戦一覧に戻る</button>
          ${(Array.isArray(session.hits) ? session.hits.length : 0) ? '<button id="resultHitHistoryBtn">大当たり履歴</button>' : ""}
          <button id="resultEditBtn">記録の修正</button>
          <button class="danger" id="resultDeleteBtn">記録の削除</button>
        </div>
      `;
      openModal("実戦リザルト", "", html);
      const resultHitHistoryButton = byId("resultHitHistoryBtn");
      if (resultHitHistoryButton) resultHitHistoryButton.addEventListener("click", () => {
        openHitHistory(session, { back: () => openSessionResult(session.id) });
      });
      els.modalBody.querySelectorAll("[data-copy-transfer]").forEach((button) => {
        button.addEventListener("click", () => copyTransferSummary(button.dataset.copyTransfer));
      });
      byId("resultEditBtn").addEventListener("click", () => {
        closeModal();
        openSessionEditor(session.id);
      });
      byId("resultDeleteBtn").addEventListener("click", () => {
        if (!confirm("削除しますか？")) return;
        if (!confirm("元に戻せません。削除を確定しますか？")) return;
        data.sessions = data.sessions.filter((item) => item.id !== session.id);
        if (activeSessionId === session.id) activeSessionId = null;
        if (!persistWithToast("記録を削除しました")) return;
        closeModal();
        renderAll();
      });
    }

    function transferSummaryForSession(session) {
      const totals = investmentTotals(session);
      const store = storeById(session.storeId);
      const machine = data.machines.find((item) => item.id === session.machineId);
      const derived = deriveSession(session, machine);
      const startEv = normalizeStartEv(session.startEv);
      const summaryPresetId = startEv?.presetId || normalizeMachinePresetId(machine);
      const startExpectedSpins = startEv ? remainingSpinsFromCounterSpin(startEv.effectiveSpin, summaryPresetId) : null;
      const hitCount = normalizeNumber(session.hitCount) ?? 0;
      const prevDayEndSpin = normalizeNumber(session.prevDayEndSpin) ?? 0;
      const endSpin = normalizeNumber(session.endSpin);
      const endEffectiveSpin = endSpin !== null ? endSpin + (hitCount > 0 ? 0 : prevDayEndSpin) : null;
      const remainingSpins = endEffectiveSpin !== null ? remainingSpinsFromCounterSpin(endEffectiveSpin, summaryPresetId) : null;
      const startSpin = normalizeNumber(session.startSpin);
      const playedSpins = startSpin !== null && endSpin !== null && endSpin >= startSpin ? endSpin - startSpin : null;
      const consumedBalls = derived.consumedBalls !== null && derived.consumedBalls !== undefined ? Math.round(derived.consumedBalls) : null;
      // S4/C-5: 1R平均は実測の獲得出玉だけで出す。玉数の増減からの推計では代用しない。
      // 分子・分母とも戦果報告の「1R当たり」と同じ取得元にそろえる。
      const totalHitBalls = sessionActualBallsTotal(session);
      const totalRounds = totalRoundsForSession(session, machine);
      const averageRoundBalls = totalHitBalls !== null && totalRounds > 0 ? totalHitBalls / totalRounds : null;
      return {
        investYen: totals.cashYen,
        recoverYen: normalizeNumber(session.settlementRecoverYen) ?? 0,
        // §5: 貯玉引出 = 開始持ち玉 + 再プレイ投資合計。実収支・差玉の式は変えない。
        withdrawBalls: Number(session.startMochidama || 0) + Number(totals.saipureiBalls || 0),
        depositBalls: finalMochidamaForCarryover(session) ?? 0,
        startEvYen: startEv ? startEv.evYen : null,
        startExpectedSpins,
        remainingSpins,
        consumedBalls,
        playedSpins,
        averageRoundBalls,
        profitYen: derived.profitYen
      };
    }

    function roundCountFromRoundType(roundType) {
      const explicit = normalizeNumber(roundType?.rounds);
      if (explicit !== null) return explicit;
      const text = `${roundType?.label || ""} ${roundType?.id || ""}`;
      const match = text.match(/(\d+(?:\.\d+)?)\s*R/i);
      return match ? Number(match[1]) : null;
    }

    // 合計Rの取得元はここ1本にする。当選履歴（R種別の記録）があればそれ、
    // 無ければヤメ入力の合計R数。どちらも無ければ0。
    function totalRoundsForPreset(session, presetId) {
      const hitRounds = normalizeHits(session?.hits).reduce((sum, hit) => {
        const rounds = roundCountFromRoundType(roundTypeById(presetId, hit.roundTypeId));
        return rounds !== null ? sum + rounds : sum;
      }, 0);
      if (hitRounds > 0) return hitRounds;
      return normalizeNumber(session?.totalRounds) ?? 0;
    }

    function totalRoundsForSession(session, machine) {
      return totalRoundsForPreset(session, normalizeMachinePresetId(machine));
    }

    function transferYenText(value) {
      return `${Math.round(Number(value || 0)).toLocaleString("ja-JP")}円`;
    }

    function transferBallText(value) {
      return Math.round(Number(value || 0)).toLocaleString("ja-JP");
    }

    function transferOptionalYenText(value) {
      const number = normalizeNumber(value);
      return number === null ? "-" : transferYenText(number);
    }

    function transferOptionalSpinText(value) {
      const number = normalizeNumber(value);
      return number === null ? "-" : `${Math.round(number).toLocaleString("ja-JP")}回転`;
    }

    function transferOptionalBallText(value) {
      const number = normalizeNumber(value);
      return number === null ? "-" : `${Math.round(number).toLocaleString("ja-JP")}玉`;
    }

    function transferOptionalRoundAverageText(value) {
      const number = normalizeNumber(value);
      return number === null ? "-" : `${Number(number.toFixed(1)).toLocaleString("ja-JP")}玉/R`;
    }

    function transferSummaryText(summary) {
      return `投資${transferYenText(summary.investYen)}/回収${transferYenText(summary.recoverYen)}/引出${transferBallText(summary.withdrawBalls)}個/預入${transferBallText(summary.depositBalls)}個
開始期待値${transferOptionalYenText(summary.startEvYen)}/想定回転数${transferOptionalSpinText(summary.startExpectedSpins)}/残り回転数${transferOptionalSpinText(summary.remainingSpins)}/消費玉数${transferOptionalBallText(summary.consumedBalls)}/消化回転数${transferOptionalSpinText(summary.playedSpins)}/1R平均${transferOptionalRoundAverageText(summary.averageRoundBalls)}/実収支${transferOptionalYenText(summary.profitYen)}`;
    }

    function transferSummaryHtml(session) {
      const summary = transferSummaryForSession(session);
      return `
        <div class="transfer-summary">
          <div class="transfer-summary-title">転記用</div>
          <div class="transfer-summary-grid">
            <div class="transfer-summary-cell"><span>投資金額</span><strong>${transferYenText(summary.investYen)}</strong></div>
            <div class="transfer-summary-cell"><span>回収金額</span><strong>${transferYenText(summary.recoverYen)}</strong></div>
            <div class="transfer-summary-cell"><span>貯玉引出</span><strong>${transferBallText(summary.withdrawBalls)}個</strong></div>
            <div class="transfer-summary-cell"><span>貯玉預入</span><strong>${transferBallText(summary.depositBalls)}個</strong></div>
          </div>
          <div class="transfer-summary-line">${escapeHtml(transferSummaryText(summary))}</div>
          <button class="small" data-copy-transfer="${escapeHtml(session.id)}">転記用をコピー</button>
          <div class="transfer-summary-grid">
            <div class="transfer-summary-cell"><span>開始期待値</span><strong>${transferOptionalYenText(summary.startEvYen)}</strong></div>
            <div class="transfer-summary-cell"><span>想定回転数</span><strong>${transferOptionalSpinText(summary.startExpectedSpins)}</strong></div>
            <div class="transfer-summary-cell"><span>残り回転数</span><strong>${transferOptionalSpinText(summary.remainingSpins)}</strong></div>
            <div class="transfer-summary-cell"><span>消費玉数</span><strong>${transferOptionalBallText(summary.consumedBalls)}</strong></div>
            <div class="transfer-summary-cell"><span>消化回転数</span><strong>${transferOptionalSpinText(summary.playedSpins)}</strong></div>
            <div class="transfer-summary-cell"><span>1R平均</span><strong>${transferOptionalRoundAverageText(summary.averageRoundBalls)}</strong></div>
            <div class="transfer-summary-cell"><span>実収支</span><strong>${transferOptionalYenText(summary.profitYen)}</strong></div>
          </div>
        </div>`;
    }

    function copyText(text) {
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("コピーしました")).catch(() => fallbackCopyText(text));
        return;
      }
      fallbackCopyText(text);
    }

    function fallbackCopyText(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
      showToast("コピーしました");
    }

    function copyTransferSummary(sessionId) {
      const session = findSession(sessionId);
      if (!session) return;
      copyText(transferSummaryText(transferSummaryForSession(session)));
    }

    function balanceForSource(session, source) {
      const balances = deriveBalances(session);
      if (source === "mochidama") return balances.mochidama;
      if (source === "saipurei") return balances.saipurei;
      return balances.credit;
    }

    function canUseSource(session, source, amount) {
      const balance = balanceForSource(session, source);
      return balance !== null && balance > 0;
    }

    function finalMochidamaForCarryover(session) {
      if (session.endTotalBalls === null || session.endTotalBalls === undefined) return null;
      return Number(session.endTotalBalls || 0) + Number(session.zanhoryuBalls || 0);
    }

    function createCarryoverFromSession(session) {
      const machine = data.machines.find((item) => item.id === session.machineId);
      const balances = deriveBalances(session);
      return {
        storeId: session.storeId,
        sourceSessionId: session.id,
        sourceMachineId: session.machineId,
        sourceDaiNo: machine?.daiNo || "",
        date: session.date,
        mochidama: finalMochidamaForCarryover(session),
        credit: balances.credit,
        saipurei: balances.saipurei,
        createdAt: nowIso()
      };
    }

    function startCarryover(session) {
      const nextCarryover = createCarryoverFromSession(session);
      if (!saveCarryover(nextCarryover)) return;
      closeModal();
      showView("mapView");
      showToast("持ち玉を引き継ぎ待機にしました");
    }

    function openSameMachineContinuePrompt(session) {
      const machine = data.machines.find((item) => item.id === session.machineId);
      const options = hitResetOptions(machine);
      openModal("同じ台で続行", "開始回転数を選ぶと、同じ台の新しい記録をすぐ開始します。値はあとから修正できます。", `
        ${machineContextLine(session)}
        <div class="quick-invest">
          ${options.map((value) => `<button class="${Number(session.currentSpin) === value ? "primary" : ""}" data-same-start="${value}">${value}</button>`).join("")}
        </div>
        <div class="modal-actions">
          <button class="ghost" data-close>閉じる</button>
        </div>
      `);
      els.modalBody.querySelectorAll("[data-same-start]").forEach((button) => {
        button.addEventListener("click", () => startSameMachineContinuation(session, Number(button.dataset.sameStart)));
      });
    }

    function startSameMachineContinuation(sourceSession, startSpin) {
      const balances = deriveBalances(sourceSession);
      const next = blankSession();
      next.storeId = sourceSession.storeId;
      next.machineId = sourceSession.machineId;
      next.date = today();
      next.labels = Array.isArray(sourceSession.labels) ? [...sourceSession.labels] : [];
      next.carriedFromSessionId = sourceSession.id;
      next.startSpin = startSpin;
      next.currentSpin = startSpin;
      next.startTime = currentTime();
      next.startMochidama = finalMochidamaForCarryover(sourceSession);
      next.startSaipurei = balances.saipurei;
      next.startCredit = balances.credit;
      next.startTotalHits = sourceSession.endTotalHits ?? null;
      next.startEv = calculateStartEvSnapshot(next, data.machines.find((item) => item.id === next.machineId));
      data.sessions.push(next);
      activeSessionId = next.id;
      if (!persistWithToast("同じ台で続行を開始しました")) return;
      closeModal();
      showView("runView");
      renderAll();
    }

    function addInvestment(session, source, amount, time = currentTime()) {
      if (amount === null) return;
      source = normalizeInvestmentSource(source);
      const unavailableMessage = sourceUnavailableMessage(session, source, amount);
      if (unavailableMessage) {
        showToast(unavailableMessage, "error");
        return;
      }
      const item = { type: source, source, amount, time, phase: currentInvestmentPhase(session), spinAt: session.currentSpin ?? session.startSpin, segmentId: currentSegmentId(session) };
      session.investments.push(item);
      session.updatedAt = nowIso();
      const balls = Math.round(investmentToBalls(item, storeById(session.storeId)));
      if (!persist()) {
        showToast("保存に失敗しました。容量を確認してください。", "error");
        return;
      }
      showToast(`投資を追記しました（+${balls}玉）`, "success", {
        undo: () => {
          const index = session.investments.indexOf(item);
          if (index >= 0) deleteInvestment(session, index, "直前の投資を取り消しました");
        }
      });
      renderAll();
    }

    function deleteInvestment(session, index, message = "投資履歴を削除しました") {
      if (!Number.isInteger(index) || !session.investments[index]) return;
      session.investments.splice(index, 1);
      session.updatedAt = nowIso();
      if (!persistWithToast(message)) return;
      renderAll();
    }

    // S4/A-2: 直前の投資（残高調整を除く）。取り消しボタンの活性判定にも使う。
    function lastInvestmentIndex(session) {
      const investments = Array.isArray(session?.investments) ? session.investments : [];
      for (let index = investments.length - 1; index >= 0; index -= 1) {
        if (!investments[index]?.adjustment) return index;
      }
      return -1;
    }

    // S4/A-2: 投資タップの取り消し。トーストの「元に戻す」と同じ削除処理を共有する。
    function undoLastInvestment(session) {
      const index = lastInvestmentIndex(session);
      if (index < 0) {
        showToast("取り消せる投資がありません", "error");
        return;
      }
      deleteInvestment(session, index, "直前の投資を取り消しました");
    }

    function addCharge(session, amount, time = currentTime()) {
      if (amount === null || amount <= 0) return;
      const item = { amount, time };
      if (!Array.isArray(session.charges)) session.charges = [];
      session.charges.push(item);
      session.updatedAt = nowIso();
      if (!persist()) {
        showToast("保存に失敗しました。容量を確認してください。", "error");
        return;
      }
      showToast(`入金を記録しました（+${amount}円）`, "success", {
        undo: () => {
          const index = session.charges.indexOf(item);
          if (index >= 0) {
            session.charges.splice(index, 1);
            session.updatedAt = nowIso();
            persist();
            renderAll();
          }
        }
      });
      renderAll();
    }

    function deleteCharge(session, index) {
      if (!Number.isInteger(index) || !session.charges?.[index]) return;
      session.charges.splice(index, 1);
      session.updatedAt = nowIso();
      if (!persistWithToast("入金履歴を削除しました")) return;
      renderAll();
    }

        if (!persistWithToast("編集を保存しました")) return;
        closeModal();
        renderAll();
      });

    // S2/§2-1: 区間ごとの無料保留（0〜9）。残保留が5個だった等の例外に対応する。
    function segmentHoldSpinsEditorHtml(session) {
      const segments = Array.isArray(session.segments) ? session.segments : [];
      if (!segments.length) return "";
      const rows = segments.map((segment, index) => {
        const kindLabel = segment.kind === "yutime" ? "遊タイム" : "通常";
        const range = `${segment.startSpin ?? "-"}〜${segment.endSpin ?? "継続中"}`;
        return `<div class="field-row"><label for="edit_segment_hold_${index}">区間${index + 1} ${kindLabel}（${escapeHtml(range)}）の無料保留</label><input id="edit_segment_hold_${index}" type="text" inputmode="numeric" value="${escapeHtml(segment.holdSpins ?? 0)}"></div>`;
      }).join("");
      return `<div class="grid two">${rows}</div><p class="hint">区間の先頭で回した無料保留の数です。0〜9で指定でき、変更すると回転率を計算し直します。</p>`;
    }

    function consumedBallsSourceEditorHtml(session) {
      if (usesTapInvestmentMode(session) && normalizeNumber(session.hitTrackedBalls) !== null && normalizeNumber(session.yutimeEnterBalls) === null) {
        return `<p class="hint">通常消費玉はタップ合計と当選時の持ち玉差分で確定しています。</p>`;
      }
      const selected = normalizeConsumedBallsSource(session.consumedBallsSource);
      return `
        <div class="field-row">
          <label for="editConsumedBallsSource">通常消費玉の採用</label>
          <div>
            <select id="editConsumedBallsSource">
              <option value="">自動判定</option>
              <option value="tray"${selected === "tray" ? " selected" : ""}>台上差</option>
              <option value="taps"${selected === "taps" ? " selected" : ""}>タップ合計</option>
