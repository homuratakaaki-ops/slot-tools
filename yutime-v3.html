<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>遊タイム実戦ツール v3</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f4ef;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #667085;
      --line: #d8d5ca;
      --accent: #236c68;
      --accent-dark: #174b48;
      --warn: #b45309;
      --danger: #b42318;
      --good: #1c7c54;
      --soft: #e8f3f1;
      --button: #f8fafc;
      --shadow: 0 10px 24px rgba(31, 41, 51, 0.08);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--button);
      color: var(--ink);
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active { transform: translateY(1px); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { background: var(--accent-dark); }
    button.danger { color: #fff; background: var(--danger); border-color: var(--danger); }
    button.ghost { background: transparent; }
    button.small { min-height: 36px; padding: 0 10px; }
    button.icon { width: 44px; padding: 0; display: inline-grid; place-items: center; }

    input, textarea, select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.5;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 14px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      background: rgba(245, 244, 239, 0.95);
      backdrop-filter: blur(10px);
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .store-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      white-space: nowrap;
      font-size: 14px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 6px 0 14px;
    }

    .tab {
      min-height: 42px;
      border-radius: 8px;
      background: #fff;
    }

    .tab.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .view { display: none; }
    .view.active { display: block; }
    #mapView.active { display: flex; flex-direction: column; gap: 0; }
    #mapView > .section:first-of-type { order: 2; }
    #mapView > .section:nth-of-type(2) { order: 1; }

    .section {
      margin: 0 0 14px;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .section-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      margin-bottom: 12px;
    }

    .section h2, .section h3 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .section p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .store-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .store-card {
      min-height: 72px;
      padding: 12px;
      text-align: left;
      background: #fff;
    }

    .store-card strong { display: block; font-size: 16px; }
    .store-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }

    .field-row {
      display: grid;
      grid-template-columns: minmax(120px, 180px) 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .field-row label {
      font-weight: 700;
      font-size: 13px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .warn {
      color: var(--warn);
      font-weight: 700;
    }

    .danger-text {
      color: var(--danger);
      font-weight: 700;
    }

    .status-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 8px 0 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #eef2f6;
      color: #344054;
      font-size: 12px;
      white-space: nowrap;
    }

    .badge.warn { background: #fff7ed; color: #9a3412; }
    .badge.good { background: #ecfdf3; color: #067647; }
    .badge.dark { background: var(--ink); color: #fff; }

    .label-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 0;
    }

    .check-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 13px;
    }

    .check-chip input {
      width: auto;
      min-height: auto;
      padding: 0;
    }

    .filter-block {
      margin: 0 0 14px;
    }

    .filter-block + .filter-block {
      margin-top: 12px;
    }

    .filter-status {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 0 0 14px;
      padding: 10px;
      border: 1px solid #7aa7a3;
      border-radius: 8px;
      background: var(--soft);
    }

    .island-builder {
      display: grid;
      gap: 12px;
    }

    .island-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .island-card-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .island-card-head strong {
      font-size: 15px;
    }

    .island-sides {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .island-side {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }

    .island-side h4 {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 13px;
    }

    .island-preview {
      display: grid;
      grid-template-columns: minmax(84px, 1fr) 34px minmax(84px, 1fr);
      gap: 12px;
      align-items: stretch;
      margin-top: 10px;
    }

    .preview-side {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .preview-machine {
      min-height: 44px;
      padding: 5px;
      font-weight: 800;
      background: #fff;
    }

    .preview-machine.excluded {
      color: #98a2b3;
      background: #eef2f6;
      text-decoration: line-through;
    }

    .map-wrap {
      overflow-x: auto;
      margin-top: 14px;
      padding-bottom: 8px;
    }

    .map-grid {
      display: grid;
      gap: 8px;
      align-items: start;
      min-width: 320px;
    }

    .map-row {
      display: grid;
      grid-template-columns: minmax(90px, 1fr) 34px minmax(90px, 1fr);
      gap: 12px;
      align-items: stretch;
    }

    .map-side {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .aisle {
      min-height: 48px;
      border-radius: 8px;
      background: repeating-linear-gradient(
        90deg,
        #e3e0d5,
        #e3e0d5 4px,
        #f3f0e7 4px,
        #f3f0e7 8px
      );
    }

    .machine-button {
      position: relative;
      min-height: 72px;
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 3px;
      padding: 7px 5px 8px;
      background: #fff;
      text-align: center;
    }

    .machine-button .dai {
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
    }

    .machine-button .rate {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--muted);
      min-height: 17px;
    }

    .machine-button .rate.good { color: var(--good); }
    .machine-button .rate.bad { color: var(--danger); }

    .machine-button .prev {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .machine-button .active-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      padding: 2px 5px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
    }

    .machine-button.has-data {
      border-color: #7aa7a3;
      background: var(--soft);
    }

    .machine-button.is-active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 2px rgba(35, 108, 104, 0.18);
    }

    .machine-button.ev-good {
      border-color: var(--good);
      box-shadow: inset 0 0 0 2px rgba(28, 124, 84, 0.22);
    }

    .machine-button.ev-assumed {
      border-style: dashed;
    }

    .machine-button .eve-sign {
      position: absolute;
      left: 4px;
      top: 4px;
      padding: 2px 5px;
      border-radius: 999px;
      background: #ecfdf3;
      color: #067647;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
    }

    .machine-button .state-badge {
      position: absolute;
      left: 4px;
      bottom: 4px;
      padding: 2px 5px;
      border-radius: 999px;
      background: #f2f4f7;
      color: #475467;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
    }

    .machine-button .state-badge.retained {
      background: #ecfdf3;
      color: #067647;
    }

    .machine-button .memo-badge {
      position: absolute;
      right: 4px;
      bottom: 4px;
      padding: 2px 5px;
      border-radius: 999px;
      background: #fff4e5;
      color: #a15c07;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
    }

    .machine-button .rate small {
      display: block;
      margin-top: 1px;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.1;
    }

    .running-panel {
      border-color: #7aa7a3;
      background: #f3fbfa;
    }

    .running-sticky {
      position: sticky;
      top: 78px;
      z-index: 15;
      margin: -2px -2px 12px;
      padding: 12px;
      border: 1px solid #7aa7a3;
      border-radius: 8px;
      background: #f3fbfa;
      box-shadow: var(--shadow);
    }

    .running-sticky.sticky-off {
      position: static;
      box-shadow: none;
    }

    .running-headline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
    }

    .running-headline-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .running-live-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(35, 108, 104, .25);
      border-radius: 8px;
      background: #fff;
    }

    .running-live-row span,
    .running-total-row span {
      color: var(--muted);
      font-size: 12px;
    }

    .running-live-row strong {
      font-size: 22px;
    }

    .live-ev-line {
      margin: -2px 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .live-ev-line.warn {
      color: var(--danger);
    }

    .editable-value {
      border-style: dashed;
      background: #fff;
      text-align: left;
    }

    .editable-value strong {
      display: inline-block;
      margin-right: 6px;
    }

    .editable-value small {
      color: var(--muted);
      font-size: 11px;
    }

    .counter-row, .balance-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .counter-row strong {
      font-size: 26px;
      line-height: 1;
    }

    .counter-row button, .balance-row button {
      min-height: 34px;
      padding: 0 10px;
    }

    .running-bottom-controls {
      position: sticky;
      bottom: 8px;
      z-index: 16;
      margin: 12px -2px 0;
      padding: 10px;
      border: 1px solid #7aa7a3;
      border-radius: 8px;
      background: rgba(243, 251, 250, .96);
      box-shadow: var(--shadow);
    }

    .running-bottom-controls.sticky-off {
      position: static;
      box-shadow: none;
    }

    .source-chip-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .source-chip {
      min-height: 42px;
      background: #fff;
    }

    .source-chip.selected {
      border-color: var(--accent);
      background: #e9f7f5;
      color: var(--accent-dark);
      font-weight: 800;
    }

    .source-chip.is-low {
      opacity: .48;
    }

    .unified-invest-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-bottom: 8px;
    }

    .unified-invest-row button {
      min-height: 96px;
      font-size: 18px;
      font-weight: 800;
    }

    .unified-invest-row #unifiedInvestBtn {
      font-size: 24px;
    }

    .running-bottom-controls .counter-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr) auto;
      gap: 8px;
      margin-top: 0;
    }

    .running-bottom-controls .counter-row button {
      min-height: 52px;
      font-size: 18px;
      font-weight: 800;
    }

    .balance-row button.needs-balance {
      opacity: .55;
    }

    .balance-row .balance-label {
      min-width: 96px;
      font-weight: 700;
    }

    .balance-row .balance-value {
      min-width: 86px;
    }

    .balance-row.is-collapsed {
      padding: 8px 10px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.68);
    }

    .running-total-row {
      margin-top: 10px;
      font-weight: 700;
    }

    .running-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .history-toggle {
      width: 100%;
      justify-content: space-between;
      margin-top: 12px;
    }

    .history-list {
      margin-top: 8px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }

    .metric {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      display: block;
      margin-top: 2px;
      font-size: 18px;
    }

    .expectation-box {
      margin: 12px 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .expectation-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .expectation-title.good { color: var(--good); }
    .expectation-title.warn { color: var(--warn); }
    .expectation-title.bad { color: var(--danger); }

    .expectation-inputs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .row-card {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .row-card-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
    }

    .row-card strong { font-size: 15px; }
    .row-card small { color: var(--muted); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: end;
      justify-content: center;
      padding: 12px;
      background: rgba(15, 23, 42, 0.42);
    }

    .modal-backdrop.open { display: flex; }

    .modal-backdrop.wizard-mode {
      align-items: flex-start;
      padding-top: max(8px, env(safe-area-inset-top));
    }

    .modal {
      width: min(680px, 100%);
      max-height: min(86vh, 760px);
      overflow: auto;
      padding: 16px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.22);
    }

    .modal-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 12px;
    }

    .modal h2 {
      margin: 0;
      font-size: 18px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .closing-display {
      min-height: 72px;
      display: grid;
      place-items: center;
      margin: 8px 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .closing-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .closing-keypad button {
      min-height: 54px;
      font-size: 22px;
      font-weight: 800;
    }

    .closing-flow-actions {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 8px;
      margin-top: 10px;
    }

    .closing-direction {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .closing-direction .grid {
      margin: 0;
    }

    .closing-recent {
      min-height: 18px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .modal-actions.wizard-actions {
      grid-template-columns: 1fr;
    }

    .quick-invest {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .phase-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .carryover-banner {
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #e3b341;
      border-radius: 8px;
      background: #fff8dc;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .carryover-banner strong {
      display: block;
      margin-bottom: 2px;
    }

    .hidden { display: none !important; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 120;
      display: none;
      width: min(520px, calc(100% - 24px));
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
      transform: translateX(-50%);
      font-weight: 700;
      font-size: 14px;
      line-height: 1.4;
    }

    .toast.show { display: block; }
    .toast.error { background: var(--danger); }

    .toast button {
      margin-left: 10px;
      min-height: 28px;
      padding: 0 10px;
      border-color: rgba(255,255,255,.7);
      color: #fff;
      background: rgba(255,255,255,.16);
    }

    .footer-note {
      margin: 16px 0 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 720px) {
      .app { padding: 10px; }
      .topbar { grid-template-columns: 1fr; }
      .tabs { grid-template-columns: repeat(2, 1fr); }
      .two, .three { grid-template-columns: 1fr; }
      .field-row { grid-template-columns: 1fr; gap: 5px; }
      .section-head { grid-template-columns: 1fr; }
      .island-sides { grid-template-columns: 1fr; }
      .map-row { grid-template-columns: minmax(118px, 1fr) 28px minmax(118px, 1fr); gap: 10px; }
      .map-side { grid-template-columns: 1fr; }
      .modal-actions { grid-template-columns: 1fr; }
      .carryover-banner { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">

    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    "use strict";

    const STORAGE_PREFIX = "ytv3:";
    const STORAGE_KEY = STORAGE_PREFIX + "data";
    const PREMIGRATE_KEY = STORAGE_PREFIX + "premigrate";
    const BACKUP_KEY = STORAGE_PREFIX + "backup:latest";
    const CARRYOVER_KEY = STORAGE_PREFIX + "carryover";
    const CORRUPT_PREFIX = STORAGE_PREFIX + "corrupt:";
    const STICKY_PREF_KEY = STORAGE_PREFIX + "running:sticky";
    const SOURCE_PREF_KEY = STORAGE_PREFIX + "running:source";
    const SCHEMA_VERSION = 13;
    const DEFAULT_LEND_RATE = 4;
    const DEFAULT_EXCHANGE_BALLS = 25;
    const DEFAULT_NET_BALLS_PER_WIN = 1400;
    const RATE_THRESHOLDS = { good: 17.0, bad: 15.0 };
    const EV_THRESHOLDS = { good: 2000, warn: 0 };
    const AUTO_LABELS = [
      "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日", "日曜日",
      "1のつく日", "2のつく日", "3のつく日", "4のつく日", "5のつく日",
      "6のつく日", "7のつく日", "8のつく日", "9のつく日", "0のつく日",
      "ゾロ目日"
    ];
    const MACHINE_PRESETS = [
      { id: "umi-sp5", name: "P大海物語5スペシャル", roundBalls: 140, standardRounds: 10, standardPayout: 1400, evSupported: true, spec: { note: "B5時点の期待値対応プリセット" } }
    ];
    const RAM_STATE_OPTIONS = [
      { value: "cleared", label: "リセットされてた（ラムクリ）", badge: "リ", retained: false },
      { value: "unknown", label: "不明（当日まだ大当たりなし）", badge: "不", retained: false },
      { value: "hitToday", label: "当選済み（当日すでに大当たり）", badge: "当", retained: false },
      { value: "retained", label: "据え置きだった", badge: "据", retained: true }
    ];

    const YUTIME_EXPECTATION_ENGINE = (() => {
      const preset = {
        id: "umi-sp5",
        name: "P大海物語5スペシャル",
        spec: {
          hitProb: 0.00312891,
          hitProbLabel: "1/319.6",
          tenjo: 950,
          yutimeJitan: 350,
          kakuhenRate: 0.54,
          jitanNormal: 100,
          jitanChain: 200,
          jitanRule: "確変中・通常時の通常当り→時短100 / 時短中(遊タイム含む)の通常当り→時短200"
        },
        defaults: {
          netBallsPerWin: DEFAULT_NET_BALLS_PER_WIN,
          densapoDelta: 0,
          spinsPerHour: 250,
          secPerHit: 120,
          secPerDensapoSpin: 6,
          slotGamesPerHour: 800,
          yenPerBall: 4
        }
      };
      function rebound(prob, spins) {
        return 1 - Math.pow(1 - prob, spins);
      }
      function finiteExpectedSpins(prob, limit) {
        return rebound(prob, limit) / prob;
      }
      function chainValues(settings = {}) {
        const spec = preset.spec;
        const p = spec.hitProb;
        const kaku = spec.kakuhenRate;
        const normal = 1 - kaku;
        const r100 = rebound(p, spec.jitanNormal);
        const r200 = rebound(p, spec.jitanChain);
        const r350 = rebound(p, spec.yutimeJitan);
        const a = 1 - kaku;
        const b = -normal * r100;
        const c = -kaku;
        const d = 1 - normal * r200;
        const det = a * d - b * c;
        const wInit = (d - b) / det;
        const jitanHit = (a - c) / det;
        const s100 = finiteExpectedSpins(p, spec.jitanNormal);
        const s200 = finiteExpectedSpins(p, spec.jitanChain);
        const dA = 1 - kaku;
        const dB = -normal * r100;
        const dC = -kaku;
        const dD = 1 - normal * r200;
        const dDet = dA * dD - dB * dC;
        const dRightE = normal * s100;
        const dRightJ = normal * s200;
        const densapoInit = (dRightE * dD - dB * dRightJ) / dDet;
        const densapoJitanHit = (dA * dRightJ - dRightE * dC) / dDet;
        return { r100, r200, r350, wInit, jitanHit, yutimeWins: r350 * jitanHit, densapoInit, densapoJitanHit, settings };
      }
      function calculate(input, settings = {}) {
        const merged = { ...preset.defaults, ...settings };
        const p = preset.spec.hitProb;
        const currentSpin = Math.max(0, Number(input.currentSpin) || 0);
        const spinsToTenjo = Math.max(0, preset.spec.tenjo - currentSpin);
        const rate = Number(input.rotationRate) || 0;
        if (rate <= 0) return null;
        const chains = chainValues(merged);
        const pHit = rebound(p, spinsToTenjo);
        const pReach = Math.pow(1 - p, spinsToTenjo);
        const expectedNormalSpins = pHit / p;
        const expectedWins = pHit * chains.wInit + pReach * chains.yutimeWins;
        const yutimeDensapoBeforeHit = finiteExpectedSpins(p, preset.spec.yutimeJitan);
        const expectedDensapoSpins = pHit * chains.densapoInit + pReach * (yutimeDensapoBeforeHit + chains.r350 * chains.densapoJitanHit);
        const investBalls = expectedNormalSpins * 250 / rate;
        const evBalls = expectedWins * merged.netBallsPerWin + expectedDensapoSpins * merged.densapoDelta - investBalls;
        const evYen = evBalls * merged.yenPerBall;
        const normalHours = expectedNormalSpins / merged.spinsPerHour;
        const hitHours = expectedWins * merged.secPerHit / 3600;
        const densapoHours = expectedDensapoSpins * merged.secPerDensapoSpin / 3600;
        const totalHours = normalHours + hitHours + densapoHours;
        const hourlyYen = totalHours > 0 ? evYen / totalHours : 0;
        const slotRate = 100 + hourlyYen / (merged.slotGamesPerHour * 3 * 20 * 0.01);
        return { currentSpin, spinsToTenjo, rotationRate: rate, pHit, pReach, expectedNormalSpins, expectedWins, expectedDensapoSpins, investBalls, evBalls, evYen, normalHours, hitHours, densapoHours, totalHours, hourlyYen, slotRate, chains };
      }
      function logRate(log) {
        const balls = Number(log.usedBalls ?? log.balls) || 0;
        const spins = Number(log.normalSpin ?? log.spins) || 0;
        return balls > 0 ? spins / (balls / 250) : 0;
      }
      return { preset, rebound, chainValues, calculate, logRate };
    })();
    window.YutimeExpectationEngine = YUTIME_EXPECTATION_ENGINE;
    MACHINE_PRESETS[0] = {
      ...MACHINE_PRESETS[0],
      name: YUTIME_EXPECTATION_ENGINE.preset.name,
      spec: YUTIME_EXPECTATION_ENGINE.preset.spec,
      defaults: YUTIME_EXPECTATION_ENGINE.preset.defaults
    };

    const blankSession = () => ({
      id: cryptoId("s"),
      storeId: null,
      machineId: null,
      date: today(),
      status: "active",
      labels: [],
      carriedFromSessionId: null,
      startSpin: null,
      startTime: null,
      startMochidama: null,
      startSaipurei: null,
      startCredit: null,
      startTotalHits: null,
      currentSpin: null,
      prevDayEndSpin: null,
      investments: [],
      charges: [],
      hitSpin: null,
      hitRemainBalls: null,
      hitVia: null,
      yutimeEnterBalls: null,
      yutimeEnterTime: null,
      endTotalHits: null,
      hitCount: null,
      totalRounds: null,
      endTotalBalls: null,
      endSpin: null,
      endTime: null,
      zanhoryuBalls: null,
      memo: "",
      createdAt: nowIso(),
      updatedAt: nowIso()
    });

    const defaultData = () => ({
      version: SCHEMA_VERSION,
      stores: [],
      layouts: {},
      machines: [],
      sessions: [],
      dailyState: {},
      labelsByStore: {},
      activeStoreId: null,
      meta: {
        createdAt: nowIso(),
        updatedAt: nowIso(),
        lastSaveChars: 0,
        sampleSessionChars: 0,
        mapLayoutChars: 0,
        sampleMachineChars: 0,
        schemaBudgetNote: "v3 schema 13: Store.assumedRate追加後のcharsを記録"
      }
    });

    let bootToastMessage = "";
    let data = loadData();
    let carryover = loadCarryover();
    let currentView = "storesView";
    let selectedLabelFilters = new Set();
    let activeSessionId = null;
    let expandedInvestmentSessions = new Set();
    let expandedReplayRows = new Set();
    let spinUndoStacks = {};
    let autoFilterExpanded = false;
    let closingCheckMode = false;
    let closingInputFlow = null;
    let mapEditorOpenByStore = {};
    let runningStickyEnabled = localStorage.getItem(STICKY_PREF_KEY) !== "off";
    let runningSource = normalizeInvestmentSource(localStorage.getItem(SOURCE_PREF_KEY) || "cash");
    let mapDraft = { storeId: null, islands: [], allowEmptySave: false };
    let modalCancel = null;

    const els = {
      currentStorePill: byId("currentStorePill"),
      storeList: byId("storeList"),
      islandBuilder: byId("islandBuilder"),
      mapStatus: byId("mapStatus"),
      carryoverBanner: byId("carryoverBanner"),
      machineMap: byId("machineMap"),
      labelFilters: byId("labelFilters"),
      runningArea: byId("runningArea"),
      ledgerSummary: byId("ledgerSummary"),
      sessionList: byId("sessionList"),
      storageNote: byId("storageNote"),
      toast: byId("toast"),
      modalBackdrop: byId("modalBackdrop"),
      modalTitle: byId("modalTitle"),
      modalHint: byId("modalHint"),
      modalBody: byId("modalBody")
    };

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => showView(button.dataset.view));
    });

    byId("addIslandBtn").addEventListener("click", addIslandDraft);
    byId("openStoreFormBtn").addEventListener("click", openStoreForm);
    byId("saveMapBtn").addEventListener("click", saveCurrentMap);
    byId("openLabelFormBtn").addEventListener("click", openLabelForm);
    byId("toggleClosingCheckBtn").addEventListener("click", () => {
      closingCheckMode = !closingCheckMode;
      renderMachineMap();
    });
    byId("exportBtn").addEventListener("click", exportJson);
    byId("closeModalBtn").addEventListener("click", closeModal);
    els.modalBackdrop.addEventListener("click", (event) => {
      if (event.target === els.modalBackdrop) closeModal();
    });

    renderAll();
    if (bootToastMessage) showToast(bootToastMessage);

    function byId(id) {
      return document.getElementById(id);
    }

    function nowIso() {
      return new Date().toISOString();
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function offsetDate(dateValue, days) {
      const parts = String(dateValue || today()).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const base = parts ? new Date(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3])) : new Date();
      base.setDate(base.getDate() + days);
      return base.toISOString().slice(0, 10);
    }

    function currentTime() {
      const d = new Date();
      return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }

    function cryptoId(prefix) {
      const raw = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
      return prefix + "_" + raw.replace(/-/g, "").slice(0, 16);
    }

    function showView(viewId) {
      currentView = viewId;
      document.querySelectorAll(".view").forEach((view) => view.classList.toggle("active", view.id === viewId));
      document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.view === viewId));
      renderAll();
    }

    function normalizeNumber(value) {
      if (value === "" || value === null || value === undefined) return null;
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function positiveNumberOrDefault(value, fallback) {
      const n = normalizeNumber(value);
      return n !== null && n > 0 ? n : fallback;
    }

    function normalizeExchangeBalls(value) {
      const n = normalizeNumber(value);
      return n !== null && n >= 20 && n <= 50 ? Number(n.toFixed(2)) : DEFAULT_EXCHANGE_BALLS;
    }

    function exchangeBallsFromStore(store) {
      if (store?.exchangeBalls !== undefined) return normalizeExchangeBalls(store.exchangeBalls);
      const oldRate = normalizeNumber(store?.exchangeRate);
      if (oldRate !== null && oldRate >= 2 && oldRate <= 5) return normalizeExchangeBalls(100 / oldRate);
      if (oldRate !== null && oldRate >= 20 && oldRate <= 50) return normalizeExchangeBalls(oldRate);
      return DEFAULT_EXCHANGE_BALLS;
    }

    function exchangeBallsText(value) {
      const balls = normalizeExchangeBalls(value);
      return Number.isInteger(balls) ? String(balls) : balls.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
    }

    function normalizeInvestmentSource(value) {
      return value === "mochidama" || value === "saipurei" ? value : "cash";
    }

    function normalizeRamState(value) {
      return RAM_STATE_OPTIONS.some((option) => option.value === value) ? value : null;
    }

    function ramStateOption(value) {
      return RAM_STATE_OPTIONS.find((option) => option.value === value) || null;
    }

    function investmentSource(item) {
      return normalizeInvestmentSource(item?.source || item?.type);
    }

    function usesTapInvestmentMode(session) {
      return Array.isArray(session.investments) && session.investments.some((item) => item.source);
    }

    function numberText(value, fallback = "未入力") {
      return value === null || value === undefined || value === "" ? fallback : String(value);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function presetById(id) {
      return MACHINE_PRESETS.find((preset) => preset.id === id) || null;
    }

    function presetByName(name) {
      return MACHINE_PRESETS.find((preset) => preset.name === name) || null;
    }

    function normalizeMachinePresetId(machine) {
      if (presetById(machine?.presetId)) return machine.presetId;
      const matched = presetByName(machine?.modelName || "");
      return matched ? matched.id : "";
    }

    function yenText(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "-";
      const rounded = Math.round(Number(value));
      return `${rounded >= 0 ? "+" : ""}${rounded.toLocaleString("ja-JP")}円`;
    }

    function hourText(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "-";
      return `${Number(value).toFixed(2)}h`;
    }

    function percentText(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "-";
      return `${Number(value).toFixed(1)}%`;
    }

    function evJudgment(result) {
      if (!result) return { className: "", label: "未判定" };
      if (result.evYen >= EV_THRESHOLDS.good) return { className: "good", label: "打てる" };
      if (result.evYen >= EV_THRESHOLDS.warn) return { className: "warn", label: "微妙" };
      return { className: "bad", label: "打てない" };
    }

    function expectationYenPerBall(store) {
      return 100 / exchangeBallsFromStore(store);
    }

    function expectationSettings(store, machine) {
      const defaults = YUTIME_EXPECTATION_ENGINE.preset.defaults;
      const netBallsPerWin = positiveNumberOrDefault(store?.netBallsPerWin, defaults.netBallsPerWin);
      return {
        settings: {
          ...defaults,
          yenPerBall: expectationYenPerBall(store),
          netBallsPerWin
        },
        payoutSource: `純増${Math.round(netBallsPerWin).toLocaleString("ja-JP")}玉使用（手動設定）`
      };
    }

    function expectationRate(stats, manualRate, store = null) {
      const manual = normalizeNumber(manualRate);
      if (manual !== null && manual > 0) return { rate: manual, source: "手入力" };
      if (stats?.rate) return { rate: stats.rate, source: "台帳累計" };
      const assumed = normalizeNumber(store?.assumedRate);
      if (assumed !== null && assumed > 0) return { rate: assumed, source: `推定${assumed.toFixed(1)}使用`, assumed: true };
      return { rate: null, source: "回転率なし" };
    }

    function calculateMachineExpectation(machine, options = {}) {
      const store = storeById(machine?.storeId);
      const preset = presetById(normalizeMachinePresetId(machine));
      if (!store || !preset?.evSupported) return { result: null, reason: "期待値対応プリセットではありません" };
      const stats = options.stats || machineStats(machine.id);
      const rateInfo = expectationRate(stats, options.manualRate, store);
      if (!rateInfo.rate) return { result: null, reason: "回転率データがありません" };
      const currentSpin = Math.max(0, Number(options.currentSpin) || 0);
      const previousSpin = Math.max(0, Number(options.previousSpin) || 0);
      const effectiveSpin = currentSpin + previousSpin;
      const settingsInfo = expectationSettings(store, machine);
      const result = YUTIME_EXPECTATION_ENGINE.calculate({ currentSpin: effectiveSpin, rotationRate: rateInfo.rate }, settingsInfo.settings);
      return {
        result,
        currentSpin,
        previousSpin,
        effectiveSpin,
        rateSource: rateInfo.source,
        rateAssumed: Boolean(rateInfo.assumed),
        payoutSource: settingsInfo.payoutSource,
        exchangeBalls: exchangeBallsFromStore(store)
      };
    }

    function showToast(message, type = "success", options = {}) {
      clearTimeout(showToast.timer);
      els.toast.innerHTML = `${escapeHtml(message)}${options.undo ? ` <button id="toastUndoBtn">元に戻す</button>` : ""}`;
      els.toast.classList.toggle("error", type === "error");
      els.toast.classList.add("show");
      if (options.undo) byId("toastUndoBtn").addEventListener("click", () => {
        clearTimeout(showToast.timer);
        els.toast.classList.remove("show", "error");
        options.undo();
      });
      showToast.timer = setTimeout(() => {
        els.toast.classList.remove("show", "error");
      }, options.undo ? 4200 : 2200);
    }

    function persistWithToast(successMessage) {
      const ok = persist();
      if (ok) showToast(successMessage);
      else showToast("保存に失敗しました。容量を確認してください。", "error");
      return ok;
    }

    function automaticLabelsForDate(dateValue) {
      const parts = String(dateValue || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!parts) return [];
      const year = Number(parts[1]);
      const month = Number(parts[2]);
      const day = Number(parts[3]);
      const date = new Date(year, month - 1, day);
      if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return [];
      const weekdays = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];
      const labels = [weekdays[date.getDay()], `${day % 10}のつく日`];
      if (day === 11 || day === 22) labels.push("ゾロ目日");
      return labels;
    }

    function dateWithAutoLabels(dateValue) {
      const labels = automaticLabelsForDate(dateValue);
      return `${dateValue || "日付未入力"}${labels.length ? " / " + labels.join("・") : ""}`;
    }

    function shortDate(dateValue) {
      const parts = String(dateValue || "").match(/^\d{4}-(\d{2})-(\d{2})$/);
      return parts ? `${Number(parts[1])}/${Number(parts[2])}` : (dateValue || "-");
    }

    function loadData() {
      const base = defaultData();
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return base;
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return base;
        if (parsed.version !== SCHEMA_VERSION && !localStorage.getItem(PREMIGRATE_KEY)) {
          localStorage.setItem(PREMIGRATE_KEY, raw);
        }
        return normalizeData(parsed);
      } catch (error) {
        console.warn("ytv3 load failed", error);
        preserveCorruptData(raw);
        return base;
      }
    }

    function preserveCorruptData(raw) {
      if (!raw) return;
      try {
        localStorage.setItem(CORRUPT_PREFIX + new Date().toISOString(), raw);
        bootToastMessage = "保存データが読み取れなかったため退避しました";
      } catch (error) {
        console.warn("ytv3 corrupt preserve failed", error);
      }
    }

    function loadCarryover() {
      try {
        const parsed = JSON.parse(localStorage.getItem(CARRYOVER_KEY) || "null");
        if (!parsed || typeof parsed !== "object") return null;
        if (!parsed.storeId || !parsed.sourceSessionId || !parsed.date) return null;
        if (parsed.date !== today()) {
          localStorage.removeItem(CARRYOVER_KEY);
          return null;
        }
        return {
          storeId: parsed.storeId,
          sourceSessionId: parsed.sourceSessionId,
          sourceMachineId: parsed.sourceMachineId || null,
          sourceDaiNo: parsed.sourceDaiNo || "",
          date: parsed.date,
          mochidama: normalizeNumber(parsed.mochidama),
          credit: normalizeNumber(parsed.credit),
          saipurei: normalizeNumber(parsed.saipurei),
          createdAt: parsed.createdAt || nowIso()
        };
      } catch (error) {
        console.warn("ytv3 carryover load failed", error);
        return null;
      }
    }

    function saveCarryover(nextCarryover) {
      carryover = nextCarryover;
      if (!carryover) {
        localStorage.removeItem(CARRYOVER_KEY);
        renderAll();
        return true;
      }
      try {
        localStorage.setItem(CARRYOVER_KEY, JSON.stringify(carryover));
        renderAll();
        return true;
      } catch (error) {
        console.warn("ytv3 carryover save failed", error);
        showToast("引き継ぎの保存に失敗しました。容量を確認してください。", "error");
        return false;
      }
    }

    function normalizeData(source) {
      const base = defaultData();
      const next = {
        ...base,
        ...source,
        stores: Array.isArray(source.stores) ? source.stores : [],
        layouts: source.layouts && typeof source.layouts === "object" ? source.layouts : {},
        machines: Array.isArray(source.machines) ? source.machines : [],
        sessions: Array.isArray(source.sessions) ? source.sessions : [],
        dailyState: source.dailyState && typeof source.dailyState === "object" ? source.dailyState : {},
        labelsByStore: source.labelsByStore && typeof source.labelsByStore === "object" ? source.labelsByStore : {},
        meta: { ...base.meta, ...(source.meta || {}) }
      };
      next.version = SCHEMA_VERSION;
      next.stores = next.stores.map((store) => ({
        id: store.id || cryptoId("st"),
        name: String(store.name || "無名店"),
        isPersonal: Boolean(store.isPersonal),
        lendRate: positiveNumberOrDefault(store.lendRate, DEFAULT_LEND_RATE),
        exchangeBalls: exchangeBallsFromStore(store),
        netBallsPerWin: positiveNumberOrDefault(store.netBallsPerWin, DEFAULT_NET_BALLS_PER_WIN),
        assumedRate: normalizeNumber(store.assumedRate),
        createdAt: store.createdAt || nowIso()
      }));
      next.layouts = normalizeLayouts(next.layouts);
      next.machines = next.machines.map((machine) => {
        const presetId = normalizeMachinePresetId(machine);
        const preset = presetById(presetId);
        return {
          id: machine.id || cryptoId("m"),
          storeId: machine.storeId || null,
          daiNo: String(machine.daiNo || ""),
          modelName: presetId === "umi-sp5" && machine.presetId === "umi-sp5" ? preset?.name || machine.modelName || "" : machine.modelName || "",
          roundBalls: normalizeNumber(machine.roundBalls),
          memo: machine.memo || "",
          presetId,
          evSupported: Boolean(preset?.evSupported || machine.evSupported)
        };
      }).filter((machine) => machine.storeId && machine.daiNo);
      next.sessions = next.sessions.map((session) => ({
        ...blankSession(),
        ...session,
        startTotalHits: normalizeNumber(session.startTotalHits),
        endTotalHits: normalizeNumber(session.endTotalHits),
        currentSpin: normalizeNumber(session.currentSpin) ?? normalizeNumber(session.startSpin),
        carriedFromSessionId: session.carriedFromSessionId || null,
        yutimeEnterTime: session.yutimeEnterTime || null,
        investments: Array.isArray(session.investments) ? session.investments.map((item) => ({
          type: normalizeInvestmentSource(item.source || item.type),
          ...(item.source ? { source: normalizeInvestmentSource(item.source) } : {}),
          amount: normalizeNumber(item.amount),
          time: item.time || null,
          phase: item.phase === "yutime" ? "yutime" : "normal",
          spinAt: normalizeNumber(item.spinAt)
        })).filter((item) => item.amount !== null) : [],
        charges: Array.isArray(session.charges) ? session.charges.map((item) => ({
          amount: normalizeNumber(item.amount),
          time: item.time || null
        })).filter((item) => item.amount !== null) : []
      }));
      if (!next.stores.some((store) => store.id === next.activeStoreId)) next.activeStoreId = next.stores[0]?.id || null;
      next.dailyState = normalizeDailyState(next.dailyState, next.machines);
      return next;
    }

    function persist() {
      data.meta.updatedAt = nowIso();
      data.meta.sampleSessionChars = measureSampleSessionChars();
      data.meta.sampleMachineChars = measureSampleMachineChars();
      data.meta.mapLayoutChars = measureActiveMapLayoutChars();
      data.meta.lastSaveChars = 0;
      const draftRaw = JSON.stringify(data);
      data.meta.lastSaveChars = draftRaw.length;
      const raw = JSON.stringify(data);
      data.meta.lastSaveChars = raw.length;
      const finalRaw = JSON.stringify(data);
      if (finalRaw.length < 12) {
        console.warn("ytv3 empty-write guard blocked save");
        return false;
      }
      try {
        const before = localStorage.getItem(STORAGE_KEY);
        if (before) localStorage.setItem(BACKUP_KEY, before);
        localStorage.setItem(STORAGE_KEY, finalRaw);
        return true;
      } catch (error) {
        console.warn("ytv3 persist failed", error);
        return false;
      }
    }

    function normalizeDailyState(source, machines) {
      const validMachineIds = new Set(machines.map((machine) => machine.id));
      const next = {};
      Object.entries(source || {}).forEach(([machineId, byDate]) => {
        if (!validMachineIds.has(machineId) || !byDate || typeof byDate !== "object") return;
        Object.entries(byDate).forEach(([date, state]) => {
          if (!isDateString(date) || !state || typeof state !== "object") return;
          const normalized = { date };
          const ramClear = normalizeRamState(state.ramClear);
          const closingSpin = normalizeNumber(state.closingSpin);
          if (ramClear) normalized.ramClear = ramClear;
          if (closingSpin !== null) normalized.closingSpin = closingSpin;
          if (normalized.ramClear || normalized.closingSpin !== undefined) {
            if (!next[machineId]) next[machineId] = {};
            next[machineId][date] = normalized;
          }
        });
      });
      return next;
    }

      return /^\d{4}-\d{2}-\d{2}$/.test(String(value || ""));

    function dailyStateFor(machineId, dateValue = today()) {
      return data.dailyState?.[machineId]?.[dateValue] || null;
    }

    function ensureDailyState(machineId, dateValue = today()) {
      if (!data.dailyState[machineId]) data.dailyState[machineId] = {};
      if (!data.dailyState[machineId][dateValue]) data.dailyState[machineId][dateValue] = { date: dateValue };
      return data.dailyState[machineId][dateValue];
    }

    function cleanupEmptyDailyState(machineId, dateValue) {
      const state = data.dailyState?.[machineId]?.[dateValue];
      if (!state) return;
      if (!state.ramClear && state.closingSpin === undefined) delete data.dailyState[machineId][dateValue];
      if (data.dailyState[machineId] && !Object.keys(data.dailyState[machineId]).length) delete data.dailyState[machineId];
    }

    function todayRamState(machineId) {
      return dailyStateFor(machineId, today())?.ramClear || null;
    }

    function validClosingInfo(machineId) {
      const state = dailyStateFor(machineId, offsetDate(today(), -1));
      if (!state || state.closingSpin === undefined) return null;
      const ramState = todayRamState(machineId);
      if (ramState && ramState !== "retained") return null;
      return { spin: state.closingSpin, date: state.date };
    }

          <span class="rate ${rateClass}">${escapeHtml(rate)}${estimatedMark}<small>回/千円</small></span>
          ${closingCheckMode && todayClosing !== null ? `<span class="prev">✓ ${escapeHtml(todayClosing)}回転</span>` : closing ? `<span class="prev">宵${escapeHtml(closing.spin)} <small>${escapeHtml(shortDate(closing.date))}</small></span>` : ""}

    function mapExpectationSign(machine, stats, closing) {
      if (!closing) return null;
      const expectation = calculateMachineExpectation(machine, { currentSpin: 0, previousSpin: closing.spin, stats });
      if (!expectation.result || expectation.result.evYen < EV_THRESHOLDS.good) return null;
      return { good: true, assumed: Boolean(expectation.rateAssumed) };
    }
